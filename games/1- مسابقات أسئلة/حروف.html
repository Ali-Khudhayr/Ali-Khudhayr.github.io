<style>
:root{
  --honey1:#ffe27a;--honey2:#f7b928;--honey3:#d98a0b;--wax:#fde9a9;--wax2:#f3cf6e;
  --ink:#3b2410;--mut:#7a5a3a;--paper:#fffaf0;--paper2:#fff3d6;--line:#ecd3a0;
  --good:#1fa35b;--bad:#e23b4e;--focus:#1e6fe0;
  --disp:Lalezar,Tajawal,"Segoe UI",Tahoma,sans-serif;--body:Tajawal,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --t0:#1e6fe0;--t1:#e23b4e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#8fd6f7;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
input{font:inherit}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cl{animation:drift 60s linear infinite alternate}.c2{animation-duration:80s}.c3{animation-duration:46s}
@keyframes drift{to{transform:translateX(-140px)}}
.lantern{animation:sway 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
@keyframes sway{from{rotate:-3deg}to{rotate:3deg}}
#bees{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bee{position:absolute;width:34px;height:28px;animation:buzz var(--d,14s) ease-in-out infinite alternate}
.bee svg{width:100%;height:100%;animation:wob .5s ease-in-out infinite alternate}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(var(--x1),var(--y1))}50%{transform:translate(var(--x2),var(--y2))}75%{transform:translate(var(--x3),var(--y3))}100%{transform:translate(var(--x4),var(--y4))}}
@keyframes wob{to{transform:translateY(-3px) rotate(4deg)}}
.screen{position:fixed;inset:0;display:none;z-index:2}
.screen.on{display:flex}
kbd{font:800 .72em var(--body);background:rgba(255,255,255,.75);color:var(--ink);border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;border-radius:.35em;padding:.02em .45em;margin-inline-start:.4em;direction:ltr;display:inline-block}
.btn{border:0;border-radius:.9rem;padding:.6em 1.15em;cursor:pointer;background:#fff;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;gap:.45em;transition:transform .12s,filter .15s;box-shadow:0 .2rem 0 rgba(90,50,0,.25)}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.pri{background:linear-gradient(#ffcf40,#f2a516);color:#3b2410;box-shadow:0 .25rem 0 #b56d00}
.btn.good{background:var(--good);color:#fff;box-shadow:0 .25rem 0 #0d6b38}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 .25rem 0 #8f1424}
.btn.ghost{background:rgba(255,255,255,.7);box-shadow:none;border:1px solid var(--line)}
.btn.big{font-size:clamp(1.1rem,2.7vh,1.6rem);padding:.6em 1.4em}
.btn[disabled]{opacity:.35;pointer-events:none}
.ib{width:2.7rem;height:2.7rem;border-radius:.85rem;border:0;background:rgba(255,250,240,.92);cursor:pointer;font-size:1.15rem;display:grid;place-items:center;flex:none;box-shadow:0 .18rem 0 rgba(90,50,0,.25)}
.ib.off{opacity:.5}.ib.on{background:#ffcf40}

/* ---------------- شاشة اللعب ---------------- */
#game{flex-direction:column;padding:.45rem .9rem .6rem;gap:.35rem}
.top{display:flex;align-items:center;gap:.45rem;height:3rem;flex:none;position:relative}
.top .grow{flex:1}
.title{font-family:var(--disp);font-size:clamp(1.6rem,4.6vh,2.6rem);line-height:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);white-space:nowrap;display:flex;align-items:center;gap:.5rem;pointer-events:none}
.title .tx{background:linear-gradient(#fff6c8 10%,#ffcf40 45%,#e08a00 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.03em #6b3a00;filter:drop-shadow(0 .12rem 0 #7a4300) drop-shadow(0 .3rem .4rem rgba(80,40,0,.35))}
.title .rnd{font-family:var(--body);font-weight:800;font-size:.42em;background:#6b3a00;color:#ffe9a8;border-radius:99px;padding:.25em .8em;-webkit-text-stroke:0}
.arena{flex:1;min-height:0;position:relative}
#board{position:absolute;overflow:visible}

/* لوحة الفريق: تجلس في الزاوية الفاضية جنب المعيّن (فوق يمين / تحت يسار) */
.tp{--tc:#888;position:absolute;width:clamp(14rem,20vw,25rem);background:var(--paper);border-radius:1.4rem;padding:0 .8rem .7rem;display:flex;flex-direction:column;align-items:stretch;gap:.4rem;box-shadow:0 .35rem 0 color-mix(in srgb,var(--tc) 55%,#000),0 1rem 2rem rgba(60,30,0,.25);border:3px solid var(--tc);transition:transform .3s,box-shadow .3s;z-index:3}
#tp0{top:0;right:0}#tp1{bottom:0;left:0}
.tp.turn{box-shadow:0 .35rem 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 0 .4rem color-mix(in srgb,var(--tc) 40%,transparent),0 1rem 2rem rgba(60,30,0,.3)}
.tp-band{margin:0 -.8rem;height:1.35rem;background:var(--tc);position:relative;border-radius:1.1rem 1.1rem 0 0}
.tp-band::after{content:"";position:absolute;inset:0;border-radius:inherit;background:
  linear-gradient(135deg,transparent 33%,#ffd23f 33% 50%,transparent 50%) 0 0/1.35rem 1.35rem,
  linear-gradient(225deg,transparent 33%,#fff 33% 50%,transparent 50%) .675rem 0/1.35rem 1.35rem;opacity:.95}
.tp-head{display:flex;align-items:center;gap:.6rem}
.emb{width:clamp(4.6rem,13vh,7.5rem);aspect-ratio:1;flex:none;margin-top:-.2rem;filter:drop-shadow(0 .3rem .3rem rgba(0,0,0,.25))}
.emb svg{width:100%;height:100%;display:block}
.tp-id{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.tp-name{font-family:var(--disp);font-size:clamp(1.5rem,4.4vh,2.6rem);line-height:1.05;color:color-mix(in srgb,var(--tc) 80%,#000)}
.turnbar{display:none;text-align:center;background:var(--tc);color:#fff;font-weight:800;border-radius:.8rem;padding:.3rem .5rem;font-size:clamp(.9rem,2.2vh,1.15rem);animation:hot .9s ease-in-out infinite alternate}
.tp.turn .turnbar{display:block}
.wins{display:flex;gap:.3rem;direction:ltr}
.wins i{width:1.5rem;height:1.7rem;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#e9dcc2}
.wins i.on{background:linear-gradient(#ffe27a,#f2a516);box-shadow:inset 0 0 0 2px #fff}
.dir{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:clamp(.8rem,1.9vh,1rem);color:var(--mut)}
.dir svg{width:2.9rem;height:2rem;flex:none}
.need{align-self:stretch;text-align:center;background:color-mix(in srgb,var(--tc) 12%,#fff);border-radius:.9rem;padding:.35rem .4rem;font-weight:800;font-size:clamp(.85rem,2vh,1.05rem)}
.need b{font-family:var(--disp);font-weight:400;font-size:1.9em;color:var(--tc);line-height:1;vertical-align:-.12em;margin:0 .15em}
.need.hot{background:var(--tc);color:#fff;animation:hot 1s ease-in-out infinite alternate}.need.hot b{color:#fff}
@keyframes hot{to{filter:brightness(1.15);transform:scale(1.04)}}
.cards{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap}
.pc{width:clamp(3.2rem,4.6vw,4.4rem);aspect-ratio:.8;border-radius:.6rem;border:0;cursor:pointer;background:linear-gradient(160deg,#fff,#fbecc6);box-shadow:0 .2rem 0 #c99a45,inset 0 0 0 2px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.2rem;transition:transform .15s}
.pc:hover{transform:translateY(-3px) rotate(-2deg)}
.pc .ico{width:58%;height:auto}
.pc span{font-weight:800;font-size:clamp(.62rem,1.45vh,.8rem);line-height:1.1;text-align:center}
.pc.used{opacity:.28;filter:grayscale(1);pointer-events:none}
.pc.armed{background:linear-gradient(160deg,#fff7c2,#ffcf40);box-shadow:0 0 0 3px var(--tc)}
.buzzk{font-weight:800;font-size:.85rem;color:var(--mut);text-align:center}

/* شريط الحالة */
.status{flex:none;display:flex;justify-content:center;align-items:center;gap:.6rem;min-height:2.9rem}
.pill{--tc:#6b3a00;display:flex;align-items:center;gap:.6rem;background:var(--paper);border:3px solid var(--tc);border-radius:99px;padding:.3rem 1.2rem .3rem .4rem;font-weight:800;font-size:clamp(1rem,2.5vh,1.3rem);box-shadow:0 .25rem 0 color-mix(in srgb,var(--tc) 60%,#000)}
.pill .em{width:2.3rem;height:2.3rem}
.pill .em svg{width:100%;height:100%}
.pill b{color:var(--tc)}

/* ---------------- الخلايا (SVG) ---------------- */
.frame-edge{stroke:rgba(0,0,0,.18);stroke-width:2}
.wall{fill:var(--wax)}
.cell{cursor:pointer}
.cell .base{fill:url(#g-empty)}
.cell .face{fill:url(#g-face)}
.cell .lt{font-family:var(--disp);fill:#6b3500;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:#fff3c4;stroke-width:3px}
.cell[data-o="0"] .base{fill:url(#g-t0)}.cell[data-o="1"] .base{fill:url(#g-t1)}
.cell[data-o="0"] .lt,.cell[data-o="1"] .lt{fill:#fff;stroke:rgba(0,0,0,.28);stroke-width:4px}
.cell .tile{transition:transform .18s;transform-box:fill-box;transform-origin:center}
.cell:not([data-o]):hover .tile{transform:translateY(-4px) scale(1.04)}
.cell .ring{fill:none;stroke:none;stroke-width:9}
.cell.cur .ring{stroke:#fff;animation:ring .8s ease-in-out infinite alternate}
.cell.hot0 .ring{stroke:var(--t0);animation:ring .6s ease-in-out infinite alternate}
.cell.hot1 .ring{stroke:var(--t1);animation:ring .6s ease-in-out infinite alternate}
.cell.cand .ring{stroke:#fff;stroke-dasharray:14 10;animation:dash 1s linear infinite}
@keyframes ring{from{stroke-opacity:.35}to{stroke-opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
.cell .badge{pointer-events:none}
.cell.frz .ice{display:block}.ice{display:none;pointer-events:none}
.cell.path .tile{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.35) drop-shadow(0 0 12px #fff)}}
.cell.pop .tile{animation:popc .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes popc{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* ---------------- الشكل الثاني (للمقارنة) ---------------- */
body.lookB{background:#fffaf0}
body.lookB .title .tx{background:linear-gradient(#5ec8f2,#1b6fa8);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.025em #0d3d66;filter:drop-shadow(0 .12rem 0 #0d3d66);font-family:'Reem Kufi',var(--disp);font-weight:700}
body.lookB .title .rnd{background:#1b6fa8;color:#fff}
body.lookB .tp{background:#fff;border-radius:.6rem}
body.lookB .tp-band::after{background:repeating-linear-gradient(90deg,#fff 0 .5rem,transparent .5rem 1rem);height:.4rem;top:auto;bottom:.3rem;inset-inline:0}
body.lookB .tp-name{font-family:'Reem Kufi',var(--disp);font-weight:700}
body.lookB .wins i{clip-path:polygon(50% 0,63% 30%,98% 35%,70% 58%,79% 95%,50% 75%,21% 95%,30% 58%,2% 35%,37% 30%)}
body.lookB .wins i.on{background:linear-gradient(#5ec8f2,#1b6fa8)}
body.lookB .pill{border-radius:.6rem}
body.lookB .wall{fill:#cfe3ef}
body.lookB .cell .lt{fill:#1b4f8f;stroke:#fff}
body.lookB .pc{background:linear-gradient(160deg,#fff,#e3f1fa);box-shadow:0 .2rem 0 #7fb3d6,inset 0 0 0 2px #fff}
body.lookB .need{background:color-mix(in srgb,var(--tc) 10%,#fff)}body.lookB .need.hot{background:var(--tc)}

#toast{position:fixed;bottom:4.2rem;left:50%;transform:translateX(-50%) translateY(1rem);background:#3b2410;color:#fff;padding:.7rem 1.3rem;border-radius:99px;font-weight:800;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.altKey&&!e.ctrlKey&&!e.metaKey){const action={KeyF:'fs',KeyM:'sound',KeyU:'undo',KeyE:'edit'}[e.code];if(action){e.preventDefault();if(G||action==='fs'||action==='sound')ACT[action]();}return;}
  if(e.ctrlKey||e.metaKey)return;
  const lat = !/[؀-ۿ]/.test(e.key), scr = ($('.screen.on') || {}).id;
  const selectingEnglish=G&&scr==='game'&&!ovEl&&!G.Q&&G.cfg.langMode&&G.cfg.langMode!=='ar';
  if (e.code === 'KeyF' && lat && !selectingEnglish) return toggleFS();
  if (e.code === 'KeyM' && lat && !selectingEnglish) return ACT.sound();
  if (scr === 'home') { if (e.key === 'Enter' && !ovEl) { e.preventDefault(); ACT.start(); } else if (e.key === 'Escape' && ovEl) closeOverlay(); else if (e.key === 'Enter' && ovEl) { const b = ovEl.querySelector('[data-enter]'); if (b) { e.preventDefault(); b.click(); } } return; }
  if (!G) return;
  if (G.Q && ovEl && $('.qdlg')) {
    const c = e.code;
    if (c === 'KeyL' || c === 'Digit1' || c === 'Numpad1') { e.preventDefault(); return buzz(0); }
    if (c === 'KeyA' || c === 'Digit2' || c === 'Numpad2') { e.preventDefault(); return buzz(1); }
    if (e.key === 'Enter') { e.preventDefault(); return G.Q.phase === 'ans' ? right() : G.Q.phase === 'dead' ? leave() : null; }
    if (e.key === 'Backspace' || e.key === 'Delete' || c === 'Digit0' || c === 'Numpad0') { e.preventDefault(); return wrong(); }
    if (c === 'Space') { e.preventDefault(); return reveal(); }
    if (e.key === 'Escape') return cancelQ();
    return;
  }
  if (ovEl) { if (e.key === 'Escape' && ovEl.dataset.closable) closeOverlay(); else if (e.key === 'Enter' || e.code === 'Space') { const b = ovEl.querySelector('[data-enter]'); if (b) { e.preventDefault(); b.click(); } } return; }
  if (scr === 'end') return;
  if (e.code === 'KeyU' && lat && !selectingEnglish) return ACT.undo();
  if (e.code === 'KeyE' && lat && !selectingEnglish) return ACT.edit();
  if (e.key === 'Escape' && G.R.mode) return G.R.mode.k === 'edit' ? ACT.edit() : ACT['mode-skip']();
  if (e.key === 'Enter' && G.R.over) { e.preventDefault(); return G.over ? podium() : ACT.next(); }
  const k = /^[a-z]$/i.test(e.key)?e.key.toUpperCase():(KEYMAP[e.key] || e.key);
  if ((L.includes(k)||EN.includes(k)) && !G.R.over) { e.preventDefault(); typeLetter(k); }
});
