<style>
/* الشكل المعتمد: «قاعة التداول الذهبية» (كريمي وذهبي وأخضر زمردي) */
:root{
  --ink:#123527;--mut:#5d7a6b;--up:#0f9f4f;--down:#e0473c;--gold:#c99a2e;--gold2:#f3d27a;--rim:#e6c77c;--acc:#0b7a55;--acc2:#12a36f;
  --card:rgba(255,253,247,.95);--card2:#fffdf7;--shadow:0 .5vh 1.4vh rgba(70,50,10,.16);--ring:0 0 0 2px var(--rim);
  --tick-bg:#0b7a55;--tick-ink:#fff;
  --sky1:#ffb37a;--sky2:#ffe3b8;--gr1:#e9c79a;--gr2:#d8ad78;
  --twA1:#f6c9a0;--twA2:#e8a47e;--twA3:#c97a63;--twB1:#fbd9bb;--twB2:#f0b892;--twK1:#f7cfa8;--twK2:#e59a76;--twK3:#b8685a;--twF1:#f3c09a;--twF2:#c97b62;--twP1:#fbdcc0;--twP2:#e7a17f;--twP3:#b56a5b;
  --disp:Lalezar,Tajawal,"Segoe UI",Tahoma,sans-serif;--body:Tajawal,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --r:1.1rem;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums;background:#fbf0dc;font-size:clamp(14px,1.95vh,24px)}
button{font:inherit;color:inherit}
input,select{font:inherit}
.up-t{color:var(--up)}.down-t{color:var(--down)}
.hint{color:var(--mut);font-weight:700;font-size:.9em}
.lbl{color:var(--mut);font-weight:800}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
kbd{font:800 .7em var(--body);background:rgba(0,0,0,.12);border-radius:.35em;padding:.05em .45em;margin-inline-start:.3em}

/* ---------- المشهد: قاعة تداول بنافذة على أفق الرياض وقت الغروب ---------- */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#fffaf0 0%,#fbf0dc 100%)}
#scene .led{position:absolute;inset:0 0 auto 0;height:7vh;min-height:46px;background:radial-gradient(circle,rgba(255,255,255,.16) 1px,transparent 1.6px) 0 0/6px 6px,linear-gradient(180deg,#10915f,#0b7a55);border-bottom:.5vh solid #d8b46a}
#scene .win{position:absolute;inset:7vh 3vw 16vh;border-radius:2.2vh 2.2vh 0 0;overflow:hidden;background:linear-gradient(180deg,#ff9f6b 0%,#ffc58f 40%,#ffe6bf 75%,#fff4dc 100%);box-shadow:inset 0 0 0 .7vh #d8b46a,inset 0 0 0 1.1vh #fff3d6,0 1vh 3vh rgba(120,80,20,.15)}
#scene .win .sun{position:absolute;top:22%;left:12%;width:16vh;height:16vh;border-radius:50%;background:radial-gradient(circle,#fff6d6 0 30%,rgba(255,214,140,.7) 45%,rgba(255,180,110,0) 70%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.12)}}
#scene .win .bird{position:absolute;top:18%;width:2.4vh;height:1vh;border-top:2px solid rgba(120,60,40,.55);border-radius:50% 50% 0 0;animation:fly 38s linear infinite}
@keyframes fly{from{transform:translateX(-10vw)}to{transform:translateX(100vw)}}
#scene .win .sky-svg{position:absolute;bottom:0;left:0;width:100%;height:62%}
#scene .win::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(16.66% - .45vh),#e7c983 calc(16.66% - .45vh) 16.66%),linear-gradient(180deg,transparent 30%,rgba(255,255,255,.25))}
#scene .floor{position:absolute;inset:auto 0 0 0;height:16vh;background:linear-gradient(180deg,#f3e2c4,#e9d2a8);border-top:.5vh solid #d8b46a}
#scene .floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.25) 0 2px,transparent 2px 9vw)}

.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.on{display:flex}

/* ---------- أزرار عامة ---------- */
.ib{width:2.4em;height:2.4em;border-radius:.8em;border:0;background:var(--card2);box-shadow:var(--ring),var(--shadow);cursor:pointer;font-size:1em;display:grid;place-items:center;flex:none}
.ib.off{opacity:.45}.ib[disabled]{opacity:.35;pointer-events:none}
.btn{border:0;border-radius:.9em;padding:.6em 1.2em;cursor:pointer;background:var(--card2);box-shadow:var(--ring),var(--shadow);font-weight:800;font-size:1em;display:inline-flex;align-items:center;gap:.45em;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.gold{background:linear-gradient(180deg,#19b37b,#0b7a55);color:#fff;box-shadow:0 .4vh 0 #075a3f,var(--shadow)}
.btn.big{font-size:clamp(1.05rem,2.8vh,1.7rem);padding:.55em 1.4em}
.btn.up{background:var(--up);color:#fff;box-shadow:0 .3vh 0 #0a6e36}.btn.down{background:var(--down);color:#fff;box-shadow:0 .3vh 0 #a52e25}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 .4vh 0 #075a3f,0 0 0 .6vh rgba(18,163,111,.3)}}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.tier:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip{padding:.35em .9em;border-radius:99px;background:#fff;border:2px solid var(--rim);cursor:pointer;font-weight:800}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip[disabled]{opacity:.35;pointer-events:none}
.seg{display:flex;gap:.35rem;flex-wrap:wrap}
.fld{background:#fff;color:var(--ink);border:2px solid var(--rim);border-radius:.7rem;padding:.4em .6em;font-weight:700;-webkit-user-select:text;user-select:text}
.fld:focus{outline:none;border-color:var(--acc)}
.mini-emb{display:inline-block;width:1.7em;height:1.7em;vertical-align:middle;flex:none}
.mini-emb.lg{width:2.6em;height:2.6em}
.mini-emb svg,.lg svg{width:100%;height:100%;display:block}

/* ---------- البداية ---------- */
#home{align-items:center;justify-content:center;padding:9vh 2rem 2rem;text-align:center}
.h-corner{position:absolute;top:1.2vh;inset-inline-start:1rem;display:flex;gap:.5rem}
.marquee{background:var(--card2);border-radius:2.4rem;box-shadow:0 0 0 .5vh var(--rim),0 0 0 1.1vh #fff3d6,0 3vh 6vh rgba(90,60,10,.25);padding:3.5vh 4vw 3vh;display:flex;flex-direction:column;align-items:center;gap:2vh;position:relative;max-width:min(64rem,94vw)}
.logo{font-family:var(--disp);font-weight:400;font-size:clamp(3.4rem,13vh,8rem);line-height:1;margin:0;display:flex;align-items:center;gap:.25em;color:var(--acc);text-shadow:0 .06em 0 #d8b46a,0 .12em .2em rgba(0,0,0,.15)}
.logo svg{width:.9em;height:.9em;animation:climb 1.6s ease-in-out infinite alternate}
@keyframes climb{from{transform:translateY(.08em)}to{transform:translateY(-.08em)}}
.tag{color:var(--mut);font-weight:800;font-size:clamp(1rem,2.6vh,1.45rem);margin:0}
.h-chart{width:min(40rem,80vw);height:auto}
.h-chart .ln{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.h-cos{display:flex;gap:1vh;justify-content:center}
.h-cos span{width:clamp(2rem,5.6vh,3.4rem);height:clamp(2rem,5.6vh,3.4rem);animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-.6vh)}}
.credit{position:absolute;bottom:1.2vh;inset-inline:0;text-align:center;color:#6b5a3a;font-size:.82rem;font-weight:700}

/* ---------- الإعداد ---------- */
#setup{align-items:center;overflow:auto;padding:8.5vh 1.5rem 1.5rem}
.setup{width:min(84rem,100%);display:flex;flex-direction:column;gap:1.4vh;margin:auto 0}
.setup h2{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,6vh,3.2rem);margin:0;text-align:center;color:var(--acc);text-shadow:0 .05em 0 #d8b46a}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.4vh 1.2rem}
.card{background:var(--card2);border-radius:1.2rem;padding:1.2vh 1.1rem;box-shadow:var(--ring),var(--shadow)}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.6vh}
.ch-h .num{font-family:var(--disp);font-size:1.6em;min-width:1.2em;text-align:center}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.5vh 0}
.opt+.opt{border-top:1px dashed var(--rim)}
.opt .lbl{font-size:.92em}
.trow{display:flex;gap:.6rem;align-items:center;margin-top:.8vh;padding:.4vh .5rem;border-radius:1rem;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 14%,#fff),#fff 60%)}
.trow input{flex:1;min-width:0;font-size:1.05em}
.emb-btn{width:clamp(2.8rem,7.5vh,4.4rem);height:clamp(2.8rem,7.5vh,4.4rem);border:0;background:none;padding:0;cursor:pointer;flex:none;transition:transform .15s}
.emb-btn:hover{transform:scale(1.08) rotate(-4deg)}
.emb-btn svg{width:100%;height:100%}
.sw{width:1.8em;height:1.8em;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--rim);cursor:pointer;flex:none}
.cos-ed{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.cos-ed label{display:flex;gap:.5rem;align-items:center;background:#fff;border-radius:.9rem;padding:.4rem;box-shadow:0 0 0 1px var(--rim)}
.cos-ed .lg{width:2.6em;height:2.6em;flex:none}
.cos-ed .ed{display:flex;flex-direction:column;gap:.15rem;min-width:0;flex:1}
.cos-ed input{width:100%;padding:.2em .4em}
.cos-ed small{color:var(--mut);font-weight:700;font-size:.72em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;--c:var(--acc)}
.emb-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.8rem}
.emb-opt{border:2px solid transparent;border-radius:1rem;background:#fff;padding:.5rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;font-weight:800;box-shadow:var(--shadow)}
.emb-opt svg{width:100%;aspect-ratio:1}
.emb-opt.on{border-color:var(--acc);background:#e9f8f0}
.emb-opt[disabled]{opacity:.3}

/* ---------- الشريط العلوي ---------- */
.top{display:flex;align-items:center;gap:.6rem;padding:0 1.2vw;height:7vh;min-height:46px;flex:none}
.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--disp);font-size:clamp(1.4rem,4.1vh,2.6rem);line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.brand svg{width:1.2em;height:1.2em}
.chip-r{background:var(--card2);border-radius:99px;padding:.3em .9em;font-weight:800;box-shadow:var(--ring),var(--shadow);display:flex;gap:.4em;align-items:center;white-space:nowrap}
.chip-r b{font-family:var(--disp);font-weight:400;font-size:1.25em;color:var(--acc)}

/* ---------- شريط الأسعار ---------- */
.ticker{overflow:hidden;white-space:nowrap;background:linear-gradient(180deg,#0d8a5c,#0a6e4b);color:var(--tick-ink);height:4.4vh;min-height:28px;display:flex;align-items:center;direction:ltr;box-shadow:0 .4vh 1vh rgba(0,0,0,.15);border-bottom:.35vh solid #d8b46a;flex:none}
.ticker .tr{display:inline-flex;animation:tick 70s linear infinite}
.ticker .ti{display:inline-flex;gap:.5em;align-items:center;margin:0 1.6em;font-weight:800;direction:rtl}
.ticker .ti b{font-family:var(--disp);font-weight:400;font-size:1.15em;color:#ffe9a8}
.ticker .ti .u{color:#7dffb1}.ticker .ti .d{color:#ffb4ab}
@keyframes tick{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* ---------- خبر الربع ---------- */
.news{margin:1vh 1.2vw 0;display:flex;align-items:center;gap:1rem;background:linear-gradient(90deg,#fff6dc,#fffdf7);border-radius:var(--r);padding:.7vh 1rem;box-shadow:var(--ring),var(--shadow);border-inline-start:.45rem solid var(--gold);min-height:6.6vh;flex:none}
.news .tag{background:#c0392b;color:#fff;font-weight:800;border-radius:.6em;padding:.25em .7em;white-space:nowrap;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{filter:brightness(1.25);transform:scale(1.04)}}
.news .hl{font-family:var(--disp);font-size:clamp(1.15rem,3.3vh,2.1rem);line-height:1.25;flex:1}
.news .q{color:var(--mut);font-weight:800;font-size:.9em;white-space:nowrap}
.news .nh{display:flex;gap:.6em;flex-wrap:wrap;font-size:.9em}

/* ---------- السوق ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(16rem,25vw);gap:1.1vw;padding:1vh 1.2vw}
.mkt{display:grid;grid-template-rows:auto 1fr;gap:1vh;min-height:0}
.idx{background:var(--card);border-radius:var(--r);box-shadow:var(--ring),var(--shadow);display:grid;grid-template-columns:auto 1fr;grid-template-rows:100%;gap:1.2rem;align-items:center;padding:.8vh 1rem;height:15vh}
.idx .chw{position:relative;height:100%}.idx .chw svg{position:absolute;inset:0;width:100%;height:100%}
.idx .lb{font-weight:800;color:var(--mut)}
.idx .v{font-family:var(--disp);font-size:clamp(1.8rem,5.6vh,3.6rem);line-height:1;color:#0b5a40}
.idx .c{font-weight:800;font-size:1.1em}
.cos{display:grid;grid-template-columns:repeat(var(--cc,4),minmax(0,1fr));grid-auto-rows:1fr;gap:1vh .9vw;min-height:0}
.co{--c:#888;position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--ring),var(--shadow);padding:0 .8rem .6vh;display:flex;flex-direction:column;gap:.3vh;overflow:hidden;min-height:0}
.co .hd{display:flex;gap:.6rem;align-items:center;min-width:0;margin:0 -.8rem .2vh;padding:.7vh .8rem;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 82%,#fff),var(--c));border-bottom:.3vh solid #d9b25a}
.co .tt{min-width:0}
.co .lg{width:clamp(2.1rem,6vh,3.8rem);height:clamp(2.1rem,6vh,3.8rem);flex:none;filter:drop-shadow(0 .2vh .4vh rgba(0,0,0,.25))}
.co .lg svg rect:first-of-type{stroke:#fff;stroke-width:3}
.co .nm{font-weight:800;font-size:clamp(.92rem,2.3vh,1.4rem);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.co .sec{font-size:.78em;font-weight:800;color:#fff;opacity:.88}
.co .px{display:flex;align-items:baseline;gap:.5rem;justify-content:space-between}
.co .pr{font-family:var(--disp);font-size:clamp(1.6rem,5vh,3.3rem);line-height:1.05;color:#0b5a40}
.co .ch{font-weight:800;font-size:.92em;border-radius:99px;padding:.1em .55em;white-space:nowrap}
.co .ch.u{background:color-mix(in srgb,var(--up) 15%,#fff);color:var(--up)}.co .ch.d{background:color-mix(in srgb,var(--down) 13%,#fff);color:var(--down)}
.co .sp{flex:1;min-height:0}
.co .sp svg{width:100%;height:100%;display:block}
.co .ft{display:flex;justify-content:space-between;align-items:center;font-size:.76em;font-weight:800;color:var(--mut);gap:.4rem;white-space:nowrap}
.vb{display:inline-flex;gap:2px;align-items:flex-end;height:1em;margin-inline-start:.3em;vertical-align:-.1em}.vb i{width:.32em;border-radius:2px;background:#e3d9c2}.vb i.on{background:var(--c,var(--acc))}
.co .badge{position:absolute;top:.6vh;inset-inline-end:.5rem;font-size:.72em;font-weight:800;border-radius:99px;padding:.1em .6em;background:#fff3d0;color:#8a5a00;box-shadow:var(--shadow)}
.co.frz{box-shadow:0 0 0 .3rem #7dd3fc,var(--shadow)}
.co.frz::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(186,230,253,.35),transparent 60%);pointer-events:none}
.cos.dense .co .lg{width:clamp(1.8rem,4.8vh,3rem);height:clamp(1.8rem,4.8vh,3rem)}
.cos.dense .co .nm{white-space:normal;font-size:clamp(.8rem,2vh,1.2rem);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cos.dense .co .sec{display:none}
.cos.dense .co .pr{font-size:clamp(1.4rem,4.4vh,3rem)}
.cos.dense .co .ft{font-size:.66em}
.co.halt{filter:grayscale(.75)}.co.halt .pr{opacity:.6}
.co.flash-up{animation:fu .9s}.co.flash-down{animation:fd .9s}
@keyframes fu{30%{background:#c9f5da}}@keyframes fd{30%{background:#ffd4cf}}

/* ---------- الفرق ---------- */
.teams{display:flex;flex-direction:column;gap:1vh;min-height:0;overflow:auto;padding:.4vh .3rem}
.tm{--tc:#888;position:relative;border-radius:var(--r);box-shadow:var(--ring),var(--shadow);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 18%,#fffdf7),var(--card) 50%);padding:.8vh .8rem;display:grid;grid-template-columns:auto 1fr auto;gap:.1vh .7rem;align-items:center;flex:1;max-height:18vh;min-height:0;cursor:pointer;transition:transform .15s}
.tm:hover{transform:translateX(-.2rem)}
.tm.act{box-shadow:0 0 0 .25rem var(--tc),var(--shadow)}
.tm .em{width:clamp(2.6rem,8vh,5rem);height:clamp(2.6rem,8vh,5rem);grid-row:span 3}
.tm .em svg{width:100%;height:100%}
.tm .nm{font-weight:800;font-size:clamp(.95rem,2.4vh,1.4rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .w{font-family:var(--disp);font-size:clamp(1.4rem,4.2vh,2.7rem);line-height:1;text-align:end;grid-row:span 2;color:#0b5a40;transition:color .3s}
.tm .w.gain{color:var(--up)}.tm .w.loss{color:var(--down)}
.tm .rnk{display:flex;justify-content:flex-end}
.tm .rnk span{font-family:var(--disp);font-size:1.15em;line-height:1;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#e9c46a,#b8860b);box-shadow:0 .2vh .4vh rgba(0,0,0,.2)}
.tm .sub{font-size:.8em;color:var(--mut);font-weight:800;display:flex;gap:.6em;align-items:center;white-space:nowrap}
.tm .mix{grid-column:2/-1;height:.55rem;border-radius:99px;overflow:hidden;display:flex;background:#efe4cc}
.tm .mix i{display:block;height:100%}
.tm .cards{display:flex;gap:.25rem;min-height:1.9em}
.tm .cards span{width:1.5em;height:1.9em;border-radius:.3em;background:linear-gradient(160deg,#fff,#ffe7a8);box-shadow:0 1px 3px rgba(0,0,0,.2);display:grid;place-items:center;font-size:.75em;border:1px solid #e5b84a}
.tm .flag{position:absolute;top:-.55rem;inset-inline-start:.8rem;font-size:.72em;font-weight:800;border-radius:99px;padding:0 .6rem;background:var(--tc);color:#fff;box-shadow:var(--shadow)}
.tm.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.04)}}

/* ---------- الشريط السفلي ---------- */
.bar{display:flex;gap:.7rem;justify-content:center;align-items:center;padding:.6vh 1rem 1.2vh;flex-wrap:wrap;flex:none}
.bar .mini-emb{width:1.4em;height:1.4em}

/* ---------- النوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(40,32,10,.42);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:1.5vh 1rem;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--card2);border-radius:1.6rem;box-shadow:0 0 0 .35rem var(--rim),0 0 0 .6rem #fff3d6,0 3vh 6vh rgba(60,40,0,.35);padding:2vh 1.6rem;width:min(62rem,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:1.4vh;animation:pop .35s both}
.dlg.sm{width:min(38rem,100%)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.dlg h3{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(1.5rem,4.4vh,2.4rem);display:flex;gap:.5rem;align-items:center;color:#0b5a40;line-height:1.2}
.dlg h3.ctr,.center h3{justify-content:center}
.center{text-align:center;display:flex;flex-direction:column;gap:1.2vh;align-items:center}
.big-e{font-size:clamp(4rem,14vh,7rem);line-height:1;filter:drop-shadow(0 .6vh .8vh rgba(0,0,0,.18));animation:popE .6s both}
@keyframes popE{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.15)}}
.shake{animation:shake .6s}
@keyframes shake{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}}
.lead{margin:0;font-weight:700;font-size:1.08em;line-height:1.7}
.why{margin:0;background:#fff6dc;border:2px dashed var(--rim);border-radius:1rem;padding:.7vh 1rem;font-weight:700;line-height:1.7}
.res{font-family:var(--disp);font-size:clamp(1.6rem,4.6vh,2.6rem);text-align:center;animation:pop .4s both}
.bonus{font-weight:800;background:#fff3d0;border-radius:99px;padding:.3em 1em;color:#8a5a00}
.line{display:flex;gap:.8rem;align-items:center;font-weight:800;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 14%,#fff),#fff);border-radius:1rem;padding:.6vh 1rem;width:100%}

/* الخبر العاجل */
.dlg.news{width:min(56rem,100%);background:linear-gradient(180deg,#fffdf7,#fff6dc)}
.breaking{background:#c0392b;color:#fff;font-weight:800;border-radius:.6em;padding:.3em 1em;font-size:1.2em;animation:blink 1.2s ease-in-out infinite}
.nh-big{font-family:var(--disp);font-size:clamp(2rem,6.8vh,3.8rem);line-height:1.3;color:var(--ink);text-wrap:balance;animation:slide .6s both .15s}
@keyframes slide{from{transform:translateY(2vh);opacity:0}}

/* اختيار المستوى */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.tier{--k:#888;border:0;border-radius:1.3rem;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--k) 12%,#fff));box-shadow:0 0 0 3px var(--k),var(--shadow);padding:2vh 1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4vh;transition:transform .15s}
.tier:hover{transform:translateY(-.5vh) scale(1.02)}
.tier .te{font-size:clamp(2rem,6vh,3.4rem);line-height:1}
.tier b{font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,4.6vh,2.6rem);color:var(--k)}
.tier .rw{font-family:var(--disp);font-size:clamp(1.3rem,3.6vh,2rem);color:#0b5a40}
.wager{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;justify-content:center;background:#fff6dc;border-radius:1rem;padding:.8vh 1rem}

/* السؤال */
.q-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.tier-pill{--k:#888;background:var(--k);color:#fff;font-weight:800;border-radius:99px;padding:.25em .9em}
.who-pill{--tc:var(--acc);display:inline-flex;gap:.4em;align-items:center;font-weight:800;border-radius:99px;padding:.15em .8em .15em .3em;background:color-mix(in srgb,var(--tc) 15%,#fff);box-shadow:0 0 0 2px var(--tc)}
.q-text{font-family:var(--disp);font-weight:400;font-size:clamp(1.8rem,5.6vh,3.2rem);line-height:1.4;text-align:center;text-wrap:balance;padding:1vh 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.op{border:0;box-shadow:0 0 0 2px var(--rim),var(--shadow);background:#fff;border-radius:1rem;padding:1.1vh 1rem;font-weight:800;font-size:clamp(1.1rem,3.2vh,1.7rem);cursor:pointer;display:flex;gap:.7rem;align-items:center;text-align:start;transition:background .2s,box-shadow .2s}
.op:hover{box-shadow:0 0 0 3px var(--acc),var(--shadow)}
.op .l{font-family:var(--disp);background:#fff3d0;color:#8a5a00;border-radius:.6rem;min-width:2.2rem;height:2.2rem;display:grid;place-items:center;flex:none}
.op.ok{background:#d6f7e3;box-shadow:0 0 0 3px var(--up)}
.op.no{background:#ffdcd7;box-shadow:0 0 0 3px var(--down);animation:shake .5s}
.op.dim{opacity:.4}
.op.cut{opacity:.15;text-decoration:line-through}
.ring{position:relative;width:4.4rem;height:4.4rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:#efe4cc}.ring .fg{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .1s linear}
.ring.warn .fg{stroke:var(--down)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:1.6rem}
.who{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.who button{--tc:#888;border:0;box-shadow:0 0 0 2px var(--tc);background:color-mix(in srgb,var(--tc) 14%,#fff);border-radius:1rem;padding:.4em 1em .4em .6em;font-weight:800;cursor:pointer;font-size:1.05rem;display:inline-flex;gap:.4em;align-items:center}
.who button.sel{background:var(--tc);color:#fff}
.who button.out{opacity:.3;pointer-events:none}

/* التداول */
.dlg.trade{width:min(78rem,100%);gap:1vh}
.tr-stat{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;font-weight:800}
.tr-stat b{font-family:var(--disp);font-weight:400;font-size:1.5em;color:#0b5a40}
.tr-stat .ops{background:#fff6dc;border-radius:99px;padding:.15em .8em;letter-spacing:.05em}
.tr-news{color:var(--mut);font-size:.9em;flex:1;min-width:12rem}
.tr-wrap{overflow:auto;min-height:0}
.tr-tbl{width:100%;border-collapse:separate;border-spacing:0 .5vh}
.tr-tbl td{padding:.35vh .5rem;background:#fff;font-weight:800;border-block:1px solid #f0e3c3}
.tr-tbl td:first-child{border-radius:0 .9rem .9rem 0;border-inline-start:.35rem solid var(--c)}.tr-tbl td:last-child{border-radius:.9rem 0 0 .9rem}
.tr-tbl tr.blk td{background:#f6f1e6;color:var(--mut)}
.tco{display:flex;gap:.5rem;align-items:center}.tco .lg{width:2.3em;height:2.3em;flex:none}.tco small{display:block;color:var(--mut);font-size:.75em}
.tr-tbl .pr{font-family:var(--disp);font-size:1.5em;font-weight:400;color:#0b5a40}
.tr-tbl .own small{display:block;color:var(--mut);font-size:.75em}
.qty{display:flex;align-items:center;gap:.25rem}
.qty input{width:4.6rem;text-align:center;padding:.25em .3em}
.qty button{border:0;border-radius:.5rem;background:#fff3d0;cursor:pointer;font-weight:800;padding:.25rem .55rem;white-space:nowrap}
.tr-foot{justify-content:flex-start}
.card-btn{background:linear-gradient(160deg,#fff,#ffe7a8)}

/* البطاقات وملف الفريق */
.hold-list{display:flex;gap:.5rem;flex-wrap:wrap}
.hold{--c:#888;display:inline-flex;gap:.4rem;align-items:center;background:#fff;border-radius:99px;padding:.2em .8em .2em .3em;box-shadow:0 0 0 2px var(--c);font-weight:800}
.hold .lg{width:1.8em;height:1.8em}.hold small{color:var(--mut)}
.cards-hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.8rem}
.pcard{background:linear-gradient(170deg,#fffdf4,#ffeab0);border-radius:1.1rem;box-shadow:0 0 0 2px #e5b84a,var(--shadow);padding:1.2vh .9rem;display:flex;flex-direction:column;gap:.4vh;align-items:center;text-align:center}
.pcard .pe{font-size:2.6em;line-height:1}.pcard p{margin:0;font-size:.85em;font-weight:700;color:#5b4a26;flex:1}
.pick-co{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.pco{--c:#888;border:0;border-radius:1rem;background:#fff;box-shadow:0 0 0 2px var(--c),var(--shadow);padding:.6rem;cursor:pointer;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.pco .lg{width:2.8em;height:2.8em}

/* الظرف المختوم */
.env-e{animation:popE .6s both,float 2.4s ease-in-out .6s infinite alternate}
@keyframes float{to{transform:translateY(-1vh) rotate(4deg)}}
.hold-btn{position:relative;border:1.1vh solid transparent;border-radius:1.2rem;padding:2.4vh 2rem;min-width:min(32rem,90%);min-height:14vh;background:linear-gradient(#fff8e6,#fff3d0) padding-box,repeating-linear-gradient(45deg,#c0392b 0 14px,#fff 14px 28px,#1d6fd8 28px 42px,#fff 42px 56px) border-box;color:var(--ink);font-weight:800;font-size:1.15em;cursor:pointer;box-shadow:var(--shadow);touch-action:none}
.hold-btn .secret{position:absolute;inset:0;border-radius:.6rem;background:#fffbea;color:var(--ink);text-shadow:none;display:none;flex-direction:column;justify-content:center;gap:.4vh;padding:1vh 1.4rem;box-shadow:0 0 0 3px #e5b84a}
.hold-btn.open .secret{display:flex}
.sec-h{font-weight:800;color:#8a5a00}.sec-t{font-size:1.25em;font-weight:800;line-height:1.5}
.rel{display:inline-block;align-self:center;font-weight:800;border-radius:99px;padding:.1rem .8rem;font-size:.9em}.rel.sure{background:#dcfce7;color:#166534}.rel.rumor{background:#fee2e2;color:#991b1b}

/* جرس الإغلاق */
.dlg.close-dlg{width:min(74rem,100%)}
.close-news{border-radius:1.1rem;padding:1vh 1rem;background:#fff;box-shadow:0 0 0 2px var(--rim)}
.close-news.yes{box-shadow:0 0 0 3px var(--up)}.close-news.no{box-shadow:0 0 0 3px #b9a982}
.cn-h{display:flex;gap:1rem;justify-content:space-between;align-items:center;flex-wrap:wrap;font-family:var(--disp);font-size:clamp(1.15rem,3.2vh,1.8rem)}

<script>

    ${t && G.opts.wager !== false ? `<div class="wager"><span class="lbl">🎲 رهان إضافي على السؤال الصعب فقط:</span><div class="seg" id="wg">${[0, .1, .25].map((p, k) => `<button class="chip ${k ? '' : 'on'}" data-act="wg" data-v="${Math.min(cap, Math.round(worth(t) * p / 10) * 10)}">${k ? `${p * 100}٪ (${money(Math.min(cap, Math.round(worth(t) * p / 10) * 10))})` : 'بدون'}</button>`).join('')}</div><span class="hint">صح = تكسبونه فوق المكافأة · غلط = تخسرونه</span></div>` : ''}
    <p class="hint">الإجابة الصحيحة = المكافأة + فرصة تداول (شراءين وبيعتين). الغلط = تروح عليكم فرصة هالربع.</p>`, 'tier-dlg');
  Q = { team: ti, wager: 0, pickTier: true };
}
function startQ(tier) {

  const seq = G.opts.mode === 'seq';
  Q = { q, tier, opts: shuffle([q.a, ...shuffle(q.w).slice(0, 3)]), team: seq ? Q.team : null, wager: tier === 2 && seq ? (Q.wager || 0) : 0, out: [], done: false, cut: [] };
  if (Q.team != null && tier === 2) G.teams[Q.team].st.hard++;
  if (Q.wager) G.teams[Q.team].st.wager += Q.wager;
  renderQ(); Snd.pop(); hostSync();
}
function renderQ() {
  const seq = G.opts.mode === 'seq', T = G.teams, q = Q.q, Ti = TIERS[Q.tier], t = Q.team != null && seq ? T[Q.team] : null;
  const canFifty = t && t.cards.includes('fifty') && !Q.cut.length;
  const d = overlay(`<div class="q-head"><span class="tier-pill" style="--k:${Ti.c}">${Ti.e} ${Ti.n} · +${money(reward(Q.tier))}${Q.wager ? ` · رهان ${money(Q.wager)}` : ''}</span><span class="lbl">${esc(q.cat)}</span><span class="sp"></span>${t ? `<span class="who-pill" style="--tc:${t.c}"><span class="mini-emb">${ART.teamBadge(t.emb, t.c, 'qq')}</span>${esc(t.n)}</span>` : '<span class="who-pill">سؤال للجميع: أسرع فريق</span>'}${ringHTML(G.opts.qTime)}</div>
    <div class="q-text">${esc(q.q)}</div>
    <div class="opts">${Q.opts.map((o, i) => `<button class="op ${Q.cut.includes(i) ? 'cut' : ''}" data-act="pick" data-i="${i}" ${Q.cut.includes(i) ? 'disabled' : ''}><span class="l">${'أبجد'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="q-who">${seq ? '' : whoHTML()}</div>
    <div id="q-foot" class="row"><span class="hint">${seq ? 'اضغط الجواب اللي اختاره الفريق (أو ١–٤)' : 'اختر الفريق اللي جاوب أول، ثم جوابه'}</span>${canFifty ? `<button class="btn" data-act="fifty">✂️ حذف خيارين (بطاقة)</button>` : ''}<button class="btn" data-act="q-swap" title="سؤال بديل لو فيه مشكلة">🔄 سؤال بديل</button><button class="btn" data-act="q-timeout">⏱ انتهى الوقت</button></div>`, 'q-dlg');
  startTimer(G.opts.qTime, $('#ring', d), () => { Snd.alarm(); timeUp(); });
}
const whoHTML = () => `<div class="lbl" style="text-align:center;margin-bottom:.4rem">مين جاوب أول؟</div><div class="who">${G.teams.map((t, i) => `<button style="--tc:${t.c}" class="${Q.out.includes(i) ? 'out' : Q.team === i ? 'sel' : ''}" data-act="who" data-i="${i}"><span class="mini-emb">${ART.teamBadge(t.emb, t.c, 'w' + i)}</span>${esc(t.n)}${Q.team === i ? ' ✓' : ''}</button>`).join('')}</div>`;
function pick(i) {
  if (!Q || Q.done || !Q.opts || Q.cut.includes(i)) return;
  if (Q.team == null) return toast('اختر الفريق اللي جاوب أول');
  const ok = Q.opts[i] === Q.q.a, ti = Q.team, t = G.teams[ti];
  $$('.op').forEach((b, k) => { b.classList.toggle('ok', Q.opts[k] === Q.q.a); if (k === i && !ok) b.classList.add('no'); if (k !== i && Q.opts[k] !== Q.q.a) b.classList.add('dim'); });
  if (ok) { Q.done = true; stopTimer(); correct(ti); return; }
  if (G.opts.mode !== 'seq' && Q.tier === 2) t.st.hard++;
  Snd.bad(); Q.out.push(ti); t.st.wrong++; t.st.streak = 0;
  if (G.opts.mode === 'seq') {
    Q.done = true; stopTimer();
    if (Q.wager) { t.cash = Math.max(0, t.cash - Q.wager); saveGame(); renderTeams(); }
    $('#q-foot').innerHTML = `<div class="res down-t">خطأ! الجواب «${esc(Q.q.a)}»${Q.wager ? ` · خسرتوا الرهان ${money(Q.wager)}` : ''}</div>${t.cards.includes('extra') ? '<span class="hint">عندكم ⏰ صفقة خارج الوقت</span>' : ''}<button class="btn big" data-act="q-next">التالي ←<kbd>Enter</kbd></button>`;
  } else {
    Q.team = null;
    if (Q.out.length >= G.teams.length) { Q.done = true; stopTimer(); $('#q-foot').innerHTML = `<div class="res">ما أحد جاوب صح: «${esc(Q.q.a)}»</div><button class="btn big" data-act="q-next">التالي ←<kbd>Enter</kbd></button>`; }
    else setTimeout(() => { if (!Q || Q.done) return; $$('.op').forEach(b => b.classList.remove('ok', 'no', 'dim')); $('#q-who').innerHTML = whoHTML(); toast(`${t.n} غلط، الفرصة للباقين`); }, 900);
  }
  saveGame();
}
function timeUp() {
  if (!Q || Q.done) return; Q.done = true;
  if (Q.team != null && G.opts.mode === 'seq') { const t = G.teams[Q.team]; t.st.wrong++; t.st.streak = 0; if (Q.wager) t.cash = Math.max(0, t.cash - Q.wager); saveGame(); renderTeams(); }
  $$('.op').forEach((b, k) => { b.classList.toggle('ok', Q.opts[k] === Q.q.a); if (Q.opts[k] !== Q.q.a) b.classList.add('dim'); });
  $('#q-foot').innerHTML = `<div class="res down-t">انتهى الوقت! الجواب «${esc(Q.q.a)}»</div><button class="btn big" data-act="q-next">التالي ←<kbd>Enter</kbd></button>`;
}
function correct(ti) {
  const t = G.teams[ti], r = reward(Q.tier) + (Q.wager || 0); t.cash += r;
  if (G.opts.mode !== 'seq' && Q.tier === 2) t.st.hard++;
  t.st.right++; t.st.streak++; t.st.best = Math.max(t.st.best, t.st.streak); t.st.bestQ = Math.max(t.st.bestQ, Q.tier);
  let bonus = '';
  if (t.st.streak % 3 === 0 && G.opts.cards && t.cards.length < 4) { const k = drawCard(t); bonus = `<div class="bonus">🔥 ثلاث إجابات صح ورا بعض: بطاقة ${CARDS[k].e} ${CARDS[k].n}!</div>`; }
  Snd.cash(); FX.burst(26); saveGame(); renderTeams(); bump(ti);
  $('#q-who').innerHTML = ''; $('#q-foot').innerHTML = `<div class="res up-t">صح! +${money(r)} 💵 · ${esc(t.n)}</div>${bonus}<button class="btn gold big" data-act="q-after" data-i="${ti}">🔄 افتح التداول ←<kbd>Enter</kbd></button>`;
}
function afterQ(ti) {
  closeOverlay(); Q = null; hostSync();
  if (ti != null && G.opts.surprise && Math.random() < G.opts.surprise) return surprise(ti, () => openTrade(ti, true));
  if (ti != null) openTrade(ti, true); else endTurn();
}

/* ==========================================================================
   8) المفاجآت الخمس (من المسابقة الأصلية)
   ========================================================================== */
const SURPRISES = [
  { w: 2, e: '⛔', n: 'خلل في النظام', run: t => { t.blocked = true; Snd.alarm(); return `${esc(t.n)} ما يقدرون يبيعون ولا يشترون هالمرة`; } },
  { w: 2, e: '📉', n: 'هبوط مفاجئ بسبب تلاعب', run: () => { const c = rnd(stocks()), f = rr(.15, .3); c.price = Math.max(1, Math.round(c.price * (1 - f))); c.fv *= 1 - f; Snd.down(); return `سهم ${esc(c.n)} نزل ${Math.round(f * 100)}٪`; } },
  { w: 2, e: '🚀', n: 'صعود مفاجئ بسبب صفقة تجارية', run: () => { const c = rnd(stocks()), f = rr(.15, .3); c.price = Math.round(c.price * (1 + f)); c.fv *= 1 + f; Snd.up(); return `سهم ${esc(c.n)} طار ${Math.round(f * 100)}٪`; } },
  { w: 1.5, e: '💰', n: 'خطأ في النظام لصالحكم: منحة مالية', run: t => { const v = Math.round(Math.max(G.opts.cash * .1, t.cash * .2) / 10) * 10; t.cash += v; Snd.cash(); FX.burst(50); return `${esc(t.n)} +${money(v)} 💵`; } },
  { w: 1.5, e: '🎁', n: 'خطأ في النظام لصالحكم: منحة أسهم', run: t => { const c = rnd(stocks()), q = Math.max(1, Math.round(G.opts.cash * .15 / c.price)); t.hold[c.id] = (t.hold[c.id] || 0) + q; Snd.cash(); return `${esc(t.n)} حصلوا ${q} سهم في ${esc(c.n)}`; } },
];
function surprise(ti, then) {
  const t = G.teams[ti], tot = SURPRISES.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot, X = SURPRISES[0];
  for (const x of SURPRISES) { r -= x.w; if (r < 0) { X = x; break; } }
  const msg = X.run(t); saveGame(); renderCos(); renderTeams();
  overlay(`<div class="center"><div class="lbl">مفاجأة!</div><div class="big-e shake">${X.e}</div><h3>${X.n}</h3><div class="res">${msg}</div><button class="btn gold big" data-act="cont">كمّل ←<kbd>Enter</kbd></button></div>`, 'sm');
  cont(then);
}

/* ==========================================================================
   9) التداول
   ========================================================================== */
let TR = null;
function openTrade(ti, normal) {

  TR = { ti, b: 0, s: 0, qty: {}, normal }; renderTrade(true); Snd.bell();
}
const tradeBlock = c => G.halt && G.halt.cid === c.id ? '⛔ موقوف' : G.frozen[c.id] != null && G.frozen[c.id] !== TR.ti ? '❄️ مجمّد' : '';
function renderTrade(first) {
  const t = G.teams[TR.ti], N = ENG.NEWS[G.news.i];
  const rows = live().map(c => {
    const q = TR.qty[c.id] ?? 10, own = t.hold[c.id] || 0, p = pct(c.price, c.open), blk = tradeBlock(c), mb = ENG.maxBuy(G, t, c);
    return `<tr class="${blk ? 'blk' : ''}" style="--c:${c.c}"><td><div class="tco"><span class="lg">${ART.coLogo(c.sec, c.c, 't' + c.id)}</span><span><b>${esc(c.n)}</b><small>${S[c.sec].n}</small></span></div></td><td class="pr">${money(c.price)}</td><td class="${p >= 0 ? 'up-t' : 'down-t'}">${pctT(p)}</td>
      <td class="own">${own ? `<b>${own}</b> سهم<small>${money(own * c.price)}</small>` : '<span class="hint">—</span>'}</td>
      <td>${blk ? `<b class="hint">${blk}</b>` : `<div class="qty"><button data-act="q-d" data-c="${c.id}" data-d="-10" aria-label="أقل">−</button><input class="fld" type="number" min="1" value="${q}" data-qty="${c.id}"><button data-act="q-d" data-c="${c.id}" data-d="10" aria-label="أكثر">+</button><button data-act="q-max" data-c="${c.id}" data-m="${mb}" title="أكبر عدد تقدرون تشترونه">أقصى ${mb}</button></div>`}</td>
      <td><div class="row nw"><button class="btn up" data-act="buy" data-c="${c.id}" ${blk || TR.b >= MAX_OPS || mb < 1 ? 'disabled' : ''}>شراء</button><button class="btn down" data-act="sell" data-c="${c.id}" ${blk || TR.s >= MAX_OPS || !own ? 'disabled' : ''}>بيع</button></div></td></tr>`;
  }).join('');

  const html = `<div class="q-head"><h3><span class="mini-emb">${ART.teamBadge(t.emb, t.c, 'tr')}</span>تداول ${esc(t.n)}</h3><span class="sp"></span>${first ? ringHTML(G.opts.tTime) : '<span id="ring-slot"></span>'}</div>
    <div class="tr-stat"><span>💵 النقد <b>${money(t.cash)}</b></span><span>📈 الثروة <b>${money(worth(t))}</b></span><span class="ops">شراء ${'●'.repeat(MAX_OPS - TR.b)}${'○'.repeat(TR.b)} · بيع ${'●'.repeat(MAX_OPS - TR.s)}${'○'.repeat(TR.s)}</span>${G.news.off ? '' : `<span class="tr-news">📰 ${esc(N.t)}</span>`}</div>
    <div class="tr-wrap"><table class="tr-tbl">${rows}</table></div>
    <div class="row tr-foot">${usable.map(k => `<button class="btn card-btn" data-act="use-card" data-k="${k}" data-i="${TR.ti}">${CARDS[k].e} ${CARDS[k].n}</button>`).join('')}${t.tip ? '<button class="btn" data-act="env" data-i="' + TR.ti + '">📩 ظرفكم</button>' : ''}<span class="sp"></span><span class="hint">السعر ينفّذ بمتوسط الحركة: الصفقة الكبيرة تحرك السعر عليكم</span><button class="btn gold big" data-act="trade-done">✓ إنهاء التداول<kbd>Enter</kbd></button></div>`;
  if (first) { const d = overlay(html, 'trade'); startTimer(G.opts.tTime, $('#ring', d), () => { Snd.alarm(); toast('انتهى وقت التداول'); finishTrade(); }); }

function trade(cid, buy) {
  const t = G.teams[TR.ti], c = co(cid), inp = $(`[data-qty="${cid}"]`); if (!c || tradeBlock(c)) return;
  let q = Math.max(1, Math.floor(+inp.value || 0));
  snap();
  if (buy) {
    if (TR.b >= MAX_OPS) return; q = Math.min(q, ENG.maxBuy(G, t, c)); if (q < 1) return toast('النقد ما يكفي');
    const p0 = c.price, cost = ENG.exec(G, c, q, true); t.cash -= cost; t.hold[cid] = (t.hold[cid] || 0) + q; TR.b++;
    Snd.up(); toast(`اشتريتوا ${q} سهم من ${c.n} بـ ${money(cost)} · السعر ${money(p0)} ← ${money(c.price)}`);
  } else {
    if (TR.s >= MAX_OPS) return; q = Math.min(q, t.hold[cid] || 0); if (q < 1) return;
    const p0 = c.price, got = ENG.exec(G, c, q, false); t.cash += got; t.hold[cid] -= q; if (!t.hold[cid]) delete t.hold[cid]; TR.s++;
    Snd.down(); toast(`بعتوا ${q} سهم من ${c.n} بـ ${money(got)} · السعر ${money(p0)} ← ${money(c.price)}`);
  }
  TR.qty[cid] = q; saveGame(); renderCos(); renderTeams(); renderTrade(false); flashCo(cid, buy);
}
function finishTrade() { if (!TR) return; const normal = TR.normal; TR = null; closeOverlay(); if (normal) endTurn(); else renderAll(); }

function endTurn() {
  if (G.opts.mode === 'seq') { const ti = turnTeam(); if (ti != null && !G.done.includes(ti)) G.done.push(ti); }
  else G.qn++;
  saveGame(); renderAll();
  const all = G.opts.mode === 'seq' ? turnTeam() == null : G.qn >= G.teams.length;
  if (all) setTimeout(() => { if (!ovEl && G.phase === 'trading') closeRound(); }, 600);
}

    <div class="hold-list">${H.length ? H.map(c => `<span class="hold" style="--c:${c.c}"><span class="lg">${ART.coLogo(c.sec, c.c, 'h' + c.id)}</span>${esc(c.n)} <b>${t.hold[c.id]}</b> <small>${money(t.hold[c.id] * c.price)}</small></span>`).join('') : '<span class="hint">ما عندهم أسهم، كله نقد</span>'}</div>
    <div class="lbl">🃏 بطاقات القوى (كل بطاقة مرة وحدة)</div>
    <div class="cards-hand">${t.cards.length ? t.cards.map(k => `<div class="pcard"><div class="pe">${CARDS[k].e}</div><b>${CARDS[k].n}</b><p>${CARDS[k].d}</p>${k === 'fifty' ? '<span class="hint">تنستخدم داخل سؤالكم</span>' : `<button class="btn gold" data-act="use-card" data-k="${k}" data-i="${i}" ${G.phase !== 'trading' ? 'disabled' : ''}>استخدموها</button>`}</div>`).join('') : '<span class="hint">ما عندهم بطاقات. ثلاث إجابات صح ورا بعض = بطاقة جديدة</span>'}</div>
    <div class="row" style="justify-content:flex-start">${t.tip ? `<button class="btn" data-act="env" data-i="${i}">📩 الظرف المختوم</button>` : ''}${t.know ? `<button class="btn" data-act="know" data-i="${i}">🕵️ المعلومة الداخلية</button>` : ''}<button class="btn" data-act="adj" data-i="${i}">± تعديل النقد</button><span class="sp"></span><button class="btn gold" data-close>تمام</button></div>`, 'team-dlg', true);
}
function useCard(i, k) {
  const t = G.teams[i]; if (!t.cards.includes(k) || G.phase !== 'trading') return;
  const take = () => { snap(); t.cards.splice(t.cards.indexOf(k), 1); };
  const back = () => { if (TR && TR.ti === i) renderTrade(false); else { closeOverlay(); renderAll(); } };
  if (k === 'freeze') {
    const inTrade = !!TR;
    const d = overlay(`<h3>❄️ تجميد سهم: اختاروا الشركة</h3><p class="hint">ما أحد غير ${esc(t.n)} يقدر يشتري أو يبيع فيها لين جرس الإغلاق.</p><div class="pick-co">${live().filter(c => !(G.halt && G.halt.cid === c.id)).map(c => `<button class="pco" style="--c:${c.c}" data-cid="${c.id}"><span class="lg">${ART.coLogo(c.sec, c.c, 'f' + c.id)}</span>${esc(c.n)}</button>`).join('')}</div><div class="row"><button class="btn" id="fz-x">إلغاء</button></div>`, 'sm');
    const saved = TR; TR = null;
    d.addEventListener('click', e => {
      const b = e.target.closest('.pco'); if (e.target.id === 'fz-x') { closeOverlay(); TR = saved; if (inTrade) renderTrade(true); else renderAll(); return; }
      if (!b) return; take(); G.frozen[b.dataset.cid] = i; Snd.whoosh(); saveGame(); closeOverlay(); TR = saved; toast(`❄️ تجمّد سهم ${co(b.dataset.cid).n} لصالح ${t.n}`); renderAll(); if (inTrade) renderTrade(true);
    });
    return;
  }
  take();
  if (k === 'hedge') { t.hedge = true; Snd.good(); toast(`🛡️ ${t.n} متحوّطين: أي خسارة في الإغلاق تتعوّض`); }
  if (k === 'dbl') { t.dblDiv = true; Snd.cash(); toast(`💰 توزيعات ${t.n} مضاعفة هالربع`); }
  if (k === 'insider') { t.know = { r: G.round, ev: G.hidden ? { ...G.hidden } : null }; saveGame(); Snd.whoosh(); return privateDlg(i, 'know', back); }
  if (k === 'extra') { saveGame(); closeOverlay(); return openTrade(i, false); }
  saveGame(); back();
}

}

  a = best((t, i) => Math.max(...t.st.ranks.slice(0, -1), 0) - order.indexOf(i)); if (a) A.push(['🔄', 'أكبر قلبة', a[0], `صعدوا ${a[1]} ${a[1] > 1 ? 'مراكز' : 'مركز'}`]);
  a = best(t => t.st.hard * 2 + t.st.wager / G.opts.cash * 4); if (a) { const s = T[a[0]].st; A.push(['🦁', 'أجرأ فريق', a[0], [s.hard ? `${s.hard} ${s.hard > 2 ? 'أسئلة صعبة' : 'سؤال صعب'}` : '', s.wager ? `رهانات ${money(s.wager)}` : ''].filter(Boolean).join(' · ')]); }
  a = best(t => t.st.best, v => v >= 2); if (a) A.push(['🔥', 'أطول سلسلة', a[0], `${a[1]} إجابات صح ورا بعض`]);
  a = best(t => t.st.divTot || 0); if (a) A.push(['💰', 'المستثمر الصبور', a[0], `توزيعات ${money(a[1])}`]);
  a = best(t => t.st.bestRound ?? -1); if (a) A.push(['📈', 'أفضل ربع', a[0], `نمو ${pctT(a[1] * 100)}`]);
  a = best(t => t.st.right); if (a) A.push(['🧠', 'العقل الذهبي', a[0], `${a[1]} إجابات صح`]);

}
function finish() {
  closeOverlay();

    <div class="podium">${pod}</div>${rest ? `<div class="rank">${rest}</div>` : ''}
    <div class="awards">${awards().map(([e, n, i, d]) => `<div class="aw" style="--tc:${T[i].c}"><span class="ae">${e}</span><b>${n}</b><span>${esc(T[i].n)}</span><small>${d}</small></div>`).join('')}</div>
    <div class="row"><button class="btn gold big" data-act="to-setup">🔁 مسابقة جديدة</button><button class="btn" data-act="back">↶ رجوع للسوق</button><button class="btn" data-act="to-home">🏠 الرئيسية</button></div></div>`;

const HELP = `<h3>❓ طريقة اللعب</h3>
  <div class="how">${[['📰', 'خبر عاجل', 'كل ربع يبدأ بخبر اقتصادي. فكّروا: أي قطاع يستفيد وأيها يتضرر؟'], ['❓', 'سؤال بمستوى تختارونه', 'سهل ٦٠٠ · متوسط ١٠٠٠ · صعب ١٦٠٠ (ومعه رهان). الصح = مكافأة + فرصة تداول.'], ['🔄', 'تداول', 'شراءين وبيعتين بالكثير. الشراء يرفع السعر والبيع ينزّله.'], ['🔔', 'جرس الإغلاق', 'تنكشف أثر الخبر والمفاجأة الخفية، وتنصرف التوزيعات، ونجم الربع ياخذ ظرف مختوم 📩']].map(([e, h, p], i) => `<div class="hw"><span class="hn">${i + 1}</span><span class="he">${e}</span><b>${h}</b><p>${p}</p></div>`).join('<span class="harr">←</span>')}</div>

  <div><b>🧠 أسرار الاستثمار</b><ul><li>🏦 الأسهم الهادئة (البنوك والاتصالات والأغذية) توزّع أرباح كل ربع.</li><li>💻 التقنية والعقار تتذبذب أكثر: ربح أكبر أو خسارة أكبر.</li><li>🧺 نوّعوا: خبر سيئ لقطاع واحد ما يهدّكم.</li><li>📩 الظرف: «مصدر موثوق» يصدق غالباً، و«الإشاعة» نص ونص.</li><li>🛟 المتأخر يبدأ أول، وصندوق الإنقاذ يدعم اللي ثروته أقل من نص المتصدر.</li><li>🔔 آخر ربع فيه رهان الجرس الأخير: فرصة تقلب الترتيب.</li></ul></div></div>

  <div class="row" style="justify-content:flex-start"><button class="btn gold" data-close>تمام</button></div>`;

const applySound = () => $$('.snd-btn').forEach(b => { b.textContent = prefs.sound ? '🔊' : '🔇'; b.classList.toggle('off', !prefs.sound); });
const toggleFS = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }); };
function embPicker(i) {
  const T = teamList(), used = T.map((t, k) => k !== i && t.emb);
  const d = overlay(`<h3>🛡 شعار ${esc(T[i].n)}</h3><div class="emb-grid">${ART.EMB_KEYS.map(k => `<button class="emb-opt ${T[i].emb === k ? 'on' : ''}" data-k="${k}" ${used.includes(k) ? 'disabled' : ''}>${ART.teamBadge(k, T[i].c, 'g' + k)}<span>${ART.EMB[k].n}</span></button>`).join('')}</div><div class="row"><button class="btn" data-close>إلغاء</button></div>`, '', true);
  d.addEventListener('click', e => { const b = e.target.closest('.emb-opt'); if (!b || b.disabled) return; prefs.embs[i] = b.dataset.k; savePrefs(); closeOverlay(); renderSetup(); Snd.pop(); });
}
const ACT = {
  'to-setup'() { renderSetup(); Snd.pop(); }, 'to-home'() { renderHome(); }, home() { closeOverlay(); TR = null; Q = null; renderHome(); },
  resume() { const s = Store.get(GAME_KEY, null); if (!s || s.v !== 2) return; G = s; hist.length = 0; showGame(); Snd.pop(); if (G.phase === 'trading' && !G.news) startRound(); },
  help() { overlay(HELP, 'help-dlg', true); }, sound() { prefs.sound = !prefs.sound; savePrefs(); applySound(); Snd.pop(); if ($('#setup').classList.contains('on')) renderSetup(); }, fs: toggleFS, host: hostOpen,
  set(el) { const k = el.dataset.k, v = el.dataset.v; prefs[k] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; fixMode(); savePrefs(); if (k === 'sound') applySound(); renderSetup(); Snd.pop(); },
  pmode(el) { applyMode(el.dataset.m); savePrefs(); renderSetup(); Snd.pop(); },
  src(el) { const v = el.dataset.v, s = new Set(prefs.src); s.has(v) ? s.delete(v) : s.add(v); if (!s.size) return toast('اختر مصدر واحد على الأقل'); prefs.src = [...s]; savePrefs(); renderSetup(); },
  'team-n'(el) { prefs.teamCount = Math.max(2, Math.min(6, prefs.teamCount + +el.dataset.d)); savePrefs(); renderSetup(); Snd.pop(); },
  'emb-pick'(el) { embPicker(+el.dataset.i); },
  'team-col'(el) { const i = +el.dataset.i, T = teamList(), used = T.map(t => t.c); let j = COLORS.indexOf(T[i].c); do { j = (j + 1) % COLORS.length; } while (used.includes(COLORS[j]) && COLORS[j] !== T[i].c); prefs.colors[i] = COLORS[j]; savePrefs(); renderSetup(); Snd.pop(); },
  start() { newGame(); },

  tier(el) { if (Q && Q.pickTier) startQ(+el.dataset.i); },
  wg(el) { if (!Q) return; Q.wager = +el.dataset.v; $$('#wg .chip').forEach(b => b.classList.toggle('on', b === el)); Snd.pop(); },
  pick(el) { pick(+el.dataset.i); },
  who(el) { if (!Q || Q.done) return; Q.team = +el.dataset.i; $('#q-who').innerHTML = whoHTML(); Snd.pop(); },
  /* حذف خيارين (وفي سؤال الثلاث خيارات نحذف واحد بس) */

  'q-swap'() { if (!Q || Q.done) return; Q.pickTier = false; const keep = { team: Q.team, wager: Q.wager }; const tier = Q.tier; Q = keep; startQ(tier); toast('سؤال بديل'); },
  'q-timeout'() { if (Q && !Q.done) { stopTimer(); timeUp(); } },
  'q-next'() { const ti = Q && Q.team; const t = ti != null && G.opts.mode === 'seq' ? G.teams[ti] : null; afterQ(null); if (t && t.cards.includes('extra')) toast(`${t.n}: تقدرون تستخدمون ⏰ من كرت الفريق`); },
  'q-after'(el) { afterQ(+el.dataset.i); },
  cont() { const f = contFn; contFn = null; closeOverlay(); if (f) f(); },

  buy(el) { trade(el.dataset.c, true); }, sell(el) { trade(el.dataset.c, false); },

  team(el) { if (!ovEl && G && !G.over) teamDlg(+el.dataset.i); },

  env(el) { const i = +el.dataset.i, inTr = TR && TR.ti === i, saved = TR; if (inTr) TR = null; privateDlg(i, 'tip', () => { closeOverlay(); if (inTr) { TR = saved; renderTrade(true); } else renderAll(); }); },
  know(el) { privateDlg(+el.dataset.i, 'know'); },
  'host-show'(el) { hostOpen(); hostSync(el.dataset.i + el.dataset.k); toast('انعرض على شاشة المشرف'); },
  end() { overlay(`<h3>نخلّص المسابقة؟</h3><p class="lead" style="margin:0">تنباع كل الأسهم بسعر السوق الحالي ويطلع الترتيب النهائي.</p><div class="row" style="justify-content:flex-start"><button class="btn gold" data-act="end-ok">نعم، النتيجة</button><button class="btn" data-close>لا، كمّل</button></div>`, 'sm', true); },
  'end-ok': finish,
  back() { G.over = false; G.teams.forEach(t => delete t.final); saveGame(); showGame(); },

  adj(el) {

    const d = overlay(`<h3>± نقد ${esc(t.n)}</h3><p class="hint" style="margin:0">النقد الحالي ${money(t.cash)}. اكتب المبلغ (بالسالب للخصم).</p><input class="fld" type="number" id="adj-v" value="0" style="font-size:1.4rem"><div class="row" style="justify-content:flex-start"><button class="btn gold" id="adj-ok">تطبيق</button><button class="btn" data-close>إلغاء</button></div>`, 'sm', true);

document.addEventListener('click', e => {

});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name != null) { prefs.names[+t.dataset.name] = t.value; savePrefs(); }
  if (t.dataset.co != null) { prefs.coNames[t.dataset.co] = t.value; savePrefs(); }
});
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const inInput = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (inInput && e.key !== 'Enter') return;
  if (!inInput) {
    if (e.code === 'KeyF') return toggleFS();
    if (e.code === 'KeyM') return ACT.sound();
    if (e.code === 'KeyH' && G) return hostOpen();
  }
  const scr = $('.screen.on').id;
  if (scr === 'setup' && e.key === 'Enter' && !ovEl) { e.preventDefault(); return newGame(); }
  if (scr !== 'game' || !G) return;
  if (ovEl) {
    if (Q && Q.pickTier && /^(?:Digit|Numpad)([1-3])$/.test(e.code)) { e.preventDefault(); return startQ(+e.code.slice(-1) - 1); }
    const m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code);
    if (m && Q && Q.opts && !Q.done && !inInput) { e.preventDefault(); return pick(+m[1] - 1); }
    if (e.key === 'Enter' || (e.code === 'Space' && !inInput)) {
      if (inInput) { if ($('#adj-ok')) { e.preventDefault(); $('#adj-ok').click(); } return; }   // Enter داخل خانة الكمية ما يقفل التداول
      const b = ovEl.querySelector('[data-act="q-after"],[data-act="q-next"],[data-act="cont"],[data-act="trade-done"],#bets-ok,[data-close].gold');
      if (b) { e.preventDefault(); b.click(); }
    } else if (e.key === 'Escape' && ovEl.querySelector('[data-close]')) closeOverlay();
    return;
  }
  if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); G.phase === 'closed' ? (G.over ? 0 : startRound()) : ask(); }
  else if (e.code === 'KeyU') ACT.undo();
});
addEventListener('beforeunload', () => { if (hostOk()) hostWin.close(); });
