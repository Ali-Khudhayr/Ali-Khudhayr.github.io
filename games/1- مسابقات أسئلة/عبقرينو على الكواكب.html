</style><style>
:root{
  --ink:#241a5c;--mut:#6a62a3;--paper:#fff;--soft:#f1edff;--line:#ddd6ff;
  --pri:#7c3aed;--pri-ink:#fff;--acc:#ffc23d;--acc-ink:#3a2300;--good:#16a34a;--bad:#ef4444;--pink:#ff3fa4;--cyan:#22d3ee;
  --disp:Lalezar,Tajawal,"Segoe UI",Tahoma,sans-serif;--body:Tajawal,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(12px,min(1.24vw,2.2vh),30px)}
html,body{height:100%;margin:0}
body{color:#fff;font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;background:#3a138f}
button{font:inherit;color:inherit}
input{font:inherit}
/* ---------- السماء: سديم مضيء + نجوم + شهب ---------- */
.sky{position:fixed;inset:0;z-index:0;background:
 radial-gradient(60% 75% at 103% 46%,#ffb347 0%,#ff6a3d30 32%,transparent 58%),
 radial-gradient(45% 55% at 22% 22%,#ff3fa4aa 0%,transparent 70%),
 radial-gradient(40% 50% at 55% 88%,#22d3ee80 0%,transparent 70%),
 radial-gradient(35% 45% at 6% 82%,#8b5cff 0%,transparent 70%),
 radial-gradient(50% 60% at 62% 18%,#5b3dff88 0%,transparent 70%),
 linear-gradient(160deg,#3a138f 0%,#5a1fb5 45%,#2445c9 100%)}
.sky::after{content:"";position:absolute;inset:-10%;background:radial-gradient(30% 25% at 30% 40%,#ff7ad966,transparent 70%),radial-gradient(25% 30% at 75% 70%,#7af0ff44,transparent 70%);animation:neb 26s ease-in-out infinite alternate}
@keyframes neb{to{transform:translate(4%,-3%) scale(1.06)}}
#stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.tw{position:fixed;z-index:0;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #fff;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
.shoot{position:fixed;z-index:0;top:8%;left:70%;width:9rem;height:2px;background:linear-gradient(90deg,#fff,transparent);border-radius:2px;transform:rotate(-20deg);opacity:0;animation:shoot 9s linear infinite}
@keyframes shoot{0%,88%{opacity:0;translate:0 0}90%{opacity:1}100%{opacity:0;translate:-40vw 15vw}}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.screen.on{display:flex}
/* ---------- عناصر عامة ---------- */
kbd{font:800 .68em var(--body);background:rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.15);border-radius:.35em;padding:.05em .45em;margin-inline-start:.45em}
.btn{border:0;border-radius:1rem;padding:.6em 1.25em;cursor:pointer;background:var(--soft);color:var(--ink);font-weight:800;font-size:1.05rem;display:inline-flex;align-items:center;gap:.4em;transition:transform .12s,filter .15s;box-shadow:0 .22rem 0 rgba(0,0,0,.14)}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.bx:focus-visible,.op:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.pri{background:linear-gradient(180deg,#9b6bff,#7c3aed);color:#fff;box-shadow:0 .22rem 0 #5223b8}
.btn.acc{background:linear-gradient(180deg,#ffe066,#ffb020);color:var(--acc-ink);box-shadow:0 .25rem 0 #c77a00,0 0 1.4rem #ffc83d77}
.btn.good{background:linear-gradient(180deg,#34d399,#16a34a);color:#fff;box-shadow:0 .22rem 0 #0f7a37}
.btn.bad{background:linear-gradient(180deg,#ff7a7a,#ef4444);color:#fff;box-shadow:0 .22rem 0 #b02424}
.btn.pink{background:linear-gradient(180deg,#ff7ac6,#ff3fa4);color:#fff;box-shadow:0 .22rem 0 #b81e72}
.btn.ghost{background:#ffffff1f;color:#fff;border:2px solid #ffffff66;box-shadow:none}
.dlg .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.big{font-size:1.4rem;padding:.6em 1.5em;border-radius:1.2rem}
.btn[disabled]{opacity:.35;pointer-events:none}
.ib{width:2.7rem;height:2.7rem;border-radius:.9rem;background:#ffffff22;border:2px solid #ffffff55;color:#fff;cursor:pointer;font-size:1.15rem;display:grid;place-items:center;flex:none}
.ib.off{opacity:.5}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{padding:.38em .95em;border-radius:99px;background:#fff;color:var(--ink);border:2px solid var(--line);cursor:pointer;font-weight:800;font-size:.95rem}

/* ---------- شاشة الإعداد ---------- */

.top{display:flex;align-items:center;gap:.55rem;padding:.6rem 1.1rem .2rem;position:relative;z-index:3}
.top h2{font-family:var(--disp);font-weight:400;font-size:2rem;margin:0;flex:1;display:flex;gap:.6rem;align-items:center;white-space:nowrap;overflow:hidden;text-shadow:0 .18rem 0 #ff3fa4,0 0 1rem #ff3fa488}

.track{position:relative;flex:1;min-height:0}

.sun{position:absolute;top:50%;border-radius:50%;translate:0 -50%;
 background:radial-gradient(circle at 42% 45%,#fffbe6 0%,#ffe066 22%,#ffb020 52%,#ff6a1a 82%,#ff3d2e 100%);
 box-shadow:0 0 3rem 1.2rem #ffb02088,0 0 8rem 4rem #ff6a3d55;animation:sunp 4s ease-in-out infinite alternate}
.sun::after{content:"";position:absolute;inset:-9%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#ffd16620 0 6deg,transparent 6deg 14deg);animation:spin 60s linear infinite;mask:radial-gradient(circle,transparent 52%,#000 56%,transparent 72%)}
@keyframes sunp{to{box-shadow:0 0 4rem 1.8rem #ffc02099,0 0 10rem 5rem #ff6a3d66}}

.lanes{position:absolute;display:flex;flex-direction:column;justify-content:space-around;gap:.3rem}
.lane{--tc:#888;position:relative;flex:1;max-height:3.6rem;border-radius:99px;background:linear-gradient(90deg,#ffffff10,#ffffff24);border:1px solid #ffffff24}

.trail{position:absolute;right:0;top:50%;height:.5rem;translate:0 -50%;border-radius:99px;background:linear-gradient(270deg,transparent,var(--tc) 30%,color-mix(in srgb,var(--tc) 50%,#fff));box-shadow:0 0 .8rem var(--tc);transition:width 1.2s cubic-bezier(.3,1.3,.5,1)}
.rk{position:absolute;top:50%;translate:50% -50%;display:flex;align-items:center;transition:right 1.2s cubic-bezier(.3,1.3,.5,1);z-index:2}

.rk .lb{position:absolute;right:calc(100% - .2rem);font-family:var(--disp);font-size:calc(var(--lh) * .5);background:var(--tc);border-radius:99px;padding:0 .55rem;line-height:1.45;box-shadow:0 .18rem 0 #0003;white-space:nowrap}
.rk .st{position:absolute;left:100%;font-size:calc(var(--lh) * .42);white-space:nowrap;filter:drop-shadow(0 0 .3rem #000a)}
.evb{position:absolute;left:50%;bottom:.1rem;translate:-50% 0;z-index:3;background:linear-gradient(90deg,#ff3fa4,#8b5cff);padding:.2rem 1.1rem;border-radius:99px;font-weight:800;font-size:1rem;box-shadow:0 0 1.2rem #ff3fa4aa;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:.8rem;padding:.9rem 1.1rem .2rem}
.tc{--tc:#888;position:relative;border-radius:1.4rem;padding:.5rem .7rem .55rem;background:linear-gradient(160deg,#ffffffef,#f3eeffef);color:var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.5rem;align-items:center;border:.25rem solid color-mix(in srgb,var(--tc) 45%,#fff);box-shadow:0 .5rem 1.4rem #1a0a5066;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s}
.tc.act{border-color:var(--tc);transform:translateY(-.4rem);box-shadow:0 0 0 .25rem #fff7,0 0 2rem var(--tc)}

.tc .fl{display:flex;gap:.25rem;flex-wrap:wrap}

.cards.many .tc{grid-template-columns:auto minmax(0,1fr);padding:.4rem .5rem}

.bar{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;padding:.8rem 1rem 1rem;align-items:center;position:relative;z-index:3}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.op{border:.2rem solid var(--line);background:#fff;color:#222;border-radius:1.1rem;padding:.65rem 1rem;font-weight:800;font-size:1.45rem;cursor:pointer;display:flex;gap:.7rem;align-items:center;text-align:start;transition:border-color .15s,background .2s,opacity .3s}

.who{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}

.chest-h{display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap;text-align:center}
.boxes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.5rem}
.bx{aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;position:relative;font-family:var(--disp);font-size:1.5rem;color:#fff;display:grid;place-items:center;transition:transform .15s;
 background:radial-gradient(circle at 34% 30%,#fff9 0,#c8b6ff 12%,#7c3aed 45%,#3b1a9a 78%,#1e0f5c 100%);box-shadow:0 0 0 .15rem #b9a3ff66,0 .35rem .8rem #3b1a9a66;text-shadow:0 .1rem .2rem #0007}

/* ==========================================================================
   الكواكب: نسيج إجرائي (بدون صور) يُرسم كرة مضاءة تدور ببطء على <canvas>

   ========================================================================== */
const PL = (() => {
  // ضجيج قيمي ثلاثي الأبعاد على سطح الكرة (بدون خياطة عند خط الطول 180)
  function mkNoise(seed) {
    let s = seed >>> 0;
    const rng = () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const P = new Uint8Array(512), V = new Float32Array(256);
    const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = rng() * (i + 1) | 0; [p[i], p[j]] = [p[j], p[i]]; }
    for (let i = 0; i < 512; i++) P[i] = p[i & 255]; for (let i = 0; i < 256; i++) V[i] = rng();
    const L = (x, y, z) => V[P[P[P[x & 255] + (y & 255)] + (z & 255)]];

/* هجوم على فريق: الدرع المغناطيسي يصد تلقائياً، وبدلة الفضاء يُسأل عنها الفريق */
function attack(j) {

  else if (x.t === 'swap') { const a = me.stars, b = o.stars; addStars(i, b - a, 'box'); addStars(j, a - b); if (b < a) { } else me.dealt += b - a; msg = `🌀 تبادل! ${esc(me.n)}: ${b}⭐ · ${esc(o.n)}: ${a}⭐`; cls = b >= a ? 'good' : 'bad'; Snd.worm(); FX.burst(40, ['🌀', '✨']); }

/* ---------- الأدوار والجولات والأحداث ---------- */
function endTurn() {

  const n = G.teams.length, old = G.turn; let k = old;

  const newRound = k <= old;

}

}
function eventGo() {

    : ph === 'ask' ? `<span class="hint">كل فريق يكتب جوابه في ورقة</span><button class="btn acc big" data-act="fq-reveal">👁 الجواب<kbd>مسافة</kbd></button>${FQ.x ? '<button class="btn ghost" data-act="fq-swap">🔄 سؤال بديل</button>' : ''}`
    : `<button class="btn good big" data-act="fq-apply" ${FQ.marks.some(m => m === null) ? 'disabled' : ''}>✔ احسب النتيجة<kbd>Enter</kbd></button>`;
  overlay(`<h3 style="text-align:center">🕳️ المرحلة الأخيرة: رهان الثقب الأسود</h3>${mid}<div class="wagers">${cards}</div><div class="row">${foot}</div>`, 'wide', false, '#ff3fa4');
}
function fqShow() {

async function fqApply() {

}
function finish() {
  closeOverlay(); G.over = true; saveGame();
  const T = G.teams, order = T.map((_, i) => i).sort((a, b) => T[b].stars - T[a].stars), top = T[order[0]].stars, tie = order.filter(i => T[i].stars === top).length > 1;
  const rank = i => 1 + T.filter(t => t.stars > T[i].stars).length;
  const pod = [order[1], order[0], order[2]].filter(i => i !== undefined);
  const aw = awards(order, rank);
  $('#end').innerHTML = `<div class="logo">${tie ? 'تعادل بين الكواكب!' : `🏆 عبقرينو الفائز: ${esc(T[order[0]].n)}`}</div>

    ${order.length > 3 ? `<div class="rest">${order.slice(3).map(i => `<span>${rank(i)}. ${esc(T[i].n)}: ${T[i].stars}⭐</span>`).join('')}</div>` : ''}
    ${aw.length ? `<div class="awards">${aw.map((a, k) => `<div class="aw" style="--tc:${a.c};animation-delay:${.4 + k * .25}s"><span class="e">${a.e}</span><b>${a.n}</b><span class="t">${esc(a.t)}</span><small>${a.why}</small></div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn acc big" data-act="start">🔁 مسابقة جديدة</button><button class="btn ghost" data-act="back">↶ رجوع للمسار</button><button class="btn ghost" data-act="home">⚙ الإعداد</button></div>`;
  show('end'); $$('#end canvas').forEach(c => PL.mount(c, c.dataset.k, c.dataset.r === '1' ? 120 : 90));

function awards(order, rank) {

  if (cb) out.push({ e: '🔄', n: 'أكبر قلبة', t: T[cb[0]].n, c: T[cb[0]].c, why: `كانوا متأخرين ${starW(cb[1])} ووصلوا المركز ${rank(cb[0])}` });

  else if ((a = best(t => t.used || 0, 2))) out.push({ e: '🃏', n: 'أجرأ فريق', t: T[a[0]].n, c: T[a[0]].c, why: `استخدموا ${a[1]} بطاقات قوى` });
  if ((a = best(t => t.dealt || 0, 3))) out.push({ e: '☄️', n: 'صيّاد الكواكب', t: T[a[0]].n, c: T[a[0]].c, why: `أسقطوا ${starW(a[1])} من الفرق الثانية` });
  if ((a = best(t => t.box || 0, 3))) out.push({ e: '🎁', n: 'محظوظ الصندوق', t: T[a[0]].n, c: T[a[0]].c, why: `كسبوا ${starW(a[1])} من صندوق المجرة` });
  return out;
}

  'pick-kind'(el) { const i = +el.dataset.i, k = el.dataset.k, oldName = (prefs.names[i] || '').trim(); if (!oldName || Object.values(KIND).includes(oldName)) prefs.names[i] = ''; prefs.kinds[i] = k; savePrefs(); closeOverlay(); renderSetup(); Snd.pop(); },
  color(el) { const i = +el.dataset.i, c = colorOf(i); prefs.colors[i] = COLORS[(COLORS.indexOf(c) + 1) % COLORS.length]; savePrefs(); renderSetup(); Snd.pop(); },
  ask() { ask(); }, reveal, opt(el) { pickOpt(+el.dataset.i); },
  replace() { if (!Q || Q.phase !== 'ask') return; stopTimer(); ask(true); toast('🔄 سؤال بديل'); },
  'q-boost': () => useBoost(), 'q-scope': () => useScope(),
  right() { if (G.src === 'host' && !Q) return hostRight(); if (!Q || !['ask', 'judge'].includes(Q.phase)) return; judge(true); },
  wrongq() { if (G.src === 'host' && !Q) return hostWrong(); if (!Q) return; if (Q.phase === 'judge' && Q.by === G.turn) { Q.phase = 'ask'; return wrong(); } if (['ask', 'judge'].includes(Q.phase)) { if (Q.by !== G.turn) { stopTimer(); snap(); Snd.bad(); finishWrong(); saveGame(); } else wrong(); } },
  steal(el) { startSteal(+el.dataset.i); }, 'no-steal'() { finishWrong(); },
  next() { endTurn(); }, next0() { closeOverlay(); Q = null; },
  box(el) { pickBox(+el.dataset.i); }, choose(el) { choosePickDone(+el.dataset.i); },
  target(el) { attack(+el.dataset.i); },
  'suit-yes'(el) { const o = G.teams[+el.dataset.i]; o.pw.suit = false; o.used++; Snd.shield(); result(+el.dataset.i, `🧑‍🚀 ${esc(o.n)} لبسوا بدلة الفضاء وصدّوا ${PEND.x.n}!`, 'good'); },
  'suit-no'(el) { doAttack(+el.dataset.i); },
  'ev-go': eventGo, 'sig-reveal': sigReveal, 'sig-win'(el) { sigWin(+el.dataset.i); },
  turn(el, e) { if (ovEl || e.target.closest('.adj,.pwc')) return; G.turn = +el.dataset.i; G.armed = false; saveGame(); update(); Snd.pop(); },
  'next-turn'() { snap(); endTurn(); Snd.pop(); },
  adj(el, e) { e.stopPropagation(); snap(); const i = +el.dataset.i; addStars(i, +el.dataset.d); saveGame(); update(); Snd.pop(); },
  'pw-card'(el, e) { e.stopPropagation(); if (ovEl) return; snap(); const t = G.teams[+el.dataset.i], k = el.dataset.k; t.pw[k] = !t.pw[k]; saveGame(); update(); toast(`✏️ تعديل المشرف: ${POWERS.find(p => p.k === k).n} ${t.pw[k] ? 'رجعت' : 'انحرقت'} لـ ${t.n}`); },
  arm() { const t = G.teams[G.turn]; if (!t.pw.boost && !G.armed) return; G.armed = !G.armed; saveGame(); update(); Snd.whoosh(); },
  end() { overlay(`<h3>نخلّص المسابقة؟</h3><p style="margin:0;font-weight:700">${G.opts.final && !G.finalDone ? 'نروح للمرحلة الأخيرة (رهان الثقب الأسود) وبعدها منصة التتويج.' : 'تطلع منصة التتويج.'}</p><div class="row" style="justify-content:flex-start"><button class="btn pri" data-act="end-ok">نعم، يلّا</button><button class="btn ghost" data-close>لا، كمّل</button></div>`, 'sm', true); },
  'end-ok'() { snap(); finale(); },
  back() { G.over = false; saveGame(); showGame(); },
  undo() { if (!hist.length) return toast('ما فيه شي نتراجع عنه'); closeOverlay(); Q = B = PEND = FQ = null; G = hist.pop(); G.over = false; saveGame(); showGame(); toast('↶ تم التراجع'); },
  wg(el) { const t = G.teams[+el.dataset.i]; t.wager = Math.max(0, Math.min(t.stars, (t.wager || 0) + +el.dataset.d)); saveGame(); renderFinal(); Snd.tick(); },
  'wg-set'(el) { const t = G.teams[+el.dataset.i], v = el.dataset.v; t.wager = v === 'all' ? t.stars : v === 'half' ? Math.floor(t.stars / 2) : 0; saveGame(); renderFinal(); Snd.tick(); },
  'fq-show': fqShow, 'fq-reveal'() { FQ.phase = 'mark'; renderFinal(); Snd.pop(); }, 'fq-swap'() { fqShow(); },
  'fq-skip'() { G.finalDone = true; G.teams.forEach(t => t.wager = 0); saveGame(); finish(); },
  mark(el) { FQ.marks[+el.dataset.i] = el.dataset.v === '1'; renderFinal(); Snd.pop(); },
  'fq-apply': fqApply,
};
/* وضع «المقدّم يسأل»: الصح يعطي نجمة ويفتح الصندوق، والخطأ يفتح السرقة */
function hostRight() {
  snap(); const i = G.turn, t = G.teams[i], ev = G.ev && G.ev.round === G.round ? G.ev.k : '';
  let gain = ev === 'shower' ? 2 : 1; const boosted = G.armed && t.pw.boost; if (boosted) { gain *= 2; t.pw.boost = false; t.used++; } G.armed = false;
  t.streak++; t.best = Math.max(t.best, t.streak); addStars(i, gain); saveGame(); update(true); Snd.star(); const sling = G.opts.sling && isTrailing(i);
  openChest(sling ? 2 : 1, `⭐ +${starW(gain)} لـ ${esc(t.n)}!${boosted ? ' 🚀' : ''}`, sling ? 'sling' : '');
}
function hostWrong() {
  snap(); G.teams[G.turn].streak = 0; G.armed = false; Snd.bad(); const others = G.teams.map((_, j) => j).filter(j => j !== G.turn && !G.teams[j].frozen);
  if (!G.opts.steal || !others.length) return endTurn();
  overlay(`<div class="res bad">خطأ! 🎯 سرقة: مين جاوب صح؟</div><div class="who">${others.map(j => `<button style="--tc:${G.teams[j].c}" data-act="host-steal" data-i="${j}"><img src="${still(G.teams[j].kind, 40)}" alt="">${esc(G.teams[j].n)}</button>`).join('')}<button style="--tc:#999" data-act="next">ما أحد</button></div>`, 'sm', false, G.teams[G.turn].c);
}
ACT['host-steal'] = el => { const j = +el.dataset.i, gain = G.ev && G.ev.round === G.round && G.ev.k === 'shower' ? 2 : 1; addStars(j, gain); saveGame(); update(true); Snd.star(); toast(`🎯 +${starW(gain)} لـ ${G.teams[j].n}`); endTurn(); };

document.addEventListener('click', e => {
  Snd.unlock();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.name != null) { prefs.names[+t.dataset.name] = t.value; savePrefs(); } });
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'KeyF' && !isArabicKey(e)) return toggleFS();
  if (e.code === 'KeyM' && !isArabicKey(e)) return ACT.sound();
  const scr = $('.screen.on').id;
  if (scr === 'home' && !ovEl) { if (e.key === 'Enter') { e.preventDefault(); return newGame(); } if (e.code === 'KeyH') return ACT.help(); return; }
  if (scr !== 'game' || !G) { if (ovEl && e.key === 'Escape' && ovEl.closable) closeOverlay(); return; }
  if(e.code==='KeyU' && !isArabicKey(e)){e.preventDefault();return ACT.undo();}
  if (ovEl) {
    if (e.key === 'Escape' && ovEl.closable) return closeOverlay();
    const press = sel => { const b = ovEl.querySelector(sel); if (b && !b.disabled) { e.preventDefault(); b.click(); return true; } };
    if (e.key === 'Enter' && (press('[data-act="next"]') || press('[data-act="ev-go"]') || press('[data-act="fq-show"]') || press('[data-act="fq-apply"]'))) return;
    if (e.code === 'Space' && (press('[data-act="sig-reveal"]') || press('[data-act="fq-reveal"]'))) return;
    if (!Q) return;
    const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
    if (m && Q.phase === 'ask' && Q.opts) { const d = +m[1]; if (d >= 1 && d <= Q.opts.length) return pickOpt(d - 1); }
    if (e.code === 'Space') { e.preventDefault(); return reveal(); }
    if (e.key === 'Enter' && Q.phase === 'judge') { e.preventDefault(); return judge(true); }
    if (e.key === 'Backspace' && ['ask', 'judge'].includes(Q.phase)) { e.preventDefault(); return ACT.wrongq(); }
    return;
  }
  if (G.src === 'host') { if (e.key === 'Enter') { e.preventDefault(); return ACT.right(); } if (e.key === 'Backspace') return ACT.wrongq(); }
  else if (e.code === 'Space') { e.preventDefault(); return ask(); }
  if (e.code === 'KeyN') ACT['next-turn']();
  else if (e.code === 'KeyU') ACT.undo();
  else if (e.code === 'KeyH') ACT.help();
});
/* سماء النجوم */
function stars() {
  const c = $('#stars'), x = c.getContext('2d'), d = Math.min(2, devicePixelRatio || 1); c.width = innerWidth * d; c.height = innerHeight * d;
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 320; i++) { const k = r(); x.fillStyle = `rgba(255,255,255,${.35 + k * .65})`; x.beginPath(); x.arc(r() * c.width, r() * c.height, (k * k * 1.8 + .3) * d, 0, 7); x.fill(); }
}
stars(); addEventListener('resize', stars);
for (let i = 0; i < 14; i++) { const s = document.createElement('i'); s.className = 'tw'; s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 3}s`; document.body.prepend(s); }
const ASTRO_ALL = ASTRO.concat(PIC_Q);
renderSetup();

// Preserve the current question, chest, and final wager across refreshes.
function checkpoint(){
 if(!G || !$('#game').classList.contains('on'))return;
 const dialog=ovEl ? {html:ovEl.firstElementChild.innerHTML,cls:ovEl.firstElementChild.className.replace('dlg',''),closable:ovEl.closable}:null;
 Store.set('abq.checkpoint.v2',{game:G,Q,B,PEND,FQ,dialog,hist,seconds: +(document.querySelector("#ring b")?.textContent||G.timer)}); saveGame();
}
function restoreCheckpoint(){
 const c=Store.get('abq.checkpoint.v2',null);if(!c || JSON.stringify(c.game)!==JSON.stringify(G))return;
 Q=c.Q;B=c.B;PEND=c.PEND;FQ=c.FQ;hist.push(...(c.hist||[]));
 if(c.dialog){overlay(c.dialog.html,c.dialog.cls,c.dialog.closable);if(Q && Q.phase==='ask')restartRing(c.seconds);if(Q && Q.by>=0 && $('#q-pl'))PL.mount($('#q-pl'),G.teams[Q.by].kind,56);}
}
setInterval(checkpoint,1000);addEventListener('beforeunload',checkpoint);
