  'mgr-del-cat': async () => { const c = db.categories.find(x => x.id === M.sel); if (!c) return; if (await askConfirm(`حذف فئة «${esc(c.name)}» مع كل أسئلتها (${c.questions.length})؟ لا يمكن التراجع.`, 'نعم، احذفها')) { db.categories = db.categories.filter(x => x !== c); prefs.selected = prefs.selected.filter(id => id !== c.id); savePrefs(); saveDB(); renderManager(); toast('تم حذف الفئة'); } },
  'mgr-add-q': el => { const c = db.categories.find(x => x.id === M.sel); if (c) editQuestion(c, null, el.dataset.p ? +el.dataset.p : null); },
  'mgr-edit-q': el => { const c = db.categories.find(x => x.id === M.sel); if (c) editQuestion(c, el.dataset.id); },
  'mgr-del-q': async el => { const c = db.categories.find(x => x.id === M.sel); if (!c) return; if (await askConfirm('حذف هذا السؤال؟')) { c.questions = c.questions.filter(q => q.id !== el.dataset.id); saveDB(); renderMgrSide(); renderMgrMain(); } },
  'mgr-bulk': () => { const c = db.categories.find(x => x.id === M.sel); if (c) bulkAdd(c); },
  export: () => {
    const blob = new Blob([JSON.stringify({ app: 'smart-minds-challenge', v: 1, categories: db.categories }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `questions-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('تم حفظ ملف الأسئلة');
  },
  import: () => $('#import-file').click(),
  enc: () => $('#enc-file').click(),
  'reset-db': async () => { if (await askConfirm('استعادة الفئات والأسئلة الأصلية؟ <b>ستُحذف كل تعديلاتك وفئاتك الخاصة.</b> (احفظ نسخة احتياطية أولاً لو تحتاجها)', 'نعم، استعد الأصلية')) { db = defaultDB(); prefs.selected = db.categories.slice(0, 6).map(c => c.id); savePrefs(); saveDB(); renderManager(); toast('تمت الاستعادة'); } },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { Snd.unlock(); f(el, e); }
});

document.addEventListener('input', e => {
  const t = e.target; if (t.dataset && t.dataset.team != null) { prefs.names[+t.dataset.team] = t.value; savePrefs(); }
  else if (t.dataset && t.dataset.bet != null && G && G.fin) { const i = +t.dataset.bet, mx = Math.max(G.teams[i].score, 600); G.fin.bets[i] = Math.max(0, Math.min(mx, parseInt(t.value, 10) || 0)); saveGame(); }
});

document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.gold != null) { prefs.gold = Math.max(0, Math.min(40, Math.round(+t.value || 0))); savePrefs(); renderSetup(); } else if (t.dataset && t.dataset.bet != null && G && G.fin) t.value = G.fin.bets[+t.dataset.bet]; });
$('#enc-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importEncyclopedia(f); });

$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let cats;
  try { cats = normalizeCats(JSON.parse(await f.text())); if (!cats.length) throw 0; } catch (er) { return toast('الملف غير صالح — استخدم ملفاً تم حفظه من هذه اللعبة'); }
  const mode = await dialog({
    title: 'استيراد الفئات',
    body: `<p style="line-height:1.9">تم العثور على <b>${cats.length}</b> فئة و<b>${cats.reduce((n, c) => n + c.questions.length, 0)}</b> سؤال.</p><p class="note">«دمج» يضيف الفئات الجديدة ويستبدل المتطابقة. «استبدال» يمسح الموجود ويضع الملف مكانه.</p>`,
    actions: [{ label: 'إلغاء', cls: 'ghost' }, { label: 'استبدال الكل', cls: 'warn', value: 'replace' }, { label: 'دمج مع الموجود', cls: 'primary', value: 'merge' }],
  });
  if (!mode) return;
  if (mode === 'replace') db.categories = cats;
  else cats.forEach(c => { const i = db.categories.findIndex(x => x.id === c.id); if (i >= 0) db.categories[i] = c; else db.categories.push(c); });
  prefs.selected = prefs.selected.filter(id => db.categories.some(c => c.id === id)); if (!prefs.selected.length) prefs.selected = db.categories.slice(0, 6).map(c => c.id);
  enrichDB(db); savePrefs(); saveDB(); if (cur === 'setup') renderSetup(); else renderManager(); toast('تم الاستيراد');
});

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (dlgOpen) { if (e.key === 'Escape') { e.preventDefault(); dlgOpen.cancel(); } return; }
  if (cur === 'setup' && e.key === 'Enter' && !/TEXTAREA|SELECT|BUTTON/.test(e.target.tagName) && !(e.target.dataset && e.target.dataset.gold != null)) { e.preventDefault(); return startGame(); }
  if (G && G.fin && !Q && e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); return G.fin.step === 'bet' ? A['fin-show']() : !G.fin.rev ? A['fin-reveal']() : null; }
  const tag = e.target.tagName; if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (e.code === 'KeyF') return toggleFS();
  if (e.code === 'KeyM') return toggleSound();
  if (!Q) return;
  if (!Q.revealed) {
    if ((e.code === 'Space' || e.key === 'Enter') && tag !== 'BUTTON') { e.preventDefault(); reveal(); }
    else if (e.key === 'Escape') A['q-back']();
  } else {
    const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
    if (m) { const d = +m[1]; if (Q.passTo != null) { if (d <= 1) passResult(d === 1); } else if (d === 0) answer(-1); else if (d <= G.teams.length) answer(d - 1); }
  }
});

/* ==========================================================================
   10) تشغيل
   ========================================================================== */
applySound();
applySkin(false);
showScreen('welcome');

</script>
</body>
</html>
