<style>
/* ===== الألوان والمقاسات ===== */
:root{
  --ink:#1d3a56; --ink-soft:#5a7491; --ink-faint:#8fa5bb;
  --card:rgba(255,255,255,.76); --solid:#fff;
  --line:rgba(29,58,86,.12);
  --blue:#3b9ae3; --blue-d:#2478bd; --gold:#f2b544; --green:#4dbf93; --coral:#ee8272;
  --shadow:0 12px 34px rgba(36,92,140,.16); --shadow-s:0 5px 16px rgba(36,92,140,.13);
  --r:1.4rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(13px,.52vw + .95vh,24px)}
html,body{height:100%;margin:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;color:var(--ink);background:#dff0fb;overflow:hidden;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7cc0f2;outline-offset:2px;border-radius:.6rem}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

/* ===== الخلفية الهادئة ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,#fff4d6 0%,rgba(255,244,214,0) 55%),radial-gradient(110% 90% at 0% 100%,#d2f1e4 0%,rgba(210,241,228,0) 55%),linear-gradient(180deg,#d8edfb 0%,#eaf6ff 60%,#f4fbff 100%)}
.deco{position:absolute;animation:drift var(--t) ease-in-out infinite alternate;pointer-events:none;user-select:none}
.deco.q{font-weight:900;color:rgba(59,154,227,.16);font-size:var(--s)}
.deco.dot{border-radius:50%;opacity:.55}
.deco.star{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.9);font-size:var(--s);opacity:.8}

/* ===== الشاشات ===== */
#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex;animation:screenIn .5s ease both}
.scroll{overflow:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:rgba(29,58,86,.18);border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* ===== أزرار وعناصر عامة ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.25em;border-radius:999px;font-weight:700;line-height:1.2;white-space:nowrap;transition:transform .18s,box-shadow .18s,background .18s,opacity .2s;user-select:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#4eb0f2,#2f86d4);color:#fff;box-shadow:0 8px 20px rgba(47,134,212,.36)}
.btn.gold{background:linear-gradient(135deg,#ffd36a,#f0a824);color:#5a3a00;box-shadow:0 8px 20px rgba(240,168,36,.35)}
.btn.good{background:linear-gradient(135deg,#72d4ab,#38a97f);color:#fff;box-shadow:0 8px 20px rgba(56,169,127,.32)}
.btn.warn{background:linear-gradient(135deg,#f6a79b,#e2705f);color:#fff;box-shadow:0 8px 20px rgba(226,112,95,.3)}
.btn.soft{background:rgba(255,255,255,.86);box-shadow:var(--shadow-s)}
.btn.ghost{color:var(--ink-soft)}
.btn.ghost:hover{background:rgba(255,255,255,.6)}
.btn.xl{font-size:1.45rem;padding:.7em 1.9em}
.btn.sm{font-size:.82rem;padding:.4em .9em}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.icon-btn{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:var(--shadow-s);font-size:1.15rem;transition:transform .18s;flex:none}
.icon-btn:hover{transform:translateY(-2px) rotate(-6deg)}
.icon-btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem 1.3rem}
.card h2{font-size:1.15rem;font-weight:800;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.muted{color:var(--ink-soft)}
.kbd{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .3em;border-radius:.4em;background:rgba(29,58,86,.09);font-size:.7rem;font-weight:700;color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3em .9em;border-radius:999px;font-weight:800;background:#eaf3fb;color:var(--ink);font-size:.9rem}
.field{width:100%;padding:.6em .9em;border-radius:.9rem;border:2px solid var(--line);background:rgba(255,255,255,.92);transition:border-color .2s,box-shadow .2s}
.field:focus{outline:none;border-color:#7cc0f2;box-shadow:0 0 0 4px rgba(124,192,242,.25)}
textarea.field{resize:vertical;min-height:4.5rem}
select.field{appearance:auto}
.seg{display:inline-flex;background:rgba(29,58,86,.07);border-radius:999px;padding:.2rem;gap:.15rem;flex-wrap:nowrap}
.seg button,.seg label{padding:.3em .85em;border-radius:999px;font-weight:700;font-size:.9rem;transition:background .2s,color .2s,box-shadow .2s;cursor:pointer;user-select:none;white-space:nowrap}
.seg button.on,.seg input:checked+span{background:#fff;color:var(--blue-d);box-shadow:var(--shadow-s)}
.seg label{padding:0}.seg label span{display:block;padding:.3em .85em;border-radius:999px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.switch{width:3rem;height:1.7rem;border-radius:999px;background:#c9d6e3;position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:.2rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:inset-inline-start .25s}
.switch.on{background:#4bbd93}
.switch.on::after{inset-inline-start:1.5rem}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;padding:.55rem 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.opt-row:last-child{border-bottom:0}
.opt-row .lbl{font-weight:700}
.opt-row .sub{font-size:.78rem;color:var(--ink-soft);font-weight:400;display:block}
.avatar{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:var(--tcl,rgba(59,154,227,.2));flex:none;transition:transform .2s}
button.avatar:hover{transform:scale(1.1)}
.page-head{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.6rem .6rem;flex-wrap:wrap}
.page-head h1{font-size:1.9rem;font-weight:900;flex:1;min-width:10rem}

/* ===== شاشة البداية ===== */
#s-welcome{flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;text-align:center;padding:1rem}
.fs-corner{position:absolute;top:1.2rem;left:1.2rem;display:flex;gap:.6rem}
.logo{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.logo .row1{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.2em 1.2rem;font-weight:900;font-size:clamp(2.2rem,min(13vh,11vw),7.5rem);line-height:1.1}
.logo .w1{background:linear-gradient(180deg,#4eb0f2,#1f5fb4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(31,95,180,.18))}
.logo .w2{background:linear-gradient(180deg,#ffd36a,#e08f12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(224,143,18,.2))}
.logo .or{font-size:.42em;font-weight:800;color:var(--ink-soft);background:rgba(255,255,255,.8);border-radius:999px;padding:.1em .7em;box-shadow:var(--shadow-s)}
.logo .tag{font-size:1.25rem;font-weight:700;color:var(--ink-soft)}
.logo .badges{display:flex;gap:1.4rem;margin-top:.6rem;font-size:clamp(2.4rem,8vh,4.4rem)}
.logo .badges span{animation:floatY 3.4s ease-in-out infinite}
.logo .badges span:nth-child(2){animation-delay:.5s}.logo .badges span:nth-child(3){animation-delay:1s}
.w-actions{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.w-actions .row{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;align-items:center}
.w-in{animation:popIn .8s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d,.2s)}
#s-welcome .btn.primary{animation:breathe 3.2s ease-in-out infinite}
.credit{position:absolute;bottom:.8rem;font-size:.78rem;color:var(--ink-faint)}

/* ===== الإعداد ===== */
#s-setup,#s-manager,#s-results{flex-direction:column}
.setup-body{padding:.4rem 1.6rem 1rem;display:grid;grid-template-columns:minmax(0,1fr) 24rem;gap:1.1rem;align-items:start;width:100%;max-width:88rem;margin:0 auto}
.setup-col{display:flex;flex-direction:column;gap:1.1rem;min-width:0}
.stepper{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem}
.stepper b{font-size:1.4rem;min-width:1.5ch;text-align:center}
.stepper .icon-btn{width:2.2rem;height:2.2rem;font-size:1.1rem;font-weight:800}
.team-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem;animation:popIn .4s both}
.team-row .avatar{width:2.8rem;height:2.8rem;font-size:1.5rem}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.7rem}
.cat-card{position:relative;display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border-radius:1.1rem;background:rgba(255,255,255,.82);border:2.5px solid transparent;box-shadow:var(--shadow-s);transition:transform .2s,box-shadow .2s,border-color .2s;text-align:start;animation:popIn .45s both;animation-delay:calc(var(--i)*35ms)}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cat-card .ico{font-size:2rem;line-height:1}
.cat-card .nm{font-weight:800;line-height:1.25}
.cat-card .meta{font-size:.76rem;color:var(--ink-soft);display:block;font-weight:500}
.cat-card .tick{position:absolute;top:.4rem;inset-inline-end:.5rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--blue);color:#fff;font-size:.85rem;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.cat-card.sel{border-color:var(--blue);background:#fff;box-shadow:0 0 0 5px rgba(59,154,227,.16),var(--shadow-s)}
.cat-card.sel .tick{transform:scale(1)}
.lvl-stats{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.9rem}
.lvl-stat{flex:1 1 9rem;border-radius:1rem;padding:.6rem .9rem;background:var(--lc);color:var(--ld);font-weight:800;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.lvl-stat small{font-weight:600;opacity:.8}
.startbar{padding:.8rem 1.6rem 1.2rem;display:flex;align-items:center;justify-content:center;gap:1.4rem;flex-wrap:wrap}
.startbar .sum{font-weight:700;color:var(--ink-soft)}
.num{width:7rem;text-align:center;font-weight:800}

/* ===== شاشة اللعب ===== */
#s-game{flex-direction:column;padding:1rem 1.4rem 1.2rem;gap:.9rem}
.topbar{display:flex;align-items:center;gap:1rem}
.tb-side{display:flex;gap:.55rem;align-items:center;flex:none}
.teams{flex:1;display:flex;gap:.9rem;justify-content:center;min-width:0}
.team{--tc:#3b9ae3;--tcl:rgba(59,154,227,.2);--tcl2:rgba(59,154,227,.08);flex:1 1 0;max-width:23rem;min-width:0;display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;border-radius:1.4rem;background:rgba(255,255,255,.86);box-shadow:var(--shadow-s);border:2.5px solid transparent;transition:border-color .3s,transform .3s,opacity .3s;position:relative}
.team.active{border-color:var(--tc);animation:glow 2.8s ease-in-out infinite}
.team.banned{opacity:.78}
.tinfo{min-width:0;flex:1}
.tname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:.76rem;color:var(--ink-soft);min-height:1.3em;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.turn-tag{color:var(--ink);font-weight:700}
.inv{display:inline-flex;align-items:center;gap:.15rem;background:#fff3cc;color:#8a5800;border-radius:99px;padding:0 .5em;font-weight:800;font-size:.8rem}
.inv.ban{background:#ffe3dd;color:#b23a2d}
.inv.fire{background:#ffe3d6;color:#c2503f;animation:pulse 1.6s infinite}
.score{font-size:2.1rem;font-weight:900;line-height:1;min-width:2.6ch;text-align:center;border-radius:.6rem;padding:.1em .2em;font-variant-numeric:tabular-nums}
.score.bump{animation:bump .5s}
.use-btn{width:2.2rem;height:2.2rem;border-radius:50%;background:#fff3cc;display:grid;place-items:center;font-size:1.05rem;box-shadow:var(--shadow-s);transition:transform .18s;flex:none}
.use-btn:hover{transform:scale(1.12) rotate(-8deg)}
.delta{position:fixed;z-index:120;font-weight:900;font-size:1.7rem;pointer-events:none;animation:floatUp 1.5s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 12px #fff;font-variant-numeric:tabular-nums}
.delta.pos{color:#1f8a64}.delta.neg{color:#c2503f}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;position:relative}
.stage.anim>*{animation:popIn .5s both}

/* اختيار المستوى */
.turn-banner{font-size:clamp(1.6rem,5vh,3rem);font-weight:900;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center}
.turn-banner .nm{background:linear-gradient(180deg,var(--tc),var(--tc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.3) brightness(.85)}
.pick-title{font-size:clamp(1.3rem,3.6vh,2.2rem);font-weight:800;color:var(--ink-soft)}
.orbs{display:flex;gap:clamp(1rem,3vw,3rem);align-items:center;justify-content:center;flex-wrap:wrap}
.orb{--oc:#4a8fe0;--od:#1f5fb4;width:clamp(9rem,23vh,15rem);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;color:#fff;font-weight:900;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 38%),radial-gradient(circle at 50% 60%,var(--oc),var(--od) 85%);box-shadow:0 18px 34px rgba(29,58,86,.28),inset 0 -10px 24px rgba(0,0,0,.18);transition:transform .25s,filter .3s;animation:floatY 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.6s);text-shadow:0 2px 6px rgba(0,0,0,.28)}
.orb:hover{transform:scale(1.09) translateY(-6px)}
.orb:active{transform:scale(.97)}
.orb .on-name{font-size:clamp(1.2rem,3.2vh,2.1rem)}
.orb .on-pts{font-size:clamp(.9rem,2.2vh,1.4rem);font-weight:800;opacity:.95;background:rgba(255,255,255,.22);border-radius:99px;padding:0 .8em}
.orb .on-left{font-size:clamp(.75rem,1.7vh,1rem);font-weight:600;opacity:.9}
.orb.empty{filter:grayscale(1) opacity(.45);pointer-events:none;animation:none}
.end-link{font-size:.9rem;color:var(--ink-soft);text-decoration:underline;padding:.3em .6em;border-radius:.6em}
.end-link:hover{background:rgba(255,255,255,.6)}

/* السؤال */
.qwrap{width:min(78rem,96%);display:flex;flex-direction:column;gap:1.1rem;max-height:100%}
.qhead{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.qhead .sp{flex:1}
.chip.lv{background:var(--lc);color:var(--ld)}
.timer{position:relative;width:3.6rem;height:3.6rem;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
.timer circle{fill:none;stroke-width:4;stroke-linecap:round}
.timer .trk{stroke:#e3edf6}
.timer .prg{stroke:#4eb0f2;transition:stroke-dashoffset 1s linear,stroke .4s}
.timer.warn .prg{stroke:#f3b04c}
.timer.low .prg{stroke:#ec7c6c}
.timer.low{animation:pulse 1s infinite}
.timer.over{animation:shake .6s}
.timer .tnum{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}
.qbox{background:linear-gradient(180deg,#fff,#f4faff);border-radius:1.8rem;box-shadow:var(--shadow);padding:1.4rem 2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8rem;min-height:9rem;justify-content:center;animation:popIn .5s both}
.q-text{font-weight:800;line-height:1.6;white-space:pre-line}
.q-text.s1{font-size:clamp(1.7rem,5.2vh,3.4rem)}
.q-text.s2{font-size:clamp(1.5rem,4.2vh,2.7rem)}
.q-text.s3{font-size:clamp(1.25rem,3.3vh,2.1rem)}
.q-img{max-width:100%;max-height:30vh;border-radius:1rem;box-shadow:var(--shadow-s);object-fit:contain;background:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.opt{position:relative;display:flex;align-items:center;gap:.9rem;padding:.9rem 1.3rem;border-radius:1.3rem;background:rgba(255,255,255,.92);box-shadow:var(--shadow-s);border:3px solid transparent;font-weight:800;font-size:clamp(1.1rem,3vh,1.9rem);text-align:start;transition:transform .2s,box-shadow .2s,border-color .25s,background .25s,opacity .3s;animation:popIn .5s both;animation-delay:calc(var(--i)*.09s + .15s)}
.opt .let{width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;background:#e8f2fb;color:var(--blue-d);font-size:.72em;flex:none;transition:background .25s,color .25s}
.opt .tx{flex:1;line-height:1.35}
.opt .mk{font-size:1.2em;margin-inline-start:auto}
.opt:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#9fd0f5}
.qlock .opt{pointer-events:none}
.opt.good{background:#dff7ea;border-color:#4dbf93;animation:popOk .6s both}
.opt.good .let{background:#4dbf93;color:#fff}
.opt.bad{background:#fde7e3;border-color:#ee8272;animation:shake .5s both}
.opt.bad .let{background:#ee8272;color:#fff}
.opt.dim{opacity:.45}
.qfoot{display:flex;flex-direction:column;align-items:center;gap:.7rem;min-height:5rem;justify-content:center}
.verdict{font-size:clamp(1.3rem,3.6vh,2.2rem);font-weight:900;animation:popIn .5s both;text-align:center}
.verdict.ok{color:#1f8a64}.verdict.no{color:#c2503f}
.note{font-size:.95rem;color:var(--ink-soft);background:#eef7ff;border-radius:1rem;padding:.5rem 1rem;max-width:50rem;text-align:center}

/* الحظ والأبواب */
.luck-title{font-size:clamp(1.6rem,5vh,3rem);font-weight:900;text-align:center}
.luck-title small{display:block;font-size:.45em;color:var(--ink-soft);font-weight:700}
.doors{display:flex;gap:clamp(1rem,3vw,3rem);justify-content:center;perspective:1200px}
.door{--dc:#b57a46;width:clamp(8rem,18vh,13rem);aspect-ratio:3/4.2;position:relative;border-radius:1.1rem 1.1rem .4rem .4rem;cursor:pointer;transition:transform .25s;animation:floatY 4s ease-in-out infinite;animation-delay:calc(var(--i)*.5s)}
.door:hover{transform:translateY(-8px) scale(1.04)}
.door .frame{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 40%,#fff9e0 0,#ffe28a 45%,#ffc34d 100%);box-shadow:inset 0 0 0 .55rem #8d5a2b,0 14px 28px rgba(29,58,86,.25);display:grid;place-items:center;font-size:clamp(3rem,9vh,5.5rem)}
.door .leaf{position:absolute;inset:.55rem;border-radius:.7rem .7rem .2rem .2rem;background:linear-gradient(135deg,#d39a62,#a8703c);transform-origin:left center;transition:transform .9s cubic-bezier(.3,.9,.3,1);box-shadow:inset 0 0 0 .3rem rgba(255,255,255,.12),inset 0 -2rem 2rem rgba(0,0,0,.14);display:flex;align-items:center;justify-content:flex-end;padding-inline-end:.8rem;font-weight:900;color:rgba(255,255,255,.85);font-size:clamp(1.6rem,4vh,2.6rem)}
.door .leaf::after{content:"";width:.9rem;height:.9rem;border-radius:50%;background:#ffe28a;box-shadow:0 0 0 .2rem #c8923f;position:absolute;inset-inline-start:.8rem;top:52%}
.door.open .leaf{transform:rotateY(105deg)}
.door.open{animation:none;pointer-events:none}
.door.miss{opacity:.55;filter:saturate(.6)}
.reward-card{background:linear-gradient(180deg,#fff,#f6fbff);border-radius:1.8rem;box-shadow:0 24px 60px rgba(29,58,86,.25);padding:1.4rem 2.2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem;min-width:min(34rem,92vw);animation:popIn .55s cubic-bezier(.2,.9,.3,1.1) both}
.reward-card .big{font-size:clamp(3.5rem,11vh,6.5rem);line-height:1.1;animation:pop2 .8s both}
.reward-card h3{font-size:clamp(1.5rem,4.4vh,2.6rem);font-weight:900}
.reward-card p{font-size:clamp(1rem,2.3vh,1.35rem);color:var(--ink-soft);font-weight:600;max-width:36rem}
.reward-card.good{box-shadow:0 24px 60px rgba(56,169,127,.35),0 0 0 .4rem rgba(77,191,147,.35)}
.reward-card.bad{box-shadow:0 24px 60px rgba(226,112,95,.3),0 0 0 .4rem rgba(238,130,114,.3)}
.reward-card .row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}

/* اختيار فريق / مخزون */
.pick-teams{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.pick-team{--tc:#3b9ae3;--tcl:rgba(59,154,227,.18);display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:8rem;padding:.7rem 1rem;border-radius:1.2rem;background:var(--tcl);border:2.5px solid var(--tc);font-weight:800;transition:transform .18s,background .18s,box-shadow .18s}
.pick-team:hover{transform:translateY(-3px);background:#fff;box-shadow:var(--shadow-s)}
.pick-team .em{font-size:2rem}
.pick-team small{font-weight:600;color:var(--ink-soft)}
.inv-list{display:flex;flex-direction:column;gap:.5rem}
.inv-item{display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem;border-radius:1rem;background:#fff;box-shadow:var(--shadow-s);text-align:start;transition:transform .18s}
.inv-item:hover{transform:translateX(-4px)}
.inv-item .ic{font-size:1.8rem}
.inv-item .tx{flex:1}
.inv-item b{display:block}
.inv-item small{color:var(--ink-soft)}
.inv-item .cnt{background:#fff3cc;color:#8a5800;border-radius:99px;padding:0 .7em;font-weight:900}

/* النتيجة */
#s-results{align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center}
.res-title{font-size:clamp(2rem,6vh,3.6rem);font-weight:900;animation:popIn .7s both}
.res-sub{color:var(--ink-soft);font-weight:700;animation:popIn .7s .15s both}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.1rem;height:min(46vh,26rem);width:min(60rem,94vw);margin-top:.5rem}
.pod{--tc:#3b9ae3;--tcl:rgba(59,154,227,.2);flex:1 1 0;max-width:14rem;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.4rem;min-width:0}
.pod .who{display:flex;flex-direction:column;align-items:center;gap:.1rem;animation:popIn .6s both;animation-delay:calc(var(--i)*.25s + .5s)}
.pod .who .avatar{width:4.6rem;height:4.6rem;font-size:2.6rem;position:relative}
.pod .crown{position:absolute;top:-1.5rem;font-size:1.8rem;animation:floatY 2.6s ease-in-out infinite}
.pod .nm{font-weight:900;font-size:1.2rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{flex:none;width:100%;border-radius:1.2rem 1.2rem .4rem .4rem;background:linear-gradient(180deg,#fff,var(--tcl));border:2.5px solid var(--tc);box-shadow:var(--shadow-s);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.6rem;animation:rise .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*.25s)}
.pod .rank{font-size:1.5rem}
.pod .sc{font-size:clamp(1.8rem,5vh,3rem);font-weight:900;font-variant-numeric:tabular-nums}
.res-actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.8rem;animation:popIn .7s 1.4s both}

/* ===== إدارة المحتوى ===== */
.mgr-head{display:flex;align-items:center;gap:.8rem;padding:1.1rem 1.6rem .4rem;flex-wrap:wrap}
.mgr-head h1{font-size:1.7rem;font-weight:900;flex:1;min-width:12rem}
.tabs{display:flex;gap:.4rem;padding:.4rem 1.6rem;width:100%;max-width:88rem;margin:0 auto}
.tabs button{padding:.55em 1.3em;border-radius:999px;font-weight:800;background:rgba(255,255,255,.6);transition:background .2s,transform .2s,box-shadow .2s}
.tabs button:hover{background:#fff}
.tabs button.on{background:#fff;color:var(--blue-d);box-shadow:var(--shadow-s)}
.mgr-body{flex:1;min-height:0;padding:.4rem 1.6rem 1.2rem;width:100%;max-width:88rem;margin:0 auto;display:flex}
.mgr-body>.card{flex:1;min-height:0;display:flex;flex-direction:column;width:100%}
.toolbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.toolbar .grow{flex:1}
.toolbar .field{width:auto;min-width:9rem}
.listbox{flex:1;min-height:0;overflow:auto;padding:.2rem}
.q-row{display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem;border-radius:.95rem;background:rgba(255,255,255,.75);margin-bottom:.4rem;transition:background .2s}
.q-row:hover{background:#fff}
.q-row .qt{flex:1;min-width:0}
.q-row .qq{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.q-row .qa{font-size:.85rem;color:#1f8a64;font-weight:700}
.q-row .tags{display:flex;flex-direction:column;gap:.2rem;align-items:flex-start;flex:none;min-width:6.5rem}
.q-row .tags .chip{font-size:.72rem;padding:.1em .7em}
.q-row .thumb{height:2.2rem;border-radius:.4rem}
.q-row .acts,.rw-card .acts{display:flex;gap:.25rem;flex:none}
.q-row .acts button,.rw-card .acts button,.lc-row .acts button{width:2.1rem;height:2.1rem;border-radius:.7rem;display:grid;place-items:center;transition:background .2s}
.q-row .acts button:hover,.rw-card .acts button:hover,.lc-row .acts button:hover{background:#e5f2fd}
.acts button.del:hover{background:#ffe3dd!important}
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.8rem}
.rw-card{background:rgba(255,255,255,.85);border-radius:1.2rem;padding:.8rem 1rem;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:.4rem;transition:transform .2s,opacity .2s}
.rw-card:hover{transform:translateY(-2px)}
.rw-card.off{opacity:.5}
.rw-card .top{display:flex;align-items:center;gap:.7rem}
.rw-card .ic{font-size:2.2rem;line-height:1}
.rw-card .nm{font-weight:800;flex:1}
.rw-card .ds{font-size:.82rem;color:var(--ink-soft)}
.rw-card .pr{display:flex;gap:.4rem;flex-wrap:wrap}
.rw-card .pr span{font-size:.72rem;font-weight:800;border-radius:99px;padding:0 .6em;background:var(--lc);color:var(--ld)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;flex:1;min-height:0}
.two-col>div{display:flex;flex-direction:column;min-height:0}
.lc-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:.95rem;background:rgba(255,255,255,.75);margin-bottom:.4rem}
.lc-row .ico{font-size:1.5rem}
.lc-row .nm{flex:1;font-weight:800}
.lc-row .n{font-size:.8rem;color:var(--ink-soft);background:rgba(29,58,86,.07);border-radius:99px;padding:0 .6em}
.lc-row input.field{padding:.3em .6em}
.tip{background:#eef7ff;border-radius:1rem;padding:.6rem .9rem;font-size:.88rem;color:var(--ink-soft);margin-bottom:.8rem}

/* ===== حوارات ===== */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:2vh 2vw;background:rgba(30,66,100,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s both}
.overlay.out{animation:fadeOut .28s both}
.overlay.dlg{z-index:80}
.dialog{width:min(34rem,94vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#fff,#f4faff);border-radius:1.6rem;box-shadow:0 28px 70px rgba(20,60,100,.4);padding:1.4rem 1.6rem;animation:popIn .35s cubic-bezier(.2,.9,.3,1.1) both}
.dialog.wide{width:min(46rem,94vw)}
.dialog h3{font-size:1.4rem;font-weight:900;margin-bottom:.9rem}
.dialog label.f{display:block;font-weight:700;margin-bottom:.8rem}
.dialog label.f>span,.dialog .f>.lab{display:block;margin-bottom:.3rem;color:var(--ink-soft);font-size:.9rem;font-weight:700}
.dialog .f{margin-bottom:.8rem}
.dialog .dactions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}
.dialog ul{margin:.2rem 0;padding-inline-start:1.3rem;line-height:1.9}
.dialog .note2{font-size:.85rem;color:var(--ink-soft);margin:.3rem 0 .8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.emoji-pick{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.emoji-pick button{width:2.3rem;height:2.3rem;border-radius:.7rem;font-size:1.3rem;background:rgba(29,58,86,.05);transition:transform .15s,background .15s}
.emoji-pick button:hover{background:#dcefff;transform:scale(1.15)}
.imgrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.imgrow img{height:4.2rem;border-radius:.7rem;box-shadow:var(--shadow-s)}
.prev-count{font-weight:700;color:var(--blue-d)}
.shake-all{animation:shakeBig .7s both}
.flash{position:fixed;inset:0;z-index:140;pointer-events:none;background:#fff;animation:flashA .6s ease-out forwards}
.flash.fire{background:radial-gradient(circle,#ffe9b0,#ff9a4d 70%,#ff6a3d)}
.flash.nuke{background:radial-gradient(circle,#fff,#fff4a8 55%,#ffb347)}
.stamp{position:fixed;inset:0;z-index:140;pointer-events:none;display:grid;place-items:center;font-size:min(40vh,22rem);animation:stampA 1.3s ease-out forwards}

/* ===== متفرقات ===== */
#toast{position:fixed;left:50%;bottom:2.2rem;transform:translate(-50%,30px);background:rgba(29,58,86,.92);color:#fff;padding:.65em 1.4em;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:200;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150}

/* ===== حركات ===== */
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes pop2{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:none}}
@keyframes popOk{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 5px var(--tcl),var(--shadow-s)}50%{box-shadow:0 0 0 11px var(--tcl2),var(--shadow)}}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(28deg)}}
@keyframes breathe{0%,100%{box-shadow:0 8px 22px rgba(47,134,212,.36),0 0 0 0 rgba(78,176,242,.5)}55%{box-shadow:0 10px 28px rgba(47,134,212,.4),0 0 0 16px rgba(78,176,242,0)}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shakeBig{10%,50%,90%{transform:translate(-14px,6px)}30%,70%{transform:translate(14px,-6px)}}
@keyframes floatY{50%{transform:translateY(-8px)}}
@keyframes floatUp{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-4.5rem);opacity:0}}
@keyframes rise{from{clip-path:inset(100% 0 0 0);transform:translateY(1.5rem)}to{clip-path:inset(-2rem -2rem 0 -2rem);transform:none}}
@keyframes flashA{0%{opacity:.95}100%{opacity:0}}
@keyframes stampA{0%{transform:scale(3);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}

@media (max-width:900px){
  .setup-body{grid-template-columns:1fr;padding-inline:1rem}
  .two-col{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .teams{order:3;flex-basis:100%}
  #s-game{padding:.7rem}
  .opts{grid-template-columns:1fr}
  .page-head h1,.mgr-head h1{font-size:1.45rem}
  .tabs{overflow:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .deco{display:none}
}

/* ==========================================================================
   المظهر الحماسي — يُفعَّل بـ data-theme="hot" (والمظهر الهادئ هو الأصل)
   ========================================================================== */
:root[data-theme="hot"]{
  --ink:#1c1457; --ink-soft:#5a4fa8; --ink-faint:#8f86cf;
  --card:#ffffff; --line:rgba(28,20,87,.14);
  --shadow:0 9px 0 rgba(15,5,70,.3),0 22px 40px rgba(10,0,60,.35);
  --shadow-s:0 5px 0 rgba(15,5,70,.22),0 10px 20px rgba(10,0,60,.22);
  --blue:#2f8bff; --blue-d:#1a5fd1;
}
:root[data-theme="hot"] body{background:#3a1fb5}

/* ----- الخلفية: أشعة + توهّج ----- */
[data-theme=hot] .bg{background:
  radial-gradient(60% 50% at 12% 8%,rgba(255,92,172,.6),transparent 70%),
  radial-gradient(55% 55% at 92% 12%,rgba(255,196,31,.5),transparent 70%),
  radial-gradient(75% 60% at 50% 108%,rgba(0,205,255,.6),transparent 70%),
  linear-gradient(160deg,#3a1fb5 0%,#5b24c9 45%,#2547e0 100%)}
[data-theme=hot] .bg::before{content:"";position:absolute;left:50%;top:48%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0 6deg,transparent 6deg 16deg);animation:spin 140s linear infinite;pointer-events:none;will-change:transform}
[data-theme=hot] #s-game{padding-top:1.9rem}
[data-theme=hot] .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.22),transparent 58%);pointer-events:none}
[data-theme=hot] .deco.q{color:rgba(255,255,255,.16)}
[data-theme=hot] .deco.star{color:#ffe36e;text-shadow:0 0 14px #ffd21f;opacity:1}

[data-theme=hot] .btn.gold{background:linear-gradient(180deg,#ffe36e,#ffb800);color:#5a3300;box-shadow:0 7px 0 #b37a00,0 16px 24px rgba(0,0,0,.28)}

/* ----- مؤثرات جديدة ----- */
.pow{position:fixed;left:50%;top:40%;z-index:130;pointer-events:none;font-size:clamp(3rem,15vh,9.5rem);font-weight:900;color:#fff;-webkit-text-stroke:.055em #1c1457;paint-order:stroke fill;text-shadow:0 .07em 0 rgba(0,0,0,.35);white-space:nowrap;animation:powA 1.15s cubic-bezier(.2,1.3,.4,1) forwards}

function normDB(d) {
  if (!d || !Array.isArray(d.levels) || !Array.isArray(d.questions) || !Array.isArray(d.rewards)) return null;
  const levels = d.levels.filter(x => x && x.id).map(x => ({ id: String(x.id), name: String(x.name || 'مستوى').slice(0, 30), points: Math.max(0, +x.points || 0) })).slice(0, 5);
  if (!levels.length) return null;
  const cats = (Array.isArray(d.cats) ? d.cats : []).filter(c => c && c.id && c.name).map(c => ({ id: String(c.id), name: String(c.name).slice(0, 30), icon: String(c.icon || '📚').slice(0, 4) }));
  const catIds = new Set(cats.map(c => c.id)), lvIds = new Set(levels.map(l => l.id));
  const questions = d.questions.filter(q => q && q.q && q.a && Array.isArray(q.w) && q.w.filter(Boolean).length).map(q => ({
    id: String(q.id || uid()), l: lvIds.has(q.l) ? q.l : levels[0].id, c: catIds.has(q.c) ? q.c : '', q: String(q.q), a: String(q.a),
    w: q.w.map(String).filter(Boolean).slice(0, 5), note: String(q.note || ''),
    img: typeof q.img === 'string' && (q.img.startsWith('data:image') || /^https?:/.test(q.img)) ? q.img : '',
  }));
  const rewards = d.rewards.filter(r => r && r.id && RTYPES[r.type]).map(r => ({
    id: String(r.id), name: String(r.name || 'مكافأة').slice(0, 40), icon: /^svg:/.test(r.icon || '') ? ((DEFAULT_REWARDS.find(x => x.id === r.id) || {}).icon || '🎁') : String(r.icon || '🎁').slice(0, 4), type: r.type, val: Math.max(0, +r.val || 0),
    hold: RTYPES[r.type].holds.includes(r.hold) ? r.hold : RTYPES[r.type].holds[0], on: r.on !== false,
    w: Object.fromEntries(levels.map(l => [l.id, Math.max(0, +(r.w && r.w[l.id]) || 0)])),
  }));
  return { v: 1, levels, cats, rewards, questions };
}

const Snd = (() => {
  let ctx = null, master = null;
  const ensure = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (f, t, d, type = 'sine', v = .16, to) => {
    if (!prefs.sound) return; const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + .05);
  };
  const seq = (notes, step, type, v, d) => notes.forEach((f, i) => tone(f, i * step, d, type, v));
  return {
    unlock: ensure,
    pop:     () => tone(740, 0, .12, 'sine', .11, 1050),
    open:    () => { tone(392, 0, .28, 'sine', .11); tone(587, .08, .36, 'sine', .09); },
    tick:    () => tone(1100, 0, .05, 'square', .035),
    correct: () => seq([523, 659, 784, 1047], .1, 'triangle', .15, .55),
    wrong:   () => { tone(300, 0, .3, 'sine', .13, 200); tone(220, .16, .4, 'sine', .11, 150); },
    timeup:  () => { tone(440, 0, .5, 'sine', .14, 330); tone(330, .25, .75, 'sine', .13, 220); },
    door:    () => { tone(150, 0, .7, 'sawtooth', .07, 90); tone(520, .45, .25, 'triangle', .08, 700); },
    gift:    () => seq([784, 988, 1175, 1568, 1319, 1568], .08, 'triangle', .13, .45),
    zap:     () => { tone(1400, 0, .3, 'square', .09, 160); tone(900, .08, .3, 'sawtooth', .07, 120); },
    boom:    () => { tone(90, 0, 1, 'sawtooth', .22, 28); tone(60, .05, 1.1, 'sine', .25, 24); },
    fire:    () => { for (let i = 0; i < 6; i++) tone(500 - i * 55, i * .06, .35, 'sawtooth', .05, 120); },
    dove:    () => seq([880, 1100, 988, 1320], .11, 'sine', .1, .4),
    ban:     () => { tone(180, 0, .3, 'square', .08, 120); tone(140, .2, .4, 'square', .08, 90); },
    win:     () => seq([523, 659, 784, 1047, 784, 1047, 1319], .13, 'triangle', .17, .6),
  };
})();

const FX = (() => {

  addEventListener('resize', size); size();
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  function burst(x, y, n = 80, angle = -Math.PI / 2, spread = Math.PI * 2, power = 10) {
    if (RM) return;
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - .5) * spread, s = power * (.4 + Math.random() * .8);

    }
    kick();
  }
  /* إيموجي: mode = burst | rise | rain | fly */
  function emoji(e, mode = 'burst', n = 26) {
    if (RM) return; const W = innerWidth, H = innerHeight;

    foot.innerHTML = `<div class="verdict ok">🎉 أصبت! +${lv.points} نقطة</div>${note}<button class="btn gold xl" data-act="to-luck">🍀 افتح باب الحظ</button>`;
  } else {
    Snd.wrong();
    let pen = 0; if (G.opts.wrongPenalty) { pen = Math.round(lv.points / 2); addScore(ti, -pen); }
    foot.innerHTML = `<div class="verdict no">${timeout ? '⏰ انتهى الوقت!' : '😔 إجابة خاطئة'}${pen ? ` (−${pen})` : ''}</div>${note}<button class="btn primary xl" data-act="next-turn">متابعة ←</button>`;
    saveGame();
  }
  const f = $('#qfoot .btn.xl'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 50);
}

/* ---------- باب الحظ ---------- */
function drawReward(lid) {
  const all = G.rewards.filter(r => (r.w[lid] || 0) > 0);
  const tot = all.reduce((a, r) => a + r.w[lid], 0); if (!tot) return null;
  let x = Math.random() * tot; for (const r of all) { x -= r.w[lid]; if (x <= 0) return r; } return all[all.length - 1];
}
function toLuck() {
  const lid = G.levels[Q.li].id, li = Q.li, rs = [0, 1, 2].map(() => drawReward(lid));
  Q = null;
  if (!rs[0]) { toast('لا توجد مكافآت مفعّلة'); return endTurn(false); }
  LK = { rs, li, picked: -1 }; G.view = 'luck'; Snd.gift(); renderStage(false);
}
function viewLuck() {
  $('#stage').innerHTML = `<div class="luck-title">🍀 حان وقت الحظ!<small>اختر باباً لتعرف مكافأتك</small></div>
    <div class="doors">${[0, 1, 2].map(i => `<button class="door" style="--i:${i}" data-act="door" data-i="${i}" aria-label="باب ${i + 1}"><div class="frame">❔</div><div class="leaf">${i + 1}</div></button>`).join('')}</div>
    <div class="muted" style="font-weight:700">اضغط على باب (أو الأرقام 1–3)</div>`;
}
const rdesc = r => ({
  add: `إضافة ${r.val} نقطة لفريقك`, sub: `خصم ${r.val} نقطة من فريقك`,
  double: 'ضعف نقاط المستوى + سؤال إضافي مباشرة', extra: 'سؤال إضافي مباشرة',
  strike: `خصم ${r.val} نقطة من فريق تختاره`, steal: `سرقة ${r.val} نقطة من فريق تختاره`,
  blast: `خصم ${r.val} نقطة من جميع الفرق الأخرى`, ban: `منع فريق تختاره من اللعب لمدة ${r.val} أدوار`,
  shield: 'تحميك من خصم واحد — تُستخدم تلقائياً',
}[r.type]);
const rgood = r => ['add', 'double', 'extra', 'strike', 'steal', 'blast', 'ban', 'shield'].includes(r.type);

async function openDoor(i) {
  if (busy || !LK || LK.picked >= 0) return; busy = true; LK.picked = i;
  const doors = $$('.door'), r = LK.rs[i];
  doors.forEach((d, k) => { $('.frame', d).textContent = LK.rs[k].icon; });
  doors[i].classList.add('open'); Snd.door();
  await sleep(1000);
  doors.forEach((d, k) => { if (k !== i) d.classList.add('open', 'miss'); });
  await sleep(900);
  const others = LK.rs.filter((_, k) => k !== i);
  $('#stage').innerHTML = `<div class="reward-card ${rgood(r) ? 'good' : 'bad'}" id="rcard"><div class="big">${esc(r.icon)}</div><h3>${esc(r.name)}</h3><p>${esc(rdesc(r))}</p><div class="row" id="rrow"></div></div>
    <div class="muted" style="font-weight:700">كان خلف الأبواب الأخرى: ${others.map(o => `${esc(o.icon)} ${esc(o.name)}`).join(' · ')}</div>`;
  Snd.gift();
  await processReward(r);
  busy = false;
}

async function processReward(r) {
  const ti = G.turn, t = G.teams[ti], ctx = { extra: false, pts: G.levels[LK.li].points }, row = () => $('#rrow');
  const cont = async () => { if (row()) row().innerHTML = `<button class="btn primary xl" data-act="rw-next">متابعة ←</button>`; await waitAct(); };
  if (r.hold === 'keep') {
    giveItem(ti, r); renderTeams(); Snd.dove(); FX.emoji(r.icon, 'burst', 14);
    if (row()) row().innerHTML = `<div class="chip">🎒 تم الاحتفاظ بها لـ ${esc(t.name)}</div>`; await sleep(500); await cont();
  } else if (r.hold === 'ask') {
    let used = false;
    while (!used) {
      row().innerHTML = `<button class="btn gold xl" data-act="rw-use">⚡ استخدمه الآن</button><button class="btn soft xl" data-act="rw-keep">🎒 احتفظ به</button>`;
      const a = await waitAct();
      if (a === 'rw-keep') { giveItem(ti, r); renderTeams(); toast(`احتفظ ${t.name} بـ ${r.name}`); break; }
      used = await runEffect(ti, r, ctx);
    }
    await cont();
  } else {
    await sleep(700); await runEffect(ti, r, ctx); await sleep(500); await cont();
  }
  endTurn(ctx.extra);
}

/* ---------- المخزون والتأثيرات ---------- */
const shieldCount = t => G.rewards.filter(r => r.type === 'shield').reduce((a, r) => a + (t.inv[r.id] || 0), 0);
function giveItem(ti, r) { const t = G.teams[ti]; t.inv[r.id] = (t.inv[r.id] || 0) + 1; saveGame(); }
function takeItem(ti, rid) { const t = G.teams[ti]; if (t.inv[rid] > 0) t.inv[rid]--; if (!t.inv[rid]) delete t.inv[rid]; saveGame(); }

async function chooseTeam(title, exclude) {
  return dialog({
    title, body: `<div class="pick-teams">${G.teams.map((t, i) => exclude.includes(i) ? '' : `<button class="pick-team" style="${teamVars(t)}" data-pick="${i}"><span class="em">${t.emoji}</span>${esc(t.name)}<small>${num(t.score)} نقطة</small></button>`).join('')}</div>`,
    actions: [{ label: 'إلغاء', cls: 'ghost' }],
    onOpen(root, close) { root.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) close(+b.dataset.pick); }); },
  });
}
async function askShield(t) {
  return dialog({ title: `🕊️ ${esc(t.name)} يملك حمامة سلام`, body: `<p style="line-height:1.8">هل يريد استخدامها لإلغاء هذا الخصم؟<br><span class="muted">إن استخدمها لا يُخصم منه شيء وتختفي الحمامة. وإن رفض يُخصم منه وتبقى الحمامة معه.</span></p>`, actions: [{ label: 'اخصم مني', cls: 'ghost', value: false }, { label: '🕊️ استخدم الحمامة', cls: 'primary', value: true }] });
}
/* خصم موجّه — يراعي حمامة السلام. يرجع true لو تم الخصم فعلاً */
async function deduct(ti, amount) {
  const t = G.teams[ti];
  if (shieldCount(t) > 0 && await askShield(t)) {
    const r = G.rewards.find(x => x.type === 'shield' && t.inv[x.id] > 0); takeItem(ti, r.id);
    Snd.dove(); FX.emoji('🕊️', 'fly', 6); renderTeams(); toast(`${t.name} نجا بحمامة السلام 🕊️`); return false;
  }
  addScore(ti, -amount); return true;
}
function fxFor(r) {
  if (r.type === 'strike') { Snd.zap(); const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 700); FX.emoji('⚡', 'burst', 22); }
  else if (r.type === 'blast') {
    const nuke = r.val >= 1000 || /☢/.test(r.icon), f = document.createElement('div'); f.className = 'flash ' + (nuke ? 'nuke' : 'fire'); document.body.appendChild(f); setTimeout(() => f.remove(), 700);
    if (nuke) { Snd.boom(); FX.emoji('☢️', 'burst', 18); $('#app').classList.add('shake-all'); setTimeout(() => $('#app').classList.remove('shake-all'), 800); } else { Snd.fire(); FX.emoji('🔥', 'rise', 40); }
  } else if (r.type === 'ban') { Snd.ban(); const s = document.createElement('div'); s.className = 'stamp'; s.textContent = r.icon || '🚫'; document.body.appendChild(s); setTimeout(() => s.remove(), 1400); }
}
async function runEffect(ti, r, ctx) {
  const t = G.teams[ti];
  switch (r.type) {
    case 'add': addScore(ti, r.val); Snd.gift(); FX.burst(innerWidth / 2, innerHeight / 2, 90, -Math.PI / 2, Math.PI * 1.6, 11); return true;
    case 'sub': addScore(ti, -r.val); Snd.wrong(); return true;
    case 'double': addScore(ti, ctx.pts || 0); ctx.extra = true; Snd.gift(); FX.emoji('🔄', 'burst', 16); return true;
    case 'extra': ctx.extra = true; Snd.gift(); FX.emoji('➕', 'burst', 12); return true;
    case 'shield': toast('حمامة السلام تُستخدم تلقائياً عند توجيه خصم لصاحبها'); return false;
    case 'strike': case 'steal': {
      if (G.teams.length < 2) return false;
      const tg = await chooseTeam(`${r.icon} ${r.name}: اختر الفريق الذي ${r.type === 'steal' ? 'تسرق منه' : 'تخصم منه'} ${r.val} نقطة`, [ti]); if (tg == null) return false;
      fxFor(r); await sleep(450); const ok = await deduct(tg, r.val); if (ok && r.type === 'steal') addScore(ti, r.val); return true;
    }
    case 'blast': {
      if (!await askConfirm(`${r.icon} ${esc(r.name)}: سيُخصم ${r.val} نقطة من جميع الفرق الأخرى. متأكد؟`, 'نعم، نفّذ', 'warn')) return false;
      fxFor(r); await sleep(500);
      for (let i = 0; i < G.teams.length; i++) if (i !== ti) await deduct(i, r.val);
      return true;
    }
    case 'ban': {
      const tg = await chooseTeam(`${r.icon} ${r.name}: اختر الفريق الذي سيُمنع ${r.val} أدوار`, [ti]); if (tg == null) return false;
      fxFor(r); G.teams[tg].ban += r.val; renderTeams(); saveGame(); toast(`${G.teams[tg].name} ممنوع من اللعب ${r.val} أدوار`); return true;
    }
  }
  return false;
}
async function showInventory(ti) {
  const t = G.teams[ti], items = G.rewards.filter(r => t.inv[r.id] > 0);
  if (!items.length) return toast('لا توجد حظوظ محتفظ بها');
  const rid = await dialog({
    title: `🎒 حظوظ ${esc(t.name)}`, body: `<div class="inv-list">${items.map(r => `<button class="inv-item" data-use="${r.id}"><span class="ic">${esc(r.icon)}</span><span class="tx"><b>${esc(r.name)}</b><small>${esc(rdesc(r))}</small></span><span class="cnt">×${t.inv[r.id]}</span></button>`).join('')}</div>`,
    actions: [{ label: 'إغلاق', cls: 'ghost' }],
    onOpen(root, close) { root.addEventListener('click', e => { const b = e.target.closest('[data-use]'); if (b) close(b.dataset.use); }); },
  });
  if (!rid || busy) return;
  const r = G.rewards.find(x => x.id === rid); busy = true;
  try { if (await runEffect(ti, r, { extra: false, pts: 0 })) { takeItem(ti, rid); renderTeams(); } } finally { busy = false; }
}

/* ---------- نهاية الدور ---------- */
function endTurn(extra) {
  LK = null; Q = null; const n = G.teams.length;
  if (!extra) G.turn = (G.turn + 1) % n;
  let guard = 0;
  while (G.teams[G.turn].ban > 0 && guard++ < 40) {
    const t = G.teams[G.turn]; t.ban--; toast(`🚫 ${t.name} ممنوع من هذا الدور`); Snd.ban(); G.turn = (G.turn + 1) % n;
  }
  const done = (G.opts.rounds > 0 && G.teams.every(t => t.played >= G.opts.rounds)) || G.levels.every(l => leftIn(l) === 0);
  G.view = 'levels'; saveGame();
  if (done) { renderTeams(); setTimeout(finish, 600); return; }
  renderGame();
}

/* ---------- النتيجة ---------- */
function finish() {
  if (!G) return; G.finished = true; saveGame(); showScreen('results'); Snd.win(); FX.rain();
}
function renderResults() {
  const ts = G.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
  const top = ts[0].score, winners = ts.filter(t => t.score === top);
  $('#res-title').innerHTML = winners.length > 1 ? '🤝 تعادل رائع!' : `🏆 مبروك ${esc(winners[0].name)}!`;
  $('#res-sub').textContent = winners.length > 1 ? `${winners.map(w => w.name).join(' و ')} — ${num(top)} نقطة لكل فريق` : `فاز بـ ${num(top)} نقطة — شاطر ومحظوظ! 👏`;
  const rank = ts.map(t => ts.findIndex(x => x.score === t.score)), n = ts.length;
  const order = n === 2 ? [0, 1] : n === 3 ? [1, 0, 2] : [1, 0, 2, 3], hts = [58, 46, 36, 28], medals = ['🥇', '🥈', '🥉', '🎖️'];
  const maxS = Math.max(...ts.map(t => Math.abs(t.score)), 1);
  $('#podium').innerHTML = order.map((k, pos) => { const t = ts[k], rk = rank[k]; return `<div class="pod" style="${teamVars(t)};--i:${pos}">
    <div class="who"><span class="avatar">${rk === 0 ? '<span class="crown">👑</span>' : ''}${t.emoji}</span><span class="nm">${esc(t.name)}</span></div>
    <div class="blk" style="height:${(hts[Math.min(rk, 3)] * Math.min(1, Math.max(.6, .6 + .4 * (Math.max(t.score, 0) / maxS)))).toFixed(1)}%"><span class="rank">${medals[Math.min(rk, 3)]}</span><span class="sc">${num(t.score)}</span></div></div>`; }).join('');
}

function readImage(file, max = 900) {

function parseBulk(text, defL) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\s*[|\t]\s*/).map(s => s.trim());
    if (p.length < 3 || !p[0] || !p[1] || !p[2]) return null;
    const w = [p[2], p[3], p[4]].filter(Boolean);
    let lv = defL; if (p[5] && /^\d+$/.test(p[5]) && db.levels[+p[5] - 1]) lv = db.levels[+p[5] - 1].id;
    const cat = p[6] ? (db.cats.find(c => c.name === p[6]) || {}).id || '' : '';
    return { q: p[0], a: p[1], w, l: lv, c: cat };
  }).filter(Boolean);
}

const normQ = t => String(t).replace(/[\u064B-\u0670\u0640]/g, '').replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[^\p{L}\p{N}]+/gu, '');
function encToQ(r) {
  const a = String(r[6] ?? '').trim();
  if (!r[5] || !a) return null;
  if (r[4] === 'm' && Array.isArray(r[7]) && r[7].filter(Boolean).length) return { q: String(r[5]).trim(), a, w: r[7].map(String).filter(Boolean).slice(0, 5) };
  if (r[4] === 't' && (a === 'صح' || a === 'خطأ')) return { q: 'صح أم خطأ: ' + String(r[5]).trim(), a, w: [a === 'صح' ? 'خطأ' : 'صح'] };
  return null;
}
async function importEncyclopedia(file) {
  let B;
  try {
    const txt = await file.text(), i = txt.indexOf('const BANK = ');
    if (i < 0) throw 0;
    B = JSON.parse(txt.slice(i + 13, txt.indexOf('\n', i)).trim().replace(/;$/, ''));
    if (!Array.isArray(B.cats) || !Array.isArray(B.q)) throw 0;
  } catch (er) { return toast('هذا مو ملف الموسوعة — اختر «موسوعة الأسئلة الثقافية.html»'); }
  const adult = r => /للكبار/.test(r[2] || '');
  const usable = B.q.filter(encToQ);
  const pick = new Set(B.cats.map(c => c.key)); let withAdult = false;
  const count = c => usable.filter(r => r[1] === c.key && (withAdult || !adult(r))).length;
  const ok = await dialog({
    title: 'استيراد من موسوعة الأسئلة', wide: true,
    body: `<p class="note2">اللعبة تحتاج أسئلة لها خيارات، فتنضاف أسئلة <b>الاختيار من متعدد</b> و<b>الصح والخطأ</b> بس (${usable.length} سؤال من ${B.q.length}${B.built ? `، تحديث ${esc(B.built)}` : ''}).<br>المستوى 1 و2 و3 في الموسوعة يصير المستوى الأول والثاني والثالث. الأسئلة الموجودة عندك ما تتكرر، ولو استوردت مرة ثانية بعد تحديث الموسوعة ينضاف الجديد بس.</p>
      <div style="display:flex;gap:.5rem;margin-bottom:.6rem"><button type="button" class="btn soft sm" data-e="all">تحديد الكل</button><button type="button" class="btn ghost sm" data-e="none">مسح</button></div>
      <div class="seg enc" id="enc-cats"></div>
      <div class="opt-row" style="border:0;margin-top:.6rem"><div class="lbl">الأقسام المعلّمة «للكبار»<span class="sub">أحكام الأسرة والحدود — مقفلة افتراضياً</span></div><button type="button" class="switch" data-e="adult" role="switch" aria-checked="false"></button></div>`,
    onOpen(root) {
      const paint = () => {
        $('#enc-cats', root).innerHTML = B.cats.filter(c => count(c)).map(c => `<button type="button" class="${pick.has(c.key) ? 'on' : ''}" data-e="cat" data-k="${esc(c.key)}" aria-pressed="${pick.has(c.key)}">${esc(c.icon || '📚')} ${esc(c.name)} <small>${count(c)}</small></button>`).join('');
        const sw = $('[data-e=adult]', root); sw.classList.toggle('on', withAdult); sw.setAttribute('aria-checked', withAdult);
      };
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-e]'); if (!b) return;
        const k = b.dataset.e;
        if (k === 'cat') { if (pick.has(b.dataset.k)) pick.delete(b.dataset.k); else pick.add(b.dataset.k); }
        else if (k === 'all') B.cats.forEach(c => pick.add(c.key));
        else if (k === 'none') pick.clear();
        else if (k === 'adult') withAdult = !withAdult;
        paint(); Snd.pop();
      });
      paint();
    },
    actions: [{ label: 'إلغاء', cls: 'ghost' }, { label: 'استيراد', cls: 'primary', onClick() { if (!pick.size) { toast('اختر فئة وحدة على الأقل'); return false; } return true; } }],
  });
  if (!ok) return;
  const seen = new Set(db.questions.map(q => normQ(q.q)));
  let added = 0, dup = 0; const newCats = [];
  for (const c of B.cats) {
    if (!pick.has(c.key)) continue;
    const rows = usable.filter(r => r[1] === c.key && (withAdult || !adult(r)));
    if (!rows.length) continue;
    let cat = db.cats.find(x => x.id === c.key || x.id === 'enc_' + c.key);
    if (!cat) { cat = { id: 'enc_' + c.key, name: (db.cats.some(x => x.name === c.name) ? `${c.name} (الموسوعة)` : c.name).slice(0, 30), icon: c.icon || '📚' }; db.cats.push(cat); newCats.push(cat.id); }
    for (const r of rows) {
      const x = encToQ(r), k = normQ(x.q);
      if (seen.has(k)) { dup++; continue; }
      seen.add(k); added++;
      const lv = db.levels[Math.min(db.levels.length, Math.max(1, +r[3] || 1)) - 1];
      db.questions.push({ id: 'e' + r[0], l: lv.id, c: cat.id, q: x.q, a: x.a, w: x.w, note: String(r[8] || '').trim(), img: '' });
    }
  }
  if (newCats.length) { fixPrefs(); prefs.cats.push(...newCats.filter(id => !prefs.cats.includes(id))); savePrefs(); }
  saveDB(); renderManager();
  toast(added ? `انضاف ${added} سؤال${newCats.length ? ` و${newCats.length === 1 ? 'فئة جديدة' : newCats.length === 2 ? 'فئتين جديدتين' : newCats.length + ' فئات جديدة'}` : ''}${dup ? ` · وانشال ${dup} مكرر` : ''}` : 'كل أسئلة الفئات المختارة موجودة عندك من قبل');
}

  manager: () => { MG.from = cur; showScreen('manager'); },
  'mgr-back': () => showScreen(MG.from || 'welcome'),

  /* الإعداد */
  'team-n': el => { prefs.teamCount = Math.max(MIN_TEAMS, Math.min(MAX_TEAMS, prefs.teamCount + +el.dataset.d)); savePrefs(); renderTeamsCard(); Snd.pop(); },
  'team-emoji': el => { const i = +el.dataset.i, c = prefs.emojis[i] || TEAM_PRESETS[i].emoji, used = TEAM_PRESETS.slice(0, prefs.teamCount).map((p, k) => k === i ? null : (prefs.emojis[k] || p.emoji)); let k = TEAM_EMOJIS.indexOf(c); do { k = (k + 1) % TEAM_EMOJIS.length; } while (used.includes(TEAM_EMOJIS[k])); prefs.emojis[i] = TEAM_EMOJIS[k]; savePrefs(); el.textContent = TEAM_EMOJIS[k]; Snd.pop(); },
  opt: el => { prefs[el.dataset.k] = +el.dataset.v; savePrefs(); renderRulesCard(); Snd.pop(); },
  toggle: el => { prefs[el.dataset.k] = !prefs[el.dataset.k]; savePrefs(); renderRulesCard(); if (el.dataset.k === 'sound') applySound(); Snd.pop(); },
  cat: el => { const id = el.dataset.id, s = prefs.cats, i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else s.push(id); savePrefs(); paintCats(); Snd.pop(); },
  start: startGame,
  again: () => startGame(),

  /* اللعب */
  turn: el => { if (busy || Q || LK) return; G.turn = +el.dataset.i; saveGame(); renderTeams(); if (G.view === 'levels') renderStage(false); Snd.pop(); },
  score: async el => {
    const i = +el.dataset.i, t = G.teams[i];
    const v = await dialog({ title: `تعديل نقاط ${esc(t.name)}`, body: `<label class="f"><span>النقاط الجديدة</span><input class="field" type="number" id="f-sc" value="${t.score}" step="10"></label>`, onOpen(root) { setTimeout(() => { const f = $('#f-sc', root); f.focus(); f.select(); }, 60); }, actions: [{ label: 'إلغاء', cls: 'ghost' }, { label: 'حفظ', cls: 'primary', onClick(root) { const n = parseInt($('#f-sc', root).value, 10); if (isNaN(n)) { toast('اكتب رقماً'); return false; } return n; } }] });
    if (v === undefined || v === null) return; const d = v - t.score; if (d) addScore(i, d);
  },
  inv: el => { if (busy || Q) return toast('انتظر حتى تنتهي هذه الخطوة'); showInventory(+el.dataset.i); },
  end: async () => { if (busy) return; if (await askConfirm('إنهاء المسابقة الآن وعرض النتيجة النهائية؟', 'نعم، أنهِ المسابقة')) finish(); },
  'pick-level': el => pickLevel(+el.dataset.i),
  answer: el => answer(+el.dataset.i),
  'swap-q': swapQuestion,
  'next-turn': () => endTurn(false),
  'to-luck': toLuck,
  door: el => openDoor(+el.dataset.i),
  'rw-use': () => resolveAct('rw-use'), 'rw-keep': () => resolveAct('rw-keep'), 'rw-next': () => resolveAct('rw-next'),

  /* الإدارة */
  'mgr-tab': el => { MG.tab = el.dataset.k; renderManager(); },
  'mgr-add-q': () => editQuestion(null),
  'mgr-edit-q': el => editQuestion(el.dataset.id),
  'mgr-del-q': async el => { if (await askConfirm('حذف هذا السؤال؟')) { db.questions = db.questions.filter(q => q.id !== el.dataset.id); saveDB(); paintQList(); } },
  'mgr-bulk': bulkAdd,
  enc: () => $('#enc-file').click(),
  'mgr-add-rw': () => editReward(null),
  'mgr-edit-rw': el => editReward(el.dataset.id),
  'mgr-del-rw': async el => { if (await askConfirm('حذف هذه المكافأة؟')) { db.rewards = db.rewards.filter(r => r.id !== el.dataset.id); saveDB(); renderManager(); } },
  'mgr-rw-on': el => { const r = db.rewards.find(x => x.id === el.dataset.id); r.on = !r.on; saveDB(); renderManager(); },
  'mgr-reset-rw': async () => { if (await askConfirm('استعادة المكافآت الأصلية؟ ستُحذف تعديلاتك على المكافآت.', 'نعم، استعد')) { db.rewards = defaultDB().rewards.map(r => ({ ...r, w: Object.fromEntries(db.levels.map((l, i) => [l.id, r.w['l' + (Math.min(i, 2) + 1)] ?? 0])) })); saveDB(); renderManager(); } },
  'mgr-add-lv': () => { if (db.levels.length >= 5) return; const id = 'l' + uid(), last = db.levels[db.levels.length - 1]; db.levels.push({ id, name: 'المستوى الجديد', points: (last ? last.points : 50) * 2 }); db.rewards.forEach(r => r.w[id] = 3); saveDB(); renderManager(); },
  'mgr-del-lv': async el => {
    const lv = db.levels.find(l => l.id === el.dataset.id), n = db.questions.filter(q => q.l === lv.id).length;
    if (!await askConfirm(`حذف «${esc(lv.name)}»؟ ${n ? `الأسئلة (${n}) ستنتقل إلى أول مستوى متبقٍّ.` : ''}`)) return;
    db.levels = db.levels.filter(l => l !== lv); db.questions.forEach(q => { if (q.l === lv.id) q.l = db.levels[0].id; }); saveDB(); renderManager();
  },
  'mgr-add-cat': () => editCat(null),
  'mgr-edit-cat': el => editCat(el.dataset.id),
  'mgr-del-cat': async el => { const c = db.cats.find(x => x.id === el.dataset.id); if (await askConfirm(`حذف فئة «${esc(c.name)}»؟ (الأسئلة تبقى بدون فئة)`)) { db.cats = db.cats.filter(x => x !== c); db.questions.forEach(q => { if (q.c === c.id) q.c = ''; }); fixPrefs(); savePrefs(); saveDB(); renderManager(); } },
  export: () => {
    const blob = new Blob([JSON.stringify({ app: 'shater-or-mahzoz', ...db }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `shater-questions-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('تم حفظ النسخة الاحتياطية ✔');
  },
  import: () => $('#import-file').click(),
  'reset-db': async () => { if (await askConfirm('استعادة كل الأسئلة والمكافآت الأصلية؟ <b>ستُحذف كل تعديلاتك.</b> (احفظ نسخة احتياطية أولاً لو تحتاجها)', 'نعم، استعد الأصلية')) { db = defaultDB(); prefs.cats = null; fixPrefs(); savePrefs(); saveDB(); renderManager(); toast('تمت الاستعادة'); } },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { Snd.unlock(); f(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.team != null) { prefs.names[+t.dataset.team] = t.value; savePrefs(); }
  else if (t.dataset.start != null) { prefs.start = Math.max(0, Math.min(1000000, parseInt(t.value, 10) || 0)); savePrefs(); }
  else if (t.dataset.mg) { MG[t.dataset.mg] = t.value; paintQList(); }
  else if (t.dataset.lv) {
    const lv = db.levels.find(l => l.id === t.dataset.id); if (!lv) return;
    if (t.dataset.lv === 'name') lv.name = t.value.slice(0, 30) || 'مستوى'; else lv.points = Math.max(0, parseInt(t.value, 10) || 0); saveDB();
  }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.mg) { MG[t.dataset.mg] = t.value; paintQList(); } });

$('#import-file').addEventListener('change', async e => {
$('#enc-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importEncyclopedia(f); });
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let nd; try { nd = normDB(JSON.parse(await f.text())); if (!nd) throw 0; } catch (er) { return toast('الملف غير صالح — استخدم ملفاً تم حفظه من هذه اللعبة'); }
  const mode = await dialog({
    title: 'استيراد',
    body: `<p style="line-height:1.9">تم العثور على <b>${nd.questions.length}</b> سؤال و<b>${nd.rewards.length}</b> مكافأة و<b>${nd.levels.length}</b> مستويات.</p><p class="note2">«دمج» يضيف الأسئلة الجديدة فقط ويبقي المكافآت والمستويات الحالية. «استبدال» يمسح كل شيء ويضع الملف مكانه.</p>`,
    actions: [{ label: 'إلغاء', cls: 'ghost' }, { label: 'استبدال الكل', cls: 'warn', value: 'replace' }, { label: 'دمج الأسئلة', cls: 'primary', value: 'merge' }],
  });
  if (!mode) return;
  if (mode === 'replace') db = nd;
  else {
    const have = new Set(db.questions.map(q => q.q + '|' + q.a)); let add = 0;
    nd.cats.forEach(c => { if (!db.cats.some(x => x.id === c.id)) db.cats.push(c); });
    nd.questions.forEach(q => { if (!have.has(q.q + '|' + q.a)) { const li = nd.levels.findIndex(l => l.id === q.l); q.l = (db.levels[Math.min(li, db.levels.length - 1)] || db.levels[0]).id; if (q.c && !db.cats.some(c => c.id === q.c)) q.c = ''; db.questions.push(q); add++; } });
    toast(`تمت إضافة ${add} سؤال جديد`);
  }
  prefs.cats = null; fixPrefs(); savePrefs(); saveDB(); renderManager(); if (mode === 'replace') toast('تم الاستيراد ✔');
});

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (dlgOpen) { if (e.key === 'Escape') { e.preventDefault(); dlgOpen.cancel(); } return; }
  const tag = e.target.tagName; if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (e.code === 'KeyF') return toggleFS();
  if (e.code === 'KeyM') return toggleSound();
  if (cur !== 'game' || !G) return;
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code), d = m ? +m[1] : 0;
  if (G.view === 'question' && Q && !Q.done && d >= 1 && d <= Q.opts.length) answer(d - 1);
  else if (G.view === 'luck' && LK && LK.picked < 0 && d >= 1 && d <= 3) openDoor(d - 1);
  else if (e.code === 'Space' && tag !== 'BUTTON') {
    const b = $('#qfoot .btn.xl') || $('#rrow [data-act="rw-next"]'); if (b) { e.preventDefault(); b.click(); }
  }
});

/* ==========================================================================
   12) تشغيل
   ========================================================================== */
(function decor() {
  const bg = $('#bg'), cols = ['#ffffff', '#bfe3fb', '#fde6bd', '#c6f0de'];
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('span'), kind = i % 5, s = kind === 0 ? 3 + Math.random() * 5 : kind === 1 ? 1 + Math.random() * 1.6 : kind === 4 ? 1.6 + Math.random() * 2 : .7 + Math.random() * 2.6;
    d.className = 'deco ' + (kind === 0 ? 'q' : kind === 1 ? 'star' : kind === 4 ? 'em' : 'dot');
    d.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;--t:${8 + Math.random() * 10}s;--dx:${(Math.random() - .5) * 110}px;--dy:${(Math.random() - .5) * 110}px;` + (kind === 2 || kind === 3 ? `width:${s}rem;height:${s}rem;background:${rnd(cols)}` : `--s:${s}rem`);
    if (kind === 0) d.textContent = rnd(['؟', '?']); if (kind === 1) d.textContent = '✦'; if (kind === 4) d.textContent = rnd(['⭐', '🍀', '⚡', '🎲', '💎', '🎁', '🚪', '🧠']); bg.appendChild(d);
  }
})();
applySound();
showScreen('welcome');

</script>
</body>
</html>
