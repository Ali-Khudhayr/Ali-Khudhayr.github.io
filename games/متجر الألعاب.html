<style>
/* ===== متجر الألعاب · نظام التصميم 2.0 (رموز موحدة) ===== */
:root{
  --bg:#100B2D;--bg2:#1C1245;--card:#302064;--card2:#251856;
  --violet:#7547E8;--violet2:#5b33c9;--gold:#FFC928;--gold2:#FFAC24;--blue:#36B8FF;--pink:#EC56D8;
  --ink:#FFFFFF;--mute:#C9C3E5;--dim:#9d94c8;--line:rgba(201,195,229,.16);--line2:rgba(201,195,229,.28);
  --on-gold:#1d1140;
  --r-xs:10px;--r-sm:14px;--r:20px;--r-lg:28px;--pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --sh-card:0 14px 30px -12px rgba(5,2,25,.75),0 2px 0 rgba(255,255,255,.04) inset;
  --sh-lift:0 22px 40px -14px rgba(5,2,25,.85);
  --glow-v:0 0 0 1px rgba(117,71,232,.55),0 0 26px rgba(117,71,232,.45);
  --glow-g:0 0 22px rgba(255,201,40,.45);
  --t-fast:150ms;--t:220ms;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.5,.5,1);
  --disp:Tajawal,"IBM Plex Sans Arabic","Segoe UI",sans-serif;--body:"IBM Plex Sans Arabic",Tajawal,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-color:var(--violet) var(--bg);overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font:500 1rem/1.65 var(--body);overflow-x:clip;
  background:
    radial-gradient(60rem 34rem at 85% -8%,rgba(117,71,232,.42),transparent 62%),
    radial-gradient(40rem 26rem at 2% 18%,rgba(236,86,216,.16),transparent 60%),
    radial-gradient(46rem 30rem at 100% 70%,rgba(54,184,255,.10),transparent 62%),
    var(--bg);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 88% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 38%,#d8cfff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 6% 64%,#ffe9a8 50%,transparent 51%),radial-gradient(1px 1px at 95% 82%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 40% 8%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 92%,#d8cfff 50%,transparent 51%)}
body>*{position:relative;z-index:1}
::selection{background:var(--gold);color:var(--on-gold)}
::-webkit-scrollbar{width:12px;height:8px}::-webkit-scrollbar-thumb{background:var(--violet);border-radius:99px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:var(--bg)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:var(--r-xs)}
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
h1,h2,h3{font-family:var(--disp);font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
.wrap{width:min(84rem,100%);margin-inline:auto;padding-inline:clamp(1rem,3vw,2rem)}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ===== الأزرار ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:2.75rem;border:1px solid var(--line2);border-radius:var(--pill);padding:.5em 1.15em;font-weight:700;font-size:.98rem;text-decoration:none;cursor:pointer;background:var(--bg2);color:var(--ink);transition:transform var(--t-fast) var(--ease),box-shadow var(--t) var(--ease),background var(--t) var(--ease)}
.btn:hover{background:var(--card);box-shadow:var(--glow-v)}
.btn:active{transform:scale(.96)}
.btn.gold,.btn.sun{background:linear-gradient(180deg,#ffd955,var(--gold) 45%,var(--gold2));color:var(--on-gold);border-color:transparent;font-weight:800;box-shadow:0 6px 18px -6px rgba(255,172,36,.7),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.gold:hover,.btn.sun:hover{box-shadow:var(--glow-g),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.grape{background:var(--violet);border-color:transparent}
.btn.big{font-family:var(--disp);font-weight:800;font-size:clamp(1.1rem,2vw,1.35rem);min-height:3.3rem;padding:.4em 1.5em}
.btn.on{background:var(--pink);border-color:transparent;color:#fff}
.ibtn{display:inline-grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);cursor:pointer;text-decoration:none;transition:box-shadow var(--t),background var(--t)}
.ibtn:hover{background:var(--card);box-shadow:var(--glow-v)}

/* ===== الترويسة والتبويبات ===== */
.bar{position:sticky;top:0;z-index:30;background:rgba(16,11,45,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:var(--s3);min-height:4.25rem;padding-block:var(--s2)}
.brand{display:flex;align-items:center;gap:var(--s2);text-decoration:none;font-family:var(--disp);font-weight:800;font-size:1.35rem;white-space:nowrap}
.brand svg{width:2.4rem;height:2.4rem;filter:drop-shadow(0 0 10px rgba(255,201,40,.45))}
.brand b{color:var(--gold);font-weight:800}
nav.tabs{display:flex;gap:var(--s1);margin-inline:auto;background:var(--bg2);border:1px solid var(--line);border-radius:var(--pill);padding:5px}
nav.tabs a{display:inline-flex;align-items:center;gap:var(--s2);text-decoration:none;min-height:2.6rem;padding:0 1.25em;border-radius:var(--pill);font-weight:700;font-size:1rem;color:var(--mute);transition:background var(--t) var(--ease),color var(--t)}
nav.tabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs a.on{background:linear-gradient(180deg,#ffd955,var(--gold) 45%,var(--gold2));color:var(--on-gold);font-weight:800;box-shadow:0 6px 16px -6px rgba(255,172,36,.7)}
nav.tabs .n{background:var(--pink);color:#fff;border-radius:var(--pill);font-size:.75rem;padding:0 .5em;line-height:1.5;font-weight:800}
nav.tabs a.on .n{background:var(--on-gold);color:var(--gold)}
.bar .tools{display:flex;gap:var(--s2)}
@media (max-width:820px){
  .bar .wrap{flex-wrap:wrap;gap:var(--s2)}
  .brand{font-size:1.15rem}.brand svg{width:2rem;height:2rem}
  .bar .tools{margin-inline-start:auto}
  nav.tabs{order:3;width:100%;margin:0}
  nav.tabs a{flex:1;justify-content:center;padding:0 .6em;font-size:.95rem}
}

/* ===== رأس المتجر ===== */
.hero{position:relative;overflow:hidden;padding-block:clamp(1.6rem,5vh,3.2rem) clamp(1.2rem,3vh,2rem);text-align:center}
.hero .deco{position:absolute;top:50%;width:clamp(5rem,11vw,9rem);transform:translateY(-58%);opacity:.95;pointer-events:none}
.hero .deco.l{left:max(1rem,calc(50% - 38rem))}.hero .deco.r{right:max(1rem,calc(50% - 38rem))}
.hero .deco svg{width:100%;height:auto;display:block}
.hero .deco.l svg{animation:bob 5s ease-in-out infinite}.hero .deco.r svg{animation:bob 5s 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@media (max-width:900px){.hero .deco{display:none}}
.hero h1{font-size:clamp(2rem,4.6vw,2.6rem);display:inline-flex;align-items:center;gap:var(--s3);color:var(--gold);text-shadow:0 0 28px rgba(255,201,40,.35)}
.hero h1 svg{width:1.25em;height:1.25em;filter:drop-shadow(0 0 12px rgba(255,201,40,.5))}
.hero h1 span{color:#fff}
.hero .sub{margin:.35rem auto 1.3rem;max-width:44ch;font-size:clamp(1rem,1.5vw,1.12rem);color:var(--mute)}
.sbox{display:flex;align-items:center;gap:var(--s2);max-width:46rem;margin-inline:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--pill);padding:5px 5px 5px 5px;padding-inline-start:1.1rem;box-shadow:0 18px 36px -18px rgba(0,0,0,.8);transition:box-shadow var(--t),border-color var(--t)}
.sbox:focus-within{border-color:var(--violet);box-shadow:var(--glow-v)}
.sbox>.ic{width:1.35rem;height:1.35rem;color:var(--mute)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:0;padding:.7rem 0;font-weight:600;font-size:clamp(.98rem,1.4vw,1.08rem);color:#fff}
.sbox input::placeholder{color:var(--dim)}
.sbox .btn{flex:none}
.chip-ex{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);margin-top:var(--s4)}

/* ===== بطاقة اللعبة ===== */
.gc{--c:#7547E8;position:relative;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,rgba(48,32,100,.96),rgba(37,24,86,.96));border:1px solid var(--line2);border-radius:var(--r);padding:10px;box-shadow:var(--sh-card);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t);animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}

  background:linear-gradient(110deg,transparent 34%,rgba(255,255,255,.42) 47%,rgba(255,236,190,.16) 53%,transparent 64%);background-size:260% 100%;background-position:130% 0}

@media (hover:hover) and (pointer:fine){
  .gc:hover{transform:perspective(900px) translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
  .gc:hover .cv img{transform:scale(1.08) translate(var(--px,0px),var(--py,0px))}
}
/* غلاف صفحة اللعبة: حركة هادئة مستمرة (عنصر واحد فقط) */
.pd-cover{position:relative;isolation:isolate}
.pd-cover img{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.07) translate(-1.2%,-1%)}}
.pd-cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.35) 48%,transparent 60%);background-size:260% 100%;background-position:130% 0;animation:sheen2 7s ease-in-out 1.2s infinite}
@keyframes sheen2{0%,72%{background-position:130% 0}100%{background-position:-30% 0}}

/* رأس المتجر: غيوم ونجوم وقطع 2.5D على الطرفين */
.hero .wrap{position:relative;z-index:1}
.hero .clouds{position:absolute;inset-inline:0;bottom:-1px;height:clamp(80px,11vw,170px);pointer-events:none;z-index:0}
.hero .clouds svg{width:100%;height:100%;display:block}
@media (max-width:700px){.hero .clouds{height:auto}.hero .clouds svg{height:auto;aspect-ratio:1440/170}}
.hero .deco{width:clamp(6rem,13vw,11rem)}
.hero .deco img{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 22px rgba(5,2,25,.6))}
.hero .deco.l>*{animation:bob 5s ease-in-out infinite}.hero .deco.r>*{animation:bob 5s 1.2s ease-in-out infinite}
.hero .deco.l svg,.hero .deco.r svg{animation:none}
.hero .deco .pf,.land .lp .pf{display:block}
.hero .st{position:absolute;width:var(--z,16px);height:var(--z,16px);fill:var(--sc,#FFC928);filter:drop-shadow(0 0 8px rgba(255,201,40,.8));animation:tw 3.4s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@media (max-width:900px){.hero .st{display:none}}
/* أمثلة البحث تظهر لما تضغط على البحث فقط (أقل زحمة) */
.hero .chip-ex{max-height:0;opacity:0;overflow:hidden;margin-top:0;transition:max-height var(--t) var(--ease),opacity var(--t),margin var(--t)}
.hero .wrap:focus-within .chip-ex{max-height:6rem;opacity:1;margin-top:var(--s4);overflow:visible}
@media (max-width:560px){.hero .wrap:focus-within .chip-ex{overflow-x:auto}}

/* الفلاتر في صف واحد */
.filters .chips{row-gap:var(--s2)}
.filters select.chip{field-sizing:content;min-width:0}
.filters .chip{padding-inline:.9em}.filters select.chip{padding-inline-end:2em}
.chip.typex{background:var(--violet);color:#fff;border-color:transparent}

/* الأرضية أسفل الصفحة: عشب وصخور وكنز وجوهرة */
footer.ft{position:relative;padding:0;border-top:0;background:#0b0820}
footer.ft .wrap{position:relative;z-index:1;padding-block:.2rem 1.4rem}
.land{position:relative;height:clamp(120px,15vw,220px);overflow:hidden;pointer-events:none;margin-top:var(--s5)}
.land>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.land::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,#0b0820)}
.land .lp{position:absolute;z-index:1;bottom:16%;width:clamp(6rem,12vw,10rem)}
.land .lp::before{content:"";position:absolute;inset:-25% -20% -10%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,var(--gw,rgba(255,201,40,.42)),transparent)}
.land .lp.chest{left:max(.6rem,calc(50% - 41rem))}
.land .lp.gem{right:max(.6rem,calc(50% - 41rem));width:clamp(4.6rem,9vw,7.8rem);--gw:rgba(54,184,255,.4)}
.land .lp img,.land .lp svg{width:100%;height:auto;display:block}
@media print{.land,.hero .clouds{display:none}}
/* store-titled v1 */
.gc .top.tt{align-items:center}
.gc .top.tt .tg{flex:1;min-width:0;margin:0;min-height:0;font-size:.98rem;color:#ece8fb}
.gc h3.vh{flex:none;width:0;height:0;margin:0;font-size:0;line-height:0;overflow:visible}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{.bar,.filters,.hero,footer,.plan-ctl button,.pl .ctl button,#planBtns{display:none!important}body{background:#fff;color:#000}body::before{display:none}.pl li{background:#fff;border:1px solid #999;break-inside:avoid;color:#000}.pl .t{color:#000}.page{padding:0}}

document.addEventListener('change', e => {
  const t = e.target, id = t.id;
  if (id === 'fSec') state.sec = t.value; else if (id === 'fDev') { state.flags.delete('noscreen'); state.flags.delete('noprint'); if (t.value === 'noscreen' || t.value === 'both') state.flags.add('noscreen'); if (t.value === 'noprint' || t.value === 'both') state.flags.add('noprint'); } else if (id === 'fTeams') state.teams = +t.value; else if (id === 'fTime') state.time = +t.value; else if (id === 'fAge') state.age = t.value; else if (id === 'fType') state.type = t.value; else if (id === 'fSort') state.sort = t.value;
  else if (id === 'pStart') { planCfg.start = t.value || '16:00'; Mem.set('store.planCfg', planCfg); return viewPlan(); } else if (id === 'pGap') { planCfg.gap = Math.max(0, +t.value || 0); Mem.set('store.planCfg', planCfg); return viewPlan(); }
  else if (t.dataset.pmin != null) { plan[+t.dataset.pmin].min = Math.max(1, +t.value || 1); savePlan(); return viewPlan(); } else return;
  if (id !== 'fSort') t.classList.toggle('on', t.value !== '' && t.value !== '0');
  paintResults();
});
function rerender() { const h = location.hash || '#/'; if (h === '#/fav') viewFav(); else if (/^#\/game/.test(h)) { const y = scrollY; route(); scrollTo(0, y); } else if (h === '#/plan') viewPlan(); else paintResults(); }
addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { const q = $('#q'); if (q) { e.preventDefault(); q.focus(); } else location.hash = '#/'; } if ($('#lb').open && e.key === 'ArrowLeft') openLb((lbI + 1) % lbList.length); if ($('#lb').open && e.key === 'ArrowRight') openLb((lbI - 1 + lbList.length) % lbList.length); });
/* ---------- اقترح لي: ثلاثة أسئلة ثم أنسب ثلاث ألعاب ---------- */
const WZ = Object.assign({ age: '', time: 0, teams: 0 }, Mem.get('store.wiz', {}));
const WQ = { age: ['ابتدائي', 'متوسط', 'ثانوي', 'جامعي', 'كبار'].map(a => [a, a]), time: [10, 15, 20, 30, 45, 60].map(n => [n, n + ' دقيقة']), teams: [2, 3, 4, 5, 6].map(n => [n, n + ' فرق']) };
function paintWiz() {
  $$('[data-wq]').forEach(box => { const k = box.dataset.wq; box.innerHTML = WQ[k].map(([v, t]) => `<button class="chip${WZ[k] === v ? ' on' : ''}" data-wv="${k}:${v}" aria-pressed="${WZ[k] === v}">${t}</button>`).join(''); });
  const res = $('#wizRes');
  if (!WZ.age && !WZ.time && !WZ.teams) { res.innerHTML = `<p style="margin:0;color:var(--mute)">اختر الفئة والوقت وعدد الفرق، ونطلع لك أنسب ثلاث ألعاب.</p>`; return; }
  const L = search('', { age: WZ.age, time: WZ.time, teams: WZ.teams, flags: [], sort: 'best' }).list.filter(p => p.file && /\.html?$/i.test(p.file)).sort((a, b) => (b.excitement || 0) - (a.excitement || 0) || (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0)).reduce((acc, p, _, all) => { if (acc.length < 3 && !acc.some(x => x.section === p.section)) acc.push(p); if (p === all[all.length - 1]) for (const q of all) if (acc.length < 3 && !acc.includes(q)) acc.push(q); return acc; }, []);
  if (!L.length) { res.innerHTML = `<p style="margin:0;color:var(--mute)">ما فيه لعبة تجمع الشروط الثلاثة. جرّب وقتاً أطول أو عدد فرق مختلف.</p>`; return; }
  const why = p => [WZ.age && 'تناسب ' + WZ.age, minsTxt(p) && minsTxt(p).replace('د', 'دقيقة'), teamsTxt(p)].filter(Boolean).join(' · ');
  res.innerHTML = L.map((p, i) => `<a class="ri" href="#/game/${p.id}"><img src="${cov(p)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sq'}))"><div><h3>${esc(p.name)}</h3><p>${esc(p.tagline)}</p><p>${esc(why(p))}</p></div><span class="rank">${i + 1}</span></a>`).join('');
}
function openWiz() { paintWiz(); const d = $('#wiz'); if (!d.open) d.showModal(); }
$('#wizBtn').addEventListener('click', openWiz);
$('#wizX').addEventListener('click', () => $('#wiz').close());
$('#wiz').addEventListener('click', e => { if (e.target === $('#wiz')) return $('#wiz').close(); const b = e.target.closest('[data-wv]'); if (!b) { if (e.target.closest('.ri')) $('#wiz').close(); return; } const [k, v] = b.dataset.wv.split(':'); const val = k === 'age' ? v : +v; WZ[k] = WZ[k] === val ? (k === 'age' ? '' : 0) : val; Mem.set('store.wiz', WZ); paintWiz(); });
paintCounts(); route();

/* ---------- الأرضية أسفل الصفحة ---------- */
$('footer.ft').insertAdjacentHTML('afterbegin', `<div class="land" aria-hidden="true">${LAND}<span class="lp chest">${prop('chest', DECO_CHEST)}</span><span class="lp gem">${prop('gem', DECO_GEM)}</span></div>`);
/* ---------- الصور الحية: إمالة مع الماوس، ولمعة مرة وحدة لما تظهر البطاقة على الجوال ---------- */
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let cur = null, ev = null, raf = 0;
    const KEYS = ['--rx', '--ry', '--px', '--py'];
    const apply = () => { raf = 0; if (!cur || !ev) return; const r = cur.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width - .5, y = (ev.clientY - r.top) / r.height - .5;
      cur.style.setProperty('--rx', (-y * 7).toFixed(2) + 'deg'); cur.style.setProperty('--ry', (x * 9).toFixed(2) + 'deg'); cur.style.setProperty('--px', (-x * 10).toFixed(1) + 'px'); cur.style.setProperty('--py', (-y * 10).toFixed(1) + 'px'); };
    document.addEventListener('pointerover', e => { const c = e.target.closest ? e.target.closest('.gc') : null; if (c !== cur) { if (cur) KEYS.forEach(k => cur.style.removeProperty(k)); cur = c; } });
    document.addEventListener('pointermove', e => { if (!cur) return; ev = e; if (!raf) raf = requestAnimationFrame(apply); }, { passive: true });
  } else if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return; const c = en.target; io.unobserve(c); c.classList.add('shine'); setTimeout(() => c.classList.remove('shine'), 1800); }), { threshold: .6 });
    const watch = () => $$('.gc:not([data-io])').forEach(c => { c.dataset.io = 1; io.observe(c); });
    new MutationObserver(watch).observe($('#app'), { childList: true, subtree: true }); watch();
  }
})();
</script>
