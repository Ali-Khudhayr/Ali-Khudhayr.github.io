body[data-th="emoji"]{--ink:#0f3557;--mut:#3b6a90;--acc:#ff7a1a;--acc2:#c95400;--plate:#fff;--plate2:#ffeb94;--plate-edge:#1fa3ff;--plate-ink:#0f3557}
body[data-th="kardees"]{--ink:#3a2410;--mut:#7a5a30;--acc:#7c4dff;--acc2:#4a26c2;--plate:#fff6dc;--plate2:#f0d9a0;--plate-edge:#a0522d;--plate-ink:#5a3410}
body[data-th="hunt"]{--ink:#4a3410;--mut:#86652a;--acc:#f4762a;--acc2:#b54a10;--plate:#fff7ec;--plate2:#ffd6a5;--plate-edge:#cf7a2a;--plate-ink:#5a3410}
body[data-th="lanes"]{--ink:#1f2937;--mut:#5b6575;--acc:#2f80ed;--acc2:#1a56b0;--plate:#fff;--plate2:#e3efff;--plate-edge:#2f80ed;--plate-ink:#1f2937}
body[data-th="dive"]{--ink:#0b3a55;--mut:#2f6d8a;--acc:#00a3c4;--acc2:#00708a;--plate:#f3fcff;--plate2:#bdf0ff;--plate-edge:#00a3c4;--plate-ink:#0b3a55}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#fff7e6;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.on{display:flex}
/* المشهد */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
body.gold #scene::after{background:radial-gradient(ellipse at 50% 50%,rgba(255,236,140,.35),rgba(255,196,0,.28) 70%);animation:goldpulse 3s ease-in-out infinite}
@keyframes goldpulse{50%{opacity:.6}}
.sc-drift{animation:sc-drift var(--d,40s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes sc-drift{from{transform:translateX(-140px)}50%{transform:translateX(140px)}to{transform:translateX(-140px)}}
.sc-spin{animation:sc-spin var(--d,90s) linear infinite}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.sc-bob{animation:sc-bob var(--d,5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes sc-bob{50%{transform:translateY(-14px)}}
.sc-fly{animation:sc-fly var(--d,16s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes sc-fly{0%{transform:translate(0,0)}25%{transform:translate(160px,-50px)}50%{transform:translate(280px,30px)}75%{transform:translate(120px,70px)}100%{transform:translate(0,0)}}
.sc-sway{animation:sc-sway var(--d,7s) ease-in-out infinite alternate}
@keyframes sc-sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.sc-sway2{animation:sc-sway2 4s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes sc-sway2{to{transform:skewX(3deg)}}
.sc-wave{animation:sc-wave 6s linear infinite}
@keyframes sc-wave{to{transform:translateX(-160px)}}
.sc-fall{animation:sc-fall var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes sc-fall{to{transform:translateY(960px) rotate(540deg)}}
.sc-rise{animation:sc-rise var(--d,7s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes sc-rise{to{transform:translateY(-820px)}}
.sc-swim{animation:sc-swim var(--d,26s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes sc-swim{from{transform:translateX(1700px)}to{transform:translateX(-400px)}}
.sc-blink{animation:sc-blink 1.5s steps(2) infinite;animation-delay:var(--dl,0s)}
@keyframes sc-blink{50%{opacity:.35}}
.sc-road{animation:sc-road var(--d,2s) linear infinite}
@keyframes sc-road{to{transform:translateY(90px)}}
.sc-flag{animation:sc-flag 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes sc-flag{to{transform:scaleX(.8) skewY(4deg)}}

kbd{font:800 .7em var(--body);background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.14);border-radius:.35em;padding:.05em .45em;margin-inline-start:.45em}
.btn{border:0;border-radius:1rem;padding:.6em 1.15em;cursor:pointer;background:#fff;color:var(--ink);font-weight:800;font-size:1rem;display:inline-flex;align-items:center;gap:.4em;box-shadow:0 .3rem 0 color-mix(in srgb,var(--acc) 35%,#d9c9a0),0 .6rem 1rem rgba(60,40,0,.16);transition:transform .12s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 .05rem 0 var(--line)}
.btn:focus-visible,.ib:focus-visible,.tile:focus-visible,.th-card:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn.acc{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));color:var(--acc-ink);box-shadow:0 .3rem 0 var(--acc2),0 .7rem 1.4rem color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.good{background:linear-gradient(180deg,#3ad48a,#18b26b);color:#fff;box-shadow:0 .3rem 0 #0e7a49}
.btn.bad{background:linear-gradient(180deg,#ff7474,#ef4b4b);color:#fff;box-shadow:0 .3rem 0 #b22a2a}
.btn.gold{background:linear-gradient(180deg,#fff3b0,#ffd23f);color:#6b4400;box-shadow:0 .3rem 0 #c79a00,0 .6rem 1.2rem rgba(255,190,0,.35)}
.btn.ghost{background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 1.5px var(--line),0 .4rem .8rem rgba(0,0,0,.08)}
.btn.big{font-size:clamp(1.1rem,2.8vh,1.55rem);padding:.6em 1.4em}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:#fff;box-shadow:0 .25rem 0 color-mix(in srgb,var(--acc) 30%,#d9c9a0),var(--shadow);cursor:pointer;font-size:1.15rem;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib.off{opacity:.5}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{padding:.4em 1em;border-radius:99px;background:#fff;border:0;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-weight:800}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.hint{color:var(--mut);font-weight:700;font-size:.95rem}
.fld{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:.7rem;padding:.4em .6em;font-weight:700;-webkit-user-select:text;user-select:text}
.plate{background:linear-gradient(180deg,var(--plate),var(--plate2));border:3px solid var(--plate-edge);border-radius:1.2rem;box-shadow:0 .35rem 0 color-mix(in srgb,var(--plate-edge) 75%,#000),0 .8rem 1.4rem rgba(60,40,0,.22);color:var(--plate-ink)}

/* البداية */
#home{align-items:center;padding:1.2rem 2rem;gap:2.2vh;overflow:auto}
.h-corner{position:absolute;top:1rem;inset-inline-start:1rem;display:flex;gap:.5rem;z-index:2}
.h-title{text-align:center;margin-top:auto}
.h-title h1{font-family:var(--disp);font-weight:400;font-size:clamp(3.2rem,11vh,6.6rem);line-height:1.05;margin:0 0 .2rem;background:linear-gradient(90deg,#ff3d7f,#ff9f1c,#7c4dff,#1fa3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .3rem 0 #fff) drop-shadow(0 .6rem .8rem rgba(120,40,120,.25))}
.h-title p{margin:0;color:#6d4a8a;font-weight:800;font-size:clamp(1rem,2.4vh,1.35rem);background:rgba(255,255,255,.7);display:inline-block;padding:.2rem 1rem;border-radius:99px}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;width:min(78rem,100%)}
.th-card{--c:#444;position:relative;border:0;border-radius:1.5rem;padding:1rem 1.1rem;text-align:start;cursor:pointer;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 65%,#fff 35%),var(--c));display:flex;flex-direction:column;gap:.15rem;min-height:clamp(8.5rem,19vh,11rem);box-shadow:0 .45rem 0 color-mix(in srgb,var(--c) 60%,#000 40%),0 1rem 2rem color-mix(in srgb,var(--c) 30%,transparent);transition:transform .18s;animation:rise .5s both;animation-delay:calc(var(--i)*60ms);overflow:hidden}
.th-card::after{content:"";position:absolute;width:9rem;height:9rem;border-radius:50%;background:rgba(255,255,255,.16);inset-inline-start:-2.5rem;bottom:-3.5rem}
.th-card:hover{transform:translateY(-6px) rotate(-.6deg)}
.th-card .ic{position:absolute;top:.7rem;inset-inline-start:.8rem;width:clamp(3.6rem,8.5vh,5rem);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 .3rem .6rem rgba(0,0,0,.25);background:#fff;display:grid;place-items:center;font-size:2.4rem;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}
.th-card .ic img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-.35rem) rotate(4deg)}}
.th-card b{font-family:var(--disp);font-weight:400;font-size:clamp(1.45rem,3.3vh,2rem);line-height:1.15;margin-top:auto;text-shadow:0 .15rem 0 rgba(0,0,0,.18);position:relative;z-index:1}
.th-card span.s{font-weight:800;font-size:.92rem;opacity:.95;line-height:1.45;position:relative;z-index:1}
.th-card .n{position:absolute;top:.8rem;inset-inline-end:.9rem;font-weight:800;font-size:.8rem;background:rgba(255,255,255,.25);border-radius:99px;padding:.1rem .6rem}
.th-card .new{position:absolute;top:2.4rem;inset-inline-end:.9rem;font-weight:800;font-size:.8rem;background:#ffd23f;color:#5a3b00;border-radius:99px;padding:.05rem .6rem;transform:rotate(-6deg)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.h-foot{margin-bottom:auto;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}

/* الإعداد */
#setup{align-items:center;overflow:auto;padding:1rem 1.5rem}
.setup{width:min(56rem,100%);display:flex;flex-direction:column;gap:.9rem;margin:auto 0}
.setup h2{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,6vh,3.2rem);margin:0 auto;text-align:center;padding:.15rem 1.4rem 0;display:flex;align-items:center;gap:.6rem}
.setup h2 img{width:3.2rem;height:3.2rem;border-radius:50%;object-fit:cover;border:3px solid #fff}
.card{background:rgba(255,255,255,.92);border-radius:1.4rem;padding:1rem 1.2rem;box-shadow:var(--shadow)}
.trows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem .9rem;margin-top:.6rem}
.trow{display:flex;gap:.5rem;align-items:center}
.trow .embb{width:3.4rem;height:3.4rem;border:0;padding:0;background:none;cursor:pointer;flex:none;filter:drop-shadow(0 .2rem .3rem rgba(0,0,0,.25));transition:transform .15s}
.trow .embb:hover{transform:scale(1.1) rotate(-4deg)}
.trow .embb img{width:100%;height:100%}
.trow input{flex:1;min-width:0;border-color:color-mix(in srgb,var(--tc) 45%,#ddd);border-width:2px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.55rem;margin-top:.6rem}
.mod{display:flex;gap:.6rem;align-items:flex-start;text-align:start;border:0;border-radius:1rem;padding:.6rem .8rem;cursor:pointer;background:#f4f1ea;box-shadow:inset 0 0 0 2px var(--line);font-weight:700}
.mod .mi{font-size:1.6rem;line-height:1}
.mod b{display:block;font-size:1.02rem}
.mod small{display:block;color:var(--mut);font-weight:700;font-size:.82rem;line-height:1.5}
.mod .sw{margin-inline-start:auto;flex:none;width:2.6rem;height:1.5rem;border-radius:99px;background:#cfcfd8;position:relative;transition:.2s}
.mod .sw::after{content:"";position:absolute;top:.15rem;inset-inline-start:.15rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.3)}
.mod.on{background:color-mix(in srgb,var(--acc) 12%,#fff);box-shadow:inset 0 0 0 2px var(--acc)}
.mod.on .sw{background:var(--acc)}.mod.on .sw::after{inset-inline-start:1.25rem}
.mod.na{opacity:.45;cursor:default}

/* اللعب */
.top{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem 0}
.top .ttl{display:flex;align-items:center;gap:.55rem;padding:.15rem 1.1rem .05rem .5rem;min-width:0}
.top .ttl img{width:2.7rem;height:2.7rem;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 .15rem .3rem rgba(0,0,0,.2)}
.top .ttl b{font-family:var(--disp);font-weight:400;font-size:clamp(1.4rem,3.8vh,2.1rem);line-height:1.15;white-space:nowrap}
.top .ttl small{display:block;font-weight:800;font-size:.8rem;opacity:.8;white-space:nowrap;margin-top:-.15rem}
.top .sp{flex:1}
.goldtag{font-family:var(--disp);font-size:1.3rem;color:#6b4400;background:linear-gradient(180deg,#fff3b0,#ffd23f);border-radius:99px;padding:.15rem 1rem 0;box-shadow:0 0 0 3px #fff,0 0 1.2rem #ffd23f;animation:bob 2s ease-in-out infinite}
.teams{display:flex;gap:.6rem;justify-content:center;padding:.55rem 1rem .1rem}
.tm{--tc:#888;flex:1 1 0;max-width:18rem;min-width:0;display:flex;align-items:center;gap:.5rem;padding:.35rem .45rem .35rem .8rem;border-radius:1.3rem;background:rgba(255,255,255,.95);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--tc) 38%,transparent),0 .5rem 1.2rem rgba(60,40,0,.18);cursor:pointer;transition:transform .25s,box-shadow .25s;position:relative}
.tm.act{box-shadow:inset 0 0 0 4px var(--tc),0 0 0 .32rem color-mix(in srgb,var(--tc) 30%,transparent),0 .8rem 1.6rem rgba(60,40,0,.25);transform:translateY(-3px) scale(1.04);z-index:2}
.tm.act::after{content:"الدور";position:absolute;top:-.8rem;inset-inline-start:1rem;background:var(--tc);color:#fff;font-weight:800;font-size:.78rem;border-radius:99px;padding:.05rem .6rem;animation:bob 1.6s ease-in-out infinite}
.tm .emb{width:clamp(2.6rem,6.4vh,3.6rem);aspect-ratio:1;flex:none;filter:drop-shadow(0 .15rem .2rem rgba(0,0,0,.25))}
.tm .mid{min-width:0;flex:1}
.tm .nm{font-weight:800;font-size:clamp(.85rem,2vh,1.05rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tm .sub{display:flex;gap:.2rem;align-items:center;margin-top:.15rem;flex-wrap:nowrap;overflow:hidden}
.pc{border:0;padding:0;font-size:.85rem;width:1.55rem;height:2rem;border-radius:.35rem;display:grid;place-items:center;background:linear-gradient(160deg,#fff,#ffeec2);box-shadow:inset 0 0 0 1.5px #d9a43a,0 .15rem 0 #c08a20;cursor:pointer;transition:transform .15s}
.pc:hover{transform:translateY(-3px) rotate(-6deg)}
.pc.used{opacity:.25;filter:grayscale(1);cursor:default;transform:none}
.badge{font-size:.78rem;font-weight:800;border-radius:99px;padding:0 .4rem;line-height:1.5;white-space:nowrap}
.badge.fire{background:#ff5a1f;color:#fff}.badge.skip{background:#dff3ff;color:#1a6fb0}.badge.held{background:#fff3c8}.badge.perk{background:#7c4dff;color:#fff}
.tm .sc{font-family:var(--disp);font-size:clamp(1.6rem,4.6vh,2.6rem);line-height:1;color:var(--tc);text-align:center;min-width:2ch;margin-inline-start:auto}
.tm .u{display:none}
.tm .adj{position:absolute;inset-inline-end:-.5rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .2s;z-index:3}
.tm:hover .adj,.tm:focus-within .adj{opacity:1}
.tm .adj button{width:1.5rem;height:1.3rem;box-shadow:0 .1rem .3rem rgba(0,0,0,.25);border:0;border-radius:.4rem;background:color-mix(in srgb,var(--tc) 15%,#fff);cursor:pointer;font-weight:800;font-size:.8rem;line-height:1}
.tm.bump .sc{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.6) rotate(-6deg)}}
.tm.hurt{animation:hurt .5s}
@keyframes hurt{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tm .pot{position:absolute;bottom:-1rem;inset-inline-end:.8rem;background:linear-gradient(180deg,#fff3b0,#ffd23f);color:#6b4400;font-weight:800;font-size:.85rem;border-radius:99px;padding:.05rem .6rem;box-shadow:0 .2rem .4rem rgba(0,0,0,.2);animation:bob 1.4s ease-in-out infinite;white-space:nowrap}
.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.6rem 1rem .4rem;position:relative}
.bar{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:.2rem 1rem .8rem;align-items:center}
.bar .info{background:rgba(255,255,255,.85);border-radius:99px;padding:.3rem .9rem;font-weight:800;color:var(--mut);font-size:.92rem}
.banner{background:linear-gradient(90deg,#7c4dff,#b06bff);color:#fff;font-weight:800;border-radius:99px;padding:.35rem 1rem;box-shadow:0 .3rem .8rem rgba(124,77,255,.4);animation:bob 2s ease-in-out infinite;display:flex;gap:.5rem;align-items:center}
.banner button{border:0;border-radius:99px;background:rgba(255,255,255,.25);color:#fff;font-weight:800;padding:.1rem .7rem;cursor:pointer}
#numbuf{font-family:var(--disp);font-size:1.8rem;color:var(--acc);min-width:2ch;text-align:center}

/* الخانات: الشكل الأساسي */
.board{display:grid;gap:var(--gap,9px);width:var(--bw);direction:rtl;perspective:900px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:22%;cursor:pointer;display:grid;place-items:center;font-family:var(--disp);font-size:calc(var(--ts)*.4);color:#5a2e00;transition:transform .15s,filter .15s;background:linear-gradient(180deg,#ffd84a,#f08c00);box-shadow:0 calc(var(--ts)*.07) 0 rgba(0,0,0,.25),0 calc(var(--ts)*.12) calc(var(--ts)*.2) rgba(0,0,0,.15)}
.tile .num{position:relative;z-index:1;line-height:1;padding-top:.08em}
.enter .tile:not(.open){animation:pop-in .45s both;animation-delay:calc(var(--k,0)*12ms)}
@keyframes pop-in{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.tile:hover:not(.open){transform:translateY(-4px) scale(1.07) rotate(-2deg);filter:brightness(1.07)}
.tile.open{cursor:default;background:#fff;box-shadow:0 0 0 calc(var(--ts)*.05) var(--oc,#ccc),0 calc(var(--ts)*.05) calc(var(--ts)*.12) rgba(0,0,0,.18);overflow:hidden}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;border-radius:inherit}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph img.obj{width:84%;height:84%;object-fit:contain}
.tile .ph .emo{font-size:calc(var(--ts)*.56);line-height:1;filter:var(--hue,none)}
.tile .tag{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:var(--oc,#555);color:#fff;font-family:var(--body);font-weight:800;font-size:calc(var(--ts)*.18);line-height:1.25;border-radius:99px;padding:0 .45em;white-space:nowrap;z-index:2;box-shadow:0 .1rem .2rem rgba(0,0,0,.3)}
.tile.peek{outline:calc(var(--ts)*.06) solid #7c4dff;outline-offset:2px;animation:peek 1s ease-in-out infinite}
@keyframes peek{50%{transform:scale(1.06)}}
.tile.sus{animation:sus .7s ease-in-out;z-index:5}
@keyframes sus{0%{transform:scale(1)}15%{transform:scale(1.18) rotate(-6deg)}30%{transform:scale(1.18) rotate(6deg)}45%{transform:scale(1.2) rotate(-5deg)}60%{transform:scale(1.22) rotate(5deg)}80%{transform:scale(1.25) rotate(-2deg);filter:brightness(1.3) drop-shadow(0 0 14px #fff)}100%{transform:scale(1.25);filter:brightness(1.4) drop-shadow(0 0 20px #fff)}}

/* الخلية: خلايا شمع */
.board.hex{gap:0;display:flex;flex-direction:column;align-items:center}
.board.hex .hr{display:flex;gap:calc(var(--ts)*.06);margin-top:calc(var(--ts)*-.22)}
.board.hex .hr:first-child{margin-top:0}
.board.hex .hr:nth-child(even){transform:translateX(calc(var(--ts)*-.53))}
.board.hex .tile{width:var(--ts);border-radius:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:none;aspect-ratio:.88;background:radial-gradient(circle at 50% 35%,#ffe58a 0,#ffc21f 45%,#e09400 75%,#b06c00 100%);color:#6b3a00;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.board.hex .tile::before{content:"";position:absolute;inset:6%;clip-path:inherit;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.6),transparent 55%)}
.board.hex .tile.open{background:var(--oc,#ffd36a)}
.board.hex .tile.open .ph{inset:5%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border-radius:0;background:#fff4cf}
.board.hex .tile.open .tag{bottom:9%}
/* الغابة: لوحات خشب */

.solo-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:clamp(1rem,3vw,3rem);width:min(82rem,100%);margin:auto 0}

/* العناوين بخط هوية اللعبة */

.tile .num{background:none!important;box-shadow:none!important;width:auto!important;aspect-ratio:auto!important;display:block;font-family:Lalezar,var(--disp);font-size:calc(var(--ts)*var(--numz,.44))!important;line-height:1;color:var(--num,#fff);-webkit-text-stroke:calc(var(--ts)*.05) var(--numink,#3a2000);paint-order:stroke fill;text-shadow:0 calc(var(--ts)*.028) 0 var(--numink,#3a2000);padding-top:.05em}

<section class="screen" id="game">
  <div class="top">

const SCN = (() => {

  const cloud = (x, y, s = 1, cls = 'sc-drift', d = 0) => `<g class="${cls}" style="--d:${40 + d}s;--dl:${-d * 3}s"><g transform="translate(${x} ${y}) scale(${s})" fill="#fff"><ellipse rx="80" ry="28"/><ellipse cx="-46" cy="10" rx="50" ry="24"/><ellipse cx="50" cy="8" rx="56" ry="26"/><ellipse cx="4" cy="-22" rx="46" ry="30"/><ellipse cx="0" cy="14" rx="96" ry="18" fill="#eaf6ff"/></g></g>`;

  const miniBee = (s = 1) => `<g transform="scale(${s})"><ellipse cx="-4" cy="-12" rx="12" ry="7" fill="#e6f5ff" opacity=".85" transform="rotate(-25)"/><ellipse cx="4" cy="-12" rx="10" ry="6" fill="#fff" opacity=".8" transform="rotate(20)"/><ellipse rx="15" ry="10" fill="#f5b000"/><path d="M-3-9v18M5-8v16" stroke="#2a1806" stroke-width="4"/><circle cx="-14" cy="0" r="7" fill="#2a1806"/></g>`;

    const fl = [...Array(30)].map((_, i) => flower(20 + i * 55 + (i % 3) * 12, 790 + (i % 4) * 22, .8 + (i % 3) * .3, ['#ff5f8f', '#fff', '#ffd23f', '#ff8a3d', '#c06bff'][i % 5])).join('');

  };

  S.forest = () => {
    const tree = (x, y, s, c1, c2) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-10 0 L-6 -160 L6 -160 L10 0Z" fill="#7a4a22"/><ellipse cy="-190" rx="90" ry="70" fill="${c1}"/><ellipse cx="-50" cy="-160" rx="60" ry="46" fill="${c2}"/><ellipse cx="55" cy="-165" rx="60" ry="48" fill="${c2}"/><ellipse cx="-20" cy="-225" rx="44" ry="30" fill="#fff" opacity=".12"/></g>`;

      // الضربة ترجع على اللي ضربها

};

/* --- فرصة المتأخر: يفتح خانتين ويختار وحدة، والثانية تنقفل وتتبدّل مع خانة مقفلة عشوائية --- */
function perkCheck() {
  G.dbl = null;
  if (!mod('catchup') || G.goldRound || G.queue || TH().design || TH().lanes || G.run) return;
  const t = cur(), mn = Math.min(...G.teams.filter(o => o !== t).map(o => o.score)), mx = Math.max(...G.teams.map(o => o.score));
  if (t.score < mn && mx - t.score >= (TH().gap || 0) && G.picks >= (t.perkAt || 0) && boardOf().filter(c => !c.open).length >= 3) G.dbl = { team: G.turn, first: null };
}
function perkPick(i) {
  const B = boardOf(); if (B[i].open) return;
  if (G.dbl.first == null) { G.dbl.first = i; Snd.flip(); renderBoard(); renderBar(); return; }
  if (G.dbl.first === i) return;
  const a = G.dbl.first, b = i; Snd.flip();
  const opt = j => { const c = B[j], v = c.v * (G.goldMul || 1); return `<button class="opt" data-act="perk-keep" data-i="${j}">${artBox(c, '#7c4dff')}<b style="font-family:var(--disp);font-size:1.6rem">${esc(c.n)}</b><span class="hint">${TYPES[c.t] || ''}${v && c.t !== 'none' ? ' ' + ar(v) : ''}</span></button>`; };
  const r = overlay(`<h3>🎯 اختاروا وحدة</h3><p>اللي ما تختارونها تنقفل وتتخبّى في مكان ثاني</p><div class="two">${opt(a)}${opt(b)}</div>`, 'reveal', false);
  r.style.borderColor = '#7c4dff'; G.dbl.second = b;
}
function perkKeep(j) {
  const B = boardOf(), d = G.dbl, k = j === d.first ? d.second : d.first;
  const pool = B.map((c, x) => x).filter(x => !B[x].open && x !== j && x !== k);
  if (pool.length) { const s = rnd(pool), keep = ['open', 'by']; const A = B[k], C = B[s]; const tmp = { ...A }; Object.keys(A).forEach(f => { if (!keep.includes(f)) A[f] = C[f]; }); Object.keys(tmp).forEach(f => { if (!keep.includes(f)) C[f] = tmp[f]; }); }
  cur().perkAt = G.picks + G.teams.length * 3; G.dbl = null; closeOverlay(); renderBoard(); openTile(j, true);

/* ==========================================================================
   10-ب) كراديس: شاشة تصميم لوحة كل فريق (قبل اللعب، أو أثناءها للخانات اللي ما انفتحت)
   ========================================================================== */
function kdRandom(T) {
  const n = KD.cells, budget = KD.budget || 1000, out = Array(n).fill('');
  const idx = shuffle([...Array(n).keys()]);
  const fine = 25 * (1 + Math.floor(Math.random() * 3));
  out[idx[0]] = 'ب'; out[idx[1]] = 'ح'; out[idx[2]] = 'غ' + fine; out[idx[3]] = '';   // بيدق، منع، غرامة، فراغ
  const nums = idx.slice(4), w = nums.map(() => .3 + Math.random() ** 2 * 3), sw = w.reduce((a, b) => a + b, 0);
  let left = budget - fine;
  nums.forEach((j, k) => { const v = k === nums.length - 1 ? left : Math.max(5, Math.round(w[k] / sw * (budget - fine) / 5) * 5); out[j] = String(Math.max(0, Math.min(v, left))); left -= +out[j]; });
  return out;
}

  if (inGame) G.boards.forEach((b, t) => { KD.boards[t] = codesOf(t); });
  const locked = (t, j) => inGame && G.boards[t][j] && G.boards[t][j].open;
  const d = overlay('', 'dlg', false);
  const stat = () => {
    const codes = codesOf(ti), spent = codes.reduce((s, r) => s + kdCost(kdParse(r, T)), 0), over = KD.budget && spent > KD.budget;
    const b = $('#kd-b', d); b.classList.toggle('over', !!over);
    b.textContent = KD.budget ? `الموزّع ${ar(spent)} من ${ar(KD.budget)}${over ? ' · زايد!' : spent < KD.budget ? ` · باقي ${ar(KD.budget - spent)}` : ' ✓'}` : `المجموع ${ar(spent)}`;
    return { bad: codes.some(r => kdParse(r, T).k === 'err'), over };
  };
  const paint = () => {
    const codes = codesOf(ti);
    d.innerHTML = `<h3>🎨 لوحة ${esc(T[ti].n)} <small class="hint">(${ar(ti + 1)} من ${ar(T.length)})</small></h3>
      <p class="hint" style="margin:0;line-height:1.8">${KD.mode === 'others' ? 'هاللوحة بتفتحها الفرق الثانية، فالفريق يوزّع نقاطه ويحط فخاخه.' : 'هاللوحة يفتحها الفريق نفسه.'} اكتب في كل خانة:</p>
      <div class="kd-legend"><span><code>٥٠</code> نقاط</span><span><code>غ٢٥</code> غرامة</span><span><code>ب</code> بيدق (ولا شي)</span><span><code>ح</code> امنعك تلعب</span><span><code>ح٢</code> امنع الفريق ٢</span><span><code>ف</code> افتح مربع من عندك</span><span><code>فاضي</code> فراغ</span></div>
      <div class="row" style="justify-content:space-between"><span class="kd-budget" id="kd-b"></span>
        <div class="row"><button class="btn ghost" data-kd="rand">🎲 وزّع عشوائي</button><button class="btn ghost" data-kd="clear">🧹 مسح</button><button class="btn ghost" data-kd="hide">${hide ? '👁 أظهر القيم' : '🙈 أخفِ القيم'}</button></div></div>
      <div class="kd-grid" style="--kc:${n % 4 === 0 && n <= 16 ? 4 : 5}">${codes.map((r, j) => { const p = kdParse(r, T); return `<label class="kd-cell"><span>${ar(j + 1)}</span><input class="fld ${p.k === 'err' ? 'bad' : ''}" ${hide ? 'type="password"' : ''} data-j="${j}" value="${esc(r)}" maxlength="14" ${locked(ti, j) ? 'disabled title="انفتحت"' : ''} aria-label="خانة ${j + 1}"><b>${hide ? '' : kdLabel(p, T)}</b></label>`; }).join('')}</div>
      <div class="row" style="justify-content:flex-start">${ti > 0 ? '<button class="btn ghost" data-kd="prev">→ الفريق السابق</button>' : ''}<span style="flex:1"></span><button class="btn ghost" data-kd="close">إلغاء</button>${ti < T.length - 1 ? '<button class="btn acc" data-kd="next">التالي: الفريق الجاي ←</button>' : `<button class="btn acc big" data-kd="done">${inGame ? '💾 حفظ ورجوع للعبة' : '▶ ابدأ اللعب'}</button>`}</div>`;
    stat();
  };
  paint();
  d.addEventListener('input', e => {
    const j = e.target.dataset.j; if (j == null) return;
    (KD.boards[ti] = codesOf(ti))[+j] = e.target.value; saveKD();
    const p = kdParse(e.target.value, T); e.target.classList.toggle('bad', p.k === 'err');
    if (!hide) e.target.nextElementSibling.textContent = kdLabel(p, T); stat();
  });
  d.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.j != null) { e.preventDefault(); const nx = $(`input[data-j="${+e.target.dataset.j + 1}"]`, d); if (nx) nx.focus(); } });
  const ok = () => { const s = stat(); if (s.bad) { toast('فيه خانة مكتوبة غلط (باللون الأحمر)'); return false; } if (s.over) { toast('النقاط الموزّعة أكثر من المسموح'); return false; } return true; };
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-kd]'); if (!b) return; const a = b.dataset.kd;
    if (a === 'rand') { const old = codesOf(ti), r = kdRandom(T); KD.boards[ti] = old.map((v, j) => locked(ti, j) ? v : r[j]); saveKD(); paint(); }
    else if (a === 'clear') { KD.boards[ti] = codesOf(ti).map((v, j) => locked(ti, j) ? v : ''); saveKD(); paint(); }
    else if (a === 'hide') { hide = !hide; paint(); }
    else if (a === 'prev') { ti--; paint(); }
    else if (a === 'next') { if (ok()) { ti++; hide = false; paint(); } }
    else if (a === 'close') closeOverlay();
    else if (a === 'done') {
      if (!ok()) return;
      // نتأكد من كل الفرق قبل البدء
      const badT = T.findIndex((_, t) => { const c = codesOf(t); return c.some(r => kdParse(r, T).k === 'err') || (KD.budget && c.reduce((s, r) => s + kdCost(kdParse(r, T)), 0) > KD.budget); });
      if (badT >= 0) { ti = badT; paint(); return toast(`راجع لوحة ${T[badT].n}`); }
      closeOverlay();
      if (!inGame) return newGame('kardees');
      snap(); G.boards = G.boards.map((bd, t) => bd.map((c, j) => c.open ? c : kdCell(kdParse(codesOf(t)[j], T)))); saveGame(); showGame(); toast('تم تعديل اللوحات');
    }
  });
}

      return;
    }
    const k = Math.max(...th.rank.map((r, i) => r ? i : -1)) + 1;   // كم مركز ياخذ خانات
    d.innerHTML = `<div class="chal">${esc(list()[ch])}</div><div class="ch-time" id="ch-t"></div>
      <div class="row">${[0, 30, 60, 90].map(s => `<button class="chip" data-ch="time" data-s="${s}">${s ? `⏱ ${ar(s)} ث` : 'بدون وقت'}</button>`).join('')}</div>
      <b>اضغطوا الفرق بترتيب الفوز:</b>
      <div class="rank">${G.teams.map((t, i) => { const r = order.indexOf(i); return `<button style="--tc:${t.c}" class="${r >= 0 ? 'on' : ''}" data-ch="rank" data-i="${i}">${r >= 0 ? `<i>${ar(r + 1)}</i>` : ''}${esc(t.n)}${r >= 0 && th.rank[r] ? ` · ${ar(th.rank[r])} خانة` : ''}</button>`; }).join('')}</div>
      <div class="row"><button class="btn ghost" data-ch="list">→ تحدي ثاني</button><button class="btn acc big" data-ch="ok" ${order.length ? '' : 'disabled'}>✓ اعتمد الترتيب</button></div>
      <p class="hint" style="margin:0">يكفي ترتّبون أول ${ar(k)}.</p>`;
  };

  d.addEventListener('click', e => {
    const b = e.target.closest('[data-ch]'); if (!b) return; const a = b.dataset.ch;
    if (a === 'pick') { ch = +b.dataset.i; order = []; }

    else if (a === 'edit') edit = true;
    else if (a === 'back') edit = false;
    else if (a === 'reset') { Store.del(CH_KEY); edit = false; }

    else if (a === 'time') {
      clearInterval(chTimer); let s = +b.dataset.s; const out = $('#ch-t', d); if (!s) { out.textContent = ''; return; }
      out.textContent = ar(s); chTimer = setInterval(() => { s--; if (!d.isConnected) return clearInterval(chTimer); out.textContent = s > 0 ? ar(s) : '⏰ انتهى الوقت!'; if (s <= 5 && s > 0) Snd.pop(); if (s <= 0) { clearInterval(chTimer); Snd.bad(); } }, 1000);

  });

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'KeyF') return toggleFS();
  if (e.code === 'KeyM') return ACT.sound();
  const scr = $('.screen.on').id;
  if (ovEl) {
    if (e.key === 'Escape' && ovEl.querySelector('[data-close]')) closeOverlay();

  if (scr !== 'game' || !G) return;
  if (TH().lanes) { if (e.key === 'Enter') { e.preventDefault(); laneOk(); } return; }
  if (e.code === 'KeyU') return ACT.undo();
  if (e.code === 'KeyN') return nextTurn();
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
  if (m && layoutOf() !== 'regions') { numBuf = (numBuf + m[1]).slice(-2); paintBuf(); clearTimeout(numT); numT = setTimeout(() => { numBuf = ''; paintBuf(); }, 2500); return; }
  if (e.key === 'Enter' && numBuf) { e.preventDefault(); const i = +numBuf - 1; numBuf = ''; paintBuf(); if (i >= 0 && i < boardOf().length) openTile(i); }
  if (e.key === 'Backspace') { numBuf = numBuf.slice(0, -1); paintBuf(); }
});

function applyBrand() {
  if (brandDone) return; brandDone = true;
  const st = document.body.style, it = SVGA.items, set = (n, k) => { if (it[k]) st.setProperty(n, `url("${it[k]}")`); };
  set('--tile', BRAND.tile); set('--tile2', BRAND.tile + '2'); set('--tile3', BRAND.tile + '3'); set('--tile4', BRAND.tile + '4'); set('--tile-gold', 'tile_gold');
  const amb = document.createDocumentFragment();
  if (!RM) (BRAND.ambient || []).forEach(a => {
    const d = document.createElement('div');
    if (a.bubble) { d.className = 'bub'; d.style.cssText = `--x:${a.x};--s:${a.s};--d:${a.d}s;--dl:${a.dl || 0}s`; }
    else { if (!it[a.a]) return; d.className = 'amb'; d.style.cssText = `--x:${a.x};--y:${a.y};--s:${a.s};--an:${a.an || 'amb-a'};--d:${a.d}s;--dl:${a.dl || 0}s`; d.innerHTML = `<img src="${it[a.a]}" alt="">`; }
    amb.append(d);
  });
  document.body.insertBefore(amb, document.body.children[1]);
}

/* --- طريقة اللعب: خاصة بهذي اللعبة فقط --- */
const lanesHow = () => {
  const th = THEMES.lanes, s = artSrc;
  return `<div class="ln-how">
    <div><img src="${s('roadmark') || ''}" alt=""><b>١. كل فريق ينقسم نصفين</b>نصف الفريق في طريق الزيادة ونصفه في طريق النقصان، فكل فريق موجود في الطريقين.</div>
    <div><img src="${s('finish') || ''}" alt=""><b>٢. سباق في الطريقين معاً</b>المقدّم يطلق التحدي: سؤال أو مهمة. أسرع مجموعة تنهي توصل أول. يصلح في الفصل أو قروبات الواتساب.</div>
    <div><img src="${s('plus') || ''}" alt=""><b>٣. الترتيب يحدد النقاط</b>في الأخضر: الأول +${ar(th.plus[0])} والثاني +${ar(th.plus[1])} والثالث +${ar(th.plus[2])}. في الأحمر: الأول لا يخسر، والأخير يخسر ${ar(-th.minus[3])}.</div>
  </div>`;
};
function helpHTML() {
  const th = THEMES[SOLO], close = `<div class="row" style="justify-content:flex-start"><button class="btn acc" data-close>تمام</button></div>`;
  if (th.lanes) return `<h3>❓ طريقة اللعب: ${th.name}</h3>${lanesHow()}<ul class="help-list"><li>في شاشة اللعب اضغط سيارة الفريق بترتيب وصوله، فتدخل مكانها عند خط النهاية وتظهر نقاطها. الضغط على الخانة يرجّعها.</li><li>لما تخلص الجولة اضغط «اعتمد الجولة» وتنضاف النقاط. ✨ الجولات الذهبية تضاعف كل النقاط.</li><li><kbd>Enter</kbd> اعتماد الجولة · <kbd>F</kbd> ملء الشاشة · <kbd>M</kbd> الصوت.</li></ul>${close}`;
  const pot = th.pot ? th.pot[0] : 'الجرة', potI = artSrc(BRAND.pot);
  return `<h3>❓ طريقة اللعب: ${th.name}</h3>
  <div class="steps">
    <div class="step"><div class="si">🙋</div><b>١. جاوبوا صح</b><small>سؤال من المقدّم أو من أي مسابقة ثانية</small></div>
    <div class="step"><div class="si">🔢</div><b>٢. اختاروا خانة</b><small>المقدّم يضغطها أو يكتب رقمها ثم Enter</small></div>
    <div class="step"><div class="si">🥁</div><b>٣. المفاجأة!</b><small>زيادة، خصم، ضربة لفريق، سرقة، حماية…</small></div>
    ${th.design ? `<div class="step"><div class="si">🎨</div><b>٤. صمّم لوحتك</b><small>كل فريق يخبّي نقاطه وفخاخه لغيره</small></div>` : `<div class="step"><div class="si">${potI ? `<img src="${potI}" alt="" style="height:2.8rem">` : '🎲'}</div><b>٤. كمّل أو اكتفِ</b><small>تجمعون في ${esc(pot)}… والخصم يطيّرها</small></div>`}
    <div class="step"><div class="si">🃏</div><b>٥. بطاقات القوى</b><small>🛡️ درع · 🔄 عكس · ❄️ تجميد</small></div>
  </div>
  <ul class="help-list">
    <li><b>🔥 السلسلة:</b> ٣ خانات زينة ورا بعض لنفس الفريق = بونص. <b>🎯 فرصة المتأخر:</b> الأخير (لو بعيد) يفتح خانتين ويختار وحدة. <b>✨ اللوحة الذهبية:</b> جولة أخيرة بقيم ×٢ وفيها «قلب الطاولة».</li>
    <li>كل الإضافات تنطفي وتشتغل من شاشة الإعداد. الدرع والعكس يطلعون لحالهم لما ينضرب الفريق، والتجميد تضغطه من بطاقة الفريق فوق.</li>
    <li>اضغط على أي فريق فوق عشان تعطيه الدور، وزر + و − جنب النقاط للتعديل اليدوي. <kbd>N</kbd> الدور التالي · <kbd>U</kbd> تراجع · <kbd>F</kbd> ملء الشاشة · <kbd>M</kbd> الصوت.</li>
    ${th.design ? '<li>كل فريق يصمّم لوحته قبل اللعب، والفريق اللي عليه الدور يفتح من لوحة فريق ثاني.</li>' : ''}${th.challenges ? '<li>زر «🏆 تحدي» بين الصناديق: الأول يفتح خانتين والثاني خانة.</li>' : ''}
    <li>تقدر تعدّل وش وراء الخانات من زر ✏️ في شاشة الإعداد. اللعبة تنحفظ تلقائياً وتقدر تكمّلها بعدين.</li>
  </ul>${close}`;
}

/* --- رايح جاي: الفكرة تنقرأ من الشاشة نفسها --- */
const carCache = {};
function carSrc(c) {
  if (carCache[c]) return carCache[c];
  const raw = SVGA.raw.car; if (!raw) return '';
  return (carCache[c] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(raw.replace(/#ff00ff/gi, c).replace(/#aa00aa/gi, SVGA.shade(c, .62))));
}
function renderLanes() {
  const th = TH(), cu = G.cur, mul = G.goldMul || 1, n = G.teams.length;
  const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + ar(Math.abs(v));
  const road = (k, pts, title, sub, sign) => {
    const val = r => (k === 'plus' ? (pts[r] ?? 0) : (pts[r] ?? pts[pts.length - 1])) * mul;
    const left = G.teams.map((t, i) => [t, i]).filter(([, i]) => !cu[k].includes(i));
    return `<section class="road ${k}"><header><img src="${artSrc(sign)}" alt=""><div><b>${title}${mul > 1 ? ' ×٢' : ''}</b><small>${sub}</small></div></header>
      <div class="cap">🏁 خط النهاية: كل مركز وقيمته</div>
      <div class="ln-slots" style="--n:${n}">${Array.from({ length: n }, (_, r) => { const v = val(r), i = cu[k][r], t = i != null ? G.teams[i] : null, cls = v > 0 ? 'up' : v < 0 ? 'down' : 'zero';
        return t ? `<button class="slot filled ${cls}" style="--tc:${t.c}" data-act="lane" data-k="${k}" data-i="${i}" title="اضغط لترجيعه"><span class="rk">${ORD[r] || ar(r + 1)}</span><img src="${carSrc(t.c)}" alt=""><span class="pts">${fmt(v)}</span><span class="who">${esc(t.n)}</span></button>`
          : `<div class="slot ${cls}"><span class="rk">${ORD[r] || ar(r + 1)}</span><span class="pts">${fmt(v)}</span></div>`; }).join('')}</div>
      <div class="cap">🚗 اضغط الفرق بترتيب وصولها</div>
      <div class="ln-start" style="--n:${n}">${left.map(([t, i]) => `<button class="ln-car" style="--tc:${t.c}" data-act="lane" data-k="${k}" data-i="${i}"><img src="${carSrc(t.c)}" alt=""><span>${esc(t.n)}</span></button>`).join('')}</div>
    </section>`;
  };
  $('#board-wrap').innerHTML = `<div class="ln-wrap">
    <div class="ln-idea"><span><b>الجولة ${ar(G.rounds.length + 1)}</b>كل فريق نصفين: نصف في الأخضر ونصف في الأحمر، والمقدّم يطلق التحدي في الطريقين معاً</span></div>
    <div class="ln-roads">${road('plus', th.plus, 'طريق الزيادة', 'كل ما وصلتوا أول كسبتوا أكثر', 'plus')}${road('minus', th.minus, 'طريق النقصان', 'الأول ينجو، والأخير يخسر أكثر', 'minus')}</div>
    ${G.rounds.length ? `<div class="ln-hist">${G.rounds.slice(-4).map((r, k) => `<span class="r"><i>جولة ${ar(G.rounds.length - Math.min(4, G.rounds.length) + k + 1)}</i>${r.map((d, i) => `<b style="color:${G.teams[i].c}">${fmt(d)}</b>`).join('')}</span>`).join('')}</div>` : ''}
  </div>`;
  $('#bar').innerHTML = `<button class="btn acc big" data-act="lane-ok">✓ اعتمد الجولة<kbd>Enter</kbd></button><button class="btn ghost" data-act="lane-clear">مسح الترتيب</button>${mod('gold') && !(G.goldMul > 1) ? '<button class="btn gold" data-act="gold">✨ الجولات الذهبية</button>' : ''}<button class="btn ghost" data-act="finish">🏁 إنهاء</button>`;
}

addEventListener('keydown', e => { if (e.key === 'Enter' && !ovEl && $('.screen.on').id === 'home' && !/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName)) { e.preventDefault(); ACT['to-setup'](); } });
applySound(); renderHome();
</script>
</body>
</html>
