<style>
/* ===================== الألوان والمقاسات ===================== */
:root{
  --bg:#070d1a; --bg2:#0f1a33;
  --sea1:#10254a; --sea2:#081429;
  --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.09); --line:rgba(255,255,255,.1);
  --ink:#f4efe3; --ink2:#c9c2b1; --ink3:#878d9e;
  --gold:#d8b25a; --gold2:#f3d98f; --ok:#35c98a; --bad:#ef5b6c; --war:#ff5a5f;
  --neutral:#1b2742; --neutral2:#24345a; --neutral-s:#3d5280; --nm:#dfe6f3;
  --link:rgba(216,178,90,.55); --grid:rgba(216,178,90,.05);
  --land:#2a3b5e; --ctx:#1b2337; --border:rgba(236,222,186,.6); --cborder:rgba(255,255,255,.12);
  --tokn:#17223b; --tokr:rgba(243,217,143,.6); --halo:rgba(5,10,24,.88);
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --r:1.1rem;
  --display:'Reem Kufi','Tajawal','Segoe UI',Tahoma,sans-serif;
}
[data-theme=light]{
  --bg:#f2ebdd; --bg2:#e7dcc5;
  --sea1:#dbe9f0; --sea2:#c5d9e4;
  --panel:rgba(255,255,255,.6); --panel2:rgba(255,255,255,.92); --line:rgba(50,45,30,.14);
  --ink:#1b2130; --ink2:#4a5163; --ink3:#7f8596;
  --gold:#9c7018; --gold2:#b8892a;
  --neutral:#cfd6e0; --neutral2:#e2e7ee; --neutral-s:#97a4b8; --nm:#27304a;
  --link:rgba(120,90,30,.55); --grid:rgba(120,90,30,.06);
  --land:#f7f2e7; --ctx:#dcd8cf; --border:rgba(80,60,25,.6); --cborder:rgba(80,60,25,.16);
  --tokn:#fffdf8; --tokr:rgba(120,90,30,.6); --halo:rgba(255,255,255,.92);
  --shadow:0 14px 40px rgba(60,50,20,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,.45vw + .8vh,24px)}
html,body{height:100%;margin:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{font-family:inherit;font-size:.7em;font-weight:700;padding:.05em .45em;border-radius:.4em;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.2);opacity:.85}
.muted{color:var(--ink3);font-weight:500}
.tc{color:var(--tc);font-weight:800;white-space:nowrap}

/* ===================== الخلفية ===================== */
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(70% 60% at 80% -10%,rgba(216,178,90,.13),transparent 60%),
  radial-gradient(60% 60% at 0% 110%,rgba(62,142,247,.12),transparent 60%),
  linear-gradient(180deg,var(--bg2),var(--bg))}
#fx{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:95;pointer-events:none}
#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex;animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===================== أزرار عامة ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.7em 1.4em;border-radius:999px;font-weight:800;line-height:1.15;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;user-select:none;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#f3d98f,#c9962f);color:#241703;box-shadow:0 10px 30px rgba(216,178,90,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.glass{background:var(--panel2);border:1px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#3ddc97,#13a56a);color:#fff;box-shadow:0 10px 26px rgba(53,201,138,.3)}
.btn.bad{background:linear-gradient(135deg,#ff6b7d,#d32f45);color:#fff;box-shadow:0 10px 26px rgba(239,91,108,.3)}
.btn.war{background:linear-gradient(135deg,#ff7a6b,#c9283a);color:#fff;box-shadow:0 10px 26px rgba(255,90,95,.3)}
.btn.big{font-size:1.25rem;padding:.8em 1.8em}
.btn.sm{font-size:.9rem;padding:.45em 1em}
.btn:disabled{opacity:.4;pointer-events:none}
.ibtn{width:2.6rem;height:2.6rem;border-radius:.85rem;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:background .15s,transform .15s;flex:none;font-size:1.15rem}
.ibtn:hover{background:var(--panel2);transform:translateY(-1px)}
.ibtn svg{width:1.25rem;height:1.25rem}
.ibtn:disabled{opacity:.35;pointer-events:none}
.lnk{color:var(--ink3);font-weight:700;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.25em .8em;border-radius:99px;font-weight:800;font-size:.95rem;background:color-mix(in srgb,var(--cc,var(--tc,var(--gold))) 18%,transparent);border:1px solid color-mix(in srgb,var(--cc,var(--tc,var(--gold))) 55%,transparent);white-space:nowrap}
.chip.hard{--cc:#ff6b4a}
.corner-tools{position:absolute;top:1rem;inset-inline-end:1rem;display:flex;gap:.5rem;z-index:3}

/* ===================== الرئيسية ===================== */
#home{align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden}

.kicker{font-weight:800;letter-spacing:.04em;color:var(--gold2);font-size:1.15rem;padding:.3rem 1.1rem;border-radius:99px;background:rgba(216,178,90,.1);border:1px solid rgba(216,178,90,.35)}
.title{font-family:var(--display);font-weight:700;font-size:clamp(4.5rem,16vmin,12rem);line-height:1.05;background:linear-gradient(180deg,#fff5d6 10%,#e7c36d 55%,#a8761f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .06em .12em rgba(0,0,0,.45))}

.tagline{font-size:1.5rem;color:var(--ink2);font-weight:700}
.home-btns{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:.6rem}
.home-feats{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:62rem;margin-top:.4rem}

/* ===================== الإعداد ===================== */
#setup{flex-direction:column}
.s-head{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.6rem .8rem}
.s-head h2{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1.1;color:var(--gold2);white-space:nowrap}

.s-body{flex:1;overflow:auto;padding:.2rem 1.6rem 7rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1.2rem;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.3rem;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.row-t{font-weight:800;color:var(--ink2);margin:1rem 0 .5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{flex:1 1 0;min-width:4.5rem;padding:.55rem .7rem;border-radius:.9rem;background:var(--panel);border:1.5px solid var(--line);font-weight:800;transition:.15s}

.seg button b{display:block}
.seg button small{display:block;font-weight:600;color:var(--ink3);font-size:.78rem;line-height:1.35;margin-top:.15rem}
.seg.tall button{text-align:start;padding:.65rem .8rem}
.seg.list{flex-direction:column;flex-wrap:nowrap;gap:.4rem}
.seg.list button{flex:none;min-width:0;display:grid;grid-template-columns:2.2rem 1fr;column-gap:.6rem;align-items:center;text-align:start;padding:.5rem .8rem}
.seg.list button i{grid-row:1/3;font-style:normal;font-size:1.45rem;text-align:center}
.seg.list button b{font-size:1rem}
.seg.list button small{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-note{color:var(--ink3);font-weight:600;font-size:.88rem;margin-top:.5rem;line-height:1.6}
.names-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem}
.names-grid label{display:flex;flex-direction:column;gap:.2rem;font-weight:800;font-size:.85rem;color:var(--ink3)}
.stakes .wide{grid-column:1/-1;color:var(--gold2)}
.evr{display:grid;grid-template-columns:auto 1fr;gap:.35rem .7rem;padding:.6rem .75rem;border-radius:.9rem;background:var(--panel);border:1px solid var(--line);margin-bottom:.45rem;align-items:start}
.evr.off{opacity:.5}
.evsw{font-size:1.3rem;line-height:1}
.evt b{display:block;font-size:1.02rem}
.evt small{display:block;color:var(--ink3);font-weight:600;font-size:.84rem;line-height:1.5}
.evc{grid-column:2;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.evc .muted{font-size:.8rem}
.seg.mini button{min-width:0;flex:none;padding:.28rem .55rem;font-size:.82rem;border-radius:.7rem}
.evadd{display:grid;grid-template-columns:4.2rem 1fr 2fr auto;gap:.5rem;align-items:center;margin-top:.35rem}
@media (max-width:1000px){.evadd{grid-template-columns:4rem 1fr}}
.ms{text-align:center;padding:1rem}
.ms-lock{font-size:4rem;line-height:1}
.ms h2{font-size:1.8rem;margin:.5rem 0}
.ms p{color:var(--ink2);font-weight:700;font-size:1.1rem;margin-bottom:1rem}
.ms-card{margin:1rem auto 0;max-width:40rem;padding:1.2rem;border-radius:1.2rem;border:2px dashed var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);animation:rise .35s ease both}
.ms-card small{display:block;color:var(--ink3);font-weight:800}
.ms-card b{display:block;font-size:clamp(1.5rem,1rem + 1.4vw,2.4rem);line-height:1.4;margin:.4rem 0}
.ms-btn{position:absolute;bottom:-.35rem;inset-inline-start:-.35rem;font-size:.8rem;background:var(--panel2);border:1px solid var(--line);border-radius:99px;width:1.5rem;height:1.5rem;display:grid;place-items:center}
.ms-td small{display:block;font-size:.82rem;font-weight:700;color:var(--ink2);max-width:16rem;margin:0 auto}
.ms-ok{color:var(--ok)}.ms-no{color:var(--ink3)}
.evb{display:flex;gap:.7rem;align-items:center;padding:.65rem .8rem;border-radius:var(--r);background:linear-gradient(135deg,rgba(243,217,143,.16),rgba(243,217,143,.04));border:1.5px dashed color-mix(in srgb,var(--gold) 65%,transparent)}
.evb i{font-style:normal;font-size:1.9rem}
.evb b{display:block;font-size:1rem;color:var(--gold2)}
.evb small{color:var(--ink2);font-weight:600;font-size:.85rem;line-height:1.45}
.t .ic .ruin{fill:#8a8f9c;stroke:#3a3f4c;stroke-width:1.2;opacity:.8}
.seg button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 16%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chipb{padding:.35rem .85rem;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:.95rem;transition:.15s;opacity:.55}
.chipb small{color:var(--ink3);font-weight:600}
.chipb.on{opacity:1;background:color-mix(in srgb,var(--cc) 22%,transparent);border-color:var(--cc)}
.quick{display:flex;gap:.35rem;margin-inline-start:auto}
.quick button{font-size:.8rem;font-weight:800;padding:.15rem .6rem;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.tgl{width:100%;display:flex;align-items:center;gap:.8rem;padding:.7rem .2rem;border-top:1px solid var(--line);text-align:start}
.tgl:first-of-type{border-top:0}
.tgl .tgi{font-size:1.5rem;width:2rem;text-align:center}
.tgl .tx{flex:1}
.tgl b{display:block;font-size:1.05rem}
.tgl small{color:var(--ink3);font-size:.85rem}
.sw-t{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw-t::after{content:'';position:absolute;top:.17rem;inset-inline-start:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tgl.on .sw-t{background:var(--gold);border-color:var(--gold)}
.tgl.on .sw-t::after{inset-inline-start:1.6rem}
.step{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.step button{width:2.4rem;height:2.4rem;border-radius:.8rem;background:var(--panel2);border:1px solid var(--line);font-size:1.3rem;font-weight:900}
.step b{font-family:var(--display);font-size:2rem;min-width:2.2ch;text-align:center;color:var(--gold2)}
.trow{--tc:#888;display:flex;align-items:center;gap:.8rem;padding:.6rem .7rem;border-radius:1rem;background:color-mix(in srgb,var(--tc) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--tc) 45%,transparent);margin-bottom:.6rem}
.t-emo{width:3.3rem;height:3.3rem;border-radius:1rem;font-size:1.9rem;display:grid;place-items:center;background:var(--tc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);flex:none;transition:transform .15s}
.t-emo:hover{transform:rotate(-6deg) scale(1.06)}
.t-mid{flex:1;min-width:0}
.t-name{width:100%;background:transparent;border:0;border-bottom:2px solid var(--line);font-weight:800;font-size:1.15rem;padding:.15rem 0;outline:none}
.t-name:focus{border-bottom-color:var(--tc)}
.t-cols{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.sw{width:1.45rem;height:1.45rem;border-radius:50%;background:var(--sw);border:2px solid transparent;transition:transform .15s}
.sw:hover{transform:scale(1.15)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.add-team{width:100%;padding:.8rem;border-radius:1rem;border:2px dashed var(--line);font-weight:800;color:var(--ink2)}
.add-team:hover{border-color:var(--gold);color:var(--ink)}
.s-foot{position:absolute;bottom:0;inset-inline:0;padding:1.6rem 1.6rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:linear-gradient(transparent,var(--bg) 45%);pointer-events:none}
.s-foot>*{pointer-events:auto}
.s-sum{font-weight:800;color:var(--ink2)}
.emo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
.emo-grid button{font-size:2rem;padding:.4rem;border-radius:.8rem;background:var(--panel);border:1.5px solid var(--line)}
.emo-grid button:hover{border-color:var(--gold)}
.emo-grid.sm{grid-template-columns:repeat(8,1fr);gap:.35rem}
.emo-grid.sm button{font-size:1.35rem;padding:.2rem}

/* ===================== بنك الأسئلة ===================== */
#editor{flex-direction:column}
.ed-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.ed-tabs button{padding:.45rem 1rem;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);font-weight:800}
.ed-tabs button small{color:var(--ink3);font-weight:700}
.ed-tabs button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.ed-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(15rem,19rem) 1fr;gap:1rem;padding:0 1.6rem 1.2rem}
.ed-side{overflow:auto;display:flex;flex-direction:column;gap:.35rem;padding-bottom:.5rem}
.ed-cat{--cc:#888;display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:.9rem;background:var(--panel);border:1.5px solid var(--line);text-align:start;transition:.15s}
.ed-cat:hover{border-color:color-mix(in srgb,var(--cc) 60%,transparent)}
.ed-cat.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent)}
.ed-cat i{font-style:normal;font-size:1.35rem}
.ed-cat b{flex:1;font-size:.98rem;line-height:1.3}
.ed-cat small{color:var(--ink3);font-weight:800}
.ed-cat .w{color:#ffb547}
.ed-main{overflow:auto;padding:1rem 1.2rem}
.ed-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.ed-top h3{font-size:1.45rem;font-weight:900;margin:0}
.ed-top h3 small{color:var(--ink3);font-size:.95rem}
.ed-top .sp{flex:1}
.ed-ic{--cc:#888;width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--cc) 25%,transparent);border:1.5px solid var(--cc)}
.ed-tip{color:var(--ink2);font-weight:600;font-size:.92rem;padding:.55rem .8rem;border-radius:.8rem;background:var(--panel);margin-bottom:.8rem}
.ed-lvl{margin-bottom:1rem}
.ed-lh{display:flex;align-items:center;gap:.7rem;margin:.4rem 0 .5rem}
.ed-empty{padding:.8rem;border-radius:.8rem;border:1.5px dashed var(--line);color:var(--ink3);font-weight:700;text-align:center}
.q-row{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem .75rem;border-radius:.85rem;background:var(--panel);border:1px solid var(--line);margin-bottom:.4rem}
.q-row .qt{flex:1;min-width:0}
.q-row .qq{font-weight:800;line-height:1.5}
.q-row .qa{color:var(--ok);font-weight:800;margin-top:.15rem}
.q-row .qn{color:var(--ink3);font-weight:600;font-size:.85rem;margin-top:.1rem}
.q-row .acts{display:flex;gap:.3rem;flex:none}
.q-row .ibtn{width:2.2rem;height:2.2rem;font-size:.95rem}
.ed-search{margin-bottom:.4rem}
.form{display:flex;flex-direction:column;gap:.85rem}
.fl{display:block;font-weight:800;color:var(--ink2)}
.fl>.field,.fl>.seg,.fl>.t-cols{margin-top:.35rem}
.fl>.field{display:block}
.fl small{font-weight:600;color:var(--ink3)}
.field{width:100%;padding:.6rem .8rem;border-radius:.8rem;border:1.5px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);font-weight:700;outline:none;resize:vertical;line-height:1.6}
[data-theme=light] .field{background:#fff}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
select.field option{background:var(--bg2);color:var(--ink)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.fnote{color:var(--ink2);font-weight:600;font-size:.95rem;line-height:1.8;padding:.6rem .8rem;border-radius:.8rem;background:var(--panel)}
.fnote code{font-family:inherit;font-weight:800;color:var(--gold2);background:rgba(0,0,0,.2);padding:.05rem .4rem;border-radius:.4rem}
.fcount{font-weight:800;color:var(--ok);min-height:1.5em}
.qans .lnk{display:inline-block;margin-top:.45rem}
@media (max-width:1000px){.ed-body{grid-template-columns:1fr}.ed-side{max-height:30vh}.frow{grid-template-columns:1fr}}

/* ===================== الساحة ===================== */
#game{flex-direction:column}
.top{display:flex;align-items:center;gap:1rem;padding:.55rem 1.1rem;flex:none;border-bottom:1px solid var(--line);background:rgba(0,0,0,.12)}
[data-theme=light] .top{background:rgba(255,255,255,.35)}
.brand{font-family:var(--display);font-weight:700;font-size:1.55rem;color:var(--gold2);white-space:nowrap}
.rounds{display:flex;align-items:center;gap:.7rem;font-weight:800;color:var(--ink2);white-space:nowrap}
.rounds b{color:var(--ink);font-size:1.15rem}
.rdots{display:flex;gap:.28rem;flex-wrap:wrap}
.rdots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.rdots i.done{background:var(--gold);border-color:var(--gold)}
.rdots i.now{background:var(--gold2);border-color:var(--gold2);box-shadow:0 0 0 3px rgba(216,178,90,.3)}
.rdots i.last{border-color:var(--war)}
.top .tools{margin-inline-start:auto;display:flex;gap:.45rem}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(19rem,25rem) 1fr}
.side{display:flex;flex-direction:column;gap:.8rem;padding:.9rem;overflow:auto;border-inline-end:1px solid var(--line);background:rgba(0,0,0,.08)}
[data-theme=light] .side{background:rgba(255,255,255,.25)}
.mapwrap{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:.5rem .8rem}
#map{width:100%;height:100%;display:block;user-select:none}

/* لوحة الدور */
.turn{--tc:var(--gold);border-radius:var(--r);padding:1rem;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 22%,transparent),color-mix(in srgb,var(--tc) 6%,transparent));border:1.5px solid color-mix(in srgb,var(--tc) 60%,transparent);box-shadow:0 10px 30px color-mix(in srgb,var(--tc) 18%,transparent)}
.tb-kick{font-weight:800;color:var(--ink2);font-size:.9rem;display:flex;justify-content:space-between;gap:.5rem}
.tb-team{display:flex;align-items:center;gap:.7rem;margin:.35rem 0 .8rem}
.tb-team .em{width:3.2rem;height:3.2rem;border-radius:1rem;display:grid;place-items:center;font-size:1.9rem;background:var(--tc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);flex:none}
.tb-team b{font-family:var(--display);font-size:1.9rem;line-height:1.1}
.tb-team small{display:block;color:var(--ink2);font-weight:700;font-size:.85rem}
.turn p{color:var(--ink2);font-weight:600;font-size:.95rem;margin-bottom:.8rem}
.acts{display:grid;grid-template-columns:1fr;gap:.5rem}
.act{display:grid;grid-template-columns:2.6rem 1fr;grid-template-rows:auto auto;column-gap:.6rem;align-items:center;text-align:start;padding:.6rem .75rem;border-radius:.95rem;background:var(--panel2);border:1.5px solid var(--line);transition:.15s}
.act i{grid-row:1/3;font-style:normal;font-size:1.7rem;text-align:center}
.act b{font-size:1.2rem;font-weight:900}
.act small{color:var(--ink3);font-weight:600;font-size:.82rem;line-height:1.3}
.act:hover:not(:disabled){border-color:var(--gold);transform:translateX(-3px)}
.act.war:hover:not(:disabled){border-color:var(--war)}
.act:disabled{opacity:.4}
.act.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent)}
.act.war.on{border-color:var(--war);background:color-mix(in srgb,var(--war) 18%,transparent)}
.tb-cards{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.cardb{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border-radius:.8rem;background:var(--panel2);border:1.5px dashed color-mix(in srgb,var(--gold) 60%,transparent);font-weight:800;font-size:.9rem}
.cardb:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 20%,transparent)}

.tb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem;gap:.5rem}
.selbox{padding:.7rem .8rem;border-radius:.9rem;background:rgba(0,0,0,.18);border:1px solid var(--line);font-weight:700;margin-top:.2rem}

.badge-air{display:inline-flex;gap:.3rem;align-items:center;font-weight:800;font-size:.85rem;padding:.2rem .6rem;border-radius:99px;background:rgba(62,142,247,.18);border:1px solid rgba(62,142,247,.5);margin-bottom:.6rem}

/* الفرق */
.sec-t{font-weight:900;color:var(--ink3);font-size:.85rem;letter-spacing:.03em;display:flex;justify-content:space-between}
.teams{display:flex;flex-direction:column;gap:.45rem}

.tm-mid{flex:1;min-width:0}

.tm .truce{font-size:.8rem;font-weight:800;color:#7cc4ff}
.feed{display:flex;flex-direction:column;gap:.3rem;font-size:.86rem;color:var(--ink2);font-weight:600}
.feed div{padding:.35rem .55rem;border-radius:.6rem;background:var(--panel);line-height:1.45}
.feed div:first-child{color:var(--ink);background:var(--panel2)}

/* الخريطة */
.hint{position:absolute;top:.8rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.8rem;padding:.5rem .6rem .5rem 1.1rem;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:800;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:2;white-space:nowrap;max-width:94%}
.hint.war{border-color:color-mix(in srgb,var(--war) 60%,transparent)}
.tip{position:absolute;z-index:4;pointer-events:none;padding:.55rem .8rem;border-radius:.8rem;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.88rem;font-weight:600;color:var(--ink2);min-width:11rem;max-width:17rem;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);line-height:1.5}
[data-theme=dark] .tip{background:rgba(16,24,44,.94)}
.tip b{display:block;font-size:1.05rem;color:var(--ink)}
.deco text{font-family:var(--display);fill:var(--gold);opacity:.42;font-size:14px;letter-spacing:1.5px;direction:ltr;pointer-events:none}
.compass{opacity:.4;pointer-events:none}
.compass path,.compass circle{stroke:var(--gold);fill:none;stroke-width:1.2}
.compass .n{fill:var(--gold);stroke:none}
.compass text{fill:var(--gold);font-size:13px;font-weight:800;font-family:var(--display)}
.ctx{fill:var(--ctx);pointer-events:none}
.mesh-c{fill:none;stroke:var(--cborder);stroke-width:.8;stroke-linejoin:round;pointer-events:none}
.cf{fill:var(--land);transition:fill .45s,opacity .25s,filter .2s}
.cf.tgt{cursor:pointer}
.cf.tgt:hover{filter:brightness(1.22)}
.cf.flash{animation:flash .9s ease}
@keyframes flash{0%{filter:brightness(1.9)}100%{filter:brightness(1)}}
.mesh-a{fill:none;stroke:var(--border);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.ce{fill:none;stroke:transparent;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;pointer-events:none;transition:stroke .2s}
.ce.km{stroke:var(--border);stroke-width:1.1}
.ce.tgt{stroke:var(--gold2);stroke-width:3.2;animation:pulse 1.3s ease-in-out infinite}
.ce.tgt.war{stroke:var(--war)}
.ce.pick{stroke:var(--war);stroke-width:3.8}
#map.sel .cf:not(.tgt):not(.pick){opacity:.36}
#map.sel .t:not(.tgt):not(.pick) .tin,#map.sel .tl:not(.tgt):not(.pick){opacity:.4}
.tl{pointer-events:none;transition:opacity .25s}
.inset{fill:var(--sea2);stroke:var(--border);stroke-width:1.2;stroke-dasharray:5 4}
.inset.tgt{stroke:var(--gold2);stroke-width:2.6;stroke-dasharray:none;cursor:pointer}
.inset.tgt.war{stroke:var(--war)}
.inset-t{font-family:var(--display);font-weight:700;font-size:13px;fill:var(--ink2);text-anchor:middle;direction:ltr;pointer-events:none}
.ln{fill:none;stroke:var(--link);stroke-width:2.2;stroke-dasharray:3 6;stroke-linecap:round;pointer-events:none;transition:stroke .2s,stroke-width .2s}
.ln.hot{stroke:var(--war);stroke-width:3.6;stroke-dasharray:6 5}
.leader{stroke:var(--border);stroke-width:1.2;stroke-dasharray:2 3;pointer-events:none}
.t{cursor:default}
.tin{transform-box:fill-box;transform-origin:center;transition:transform .2s,opacity .25s}
.tk{fill:var(--tokn);stroke:var(--tokr);stroke-width:2;transition:fill .4s}
.tk-sh{fill:rgba(0,0,0,.35)}
[data-theme=light] .tk-sh{fill:rgba(60,50,20,.2)}
.t.own .tk{stroke:#fff;stroke-width:2.4}
.tl .nm,.t .nm{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;font-weight:900;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.6px;stroke-linejoin:round;direction:ltr;pointer-events:none}
.t .em{text-anchor:middle;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;pointer-events:none}
.t .ic{pointer-events:none}
.t .ic .shield{fill:#f3d98f;stroke:#5a3c07;stroke-width:1.4}
.t .ic .crown{fill:#ffd25e;stroke:#5a3c07;stroke-width:1.4}
.t.tgt{cursor:pointer}
.t.tgt .tk{stroke:var(--gold2);stroke-width:3.2;animation:pulse 1.3s ease-in-out infinite}
.t.tgt.war .tk{stroke:var(--war)}
.t.pick .tk{stroke:var(--war);stroke-width:3.8}
.t.tgt:hover .tin{transform:scale(1.14)}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.t.pop .tin{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.t.crk .tin{animation:crk .55s ease}
@keyframes crk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-4deg)}40%{transform:translateX(5px) rotate(4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.rl{pointer-events:none;direction:ltr}
.rl .rn{font-family:var(--display);font-weight:700;font-size:19px;text-anchor:middle;letter-spacing:.5px;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
.rl .rb{font-family:var(--display);font-weight:700;font-size:14px;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
[data-theme=light] .rl{filter:brightness(.6) saturate(1.4)}
[data-theme=light] .deco text{opacity:.5}

/* ===================== النوافذ ===================== */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:rgba(4,8,18,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .25s ease both}
[data-theme=light] .ov{background:rgba(60,50,30,.35)}
.sheet{width:min(72rem,100%);max-height:100%;overflow:auto;background:linear-gradient(170deg,var(--bg2),var(--bg));border:1px solid var(--line);border-radius:1.5rem;padding:1.4rem 1.6rem;box-shadow:var(--shadow);animation:rise .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.dlg{z-index:90}
.dlg .sheet{width:min(46rem,100%)}
.dlg.wide .sheet{width:min(62rem,100%)}
.sh-top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.sh-top h2{font-size:1.7rem;font-weight:900;flex:1;min-width:12rem}
.sh-top h2 b{color:var(--gold2)}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.lv{padding:.8rem 1rem;border-radius:1rem;background:var(--panel);border:2px solid var(--line);text-align:start;transition:.15s}
.lv b{display:block;font-size:1.25rem;font-weight:900}
.lv small{color:var(--ink2);font-weight:600}
.lv.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.lv.hard.on{border-color:#ff6b4a;background:color-mix(in srgb,#ff6b4a 15%,transparent)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.6rem}
.ct{--cc:#888;display:flex;align-items:center;gap:.7rem;padding:.75rem .85rem;border-radius:1rem;background:color-mix(in srgb,var(--cc) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--cc) 45%,transparent);text-align:start;transition:.15s}
.ct:disabled{opacity:.35;pointer-events:none}
.ct:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--cc) 24%,transparent);border-color:var(--cc)}
.ct i{font-style:normal;font-size:1.9rem;flex:none}
.ct b{display:block;font-size:1.05rem;line-height:1.25}
.ct small{color:var(--ink3);font-weight:600;font-size:.8rem}
.qhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.qhead .sp{flex:1}
.qtext{font-size:clamp(1.8rem,1.2rem + 1.6vw,3.1rem);font-weight:800;line-height:1.45;text-align:center;padding:1.6rem .5rem 1.2rem;text-wrap:balance}
.qans{margin:0 auto 1rem;max-width:52rem;text-align:center;padding:1rem 1.2rem;border-radius:1.1rem;background:color-mix(in srgb,var(--ok) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--ok) 50%,transparent);animation:rise .35s ease both}
.qans small{display:block;color:var(--ink3);font-weight:800}
.qans b{display:block;font-size:clamp(1.6rem,1rem + 1.4vw,2.6rem);font-weight:900;line-height:1.35}
.qans p{color:var(--ink2);font-weight:600;margin-top:.3rem}
.qbtns{display:flex;justify-content:center;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:.4rem}
.ring{position:relative;width:3.6rem;height:3.6rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--panel2)}
.ring .fg{stroke:var(--gold);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem}
.ring.hurry .fg{stroke:var(--bad)}
.ring.hurry b{color:var(--bad);animation:beat .5s infinite}
.ring.up b{font-size:1.5rem}
@keyframes beat{50%{transform:scale(1.18)}}

/* المعركة */
.vsbar{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;align-items:stretch}
.side-c{--tc:#888;padding:.8rem 1rem;border-radius:1.1rem;background:color-mix(in srgb,var(--tc) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--tc) 60%,transparent);display:flex;align-items:center;gap:.8rem}
.side-c .em{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;font-size:1.7rem;background:var(--tc);flex:none}
.side-c b{display:block;font-size:1.3rem;font-weight:900}
.side-c small{color:var(--ink2);font-weight:700}
.side-c.def{flex-direction:row-reverse;text-align:end}
.vs{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.2rem;color:var(--war);text-shadow:0 0 18px rgba(255,90,95,.45)}
.stakes{margin:.8rem 0 1rem;padding:.7rem 1rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);font-weight:700;color:var(--ink2);display:grid;grid-template-columns:1fr 1fr;gap:.6rem;font-size:.98rem}
.stakes b{color:var(--ink)}
.b-q .qtext{padding:1.1rem .5rem .5rem}
.unit{text-align:center;color:var(--gold2);font-weight:800;font-size:1.1rem;margin-bottom:.9rem}
.gins{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;align-items:end;max-width:50rem;margin:0 auto}
.gbox{--tc:#888;display:flex;flex-direction:column;gap:.35rem;font-weight:800}
.gbox span{color:var(--tc)}
.gin{width:100%;font-family:var(--display);font-size:2.2rem;text-align:center;padding:.4rem .6rem;border-radius:1rem;border:2px solid color-mix(in srgb,var(--tc) 60%,transparent);background:rgba(0,0,0,.25);outline:none;direction:ltr}
[data-theme=light] .gin{background:#fff}
.gin:focus{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 25%,transparent)}
.gin:disabled{opacity:.85}
.snipers{max-width:50rem;margin:.9rem auto 0;padding:.7rem .9rem;border-radius:1rem;background:var(--panel);border:1px dashed var(--line)}
.snipers>small{display:block;color:var(--ink2);font-weight:700;margin-bottom:.45rem}
.sn-row{display:flex;gap:.6rem;flex-wrap:wrap}
.sn-row .gbox{flex:1;min-width:9rem;font-size:.9rem}
.sn-row .gin{font-size:1.4rem;padding:.25rem .5rem;border-width:1.5px}
.b-hint{text-align:center;color:var(--ink3);font-weight:600;font-size:.92rem;margin:.8rem 0 .4rem}
.nl{position:relative;direction:ltr;height:10.5rem;margin:1.2rem 1.5rem .4rem}
.nl .track{position:absolute;left:0;right:0;top:5.4rem;height:.35rem;border-radius:99px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2))}
.nl .edge{position:absolute;top:6.1rem;font-size:.8rem;color:var(--ink3);font-weight:700}
.nl .edge.l{left:0}
.nl .edge.r{right:0}
.mk{--tc:#888;position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1s cubic-bezier(.2,.9,.3,1),opacity .4s;opacity:0;white-space:nowrap}
.mk.in{opacity:1}
.mk .bub{direction:rtl;unicode-bidi:isolate;padding:.2rem .6rem;border-radius:.7rem;background:var(--tc);color:#fff;font-weight:900;font-size:1rem;box-shadow:0 6px 16px rgba(0,0,0,.3);display:flex;gap:.3rem;align-items:center}
.mk .stem{width:2px;background:var(--tc);flex:1;min-height:.6rem}
.mk.tmk{top:0;height:5.6rem;justify-content:flex-start}
.mk.tmk.r1{height:4rem;top:1.6rem}
.mk.tmk.r2{height:2.5rem;top:3.1rem}
.mk.tmk.sn .bub{font-size:.8rem;opacity:.85}
.mk.far .bub::after{content:'…';opacity:.7}
.mk.ans{top:5.3rem;--tc:var(--gold)}
.mk.ans .stem{height:.9rem;flex:none}
.mk.ans .bub{background:linear-gradient(135deg,#f3d98f,#c9962f);color:#241703;font-size:1.15rem}
.mk.win .bub{outline:3px solid #fff;outline-offset:2px}
.b-out{text-align:center;padding:.9rem 1rem;border-radius:1.1rem;margin:.6rem auto 1rem;max-width:56rem;border:1.5px solid color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 13%,transparent);animation:rise .4s ease both}
.b-out .big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.3}
.b-out .dl{color:var(--ink2);font-weight:700;margin:.25rem 0}
.b-out .eff{font-size:1.3rem;font-weight:900;margin-top:.3rem}
.b-out .ex{color:var(--gold2);font-weight:800;margin-top:.3rem}

/* الإعلانات */
.ann{position:fixed;top:13%;left:50%;transform:translate(-50%,-10px);z-index:85;pointer-events:none;display:flex;align-items:center;gap:1rem;padding:1rem 1.8rem;border-radius:1.4rem;background:var(--panel2);border:1.5px solid color-mix(in srgb,var(--ac,var(--gold)) 70%,transparent);box-shadow:var(--shadow),0 0 50px color-mix(in srgb,var(--ac,var(--gold)) 25%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .3s,transform .35s;max-width:92vw}
[data-theme=dark] .ann{background:rgba(14,22,42,.92)}
.ann.on{opacity:1;transform:translate(-50%,0)}
.ann .ai{font-size:2.6rem;line-height:1}
.ann b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.2}
.ann small{display:block;color:var(--ink2);font-weight:700;font-size:1.05rem}
.ann.small{padding:.6rem 1.2rem;top:auto;bottom:6%}
.ann.small .ai{font-size:1.5rem}
.ann.small b{font-family:inherit;font-size:1.1rem;font-weight:800}

/* المساعدة */
.help h3{font-size:1.25rem;margin:1rem 0 .4rem;color:var(--gold2)}
.help ul{margin:0;padding-inline-start:1.3rem;color:var(--ink2);font-weight:600;line-height:1.75}
.help li b{color:var(--ink)}
.help .cards-l{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.4rem}
.help .cards-l div{padding:.55rem .7rem;border-radius:.8rem;background:var(--panel);border:1px solid var(--line);font-weight:600;color:var(--ink2);font-size:.93rem}
.help .cards-l b{color:var(--ink);display:block}
.menu-l{display:flex;flex-direction:column;gap:.6rem}
.menu-l .btn{justify-content:flex-start}

/* النهاية */
#end{align-items:center;justify-content:center;overflow:auto}
.end-c{width:min(64rem,94vw);display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding:2rem 0}
.end-c .kicker{font-size:1.05rem}
.crown{font-size:4.5rem;line-height:1;animation:pop .9s cubic-bezier(.3,1.6,.5,1)}
.winner{--tc:var(--gold);font-family:var(--display);font-weight:700;font-size:clamp(3rem,9vmin,6rem);line-height:1.1;color:var(--tc);text-shadow:0 0 40px color-mix(in srgb,var(--tc) 45%,transparent)}
.end-sub{font-size:1.3rem;color:var(--ink2);font-weight:700}
.rank-t{width:100%;border-collapse:separate;border-spacing:0 .45rem}
.rank-t th{font-size:.85rem;color:var(--ink3);font-weight:800;padding:0 .6rem;text-align:center}
.rank-t th:nth-child(2){text-align:start}
.rank-t td{padding:.65rem .6rem;background:var(--panel);text-align:center;font-weight:800;font-size:1.1rem}
.rank-t td:first-child{border-radius:0 .9rem .9rem 0;font-size:1.5rem}
.rank-t td:last-child{border-radius:.9rem 0 0 .9rem;font-family:var(--display);font-size:1.7rem;color:var(--gold2)}
.rank-t td.nm{text-align:start}
.rank-t td.nm small{display:block;font-size:.8rem;color:var(--ink3);font-weight:600}
.rank-t tr.w td{background:color-mix(in srgb,var(--tc) 16%,transparent)}
.end-btns{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.4rem}

@media (max-width:1000px){
  body{overflow:auto}
  #app{position:relative;min-height:100%}
  .screen{position:relative;min-height:100vh}
  .main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .side{order:2;border:0}
  .mapwrap{order:1;height:70vh}
  .stakes,.gins{grid-template-columns:1fr}
  .vsbar{grid-template-columns:1fr}
  .vs{font-size:1.6rem}
  .side-c.def{flex-direction:row;text-align:start}
  .top{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fantasy-edition{font-size:1.2rem;font-weight:800;color:var(--gold2)}
.brand small{font-size:.75em;color:var(--ink2)}
.bank-count{font-size:.72rem;font-weight:600;color:var(--ink3);margin-inline-start:.4rem}
.seg.list button small{white-space:normal}
.seg.list button:has(.map-mini){grid-template-columns:4rem 1fr}
.map-mini svg{display:block;width:4rem;height:3.2rem}
.tlabels .nm{paint-order:stroke;stroke:var(--sea2);stroke-width:3.5px;stroke-linejoin:round}
.rlabels .rn{font-size:18px}.rlabels .rb{font-size:13px}

.design-toggle{white-space:nowrap;min-height:2.6rem}
[data-design=atlas] [data-act=theme]{display:none}
[data-design=atlas]{--bg:#f4ecd9;--bg2:#e5dac2;--sea1:#e4e9dd;--sea2:#dce3d5;--panel:#faf4e7;--panel2:#fff9ed;--line:#c8b996;--ink:#263a3b;--ink2:#53605a;--ink3:#75674e;--gold:#a27934;--gold2:#76551e;--land:#f2e5c9;--ctx:#d7dbc9;--border:#8c7858;--cborder:#b8ab8e;--tokn:#fff7e3;--tokr:#947b4f;--halo:#f8edda;--grid:#bac5b02b;--link:#777f59;--r:5px;--shadow:0 5px 18px #56442516}
[data-design=atlas] .bg{background:var(--bg)}
[data-design=atlas] .title{background:none;color:#263a3b;-webkit-text-fill-color:currentColor;filter:none}
[data-design=atlas] .top,[data-design=atlas] .side{background:#f7efdd;border-color:#c8b996}
[data-design=atlas] .card,[data-design=atlas] .sheet,[data-design=atlas] .tm,[data-design=atlas] .selbox{border-radius:5px;backdrop-filter:none}
[data-design=atlas] .btn,[data-design=atlas] .seg button,[data-design=atlas] .act{border-radius:4px}
[data-design=atlas] .btn.gold{background:#2d4847;color:#fff5dd;border-color:#2d4847;box-shadow:0 3px 8px #233b3220}
[data-design=atlas] .trow,[data-design=atlas] .turn{background:color-mix(in srgb,var(--tc,#b49b65) 9%,#faf3e3)}
[data-design=atlas] .fills .cf{fill-opacity:.48}
[data-design=atlas] .tlabels .nm{fill:#263a3b;stroke:#f8edda;stroke-width:4px}
[data-design=atlas] .mesh-a{stroke:#8c7858;stroke-width:1.7}
[data-design=atlas] .rl{filter:none}
[data-design=atlas] .rl .rn,[data-design=atlas] .rl .rb{fill:#59654e;stroke:#f8edda}

    if (e) { announce(e.icon, `مستمر: ${e.name}`, `باقي ${plural(left, 'جولة', 'جولات')}`, { color: '#f3d98f', ms: 2400 }); return; }

  if (Math.random() * 100 >= E.chance) { feed('🎴 جولة هادية: ما فيه حدث'); announce('🎴', 'جولة هادية', 'ما فيه حدث هالجولة', { ms: 1800 }); return; }
  const fit = noRepeat => evList(E).filter(e => {
    const c = evCfg(E, e.k);
    return c.on && (!noRepeat || e.k !== G.evLast) && (c.rep || !G.evUsed.includes(e.k)) && (!e.cards || G.opt.cards) && (!e.forts || fortsOn()) && (!e.free || G.own.some(o => o < 0)) && (e.k !== 'quake' || G.fort.some(Boolean));

function setupAct(act, b) {
  const i = +b.dataset.i;

      const used = new Set(S.teams.map(t => t.color)), names = new Set(S.teams.map(t => t.name));
      const pr = TEAM_PRESETS.find(p => !names.has(p.name)) || TEAM_PRESETS[0];
      S.teams.push({ name: pr.name, emblem: pr.emblem, color: [...COLORS.keys()].find(k => !used.has(k)) ?? 0 });
      break;
    }
    case 'rmteam': S.teams.splice(i, 1); break;
    case 'col': {
      const c = +b.dataset.c, other = S.teams.findIndex((t, k) => k !== i && t.color === c);
      if (other >= 0) S.teams[other].color = S.teams[i].color;
      S.teams[i].color = c; break;
    }
    case 'emo': {
      const d = dialog(`<div class="sh-top"><h2>اختر شعار الفريق</h2></div><div class="emo-grid">${EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join('')}</div>`);
      d.querySelectorAll('[data-e]').forEach(x => x.onclick = () => { S.teams[i].emblem = x.dataset.e; closeDialog(); saveSetup(); renderSetup(); });
      return;
    }
    case 'rnd': S.rounds = Math.max(3, Math.min(20, S.rounds + +b.dataset.d)); S.autoRounds = false; break;
    case 'timer': S.timer = +b.dataset.s ? 1 : 0; break;
    case 'opt': S[b.dataset.k] = !S[b.dataset.k]; break;
    case 'mode': S.mode = b.dataset.v; break;
    case 'map': S.map = b.dataset.v; useMap(S.map); break;
    case 'dist': S.dist = b.dataset.v; break;
    case 'fon': S.forts.on = !S.forts.on; break;
    case 'fkind': S.forts.kind = b.dataset.v; break;
    case 'fmax': S.forts.max = +b.dataset.v; break;
    case 'freb': S.forts.rebuild = +b.dataset.v; break;
    case 'fcap': S.forts.cap = !S.forts.cap; break;
    case 'nameset': S.nameCategory = b.dataset.v; break;
    case 'rerollnames': S.nameRound++; break;
    case 'evon': S.evs.on = !S.evs.on; break;
    case 'mson': S.missions.on = !S.missions.on; break;
    case 'msb': S.missions.bonus = +b.dataset.v; break;
    case 'sesel': SEA.active = b.dataset.v || null; saveSeason(); { const nx = seasonNext(curSeason()); if (nx) { S.map = nx; useMap(nx); } } break;
    case 'senew': return newSeason();
    case 'setable': return openSeason();
    case 'evch': S.evs.chance = +b.dataset.v; break;
    case 'evst': S.evs.start = +b.dataset.v; break;
    case 'evedit': return editEvents();
    case 'names': return editNames();
    case 'cat': { const k = b.dataset.k; if (S.cats.includes(k)) { if (S.cats.length <= 3) return toast('لازم 3 فئات على الأقل'); S.cats = S.cats.filter(x => x !== k); } else S.cats.push(k); break; }
    case 'ncat': { const k = b.dataset.k; if (S.ncats.includes(k)) { if (S.ncats.length <= 1) return toast('لازم فئة أرقام وحدة على الأقل'); S.ncats = S.ncats.filter(x => x !== k); } else S.ncats.push(k); break; }
    case 'cats': S.cats = CATS.map(c => c.key).filter(hasQ); break;
    case 'ncats': S.ncats = NCATS.map(c => c.key).filter(hasN); break;
    default: return;
  }
  if ((act === 'addteam' || act === 'rmteam') && S.autoRounds) S.rounds = REC_ROUNDS[S.teams.length];
  if (S.teams.length > 5 && S.dist === 'region') S.dist = 'even';

}

/* ===================== حالة اللعبة ===================== */
let G = null, hist = [], sel = null, busy = false, flow = 0, fxq = [], QX = null, BX = null;
const save = () => { if (G) store.set(K_SAVE, G); };
function snapshot() { const s = JSON.stringify(G); if (hist[hist.length - 1] !== s) hist.push(s); if (hist.length > 80) hist.shift(); }
const N = () => G.teams.length;
const tName = i => { const t = G.teams[i]; return `<span class="tc" style="--tc:${t.color}">${t.emblem} ${esc(t.name)}</span>`; };
const tPlain = i => `${G.teams[i].emblem} ${G.teams[i].name}`;
const idxs = f => { const r = []; for (let i = 0; i < NT; i++) if (f(i)) r.push(i); return r; };
const mine = i => idxs(t => G.own[t] === i);
const truced = i => G.teams[i].truce > G.turnNo;
function feed(html) { G.feed.unshift(html); if (G.feed.length > 30) G.feed.length = 30; }

function scoreOf(i) {
  let lands = 0, caps = 0, forts = 0;
  for (let t = 0; t < NT; t++) if (G.own[t] === i) { lands++; if (G.cap[t] >= 0) caps++; if (G.fort[t]) forts++; }
  const regs = REGK.filter(k => REG[k].members.every(t => G.own[t] === i));
  const bonus = regs.reduce((s, k) => s + REG[k].bonus, 0);
  return { lands, caps, forts, regs, bonus, total: lands + caps * 2 + bonus };
}
function ranking(final) {
  const s = G.teams.map((_, i) => ({ ...scoreOf(i), total: scoreOf(i).total + (final ? missionBonus(i) : 0) }));
  return G.teams.map((_, i) => i).sort((a, b) => s[b].total - s[a].total || s[b].lands - s[a].lands || s[b].forts - s[a].forts || a - b);
}

// الأهداف المتاحة لكل إجراء
function expandTargets(i) {
  const free = idxs(t => G.own[t] < 0);
  if (G.air || !mine(i).length) return free;
  return free.filter(t => nb(t).some(a => G.own[a] === i));
}
function attackTargets(i) {
  if (G.ev === 'calm') return [];
  const enemy = idxs(t => G.own[t] >= 0 && G.own[t] !== i && !truced(G.own[t]));
  if (G.air || !mine(i).length) return enemy;
  return enemy.filter(t => nb(t).some(a => G.own[a] === i));
}
const FORTS_OFF = { on: false, kind: 'edge', max: 0, rebuild: 0, cap: false };
const fortsOn = () => !!G.opt.forts.on;
function fortCap(i) { const f = G.opt.forts; if (!f.on) return 0; if (!f.max) return 99; return Math.max(0, f.max - scoreOf(i).forts); }
const canFort = t => !G.fort[t] && !(G.ruin[t] > G.turnNo);
const fortTargets = i => fortCap(i) > 0 ? idxs(t => G.own[t] === i && canFort(t)) : [];
function breakFort(t) { G.fort[t] = 0; G.ruin[t] = G.turnNo + (G.opt.forts.rebuild || 0) * N(); fxq.push({ t, k: 'crack' }); }
const ramOn = () => !!G.ram || G.ev === 'siege';
const shieldHolds = t => G.fort[t] && G.opt.forts.kind === 'shield' && !ramOn();
const nb = t => G.ev === 'storm' ? ADJL[t] : ADJ[t];
const cardPool = () => CARD_KEYS.filter(k => fortsOn() || (k !== 'fort' && k !== 'ram'));
function originsFor(i, target) { const m = mine(i); return G.air ? m : m.filter(t => nb(target).includes(t)); }
function capCandidates() {
  if (G.opt.mode === 'war') return mine(G.capPick).filter(t => G.cap[t] < 0);
  const caps = idxs(t => G.cap[t] >= 0), free = idxs(t => G.own[t] < 0);
  const c = free.filter(t => !caps.some(k => ADJ[k].includes(t)));
  return c.length ? c : free;
}

// الأسئلة: تتجنب المكرر بين الألعاب
function drawFrom(pool) {
  const used = new Set(store.get(K_USED, []));
  let fresh = pool.filter(q => !used.has(q.id));
  if (!fresh.length) { const ids = new Set(pool.map(q => q.id)); store.set(K_USED, [...used].filter(id => !ids.has(id))); fresh = pool; }
  const q = pickOne(fresh);
  const u = store.get(K_USED, []); u.push(q.id); store.set(K_USED, u.slice(-900));
  return q;
}
function drawQ(cat, lvl, not) {
  let pool = QS.filter(q => q.cat === cat && q.lvl === lvl && q.id !== not);
  if (!pool.length) pool = QS.filter(q => q.cat === cat && q.id !== not);
  if (!pool.length) pool = QS.filter(q => q.id !== not);
  return drawFrom(pool.length ? pool : QS);
}
function drawN(cat, not) {
  let pool = NQS.filter(q => q.cat === cat && q.id !== not);
  if (!pool.length) pool = NQS.filter(q => q.id !== not);
  return drawFrom(pool.length ? pool : NQS);
}
const leftQ = (cat, lvl) => { const used = new Set(store.get(K_USED, [])); return QS.filter(q => q.cat === cat && q.lvl === lvl && !used.has(q.id)).length; };

function giveCard(i, k, why = '') {
  if (!G.opt.cards) return null;
  const t = G.teams[i];
  if (t.cards.length >= 3) { toast(`أوراق ${t.name} ممتلئة (3)`, '🃏'); return null; }
  k = k || pickOne(cardPool()); t.cards.push(k);
  feed(`${tName(i)} حصل على ورقة ${CARDS[k].icon} ${CARDS[k].name}${why ? ' (' + why + ')' : ''}`);
  return k;
}
function checkRegions() {
  for (const k of REGK) {
    if (G.regFirst[k] != null) continue;
    const o = G.own[REG[k].members[0]];
    if (o >= 0 && REG[k].members.every(t => G.own[t] === o)) {
      G.regFirst[k] = o;
      feed(`👑 ${tName(o)} أول من سيطر على ${REG[k].name} كاملًا`);
      announce('👑', `${tPlain(o)} سيطر على ${REG[k].name}`, `+${REG[k].bonus} نفوذ ما دام محافظ عليه${G.opt.cards ? ' + ورقة نفوذ' : ''}`, { color: G.teams[o].color, ms: 2300 });
      giveCard(o, null, 'أول سيطرة على إقليم');
    }
  }
}
function takeTerr(t, i) {
  const prev = G.own[t];
  G.own[t] = i;
  fxq.push({ t, k: 'cap', c: G.teams[i].color });
  if (G.cap[t] >= 0 && prev >= 0 && prev !== i) {
    G.teams[i].st.caps++;
    const pc = G.teams[prev].cards;
    if (G.opt.cards && pc.length && G.teams[i].cards.length < 3) {
      const k = pc.splice(rand(pc.length), 1)[0]; G.teams[i].cards.push(k);
      feed(`${tName(i)} أسر عاصمة وأخذ ورقة ${CARDS[k].icon} من ${tName(prev)}`);
    }
    announce('👑', `${tPlain(i)} أسر عاصمة في ${TN[t]}!`, 'العاصمة تساوي 3 نقاط نفوذ', { color: G.teams[i].color });
  }
  checkRegions();
}

// مود المعركة: الخريطة توزّع من البداية
function dealLands() {
  const n = N();
  if (G.opt.dist === 'region' && n <= REGK.length) {
    shuffle(REGK).slice(0, n).forEach((k, i) => REG[k].members.forEach(t => { G.own[t] = i; }));
    return;
  }
  // متوازن: بذرة لكل فريق ثم تكبر كل كتلة أرضًا متجاورة كل مرة، والزيادة للفرق اللي تلعب آخر
  shuffle([...Array(NT).keys()]).slice(0, n).forEach((t, i) => { G.own[t] = i; });
  const order = [...Array(n).keys()].reverse();
  while (G.own.some(o => o < 0)) for (const k of order) {
    const free = idxs(t => G.own[t] < 0); if (!free.length) break;

    case 'expand': sel.target = t; openQPick(); break;

      else { sel.mode = 'origin'; sel.targets = o; render(); }

    }

function useCard(k) {

};

function assignMissions() {
  const n = N(), types = Object.keys(MISSIONS).filter(k => !MISSIONS[k].ok || MISSIONS[k].ok());
  let bag = shuffle(types);
  G.missions = G.teams.map((_, i) => {
    if (!bag.length) bag = shuffle(types);
    const type = bag.pop(), m = { type };
    if (type === 'region') { const opts = REGK.filter(k => !REG[k].members.every(t => G.own[t] === i)); m.r = pickOne(opts.length ? opts : REGK); }
    if (type === 'capitals') m.k = 2;
    if (type === 'hunt') m.t = pickOne(G.teams.map((_, k) => k).filter(k => k !== i));
    if (type === 'lands') m.k = Math.ceil(NT / n * 1.35);
    if (type === 'forts') m.k = Math.min(3, G.opt.forts.max || 3);
    if (type === 'wins') m.k = Math.max(2, Math.round(G.rounds / 3));
    return m;

function resume() {

}

// اللصق الجماعي: سطر لكل سؤال، والأجزاء مفصولة بـ | أو Tab (من Excel)
const lvlTok = t => /^(صعب|2|hard)$/i.test(t || '') ? 2 : /^(عادي|سهل|1)$/i.test(t || '') ? 1 : 0;
const unitTok = t => /^(م|ميلادي|ميلادية)$/.test(t || '') ? 'م' : /^(هـ|ه|هجري|هجرية)$/.test(t || '') ? 'هـ' : (t || '');
function parseBulk(kind, text, def) {
  const ok = [], bad = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const p = l.split(/\s*[|\t]\s*/).map(x => x.trim());
    if (p.length < 2 || !p[0] || !p[1]) return bad.push(l);
    if (kind === 'q') {
      const lv = lvlTok(p[2]);
      ok.push({ id: 'u' + uid(), lvl: lv || def, q: p[0], a: p[1], note: (lv ? p.slice(3) : p.slice(2)).filter(Boolean).join(' | ') });
    } else {
      const a = parseNum(p[1]); if (a == null) return bad.push(l);
      ok.push({ id: 'u' + uid(), q: p[0], a, unit: p[2] ? unitTok(p[2]) : def, note: p.slice(3).filter(Boolean).join(' | ') });
    }
  });
  return { ok, bad };
}

  };

    case 'msview': { const i = +b.dataset.i; return confirmBox('عرض المهمة السرية؟', `بتنعرض مهمة «${esc(G.teams[i].name)}» على الشاشة. تأكد إن بقية الفرق ما تشوف.`, 'اعرضها', () => revealMission(i, null)); }
    case 'season': SFX.click(); return openSeason();
    case 'setable': return openSeason(G && G.phase === 'over' && G.opt.season);
    case 'menu': SFX.click(); return openMenu();
    case 'undo': return undo();
    case 'randcaps': SFX.pick(); return randomCaps();
    case 'do': return chooseAction(b.dataset.a);
    case 'cancel': return cancelSel();
    case 'card': return useCard(b.dataset.k);
    case 'ov-cancel': SFX.click(); closeOv(); QX = null; BX = null; if (sel && sel.act === 'attack') { sel.mode = 'attack'; sel.targets = attackTargets(G.cur); } render(); return;
    case 'q-reveal': return revealQ();
    case 'q-swap': if (QX && !QX.revealed) { SFX.click(); openQuestion(drawQ(QX.q.cat, QX.lvl, QX.q.id), QX); } return;
    case 'q-ok': return judgeQ(true);
    case 'q-no': return judgeQ(false);
    case 'b-reveal': return revealBattle();
    case 'b-swap': if (BX && !BX.revealed) { SFX.click(); openBattle(drawN(BX.cat, BX.nq.id)); } return;
    case 'b-redo': return redoBattle();
    case 'b-done': return finishBattle();
    case 'q-edit': if (QX) editQ(QX.q.cat, QX.q.id, { onSaved: (rec, cid) => { QX.q = { ...rec, cat: cid }; const d = $('#ov'); if (!d) return; d.querySelector('.qtext').textContent = rec.q; d.querySelector('.qans').innerHTML = qansHTML(rec); } }); return;
    case 'b-edit': if (BX) editN(BX.nq.cat, BX.nq.id, { onSaved: (rec, cid) => { BX.nq = { ...rec, cat: cid }; const t = $('#ov .qtext'); if (t) t.textContent = rec.q; toast('انحفظ، والتعديل يسري على المعارك الجاية', '✏️'); } }); return;
    case 'editor': SFX.click(); return openEditor('home');
    case 'editor-setup': SFX.click(); return openEditor('setup');
    default: if (act.startsWith('ed-')) return editorAct(act, b);
  }
});
$('#encFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importEncyclopedia(f); });
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importDB(f); });
document.addEventListener('input', e => {
  const inp = e.target.closest('.t-name'); if (!inp) return;
  S.teams[+inp.dataset.i].name = inp.value; saveSetup();
});
document.addEventListener('keydown', e => {
  const tgt = e.target && e.target.closest ? e.target : document.body;
  if (e.key === 'Escape') {
    if ($('#dlg')) return closeDialog();
    if (ovOpen()) { const c = $('#ov [data-act=ov-cancel]'); if (c) c.click(); return; }
    if (sel && sel.mode !== 'fort2') return cancelSel();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && $('#dlg [data-x=save]')) { e.preventDefault(); return $('#dlg [data-x=save]').click(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !tgt.closest('input,textarea,select')) { e.preventDefault(); return undo(); }
  if (tgt.closest('input,textarea,select') || $('#dlg')) return;
  if (e.key === 'Enter' || e.key === ' ') {
    if (QX && !QX.revealed && $('#ov')) { e.preventDefault(); return revealQ(); }
    if (BX && BX.revealed && $('#ov [data-act=b-done]')) { e.preventDefault(); return finishBattle(); }
    if (BX && !BX.revealed && $('#ov')) { e.preventDefault(); return revealBattle(); }
  }
  if (e.key === 'f' || e.key === 'F') { if (!ovOpen()) toggleFS(); }
});
(() => {
  const svg = $('#map');
  svg.addEventListener('click', e => { const g = e.target.closest('[data-i]'); if (g) onTerr(+g.dataset.i); });
  svg.addEventListener('mousemove', e => { const g = e.target.closest('[data-i]'); if (g && !ovOpen()) showTip(+g.dataset.i, e); else hideTip(); });
  svg.addEventListener('mouseleave', hideTip);
})();

applyTools();
show('home');
refreshHome();
</script>
</body>
</html>
