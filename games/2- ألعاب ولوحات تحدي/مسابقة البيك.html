<style>
/* ==========================================================================
   «مشهد حي»: كل لوحة داخل مشهدها (خلفية SVG بطبقات وحركة خفيفة) + خانات بشكل عالمها
   ========================================================================== */
:root{
  --ink:#2b2350;--mut:#6d6690;--line:rgba(43,35,80,.12);
  --acc:#ff7a1a;--acc2:#c95400;--acc-ink:#fff;--good:#18b26b;--bad:#ef4b4b;
  --plate:#fff7d6;--plate2:#ffe08a;--plate-edge:#c98a00;--plate-ink:#6b3d00;
  --disp:Lalezar,Tajawal,"Segoe UI",Tahoma,sans-serif;--body:Tajawal,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --shadow:0 .6rem 1.6rem rgba(43,35,80,.16);
}
body[data-th="hive"]{--ink:#4a2c00;--mut:#8a6420;--acc:#ff9f1c;--acc2:#b55400}
body[data-th="forest"]{--ink:#173a22;--mut:#3e6a4a;--acc:#22a55a;--acc2:#147a3e;--plate:#fff8e6;--plate2:#c9f0b8;--plate-edge:#2a8a4a;--plate-ink:#173a22}
body[data-th="baik"]{--ink:#5a1a08;--mut:#9a4a2a;--acc:#e8342b;--acc2:#9e1f1c;--plate:#fff;--plate2:#ffe1c2;--plate-edge:#e8342b;--plate-ink:#9e1f1c}
body[data-th="emoji"]{--ink:#0f3557;--mut:#3b6a90;--acc:#ff7a1a;--acc2:#c95400;--plate:#fff;--plate2:#ffeb94;--plate-edge:#1fa3ff;--plate-ink:#0f3557}
body[data-th="kardees"]{--ink:#3a2410;--mut:#7a5a30;--acc:#7c4dff;--acc2:#4a26c2;--plate:#fff6dc;--plate2:#f0d9a0;--plate-edge:#a0522d;--plate-ink:#5a3410}
body[data-th="hunt"]{--ink:#4a3410;--mut:#86652a;--acc:#f4762a;--acc2:#b54a10;--plate:#fff7ec;--plate2:#ffd6a5;--plate-edge:#cf7a2a;--plate-ink:#5a3410}
body[data-th="lanes"]{--ink:#1f2937;--mut:#5b6575;--acc:#2f80ed;--acc2:#1a56b0;--plate:#fff;--plate2:#e3efff;--plate-edge:#2f80ed;--plate-ink:#1f2937}
body[data-th="dive"]{--ink:#0b3a55;--mut:#2f6d8a;--acc:#00a3c4;--acc2:#00708a;--plate:#f3fcff;--plate2:#bdf0ff;--plate-edge:#00a3c4;--plate-ink:#0b3a55}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#fff7e6;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.on{display:flex}
/* المشهد */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
body.gold #scene::after{background:radial-gradient(ellipse at 50% 50%,rgba(255,236,140,.35),rgba(255,196,0,.28) 70%);animation:goldpulse 3s ease-in-out infinite}
@keyframes goldpulse{50%{opacity:.6}}
.sc-drift{animation:sc-drift var(--d,40s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes sc-drift{from{transform:translateX(-140px)}50%{transform:translateX(140px)}to{transform:translateX(-140px)}}
.sc-spin{animation:sc-spin var(--d,90s) linear infinite}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.sc-bob{animation:sc-bob var(--d,5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes sc-bob{50%{transform:translateY(-14px)}}
.sc-fly{animation:sc-fly var(--d,16s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes sc-fly{0%{transform:translate(0,0)}25%{transform:translate(160px,-50px)}50%{transform:translate(280px,30px)}75%{transform:translate(120px,70px)}100%{transform:translate(0,0)}}
.sc-sway{animation:sc-sway var(--d,7s) ease-in-out infinite alternate}
@keyframes sc-sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.sc-sway2{animation:sc-sway2 4s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes sc-sway2{to{transform:skewX(3deg)}}

/* الخانات: الشكل الأساسي */
.board{display:grid;gap:var(--gap,9px);width:var(--bw);direction:rtl;perspective:900px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:22%;cursor:pointer;display:grid;place-items:center;font-family:var(--disp);font-size:calc(var(--ts)*.4);color:#5a2e00;transition:transform .15s,filter .15s;background:linear-gradient(180deg,#ffd84a,#f08c00);box-shadow:0 calc(var(--ts)*.07) 0 rgba(0,0,0,.25),0 calc(var(--ts)*.12) calc(var(--ts)*.2) rgba(0,0,0,.15)}

@keyframes sus{0%{transform:scale(1)}15%{transform:scale(1.18) rotate(-6deg)}30%{transform:scale(1.18) rotate(6deg)}45%{transform:scale(1.2) rotate(-5deg)}60%{transform:scale(1.22) rotate(5deg)}80%{transform:scale(1.25) rotate(-2deg);filter:brightness(1.3) drop-shadow(0 0 14px #fff)}100%{transform:scale(1.25);filter:brightness(1.4) drop-shadow(0 0 20px #fff)}}

/* الغابة: لوحات خشب */

/* كراديس: مربعات خريطة */
.sk-kardees .tile{border-radius:10%;background:radial-gradient(circle at 30% 25%,#fffaf0,#f3dfae 70%,#e2c07c);box-shadow:inset 0 0 0 calc(var(--ts)*.035) #a0522d,inset 0 0 0 calc(var(--ts)*.07) #fff3d0,0 calc(var(--ts)*.06) 0 #8a5a2c,0 calc(var(--ts)*.1) calc(var(--ts)*.18) rgba(0,0,0,.2)}
.sk-kardees .tile .num{color:#fff;background:radial-gradient(circle at 35% 30%,#ff6b5b,#b81f17);width:62%;aspect-ratio:1;border-radius:46% 54% 50% 50%;display:grid;place-items:center;box-shadow:0 .15rem .3rem rgba(0,0,0,.3),inset 0 0 0 calc(var(--ts)*.03) rgba(255,255,255,.25);font-size:.85em}
/* صيد الغابة: أهداف رماية */
.sk-hunt .tile{border-radius:50%;background:radial-gradient(circle,#ffd23f 0 27%,#e8342b 27.5% 41%,#3d8bff 41.5% 55%,#2a2a30 55.5% 70%,#fff 70.5% 96%,#c9ced6 96.5%);color:#5a2e00;text-shadow:0 1px 0 #fff;box-shadow:0 calc(var(--ts)*.06) 0 #8a8f99,0 calc(var(--ts)*.12) calc(var(--ts)*.2) rgba(0,0,0,.22)}
.sk-hunt .tile .num{font-size:.75em}
.sk-hunt .tile.open{border-radius:50%}
/* الغوص: محار مقفّل */
.sk-dive .tile{border-radius:50% 50% 44% 44%/62% 62% 38% 38%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 40%),repeating-conic-gradient(from 270deg at 50% 92%,#e9dccb 0 9deg,#cdb89c 9deg 13deg),#d9c8ae;color:#fff;text-shadow:0 2px 3px rgba(80,50,20,.6);box-shadow:inset 0 calc(var(--ts)*-.07) 0 #b49a78,0 calc(var(--ts)*.06) 0 #8f7656,0 calc(var(--ts)*.12) calc(var(--ts)*.2) rgba(0,40,60,.3)}
.sk-dive .tile .num{font-size:.85em}
.sk-dive .tile.open{border-radius:22%}
/* اللوحة الذهبية */
.sk-gold .tile{border-radius:18%;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%) -200% 0/300% 100%,radial-gradient(circle at 40% 30%,#fff7c0,#ffd23f 50%,#d99a00);color:#6b4400;text-shadow:0 2px 0 #fff3a8;box-shadow:0 0 0 calc(var(--ts)*.04) #fff,0 calc(var(--ts)*.07) 0 #a87400,0 0 calc(var(--ts)*.3) rgba(255,210,63,.8);animation:shine 2.6s linear infinite}
.sk-gold .tile:nth-child(3n){animation-delay:-.9s}.sk-gold .tile:nth-child(3n+1){animation-delay:-1.7s}
@keyframes shine{to{background-position:200% 0,0 0}}
.board.round .tile{border-radius:50%}
.regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;width:var(--bw)}
.region{--rc:#2b8;border-radius:1.4rem;padding:.5rem .7rem .8rem;background:color-mix(in srgb,var(--rc) 25%,#fff) var(--img,none) center/cover;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--rc) 70%,#fff),var(--shadow);position:relative;overflow:hidden}
.region::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05))}
.region h3{position:relative;margin:0 auto .45rem;font-family:var(--disp);font-weight:400;font-size:clamp(1.05rem,2.7vh,1.5rem);text-align:center;color:#fff;background:color-mix(in srgb,var(--rc) 80%,#000);border-radius:99px;width:max-content;padding:.05rem 1rem 0;box-shadow:0 .2rem .4rem rgba(0,0,0,.25)}
.region .board{width:100%;position:relative}

/* كشف الخانة */
.ov{position:fixed;inset:0;background:rgba(30,20,60,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:1rem;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.reveal{position:relative;background:#fff;border-radius:2rem;padding:1.3rem 2rem 1.5rem;width:min(42rem,100%);max-height:94vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:.7rem;align-items:center;animation:pop .5s both;box-shadow:0 0 0 .5rem rgba(255,255,255,.55),0 2rem 4rem rgba(43,35,80,.35);border-top:.7rem solid var(--acc)}
.reveal::before{content:"";position:fixed;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 8deg,transparent 8deg 16deg);animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}65%{transform:scale(1.05) rotate(1deg)}}
.reveal .art{width:clamp(9rem,30vh,17rem);aspect-ratio:1;border-radius:1.6rem;overflow:hidden;background:#fff;box-shadow:0 0 0 .45rem #fff,0 0 0 .7rem var(--rc,var(--acc)),0 1rem 1.6rem rgba(0,0,0,.25);transform:rotate(-3deg);animation:wob 1.1s .3s;display:grid;place-items:center;position:relative}
.reveal .art img{width:100%;height:100%;object-fit:cover}.reveal .art img.obj{width:86%;height:86%;object-fit:contain}
.reveal .art .emo{font-size:clamp(6rem,20vh,10rem);line-height:1;filter:var(--hue,none)}
.reveal .art::after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,255,255,.45),transparent 40%);pointer-events:none}
@keyframes wob{30%{transform:rotate(-12deg) scale(1.1)}60%{transform:rotate(6deg)}100%{transform:rotate(-3deg)}}
.reveal h3{font-family:var(--disp);font-weight:400;font-size:clamp(2.1rem,6.2vh,3.4rem);margin:.3rem 0 0;line-height:1.1;color:var(--ink)}
.reveal .eff{font-family:var(--disp);font-size:clamp(1.6rem,4.6vh,2.6rem);line-height:1.25}
.reveal .eff.good{color:var(--good)}.reveal .eff.bad{color:var(--bad)}.reveal .eff.acc{color:var(--acc)}
.reveal .eff.small{font-size:clamp(1.2rem,3.4vh,1.8rem)}
.reveal p{margin:0;font-weight:700;font-size:clamp(1rem,2.5vh,1.25rem);color:var(--mut);line-height:1.6}
.runbox{display:flex;flex-direction:column;gap:.5rem;align-items:center;background:linear-gradient(180deg,#fffbe6,#fff1c2);border:3px dashed #ffb300;border-radius:1.2rem;padding:.6rem 1.2rem;width:100%}
.runbox .potv{font-family:var(--disp);font-size:clamp(1.8rem,5vh,2.6rem);color:#e86a00;line-height:1.1}
.pick{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.pick button{--tc:#888;border:0;background:color-mix(in srgb,var(--tc) 16%,#fff);box-shadow:inset 0 0 0 2.5px var(--tc),0 .25rem 0 color-mix(in srgb,var(--tc) 50%,#fff);border-radius:1rem;padding:.45em 1em .45em .7em;font-weight:800;cursor:pointer;font-size:1.1rem;display:inline-flex;align-items:center;gap:.4em}
.pick button img{width:2rem;height:2rem}
.pick button:hover{background:var(--tc);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%}
.two .opt{border:0;border-radius:1.4rem;background:#faf7ff;box-shadow:inset 0 0 0 3px #b9a3ff;padding:.8rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:800}
.two .opt:hover{background:#efe8ff;transform:translateY(-3px)}
.two .opt .art{width:clamp(7rem,22vh,12rem)}
.dlg{background:#fff;border-radius:1.6rem;padding:1.3rem 1.4rem;width:min(60rem,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:.8rem;box-shadow:0 2rem 4rem rgba(43,35,80,.3)}
.dlg h3{margin:0;font-family:var(--disp);font-weight:400;font-size:1.9rem}
.react{border-top-color:#7c4dff}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.6rem}
.egrid button{border:0;background:#f7f5ff;border-radius:1rem;padding:.4rem;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:transform .12s}
.egrid button:hover{transform:scale(1.07)}
.egrid button.on{box-shadow:inset 0 0 0 3px var(--acc);background:#fff}
.egrid img{width:100%;display:block}
.swatches{display:flex;gap:.45rem;flex-wrap:wrap}
.swatches button{width:2.3rem;height:2.3rem;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ddd;cursor:pointer}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
.ed-table{width:100%;border-collapse:collapse}
.ed-table td,.ed-table th{padding:.25rem .3rem;text-align:start;font-weight:700}
.ed-table th{color:var(--mut);font-size:.85rem}
.ed-table .fld{width:100%}
.ed-table .e{width:3.4rem;text-align:center;font-size:1.3rem}
.ed-table .v{width:5rem}
.ed-table .thumb{width:2.6rem;height:2.6rem;border-radius:.6rem;object-fit:cover;display:block}
/* كراديس: كل فريق يصمّم لوحته */
.kd-grid{display:grid;grid-template-columns:repeat(var(--kc,5),1fr);gap:.5rem}
.kd-cell{display:flex;flex-direction:column;gap:.15rem}
.kd-cell span{font-size:.75rem;color:var(--mut);font-weight:800;text-align:center}
.kd-cell input{text-align:center;font-size:1.3rem;font-family:var(--disp);padding:.4em .2em;width:100%}
.kd-cell input.bad{border-color:var(--bad);background:#fff1f1}
.kd-cell input:disabled{opacity:.45}
.kd-cell b{font-size:.78rem;text-align:center;min-height:1.2em;color:var(--mut)}
.kd-budget{font-weight:800;padding:.45rem .9rem;border-radius:.8rem;background:color-mix(in srgb,var(--acc) 14%,#fff)}
.kd-budget.over{background:#ffe1e1;color:var(--bad)}
.kd-legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-weight:700;font-size:.92rem;color:var(--mut)}
.kd-legend code{font-family:var(--disp);color:var(--ink);background:color-mix(in srgb,var(--acc) 14%,#fff);border-radius:.4rem;padding:0 .45rem;font-size:1.1rem}
.vtabs{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.85);border-radius:99px;padding:.25rem .5rem}
.vtabs button{--tc:#888;border:0;border-radius:99px;padding:.3em .9em;font-weight:800;background:color-mix(in srgb,var(--tc) 14%,#fff);box-shadow:inset 0 0 0 2px var(--tc);cursor:pointer;color:var(--ink)}
.vtabs button.on{background:var(--tc);color:#fff}
/* إيموجي: التحديات */
.chal{font-family:var(--disp);font-size:clamp(2.2rem,8vh,4rem);line-height:1.2;text-align:center;color:var(--ink)}
.ch-time{font-family:var(--disp);font-size:clamp(2rem,7vh,3.4rem);color:var(--acc);text-align:center;min-height:1.2em}
.rank{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.rank button{--tc:#888;border:0;border-radius:1rem;padding:.6em 1.1em;font-weight:800;font-size:1.1rem;cursor:pointer;background:color-mix(in srgb,var(--tc) 14%,#fff);box-shadow:inset 0 0 0 2.5px var(--tc);color:var(--ink)}
.rank button.on{background:var(--tc);color:#fff}
.rank button i{font-style:normal;display:inline-block;min-width:1.4em;margin-inline-end:.3em;border-radius:99px;background:#fff;color:var(--tc)}
/* طريقة اللعب */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.7rem}
.step{background:linear-gradient(180deg,#fffaf0,#fff);border-radius:1.2rem;padding:.7rem;text-align:center;box-shadow:inset 0 0 0 2px var(--line)}
.step .si{font-size:2.6rem;line-height:1.2}
.step b{display:block;font-family:var(--disp);font-weight:400;font-size:1.35rem;color:var(--acc2)}
.step small{display:block;color:var(--mut);font-weight:700;line-height:1.55;font-size:.88rem}
.help-list{margin:0;padding-inline-start:1.2rem;line-height:1.85;font-weight:600}

/* النهاية */
#end{align-items:center;justify-content:safe center;gap:1.4vh;padding:.8rem 1rem;overflow:auto}
.end-title{font-family:var(--disp);font-size:clamp(2rem,6vh,3.6rem);text-align:center;padding:.2rem 1.6rem 0}
.podium{display:flex;align-items:flex-end;gap:1rem;justify-content:center}
.pod{--tc:#888;display:flex;flex-direction:column;align-items:center;gap:.3rem;width:clamp(8rem,17vw,13rem)}
.pod .blk{width:100%;border-radius:1.2rem 1.2rem .4rem .4rem;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));display:grid;place-items:center;font-family:var(--disp);font-size:2.8rem;color:#fff;box-shadow:0 .4rem 0 color-mix(in srgb,var(--tc) 60%,#000);animation:grow .8s both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.pod .e{width:clamp(3.2rem,8vh,5.5rem);animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 .3rem .4rem rgba(0,0,0,.25))}.pod .nm{font-weight:800;font-size:1.15rem;text-align:center;background:rgba(255,255,255,.88);border-radius:99px;padding:0 .7rem}
.pod .sc{font-family:var(--disp);font-size:2.2rem;color:var(--tc);background:rgba(255,255,255,.88);border-radius:1rem;padding:0 .6rem;line-height:1.3}
.crown{width:clamp(3rem,8vh,5rem);animation:wob 1.4s infinite}
.awards{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;max-width:70rem}
.award{--tc:#888;background:#fff;border-radius:1.2rem;padding:.35rem .9rem .35rem .6rem;display:flex;align-items:center;gap:.55rem;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--tc) 50%,#fff),var(--shadow);animation:rise .6s both;animation-delay:calc(var(--i)*150ms + .6s)}
.award .ai{font-size:2rem}.award img{width:2.6rem}.award b{display:block;font-family:var(--disp);font-weight:400;font-size:1.25rem;color:var(--tc)}.award small{font-weight:800;color:var(--mut)}

/* رايح جاي */
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem;width:min(70rem,100%)}
.lane{border-radius:1.5rem;padding:1rem;background:rgba(40,46,56,.82);box-shadow:inset 0 0 0 4px var(--lc),0 1rem 2rem rgba(0,0,0,.25)}
.lane h3{margin:0 0 .6rem;font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,4vh,2.3rem);color:#fff;text-align:center;background:var(--lc);border-radius:99px;padding:.1rem 0 0}
.lane .lt{display:flex;flex-direction:column;gap:.5rem}
.lane .lt button{--tc:#888;display:flex;align-items:center;gap:.6rem;border:0;background:#fff;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--tc) 60%,#fff);border-radius:1rem;padding:.4rem .9rem .4rem .5rem;cursor:pointer;font-weight:800;font-size:clamp(1rem,2.6vh,1.3rem);transition:transform .2s}
.lane .lt button img{width:2.4rem;height:2.4rem}
.lane .lt button.ranked{transform:translateX(-.6rem);background:color-mix(in srgb,var(--tc) 16%,#fff)}
.lane .lt button .rk{margin-inline-start:auto;font-family:var(--disp);font-size:1.5rem;min-width:4.5rem;text-align:end}
.lane .lt button .rk small{font-family:var(--body);font-weight:800;font-size:.8rem;color:var(--mut);margin-inline-end:.35rem}
.hist{width:min(70rem,100%);border-collapse:collapse;font-weight:800;background:#fff;border-radius:1rem;overflow:hidden;box-shadow:var(--shadow)}
.hist td,.hist th{padding:.35rem .6rem;border-bottom:1px solid var(--line);text-align:center}
.hist th{color:var(--mut)}
.credits{font-size:.9rem;line-height:1.7;font-weight:600}
.credits li{margin-bottom:.15rem}

[data-sc],.tag,.rk b,.hist td{direction:ltr;unicode-bidi:isolate}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(1rem);background:var(--ink);color:#fff;padding:.7rem 1.3rem;border-radius:99px;font-weight:800;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.flash{position:fixed;inset:0;z-index:65;pointer-events:none;animation:flash .6s forwards}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.bigmsg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:66;font-family:var(--disp);font-size:clamp(3rem,12vh,7rem);color:#fff;text-shadow:0 .3rem 0 rgba(0,0,0,.25),0 0 2rem rgba(255,200,0,.8);pointer-events:none;animation:bigmsg 1.6s forwards;white-space:nowrap}
@keyframes bigmsg{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
@media (max-width:900px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}.lanes{grid-template-columns:1fr}.trows{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ==========================================================================
   طبقة «اللعبة المستقلة»: هوية كل لعبة، خانات كرتونية، وأداء خفيف
   قاعدة الأداء: لا شيء يتحرك باستمرار إلا بـ transform/opacity على عناصر صغيرة مستقلة
   ========================================================================== */
#scene *{animation:none!important}
#scene{contain:strict}
#scene::after{display:none}
body.gold #scene::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 50%,rgba(255,236,140,.3),rgba(255,180,0,.42) 72%)}
.amb{position:fixed;left:var(--x);top:var(--y);width:calc(var(--s)*1rem);aspect-ratio:1;z-index:0;pointer-events:none;will-change:transform;animation:var(--an) var(--d) ease-in-out infinite;animation-delay:var(--dl,0s)}
.amb img{width:100%;height:100%;display:block}
@keyframes amb-a{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(2.2rem,-1.6rem) rotate(4deg)}50%{transform:translate(4rem,.6rem) rotate(-3deg)}75%{transform:translate(1.4rem,1.8rem) rotate(6deg)}}
@keyframes amb-b{0%,100%{transform:translate(0,0)}50%{transform:translate(-2.6rem,-1.4rem)}}
@keyframes amb-c{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.3rem) rotate(5deg)}}
@keyframes amb-rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}88%{opacity:.85}100%{transform:translateY(-70vh);opacity:0}}
.bub{position:fixed;bottom:-2rem;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle at 34% 30%,#fff 0 18%,rgba(255,255,255,.28) 42%,rgba(255,255,255,.08) 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65);will-change:transform;animation:amb-rise var(--d) linear infinite;animation-delay:var(--dl,0s)}

/* الرئيسية: هوية اللعبة */
#home{align-items:center;justify-content:center;padding:1.4rem 2rem;gap:0;overflow:auto}
.h-corner{z-index:3}
.h-store{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;padding:.55em 1em;border-radius:99px;background:rgba(255,255,255,.92);color:var(--ink);font-weight:800;box-shadow:0 .25rem 0 color-mix(in srgb,var(--acc) 30%,#d9c9a0),var(--shadow)}
.h-store:hover{transform:translateY(-2px)}
.solo-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:clamp(1rem,3vw,3rem);width:min(82rem,100%);margin:auto 0}
.solo-art{position:relative;aspect-ratio:1;max-height:76vh;justify-self:center;width:100%;max-width:76vh;display:grid;place-items:center}
.solo-art .halo{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.75) 42%,rgba(255,255,255,0) 72%)}
.solo-art .mark{position:relative;width:72%;animation:hero-in .7s cubic-bezier(.2,1.5,.4,1) both}
.solo-art .mark img{width:100%;display:block;animation:amb-c 4.5s ease-in-out infinite}
.solo-art .orb{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 .5rem 1rem rgba(0,0,0,.2),inset 0 0 0 .22rem var(--acc);display:grid;place-items:center;padding:.5rem;animation:orb-in .6s both,amb-c var(--d) ease-in-out infinite;animation-delay:var(--dl),calc(var(--dl) + .6s)}
.solo-art .orb img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes hero-in{from{transform:scale(.35) rotate(-14deg);opacity:0}}
@keyframes orb-in{from{transform:scale(0);opacity:0}}
.solo-copy{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(.7rem,2vh,1.2rem);min-width:0}
.wm{font-family:var(--disp);font-weight:var(--dw,400);line-height:1.12;margin:0;display:flex;flex-wrap:wrap;gap:0 .28em;font-size:clamp(3.4rem,12.5vh,7.6rem)}
.wm span{display:inline-block;color:var(--c);-webkit-text-stroke:.085em var(--wink);paint-order:stroke fill;text-shadow:0 .055em 0 var(--wink),0 .12em 0 rgba(0,0,0,.14)}

<script>
'use strict';

const Store = {

};

/* --- فرصة المتأخر: يفتح خانتين ويختار وحدة، والثانية تنقفل وتتبدّل مع خانة مقفلة عشوائية --- */

/* ==========================================================================
   10-ب) كراديس: شاشة تصميم لوحة كل فريق (قبل اللعب، أو أثناءها للخانات اللي ما انفتحت)
   ========================================================================== */
function kdRandom(T) {
  const n = KD.cells, budget = KD.budget || 1000, out = Array(n).fill('');
  const idx = shuffle([...Array(n).keys()]);
  const fine = 25 * (1 + Math.floor(Math.random() * 3));
  out[idx[0]] = 'ب'; out[idx[1]] = 'ح'; out[idx[2]] = 'غ' + fine; out[idx[3]] = '';   // بيدق، منع، غرامة، فراغ
  const nums = idx.slice(4), w = nums.map(() => .3 + Math.random() ** 2 * 3), sw = w.reduce((a, b) => a + b, 0);
  let left = budget - fine;
  nums.forEach((j, k) => { const v = k === nums.length - 1 ? left : Math.max(5, Math.round(w[k] / sw * (budget - fine) / 5) * 5); out[j] = String(Math.max(0, Math.min(v, left))); left -= +out[j]; });
  return out;
}
function kdDesign(ti, inGame) {
  const T = inGame ? G.teams : teamList(), n = inGame ? G.boards[ti].length : KD.cells;
  let hide = false;
  const codesOf = t => Array.from({ length: n }, (_, j) => (KD.boards[t] || [])[j] || '');
  if (inGame) G.boards.forEach((b, t) => { KD.boards[t] = codesOf(t); });
  const locked = (t, j) => inGame && G.boards[t][j] && G.boards[t][j].open;
  const d = overlay('', 'dlg', false);
  const stat = () => {
    const codes = codesOf(ti), spent = codes.reduce((s, r) => s + kdCost(kdParse(r, T)), 0), over = KD.budget && spent > KD.budget;
    const b = $('#kd-b', d); b.classList.toggle('over', !!over);
    b.textContent = KD.budget ? `الموزّع ${ar(spent)} من ${ar(KD.budget)}${over ? ' · زايد!' : spent < KD.budget ? ` · باقي ${ar(KD.budget - spent)}` : ' ✓'}` : `المجموع ${ar(spent)}`;
    return { bad: codes.some(r => kdParse(r, T).k === 'err'), over };
  };
  const paint = () => {
    const codes = codesOf(ti);
    d.innerHTML = `<h3>🎨 لوحة ${esc(T[ti].n)} <small class="hint">(${ar(ti + 1)} من ${ar(T.length)})</small></h3>
      <p class="hint" style="margin:0;line-height:1.8">${KD.mode === 'others' ? 'هاللوحة بتفتحها الفرق الثانية، فالفريق يوزّع نقاطه ويحط فخاخه.' : 'هاللوحة يفتحها الفريق نفسه.'} اكتب في كل خانة:</p>
      <div class="kd-legend"><span><code>٥٠</code> نقاط</span><span><code>غ٢٥</code> غرامة</span><span><code>ب</code> بيدق (ولا شي)</span><span><code>ح</code> امنعك تلعب</span><span><code>ح٢</code> امنع الفريق ٢</span><span><code>ف</code> افتح مربع من عندك</span><span><code>فاضي</code> فراغ</span></div>
      <div class="row" style="justify-content:space-between"><span class="kd-budget" id="kd-b"></span>
        <div class="row"><button class="btn ghost" data-kd="rand">🎲 وزّع عشوائي</button><button class="btn ghost" data-kd="clear">🧹 مسح</button><button class="btn ghost" data-kd="hide">${hide ? '👁 أظهر القيم' : '🙈 أخفِ القيم'}</button></div></div>
      <div class="kd-grid" style="--kc:${n % 4 === 0 && n <= 16 ? 4 : 5}">${codes.map((r, j) => { const p = kdParse(r, T); return `<label class="kd-cell"><span>${ar(j + 1)}</span><input class="fld ${p.k === 'err' ? 'bad' : ''}" ${hide ? 'type="password"' : ''} data-j="${j}" value="${esc(r)}" maxlength="14" ${locked(ti, j) ? 'disabled title="انفتحت"' : ''} aria-label="خانة ${j + 1}"><b>${hide ? '' : kdLabel(p, T)}</b></label>`; }).join('')}</div>
      <div class="row" style="justify-content:flex-start">${ti > 0 ? '<button class="btn ghost" data-kd="prev">→ الفريق السابق</button>' : ''}<span style="flex:1"></span><button class="btn ghost" data-kd="close">إلغاء</button>${ti < T.length - 1 ? '<button class="btn acc" data-kd="next">التالي: الفريق الجاي ←</button>' : `<button class="btn acc big" data-kd="done">${inGame ? '💾 حفظ ورجوع للعبة' : '▶ ابدأ اللعب'}</button>`}</div>`;
    stat();
  };
  paint();
  d.addEventListener('input', e => {
    const j = e.target.dataset.j; if (j == null) return;
    (KD.boards[ti] = codesOf(ti))[+j] = e.target.value; saveKD();
    const p = kdParse(e.target.value, T); e.target.classList.toggle('bad', p.k === 'err');
    if (!hide) e.target.nextElementSibling.textContent = kdLabel(p, T); stat();
  });
  d.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.j != null) { e.preventDefault(); const nx = $(`input[data-j="${+e.target.dataset.j + 1}"]`, d); if (nx) nx.focus(); } });
  const ok = () => { const s = stat(); if (s.bad) { toast('فيه خانة مكتوبة غلط (باللون الأحمر)'); return false; } if (s.over) { toast('النقاط الموزّعة أكثر من المسموح'); return false; } return true; };
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-kd]'); if (!b) return; const a = b.dataset.kd;
    if (a === 'rand') { const old = codesOf(ti), r = kdRandom(T); KD.boards[ti] = old.map((v, j) => locked(ti, j) ? v : r[j]); saveKD(); paint(); }
    else if (a === 'clear') { KD.boards[ti] = codesOf(ti).map((v, j) => locked(ti, j) ? v : ''); saveKD(); paint(); }
    else if (a === 'hide') { hide = !hide; paint(); }
    else if (a === 'prev') { ti--; paint(); }
    else if (a === 'next') { if (ok()) { ti++; hide = false; paint(); } }
    else if (a === 'close') closeOverlay();
    else if (a === 'done') {
      if (!ok()) return;
      // نتأكد من كل الفرق قبل البدء
      const badT = T.findIndex((_, t) => { const c = codesOf(t); return c.some(r => kdParse(r, T).k === 'err') || (KD.budget && c.reduce((s, r) => s + kdCost(kdParse(r, T)), 0) > KD.budget); });
      if (badT >= 0) { ti = badT; paint(); return toast(`راجع لوحة ${T[badT].n}`); }
      closeOverlay();
      if (!inGame) return newGame('kardees');
      snap(); G.boards = G.boards.map((bd, t) => bd.map((c, j) => c.open ? c : kdCell(kdParse(codesOf(t)[j], T)))); saveGame(); showGame(); toast('تم تعديل اللوحات');
    }
  });
}

  resume() { const s = Store.get(GAME_KEY, null); if (!s) return; G = fixG(s); hist.length = 0; shown = G.teams.map(t => t.score); showGame(); Snd.pop(); if (G.run && G.run.pot > 0) runPrompt(); },
  help() { overlay(helpHTML(), 'dlg'); },
  sound() { prefs.sound = !prefs.sound; savePrefs(); applySound(); Snd.pop(); },
  fs: toggleFS,
  'team-n'(el) { prefs.teamCount = Math.max(2, Math.min(6, prefs.teamCount + +el.dataset.d)); savePrefs(); renderSetup(); Snd.pop(); },
  'team-emb'(el) { emblemDialog(+el.dataset.i); },
  mod(el) { const m = el.dataset.m; prefs.mods[m] = !prefs.mods[m]; fixMode(); savePrefs(); renderSetup(); Snd.pop(); },
  pmode(el) { const m = PLAY_MODES.find(x => x[0] === el.dataset.m); if (!m) return; prefs.mode = m[0]; Object.assign(prefs.mods, m[4]); if (m[5]) prefs.size[prefs.theme] = m[5]; savePrefs(); renderSetup(); Snd.pop(); },
  size(el) { prefs.size[prefs.theme] = el.dataset.v; savePrefs(); renderSetup(); Snd.pop(); },
  'pct-reset'() { delete prefs.pct[prefs.theme]; savePrefs(); renderSetup(); Snd.pop(); },
  auto(el) { prefs.autoTurn = el.dataset.v === '1'; savePrefs(); renderSetup(); },
  'edit-items': editItems,
  start() { THEMES[prefs.theme].design ? kdDesign(0, false) : newGame(prefs.theme); },
  tile(el) { openTile(+el.dataset.i); },
  turn(el, e) { if (e.target.closest('[data-act="adj"],[data-act="card"]') || TH().lanes || busy) return; bank(); G.run = null; G.turn = +el.dataset.i; G.ownPending = false; syncView(); perkCheck(); saveGame(); Snd.pop(); TH().perTeam ? showGame() : (renderTeams(), renderBoard(), renderBar()); },
  card(el) { useCard(+el.dataset.i, el.dataset.k); },
  view(el) { G.view = +el.dataset.i; saveGame(); Snd.pop(); showGame(); },
  'kd-set'(el) { const k = el.dataset.k; KD[k] = k === 'mode' ? el.dataset.v : +el.dataset.v; saveKD(); renderSetup(); Snd.pop(); },
  'kd-edit'() { kdDesign(G.view ?? G.turn, true); },
  challenge() { challenge(); },
  gold() { goldDialog(); },
  'gold-go': startGold,
  'perk-keep'(el) { perkKeep(+el.dataset.i); },
  'perk-skip'() { cur().perkAt = G.picks + G.teams.length; G.dbl = null; saveGame(); renderTeams(); renderBoard(); renderBar(); },
  adj(el) { snap(); const i = +el.dataset.i, st = TH().step || 1; addTo(i, +el.dataset.d * st); updateRanks(); saveGame(); renderTeams(); Snd.pop(); },
  undo() { if (!hist.length) return toast('ما فيه شي نتراجع عنه'); if (busy) return; closeOverlay(); PEND = null; G = hist.pop(); G.over = false; saveGame(); showGame(); toast('تم التراجع'); if (G.run && G.run.pot > 0) runPrompt(); },
  'next-turn': nextTurn,
  finish() { overlay(`<h3>نخلّص اللعبة؟</h3><p>تظهر النتيجة النهائية ومن ياخذ التاج.</p><div class="row"><button class="btn acc" data-act="finish-ok">نعم، النتيجة</button><button class="btn ghost" data-close>لا، كمّل</button></div>`, 'dlg'); },
  'finish-ok'() { finish(); },
  'again-same'() { newGame(G.theme); },
  'back-board'() { G.over = false; saveGame(); showGame(); },
  lane(el) { laneClick(el.dataset.k, +el.dataset.i); },
  'lane-ok': laneOk,
  'lane-clear'() { G.cur = { plus: [], minus: [] }; saveGame(); renderLanes(); },
  ...R,
};
document.addEventListener('click', e => {
  Snd.unlock();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', e => { const i = e.target.dataset.name; if (i != null) { prefs.names[+i] = e.target.value; savePrefs(); } });

let numBuf = '', numT;   // كتابة رقم الخانة بالكيبورد
function paintBuf() { const b = $('#numbuf'); if (b) b.textContent = numBuf ? ar(numBuf) : ''; }
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'KeyF') return toggleFS();
  if (e.code === 'KeyM') return ACT.sound();
  const scr = $('.screen.on').id;
  if (ovEl) {
    if (e.key === 'Escape' && ovEl.querySelector('[data-close]')) closeOverlay();
    else if (e.key === 'Enter') { const b = ovEl.querySelector('[data-primary]'); if (b) { e.preventDefault(); b.click(); } }
    return;
  }
  if (scr === 'setup' && e.key === 'Enter') { e.preventDefault(); return ACT.start(); }
  if (scr !== 'game' || !G) return;
  if (TH().lanes) { if (e.key === 'Enter') { e.preventDefault(); laneOk(); } return; }
  if (e.code === 'KeyU') return ACT.undo();
  if (e.code === 'KeyN') return nextTurn();
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
  if (m && layoutOf() !== 'regions') { numBuf = (numBuf + m[1]).slice(-2); paintBuf(); clearTimeout(numT); numT = setTimeout(() => { numBuf = ''; paintBuf(); }, 2500); return; }
  if (e.key === 'Enter' && numBuf) { e.preventDefault(); const i = +numBuf - 1; numBuf = ''; paintBuf(); if (i >= 0 && i < boardOf().length) openTile(i); }
  if (e.key === 'Backspace') { numBuf = numBuf.slice(0, -1); paintBuf(); }
});



/* ==========================================================================
   طبقة «اللعبة المستقلة»: تُضاف بعد game.js وتستبدل بعض دواله (كل ملف = لعبة وحدة بهويتها)
   ========================================================================== */
const catOf = c => (c.t === 'add' ? 'good' : c.t === 'sub' || c.t === 'hit' ? 'bad' : 'power');

/* --- الخانات والصور --- */
function faceHTML(c, theme = G && G.theme) {
  const k = c.art || artFor(theme, c), s = artSrc(k);
  return s ? `<img class="obj" src="${s}" alt="" draggable="false">` : `<span class="emo">${esc(c.e)}</span>`;
}
function tileHTML(c, i, label) {
  const oc = c.by != null && G.teams[c.by] ? G.teams[c.by].c : '';
  if (c.open) {
    const v = c.v * (c.mul || 1), neg = c.t === 'sub' || c.t === 'hit', tag = v && c.t !== 'none' ? `${c.t === 'add' ? '+' : neg ? '−' : ''}${ar(v)}` : '';
    return `<button class="tile open cat-${catOf(c)}" style="--oc:${oc}" data-act="tile" data-i="${i}" aria-label="${esc(c.n)}" title="${esc(c.n)}${c.by != null && G.teams[c.by] ? ' — ' + esc(G.teams[c.by].n) : ''}"><span class="ph">${faceHTML(c)}</span>${tag ? `<span class="tag ${neg ? 'neg' : ''}">${tag}</span>` : ''}</button>`;
  }
  if (G.dbl && G.dbl.first === i) return `<button class="tile open peek cat-${catOf(c)}" style="--oc:#7c4dff" data-act="tile" data-i="${i}"><span class="ph">${faceHTML(c)}</span><span class="tag" style="--tgc:#7c4dff">١</span></button>`;
  return `<button class="tile" style="--k:${i}" data-act="tile" data-i="${i}" aria-label="خانة ${label}"><span class="num">${label}</span></button>`;
}

/* --- الرئيسية: شاشة اللعبة نفسها --- */
const wordmark = (cls = 'wm') => `<h1 class="${cls}" aria-label="${esc(BRAND.name)}">${BRAND.words.map(([w, c]) => `<span style="--c:${c}">${esc(w)}</span>`).join(' ')}</h1>`;
function renderHome() {
  G = null; setTheme(SOLO); applyBrand();
  const th = THEMES[SOLO], orbs = (BRAND.orbs || []).slice(0, 4), pos = [['2%', '6%', '21%'], ['77%', '4%', '19%'], ['-1%', '69%', '19%'], ['80%', '72%', '22%']];
  const facts = th.lanes ? ['🏁 جولات سريعة', '👥 ٢–٦ فرق', '🙋 المقدّم يدير اللعب'] : th.design ? [`🎨 ${ar(KD.cells)} خانة يصمّمها كل فريق`, '👥 ٢–٦ فرق', '🙋 المقدّم يسأل'] : [`🔢 ${ar(Math.min(80, itemsOf(SOLO).reduce((s, x) => s + (+x.c || 0), 0)))} خانة`, '👥 ٢–٦ فرق', '🙋 المقدّم يسأل'];
  const s = Store.get(GAME_KEY, null), canResume = s && !s.over && s.theme === SOLO;
  $('#home').innerHTML = `<div class="h-corner"><button class="ib snd-btn" data-act="sound" title="الصوت (M)" aria-label="الصوت">🔊</button><button class="ib" data-act="fs" title="ملء الشاشة (F)" aria-label="ملء الشاشة">⛶</button></div>
    <a class="h-store" href="../متجر الألعاب.html">🏪 كل الألعاب</a>
    <div class="solo-hero">
      <div class="solo-copy">
        ${wordmark()}
        <p class="solo-tag">${esc(BRAND.tagline)}</p>
        <div class="solo-facts">${facts.map(f => `<span>${f}</span>`).join('')}</div>
        <ul class="solo-why">${(BRAND.why || []).map(w => `<li>${esc(w)}</li>`).join('')}</ul>
        <div class="solo-acts">${canResume ? `<button class="btn gold big" data-act="resume">▶ كمّل اللعبة</button>` : ''}<button class="btn acc play" data-act="to-setup">يلا نلعب<kbd>Enter</kbd></button><button class="btn ghost" data-act="help">❓ طريقة اللعب</button></div>
      </div>
      <div class="solo-art">
        <div class="halo"></div>
        <div class="mark"><img src="${artSrc(th.hero)}" alt="" draggable="false"></div>
        ${orbs.map((k, i) => artSrc(k) ? `<div class="orb" style="--x:${pos[i][0]};--y:${pos[i][1]};--w:${pos[i][2]};--dl:${(.15 + i * .12).toFixed(2)}s;--d:${(4 + i * .7).toFixed(1)}s"><img src="${artSrc(k)}" alt=""></div>` : '').join('')}
      </div>
    </div>`;
  applySound(); show('home');
}
ACT['to-setup'] = () => { prefs.theme = SOLO; savePrefs(); renderSetup(); Snd.pop(); };

/* --- الهوية: الخانات والحركة الخفيفة --- */
let brandDone = false;
function applyBrand() {
  if (brandDone) return; brandDone = true;
  const st = document.body.style, it = SVGA.items, set = (n, k) => { if (it[k]) st.setProperty(n, `url("${it[k]}")`); };
  set('--tile', BRAND.tile); set('--tile2', BRAND.tile + '2'); set('--tile3', BRAND.tile + '3'); set('--tile4', BRAND.tile + '4'); set('--tile-gold', 'tile_gold');
  const amb = document.createDocumentFragment();
  if (!RM) (BRAND.ambient || []).forEach(a => {
    const d = document.createElement('div');
    if (a.bubble) { d.className = 'bub'; d.style.cssText = `--x:${a.x};--s:${a.s};--d:${a.d}s;--dl:${a.dl || 0}s`; }
    else { if (!it[a.a]) return; d.className = 'amb'; d.style.cssText = `--x:${a.x};--y:${a.y};--s:${a.s};--an:${a.an || 'amb-a'};--d:${a.d}s;--dl:${a.dl || 0}s`; d.innerHTML = `<img src="${it[a.a]}" alt="">`; }
    amb.append(d);
  });
  document.body.insertBefore(amb, document.body.children[1]);
}

/* --- طريقة اللعب: خاصة بهذي اللعبة فقط --- */
const lanesHow = () => {
  const th = THEMES.lanes, s = artSrc;
  return `<div class="ln-how">
    <div><img src="${s('roadmark') || ''}" alt=""><b>١. كل فريق ينقسم نصفين</b>نصف الفريق في طريق الزيادة ونصفه في طريق النقصان، فكل فريق موجود في الطريقين.</div>
    <div><img src="${s('finish') || ''}" alt=""><b>٢. سباق في الطريقين معاً</b>المقدّم يطلق التحدي: سؤال أو مهمة. أسرع مجموعة تنهي توصل أول. يصلح في الفصل أو قروبات الواتساب.</div>
    <div><img src="${s('plus') || ''}" alt=""><b>٣. الترتيب يحدد النقاط</b>في الأخضر: الأول +${ar(th.plus[0])} والثاني +${ar(th.plus[1])} والثالث +${ar(th.plus[2])}. في الأحمر: الأول لا يخسر، والأخير يخسر ${ar(-th.minus[3])}.</div>
  </div>`;
};
function helpHTML() {
  const th = THEMES[SOLO], close = `<div class="row" style="justify-content:flex-start"><button class="btn acc" data-close>تمام</button></div>`;
  if (th.lanes) return `<h3>❓ طريقة اللعب: ${th.name}</h3>${lanesHow()}<ul class="help-list"><li>في شاشة اللعب اضغط سيارة الفريق بترتيب وصوله، فتدخل مكانها عند خط النهاية وتظهر نقاطها. الضغط على الخانة يرجّعها.</li><li>لما تخلص الجولة اضغط «اعتمد الجولة» وتنضاف النقاط. ✨ الجولات الذهبية تضاعف كل النقاط.</li><li><kbd>Enter</kbd> اعتماد الجولة · <kbd>F</kbd> ملء الشاشة · <kbd>M</kbd> الصوت.</li></ul>${close}`;
  const pot = th.pot ? th.pot[0] : 'الجرة', potI = artSrc(BRAND.pot);
  return `<h3>❓ طريقة اللعب: ${th.name}</h3>
  <div class="steps">
    <div class="step"><div class="si">🙋</div><b>١. جاوبوا صح</b><small>سؤال من المقدّم أو من أي مسابقة ثانية</small></div>
    <div class="step"><div class="si">🔢</div><b>٢. اختاروا خانة</b><small>المقدّم يضغطها أو يكتب رقمها ثم Enter</small></div>
    <div class="step"><div class="si">🥁</div><b>٣. المفاجأة!</b><small>زيادة، خصم، ضربة لفريق، سرقة، حماية…</small></div>
    ${th.design ? `<div class="step"><div class="si">🎨</div><b>٤. صمّم لوحتك</b><small>كل فريق يخبّي نقاطه وفخاخه لغيره</small></div>` : `<div class="step"><div class="si">${potI ? `<img src="${potI}" alt="" style="height:2.8rem">` : '🎲'}</div><b>٤. كمّل أو اكتفِ</b><small>تجمعون في ${esc(pot)}… والخصم يطيّرها</small></div>`}
    <div class="step"><div class="si">🃏</div><b>٥. بطاقات القوى</b><small>🛡️ درع · 🔄 عكس · ❄️ تجميد</small></div>
  </div>
  <ul class="help-list">
    <li><b>🔥 السلسلة:</b> ٣ خانات زينة ورا بعض لنفس الفريق = بونص. <b>🎯 فرصة المتأخر:</b> الأخير (لو بعيد) يفتح خانتين ويختار وحدة. <b>✨ اللوحة الذهبية:</b> جولة أخيرة بقيم ×٢ وفيها «قلب الطاولة».</li>
    <li>كل الإضافات تنطفي وتشتغل من شاشة الإعداد. الدرع والعكس يطلعون لحالهم لما ينضرب الفريق، والتجميد تضغطه من بطاقة الفريق فوق.</li>
    <li>اضغط على أي فريق فوق عشان تعطيه الدور، وزر + و − جنب النقاط للتعديل اليدوي. <kbd>N</kbd> الدور التالي · <kbd>U</kbd> تراجع · <kbd>F</kbd> ملء الشاشة · <kbd>M</kbd> الصوت.</li>
    ${th.design ? '<li>كل فريق يصمّم لوحته قبل اللعب، والفريق اللي عليه الدور يفتح من لوحة فريق ثاني.</li>' : ''}${th.challenges ? '<li>زر «🏆 تحدي» بين الصناديق: الأول يفتح خانتين والثاني خانة.</li>' : ''}
    <li>تقدر تعدّل وش وراء الخانات من زر ✏️ في شاشة الإعداد. اللعبة تنحفظ تلقائياً وتقدر تكمّلها بعدين.</li>
  </ul>${close}`;
}

/* --- رايح جاي: الفكرة تنقرأ من الشاشة نفسها --- */
const carCache = {};
function carSrc(c) {
  if (carCache[c]) return carCache[c];
  const raw = SVGA.raw.car; if (!raw) return '';
  return (carCache[c] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(raw.replace(/#ff00ff/gi, c).replace(/#aa00aa/gi, SVGA.shade(c, .62))));
}
function renderLanes() {
  const th = TH(), cu = G.cur, mul = G.goldMul || 1, n = G.teams.length;
  const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + ar(Math.abs(v));
  const road = (k, pts, title, sub, sign) => {
    const val = r => (k === 'plus' ? (pts[r] ?? 0) : (pts[r] ?? pts[pts.length - 1])) * mul;
    const left = G.teams.map((t, i) => [t, i]).filter(([, i]) => !cu[k].includes(i));
    return `<section class="road ${k}"><header><img src="${artSrc(sign)}" alt=""><div><b>${title}${mul > 1 ? ' ×٢' : ''}</b><small>${sub}</small></div></header>
      <div class="cap">🏁 خط النهاية: كل مركز وقيمته</div>
      <div class="ln-slots" style="--n:${n}">${Array.from({ length: n }, (_, r) => { const v = val(r), i = cu[k][r], t = i != null ? G.teams[i] : null, cls = v > 0 ? 'up' : v < 0 ? 'down' : 'zero';
        return t ? `<button class="slot filled ${cls}" style="--tc:${t.c}" data-act="lane" data-k="${k}" data-i="${i}" title="اضغط لترجيعه"><span class="rk">${ORD[r] || ar(r + 1)}</span><img src="${carSrc(t.c)}" alt=""><span class="pts">${fmt(v)}</span><span class="who">${esc(t.n)}</span></button>`
          : `<div class="slot ${cls}"><span class="rk">${ORD[r] || ar(r + 1)}</span><span class="pts">${fmt(v)}</span></div>`; }).join('')}</div>
      <div class="cap">🚗 اضغط الفرق بترتيب وصولها</div>
      <div class="ln-start" style="--n:${n}">${left.map(([t, i]) => `<button class="ln-car" style="--tc:${t.c}" data-act="lane" data-k="${k}" data-i="${i}"><img src="${carSrc(t.c)}" alt=""><span>${esc(t.n)}</span></button>`).join('')}</div>
    </section>`;
  };
  $('#board-wrap').innerHTML = `<div class="ln-wrap">
    <div class="ln-idea"><span><b>الجولة ${ar(G.rounds.length + 1)}</b>كل فريق نصفين: نصف في الأخضر ونصف في الأحمر، والمقدّم يطلق التحدي في الطريقين معاً</span></div>
    <div class="ln-roads">${road('plus', th.plus, 'طريق الزيادة', 'كل ما وصلتوا أول كسبتوا أكثر', 'plus')}${road('minus', th.minus, 'طريق النقصان', 'الأول ينجو، والأخير يخسر أكثر', 'minus')}</div>
    ${G.rounds.length ? `<div class="ln-hist">${G.rounds.slice(-4).map((r, k) => `<span class="r"><i>جولة ${ar(G.rounds.length - Math.min(4, G.rounds.length) + k + 1)}</i>${r.map((d, i) => `<b style="color:${G.teams[i].c}">${fmt(d)}</b>`).join('')}</span>`).join('')}</div>` : ''}
  </div>`;
  $('#bar').innerHTML = `<button class="btn acc big" data-act="lane-ok">✓ اعتمد الجولة<kbd>Enter</kbd></button><button class="btn ghost" data-act="lane-clear">مسح الترتيب</button>${mod('gold') && !(G.goldMul > 1) ? '<button class="btn gold" data-act="gold">✨ الجولات الذهبية</button>' : ''}<button class="btn ghost" data-act="finish">🏁 إنهاء</button>`;
}

addEventListener('keydown', e => { if (e.key === 'Enter' && !ovEl && $('.screen.on').id === 'home' && !/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName)) { e.preventDefault(); ACT['to-setup'](); } });
applySound(); renderHome();
</script>
