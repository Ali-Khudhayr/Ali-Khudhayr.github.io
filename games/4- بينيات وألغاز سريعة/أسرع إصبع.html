<style>

:root{
  --bg:#0a1d15;--bg2:#0f2a1f;--bg3:#163a2a;--panel:rgba(255,255,255,.06);--panel2:rgba(255,255,255,.11);--line:rgba(255,255,255,.15);
  --ink:#f5f2e8;--mut:#a9bdb1;--gold:#f4b41f;--gold2:#ffe08a;--good:#22b573;--bad:#ef5b4c;--sky:#4da3ff;
  --disp:Lalezar,Tajawal,"Segoe UI",Tahoma,sans-serif;--body:Tajawal,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --quran:"Amiri Quran","Traditional Arabic","Amiri","Scheherazade New","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,#17402e 0%,var(--bg) 60%,#06130d 100%);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit}
.disp{font-family:var(--disp);font-weight:400}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
kbd{font:800 .7em var(--body);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:.35em;padding:.05em .45em;margin-inline-start:.45em;vertical-align:middle}

/* أزرار */
.btn{border:0;border-radius:.9rem;padding:.7em 1.25em;cursor:pointer;background:var(--panel2);font-weight:800;font-size:1rem;display:inline-flex;align-items:center;gap:.4em;transition:transform .12s,filter .15s,background .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn:focus-visible,.chip:focus-visible,.ib:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.big{font-size:clamp(1.1rem,2.9vh,1.65rem);padding:.7em 1.5em;border-radius:1rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:2.7rem;height:2.7rem;border-radius:.8rem;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.2rem;display:grid;place-items:center;flex:none}
.ib.off{opacity:.45}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.chip{padding:.4em 1em;border-radius:99px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:.95rem}
.chip.on{background:var(--gold);color:#2a1d00;border-color:transparent}
.chip small{opacity:.7;font-weight:700}
.lbl{color:var(--mut);font-weight:700;font-size:.95rem}
.muted{color:var(--mut)}

/* الشاشة الرئيسية */
#home{align-items:center;justify-content:center;gap:3vh;padding:2rem}
.h-corner{position:absolute;top:1rem;inset-inline-start:1rem;display:flex;gap:.5rem}
.h-title{text-align:center}
.h-title .k{color:var(--gold);font-weight:800;letter-spacing:.02em;font-size:clamp(1rem,2.4vh,1.3rem)}
.h-title h1{font-family:var(--disp);font-weight:400;font-size:clamp(3.6rem,13vh,7.5rem);line-height:1;margin:.2rem 0 .4rem;text-shadow:0 .35rem 0 rgba(0,0,0,.25)}
.h-title p{margin:0;color:var(--mut);font-size:clamp(1rem,2.4vh,1.35rem);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;width:min(68rem,100%)}
.tile{position:relative;text-align:start;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border-radius:1.3rem;padding:1.2rem 1.3rem 1.1rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;transition:transform .18s,border-color .18s,background .18s;animation:rise .5s both;animation-delay:calc(var(--i)*60ms)}
.tile:hover{transform:translateY(-4px);border-color:var(--gold)}
.tile .ic{font-size:2.4rem;line-height:1}
.tile b{font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,3.8vh,2.2rem);line-height:1.2}
.tile span{color:var(--mut);font-weight:700;font-size:.98rem;line-height:1.5}
.tile .n{position:absolute;top:.9rem;inset-inline-end:1rem;color:var(--mut);font-weight:800;font-size:.85rem}
.h-foot{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* شاشة الفقرة */
.top{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem .4rem}
.top h2{font-family:var(--disp);font-weight:400;font-size:clamp(1.5rem,4vh,2.3rem);margin:0;flex:1;display:flex;align-items:center;gap:.5rem}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2.2vh;padding:.6rem 2rem 1rem;text-align:center;overflow:auto}
.stage>:first-child{margin-top:auto}.stage>:last-child{margin-bottom:auto}   /* توسيط بدون ما ينقص أول المحتوى إذا طال */
#sb{display:flex;gap:.55rem;justify-content:center;flex-wrap:wrap;padding:.6rem;border-top:1px solid var(--line);background:rgba(0,0,0,.22)}
#sb[hidden]{display:none}
.tm{--tc:#888;display:flex;align-items:center;gap:.45rem;padding:.25rem .35rem;border-radius:99px;background:var(--panel);border:2px solid var(--tc)}
.tm .e{font-size:1.25rem}.tm .nm{font-weight:800;max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .sc{font-family:var(--disp);font-size:1.6rem;min-width:2ch;text-align:center;line-height:1}
.tm button{width:1.9rem;height:1.9rem;border-radius:50%;border:0;background:rgba(255,255,255,.12);cursor:pointer;font-weight:800;font-size:1.1rem;line-height:1}
.tm.bump .sc{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.5);color:var(--gold)}}
.kicker{color:var(--gold);font-weight:800;font-size:clamp(1rem,2.6vh,1.35rem)}
.big-q{font-family:var(--disp);font-weight:400;font-size:clamp(2.2rem,7.5vh,4.6rem);line-height:1.35;max-width:62rem;text-wrap:balance}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.4rem;padding:1.4rem 1.8rem;max-width:min(64rem,100%);width:100%}
.setup{display:flex;flex-direction:column;gap:1.1rem;align-items:center;width:min(52rem,100%)}
.setup .opt{display:flex;flex-direction:column;gap:.5rem;align-items:center}
.hint{color:var(--mut);font-size:.95rem;font-weight:700}

/* مؤقت دائري */
.ring{position:relative;width:var(--rs,9rem);height:var(--rs,9rem);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .1s linear,stroke .3s}
.ring.warn .fg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:400;font-size:calc(var(--rs,9rem)*.38)}
.ring.warn b{color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}

/* العدّاد */
.cnt-t{font-family:var(--disp);font-weight:400;font-size:clamp(2.4rem,8.5vh,5.2rem);line-height:1.3;max-width:62rem}
.cnt-t small{display:block;font-size:.45em;color:var(--mut);font-family:var(--body);font-weight:800}
.dots{display:flex;gap:clamp(.4rem,1.2vw,.9rem);flex-wrap:wrap;justify-content:center}
.dots i{width:clamp(2.2rem,6vh,3.6rem);height:clamp(2.2rem,6vh,3.6rem);border-radius:50%;border:3px dashed rgba(255,255,255,.28);display:grid;place-items:center;font-style:normal;font-family:var(--disp);font-size:1.4rem;color:transparent;transition:background .2s,border-color .2s,transform .2s}
.dots i.on{background:var(--good);border:3px solid var(--good);color:#fff;transform:scale(1.08)}
.cnt-mid{display:flex;align-items:center;gap:3rem;justify-content:center;flex-wrap:wrap}
.banner{font-family:var(--disp);font-weight:400;font-size:clamp(2.2rem,7vh,4.2rem);animation:pop .45s both}
.banner.good{color:var(--good)}.banner.bad{color:var(--bad)}.banner.gold{color:var(--gold)}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}}

/* أسرع إصبع */
.pads{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1rem;width:min(80rem,100%)}
.pad{--tc:#888;border:0;border-radius:1.4rem;background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 85%,#fff 15%),color-mix(in srgb,var(--tc) 75%,#000 25%));color:#fff;padding:1.4rem .6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4rem;box-shadow:0 .5rem 0 color-mix(in srgb,var(--tc) 55%,#000 45%);transition:transform .1s,opacity .25s,filter .25s}
.pad:active{transform:translateY(.3rem);box-shadow:0 .2rem 0 color-mix(in srgb,var(--tc) 55%,#000 45%)}
.pad .e{font-size:clamp(2.2rem,7vh,3.6rem);line-height:1}
.pad .nm{font-weight:800;font-size:clamp(1rem,2.6vh,1.4rem)}
.pad .key{font-family:var(--disp);font-size:1.5rem;background:rgba(0,0,0,.25);border-radius:.5rem;padding:0 .6rem}
.pad.dim{opacity:.25;filter:grayscale(.7)}
.pad.out{opacity:.35;filter:grayscale(1)}
.pad.win{animation:winpad .6s infinite alternate;outline:.4rem solid #fff;outline-offset:.2rem}
@keyframes winpad{to{transform:scale(1.05)}}
.bz-status{font-family:var(--disp);font-weight:400;font-size:clamp(1.8rem,5.5vh,3.4rem);line-height:1.3}
.bz-status.open{color:var(--good);animation:pulse .6s infinite alternate}

/* العجلة */
.wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center}
#wheel{width:var(--ws);height:var(--ws);border-radius:50%;box-shadow:0 0 0 .6rem rgba(255,255,255,.08),0 1.2rem 3rem rgba(0,0,0,.45)}
.pointer{position:absolute;top:-.6rem;left:50%;transform:translateX(-50%);width:0;height:0;border-left:1.3rem solid transparent;border-right:1.3rem solid transparent;border-top:2.4rem solid var(--gold);filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.5));z-index:2}
.wh-hub{position:absolute;width:calc(var(--ws)*.16);height:calc(var(--ws)*.16);border-radius:50%;background:var(--bg2);border:.35rem solid var(--gold);display:grid;place-items:center;font-size:calc(var(--ws)*.06);cursor:pointer}
.wh-side{display:flex;gap:2.5rem;align-items:center;justify-content:center;flex-wrap:wrap}
.wh-res{min-width:16rem;display:flex;flex-direction:column;gap:1rem;align-items:center}
.wh-res .who{font-family:var(--disp);font-weight:400;font-size:clamp(2.6rem,9vh,5.4rem);line-height:1.15;color:var(--gold);animation:pop .5s both}

/* ضربات الجزاء */
.pk-board{display:flex;align-items:center;justify-content:center;gap:2rem;width:min(70rem,100%)}
.pk-team{--tc:#888;flex:1;display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:1.1rem;border:2px solid transparent;transition:border-color .2s,background .2s}
.pk-team.turn{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 18%,transparent)}
.pk-team .nm{font-weight:800;font-size:clamp(1.1rem,3vh,1.6rem)}
.pk-team .g{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
.pk-team .g i{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.pk-team .g i.y{background:var(--good);border-color:var(--good)}
.pk-team .g i.n{background:var(--bad);border-color:var(--bad)}
.pk-team .g i.sd{border-style:dashed}
.pk-score{font-family:var(--disp);font-weight:400;font-size:clamp(3rem,9vh,5rem);line-height:1;display:flex;gap:1rem;align-items:center}
.pk-score span{color:var(--mut);font-size:.5em}
.scene{width:min(52rem,100%);height:auto;max-height:32vh;border-radius:1.2rem;overflow:hidden}
.scene .mv{transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-box:fill-box;transform-origin:center}
.scene #net.shake{animation:netshake .5s}
@keyframes netshake{25%{transform:translateY(6px)}50%{transform:translateY(-3px)}75%{transform:translateY(2px)}}
.pk-q{display:flex;flex-direction:column;gap:.8rem;align-items:center;width:100%}
.pk-q .qt{font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,5vh,3rem);line-height:1.4;max-width:60rem;text-wrap:balance}
.ans{display:inline-block;background:color-mix(in srgb,var(--gold) 20%,transparent);border:2px solid var(--gold);color:var(--gold2);border-radius:1rem;padding:.3em 1em;font-weight:800;font-size:clamp(1.2rem,3.4vh,2rem);animation:pop .35s both}
.res-over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}

/* صح أو خطأ */
.tf-bar{width:min(60rem,100%);height:1.1rem;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.tf-bar i{display:block;height:100%;background:var(--gold);transform-origin:right;transition:transform .1s linear}
.tf-bar.warn i{background:var(--bad)}
.tf-stats{display:flex;gap:2.4rem;justify-content:center;font-family:var(--disp);font-size:clamp(1.8rem,5vh,2.8rem)}
.tf-stats .g{color:var(--good)}.tf-stats .b{color:var(--bad)}.tf-stats .t{color:var(--gold)}
.tf-card{transition:background .2s,border-color .2s}
.tf-card.ok{background:color-mix(in srgb,var(--good) 25%,transparent);border-color:var(--good)}
.tf-card.no{background:color-mix(in srgb,var(--bad) 25%,transparent);border-color:var(--bad)}
.tf-prop{margin-top:1rem;font-size:clamp(1.4rem,4.4vh,2.6rem);font-weight:800}
.tf-prop b{color:var(--gold2);background:rgba(244,180,31,.15);border-radius:.6rem;padding:0 .4em}
.res-table{border-collapse:collapse;min-width:20rem}
.res-table td{padding:.4rem 1rem;border-bottom:1px solid var(--line);font-weight:800}

/* الآيات */
.qr{font-family:var(--quran);font-size:clamp(2rem,6.4vh,3.8rem);line-height:2.15;max-width:66rem;direction:rtl;text-wrap:pretty;-webkit-user-select:text;user-select:text}
.qr .rest{color:var(--gold2)}
.qr .gap{color:var(--mut);letter-spacing:.2em}
.qr.next{font-size:clamp(1.8rem,5.6vh,3.3rem);border-top:1px dashed var(--line);padding-top:1rem;margin-top:.4rem;animation:pop .4s both}
.ref{font-weight:800;color:var(--gold);font-size:clamp(1.1rem,3vh,1.6rem)}
.juz-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.35rem;width:min(40rem,100%)}
.juz-grid .chip{padding:.35em 0;text-align:center}
select.fld,input.fld,textarea.fld{background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);border-radius:.7rem;padding:.5em .8em;font-weight:700}
textarea.fld{width:100%;min-height:16rem;line-height:1.7;font-weight:600;-webkit-user-select:text;user-select:text}

/* نوافذ */
.ov{position:fixed;inset:0;background:rgba(3,10,7,.62);display:grid;place-items:center;z-index:50;animation:fade .2s;padding:1rem}
@keyframes fade{from{opacity:0}}
.dlg{background:#11291d;border:1px solid var(--line);border-radius:1.3rem;padding:1.4rem 1.5rem;width:min(42rem,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:.9rem}
.dlg h3{margin:0;font-family:var(--disp);font-weight:400;font-size:1.8rem}
.dlg .acts{display:flex;gap:.6rem;justify-content:flex-start;flex-wrap:wrap}
.trow{display:flex;gap:.5rem;align-items:center}
.trow .ib{font-size:1.5rem;border-color:var(--tc)}
.trow input{flex:1}
#toast{position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%) translateY(1rem);background:#1d4532;border:1px solid var(--line);padding:.7rem 1.3rem;border-radius:99px;font-weight:800;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pads{grid-template-columns:repeat(min(var(--n),3),minmax(0,1fr))}
  .pk-board{gap:.6rem}
}
@media (max-width:560px){.tiles{grid-template-columns:1fr}.stage{padding:.6rem 1rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* البينيات: كل فقرة لعبة مستقلة بهويتها */
:root{--disp:var(--font),Lalezar,Tajawal,"Segoe UI",sans-serif}
body{background:var(--page)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--pat,none)}
.ov{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.dlg{background:color-mix(in srgb,var(--bg3) 88%,#000);border-color:var(--line)}
#toast{background:var(--bg3)}
#sb{background:color-mix(in srgb,var(--bg) 70%,transparent)!important}
.btn.gold{color:var(--on-gold,#2a1d00)}.chip.on{color:var(--on-gold,#2a1d00)}
.top h2{font-weight:var(--dw,400)}
.t-mark{height:2.8rem;width:2.8rem;object-fit:contain;display:block}
.setup h1,.setup h2,.banner,.cnt-t,.bz-status,.qt{font-family:var(--disp);font-weight:var(--dw,400)}
#home{align-items:center;justify-content:center;padding:1.4rem 2rem;gap:0;overflow:auto}
.h-store{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;padding:.55em 1em;border-radius:99px;background:rgba(255,255,255,.14);color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 1.5px var(--line)}
.h-store:hover{background:rgba(255,255,255,.22)}
.solo-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:clamp(1rem,3vw,3rem);width:min(82rem,100%);margin:auto 0}
.solo-art{position:relative;aspect-ratio:1;max-height:72vh;justify-self:center;width:100%;max-width:72vh;display:grid;place-items:center}
.solo-art .halo{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0,rgba(255,255,255,.2) 45%,rgba(255,255,255,0) 72%)}
.solo-art .mark{position:relative;width:82%;animation:hero-in .7s cubic-bezier(.2,1.5,.4,1) both}
.solo-art .mark img{width:100%;display:block;animation:amb-c 4.5s ease-in-out infinite}
@keyframes hero-in{from{transform:scale(.35) rotate(-14deg);opacity:0}}
@keyframes amb-c{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.1rem) rotate(3deg)}}
.solo-copy{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(.7rem,2vh,1.2rem);min-width:0}
.wm{font-family:var(--disp);font-weight:var(--dw,400);line-height:1.12;margin:0;display:flex;flex-wrap:wrap;gap:0 .28em;font-size:clamp(3.4rem,12.5vh,7.6rem)}
.wm span{display:inline-block;color:var(--c);-webkit-text-stroke:.085em var(--wink);paint-order:stroke fill;text-shadow:0 .055em 0 var(--wink),0 .12em 0 rgba(0,0,0,.2)}
.solo-tag{margin:0;font-weight:800;font-size:clamp(1.15rem,3vh,1.7rem);color:var(--ink)}
.solo-why{list-style:none;margin:0;padding:0;display:grid;gap:.35rem;font-weight:700;font-size:clamp(.98rem,2.2vh,1.18rem);color:var(--ink)}
.solo-why li{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px var(--line);border-radius:.8rem;padding:.3em .85em}
.solo-acts{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.btn.play{font-family:var(--disp);font-weight:var(--dw,400);font-size:clamp(1.5rem,4.2vh,2.5rem);padding:.42em 1.5em;border-radius:1.3rem;animation:play-pulse 2.2s ease-in-out infinite;box-shadow:0 .35rem 0 color-mix(in srgb,var(--gold) 60%,#000)}
@keyframes play-pulse{50%{transform:scale(1.045)}}
@media (max-width:900px){.solo-hero{grid-template-columns:1fr}.solo-art{max-width:36vh}.solo-copy{align-items:center;text-align:center}.wm{justify-content:center}}

:root{--bg:#15074a;--bg2:#22096b;--bg3:#33108f;--gold:#ffe11f;--gold2:#fff29a;--mut:#c9bcf3;--page:radial-gradient(120% 95% at 50% 0%,#6a2bf0 0%,#2f0f96 52%,#12053f 100%);--pat:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 26px,transparent 26px 70px);--font:'Marhey';--dw:700;--wink:#22096b}

/* ui-setup v1: شاشة الإعداد الموحدة (أساسي · إعدادات إضافية · للمشرف) */
.stage.su{justify-content:flex-start;gap:0;padding:.3rem 1.2rem 5.4rem;text-align:start}
.stage.su>:first-child{margin-top:0}.stage.su>:last-child{margin-bottom:0}
.usetup{display:flex;flex-direction:column;gap:.55rem;width:min(72rem,100%);margin:0 auto}
.usetup .card{max-width:none;width:100%}
.usetup .card.us-card{padding:.6rem 1rem;border-radius:1.1rem}
.usetup .chips{justify-content:flex-start}
.us-h{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.us-h>b{font-size:1.12rem}
.us-h>.hint,.us-h>.us-by{margin-inline-start:auto}
.us-cnt{gap:.45rem}.us-cnt .ib{width:2.3rem;height:2.3rem}
.us-n{font-size:1.3rem;min-width:1.4ch;text-align:center}
.us-hint{margin-inline-start:auto;font-size:.85rem}
.us-line{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.pmodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-top:.45rem}
.pm{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:start;border:0;border-radius:1rem;padding:.5rem .75rem;cursor:pointer;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;transition:transform .15s,box-shadow .15s,background .15s}
.pm:hover{transform:translateY(-2px)}
.pm .pt{display:flex;align-items:center;gap:.45rem}
.pm .pi{font-size:1.45rem;line-height:1.1}
.pm b{font-size:1.15rem;font-weight:800}
.pm small{color:var(--mut);font-weight:700;font-size:.8rem;line-height:1.45}
.pm.on{background:color-mix(in srgb,var(--gold) 22%,transparent);box-shadow:inset 0 0 0 2.5px var(--gold),0 .25rem 0 color-mix(in srgb,var(--gold) 45%,transparent)}
.pm.on small{color:var(--ink)}
.pm:focus-visible,.sz:focus-visible,.mod:focus-visible,.pcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tagc{background:var(--gold);color:var(--on-gold,#2a1d00);border-radius:99px;padding:.05em .75em;font-weight:800;font-size:.85rem}
.tagc[hidden]{display:none}
.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-top:.45rem}
.sz{border:0;border-radius:.9rem;padding:.35rem .5rem;cursor:pointer;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;font-weight:800;line-height:1.35;transition:transform .15s}
.sz:hover{transform:translateY(-2px)}
.sz b{font-size:1.08rem}.sz span{font-size:.95rem}.sz small{color:var(--mut);font-weight:700;font-size:.82rem}
.sz.on{background:var(--gold);color:var(--on-gold,#2a1d00);box-shadow:0 .25rem 0 color-mix(in srgb,var(--gold) 55%,#000)}.sz.on small{color:inherit;opacity:.85}
.us-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.45rem;margin-top:.45rem}
.us-teams .trow input{min-width:0;padding:.4em .7em}
.us-teams .trow .ib{width:2.5rem;height:2.5rem;font-size:1.35rem;border-width:2px}
.us-juz{grid-template-columns:repeat(30,minmax(0,1fr));width:100%;margin-top:.45rem;gap:.25rem}
.us-juz .chip{font-size:.85rem;padding:.3em 0}
.us-quick .chip{padding:.3em .8em;font-size:.9rem}
details.more{padding:0!important;overflow:hidden}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;flex-wrap:wrap}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";margin-inline-start:auto;font-size:1.2rem;color:var(--mut);transition:transform .2s}
details.more[open]>summary::after{transform:rotate(180deg)}
.more-in{display:flex;flex-direction:column;gap:.75rem;padding:.75rem 1rem .9rem;border-top:1.5px dashed var(--line)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.45rem}
.mod{display:flex;align-items:center;gap:.6rem;text-align:start;border:0;border-radius:.9rem;padding:.45rem .7rem;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-weight:700}

  enter() { renderSetup(this); },
  leave() { if (this.T) this.T.stop(); },
  busy() { return !!this.G && !['setup', 'end'].includes(this.phase) && (this.G.round > 0 || this.phase !== 'ready'); },
  begin() {
    const p = prefs.counter; uPlay();
    this.list = parseCounter(p.text); if (!this.list.length) this.list = parseCounter(DEFAULT_COUNTER);

  },
  pickCat() { const c = this.list[this.order[this.k % this.order.length]]; this.k++; return c; },
  need: c => Math.min(20, c.n + (prefs.counter.harder ? 2 : 0)),
  load() {
    if (this.T) this.T.stop(); const p = prefs.counter, G = this.G, team = G.round % prefs.teamCount, c = this.pickCat(), late = p.catchup && isLast(team);
    this.R = { team, c, n: this.need(c), time: p.time + (late ? 5 : 0), late, mult: p.dbl > 0 && chance(p.dbl) ? 2 : 1, x2: false, extra: false, pts: 0, msg: '' };

      : `${ph === 'lose' && R.canSteal && !R.stolen ? `<button class="btn big" data-act="c-steal">🏴‍☠️ سرقها ${T[R.thief].e} ${esc(T[R.thief].n)} +${arNum(2 * R.mult)}</button>` : ''}<button class="btn gold big" data-act="c-after">${R.final || (lastRound && !toFinal) ? '🏁 النتيجة النهائية' : lastRound ? '🏆 إلى المزاد الختامي' : 'التصنيف التالي'} ←<kbd>Enter</kbd></button>`;

  paintDots() { $$('#c-dots i').forEach((d, i) => d.classList.toggle('on', i < this.got)); },
  start() {
    if (this.phase !== 'ready') return; this.phase = 'run'; Snd.whistle(); const R = this.R;
    this.T = makeTimer(R.time, l => paintRing($('#c-ring .ring'), l, R.time), () => { if (this.phase === 'run') this.finish(false); });
    this.render(); this.T.start();
  },
  plus() { if (this.phase !== 'run') return; this.got++; this.paintDots(); Snd.up(); if (this.got >= this.R.n) { this.T.stop(); this.finish(true); } },
  minus() { if (this.phase === 'run' && this.got > 0) { this.got--; this.paintDots(); Snd.down(); } },
  finish(win) {
    const R = this.R, p = prefs.counter, T = teams(); this.phase = win ? 'win' : 'lose';
    if (R.final) {
      const to = win ? R.team : this.F.other; addScore(to, R.n);
      R.msg = win ? `<div class="banner good">كمّلوها! +${arNum(R.n)} لـ ${esc(T[to].n)} 🎉</div>` : `<div class="banner bad">ما كمّلوا (${arNum(this.got)} من ${arNum(R.n)}) · النقاط +${arNum(R.n)} لـ ${esc(T[to].n)}</div>`;
    } else {
      const base = p.score === 'each' ? this.got + (win ? 2 : 0) : win ? 3 : 0;
      R.pts = base * R.mult * (R.x2 ? 2 : 1); if (R.pts) addScore(R.team, R.pts);
      R.canSteal = !win && p.steal && prefs.teamCount > 1; R.thief = (R.team + 1) % prefs.teamCount;

  steal() {

  },
  after() {

  card(k, i) {

  /* الختام: مزاد العدّ بين أول فريقين */
  auction() { const [a, b] = top2(); this.F = { a, b, bid: [3, 3], c: this.pickCat() }; this.phase = 'bid'; this.renderBid(); Snd.whistle(); },
  renderBid() {

      <div class="bids">${[F.a, F.b].map((ti, s) => `<div class="bid" style="--tc:${T[ti].c}"><div class="nm">${T[ti].e} ${esc(T[ti].n)}</div><div class="row"><button class="ib" data-act="c-bid" data-s="${s}" data-d="-1" aria-label="أقل">−</button><b class="bv">${arNum(F.bid[s])}</b><button class="ib" data-act="c-bid" data-s="${s}" data-d="1" aria-label="أكثر">+</button></div></div>`).join('<div class="vs">🆚</div>')}</div>

  sold() {

  edit() {
    const d = dialog(`<h3>✏️ تصنيفات العدّاد</h3><p class="hint" style="margin:0">كل سطر: <b>التصنيف | العدد</b>. والسطر اللي يبدأ بـ # عنوان قسم.</p><textarea class="fld" id="c-text">${esc(prefs.counter.text)}</textarea>

  act: {
    'c-start'() { Counter.start(); }, 'c-plus'() { Counter.plus(); }, 'c-minus'() { Counter.minus(); }, 'c-next'() { Counter.skip(); },
    'c-after'() { Counter.after(); }, 'c-steal'() { Counter.steal(); }, 'c-edit'() { Counter.edit(); },
    'c-bid'(el) { const F = Counter.F, s = +el.dataset.s; F.bid[s] = Math.max(1, Math.min(20, F.bid[s] + +el.dataset.d)); Snd.pop(); Counter.renderBid(); },
    'c-sold'() { Counter.sold(); },
  },
  set() { if (this.phase === 'setup') renderSetup(this); else if (this.R && this.phase !== 'end' && this.phase !== 'bid') this.render(); },
  key(e) {
    const u = uKey(this, e); if (u !== 'go') return u ? undefined : false;
    const ph = this.phase;
    if (ph === 'bid') { if (e.code === 'Enter') this.sold(); else return false; return; }
    if (e.code === 'Enter') { if (ph === 'ready') this.start(); else if (ph === 'win' || ph === 'lose') this.after(); }
    else if (e.code === 'Space') this.plus();
    else if (e.code === 'Backspace') this.minus();

  enter() { renderSetup(this); },

  },
  right() {
    if (this.win == null || this.win < 0) return; const w = this.win, G = this.G, p = prefs.buzz;
    const pts = p.pts * (this.gold ? 3 : 1) * (this.x2.has(w) ? 2 : 1) * (p.catchup && !G.fin && isLast(w) ? 2 : 1);
    if (this.AT) this.AT.stop(); addScore(w, pts); Snd.good(); FX.burst(90); toast(`+${arNum(pts)} لـ ${teams()[w].n}`);
    this.win = -1;
    if (G.fin) { G.fin.got[w] = (G.fin.got[w] || 0) + 1; if (G.fin.got[w] >= 3) { addScore(w, 5); this.tm = setTimeout(() => ceremony(this, `${teams()[w].n} فاز بالنهائي +٥`), 900); return; } }
    else G.q++;

  },
  nextQ() {
    const G = this.G;
    if (!G.fin && G.q >= G.total) { if (prefs.buzz.finale && prefs.teamCount >= 2) { G.fin = { t: top2(), got: {} }; toast('🏆 النهائي!'); Snd.whistle(); } else return ceremony(this); }
    this.reset();
  },
  wrong() {
    if (this.win == null || this.win < 0) return; const w = this.win; if (this.AT) this.AT.stop();
    if (prefs.buzz.pen) addScore(w, -1);
    if (this.retry.has(w)) { this.retry.delete(w); toast('🔁 فرصة ثانية: الفريق باقي في السؤال'); } else this.out.add(w);
    this.win = null; Snd.bad();
    if (!teams().some((_, i) => !this.blocked(i))) { toast('ما بقى أحد — السؤال التالي'); if (!this.G.fin) this.G.q++; return this.nextQ(); }
    this.open = true; this.t0 = performance.now(); this.render();
  },
  skip() { if (this.phase !== 'play' || this.win === -1) return; this.reset(); Snd.pop(); },
  card(k, i) {
    const G = this.G; if (!G || !G.cards || G.fin || this.open || this.win != null || !G.cards[i] || !G.cards[i].has(k)) return;
    if (k === 'freeze') {
      const S = teams().map((_, j) => j).filter(j => j !== i && !this.blocked(j)).sort((a, b) => (scores[b] || 0) - (scores[a] || 0) || a - b);
      if (!S.length) return toast('ما فيه فريق تجمّده'); this.frozen.add(S[0]); toast(`❄️ ${teams()[S[0]].n} مجمّد في هالسؤال`);
    } else (k === 'x2' ? this.x2 : this.retry).add(i);
    G.cards[i].delete(k); Snd.ding(); this.render();
  },
  act: { 'b-open'() { Buzz.openBell(); }, 'b-press'(el) { Buzz.press(+el.dataset.i); }, 'b-right'() { Buzz.right(); }, 'b-wrong'() { Buzz.wrong(); }, 'b-reset'() { Buzz.skip(); } },
  set() { if (this.phase === 'setup') renderSetup(this); else if (this.phase === 'play' && this.win !== -1) this.render(); },
  key(e) {
    const u = uKey(this, e); if (u !== 'go') return u ? undefined : false;
    const m = /^(?:Digit|Numpad)([1-6])$/.exec(e.code);
    if (m) this.press(+m[1] - 1);
    else if (e.code === 'Space') { this.win != null || this.open ? this.skip() : this.openBell(); }
    else if (e.code === 'Enter') this.right();
    else if (e.code === 'Backspace') this.wrong();
    else return false;
  },
};

/* ---------- عجلة الاختيار ---------- */
const WHEEL_COLORS = ['#FF5A4D', '#4DA3FF', '#34C98B', '#FFB62E', '#A78BFA', '#F472B6', '#2DD4BF', '#FB923C'];
const Wheel = {
  id: 'wheel', icon: '🎡', title: 'عجلة الاختيار', desc: 'قرعة لاختيار طالب أو فريق أو فقرة',
  a: 0, phase: 'setup', hist: [], pool: [], res: null,
  S: {
    desc: ['لفّة وتطلع نتيجة، والكل يبقى في العجلة.', 'لفّة بتشويق، واللي يطلع ينشال عشان الكل ياخذ دوره.', 'اختيارين في كل لفّة، مع سجل باللي طلعوا.', 'قرعة مواجهات كاملة: كل اثنين ضد بعض.'],

      cup: { remove: true, suspense: true, picks: 2, pairs: true },
    },
    order: ['basic', 'teams'], teams: () => prefs.wheel.src === 'teams', noTeamSum: true,
    basic: () => {
      const w = prefs.wheel, n = Wheel.entries().length;
      return `<div class="card us-card"><div class="us-h"><b>العجلة فيها</b><span class="hint">${arNum(n)} خيار</span></div><div class="us-line" style="margin-top:.5rem">${seg('src', w, [['teams', '👥 الفرق'], ['nums', '🔢 أرقام'], ['custom', '✍️ أسماء من عندي']])}
        ${w.src === 'nums' ? `<span class="lbl">من ١ إلى</span><input class="fld" type="number" min="2" max="60" value="${w.nums}" data-uin="nums" style="width:5.5rem" aria-label="آخر رقم">` : ''}
        ${w.src === 'custom' ? `<button class="btn ghost" data-act="w-edit">✏️ الأسماء${n ? ` (${arNum(n)})` : ''}</button>` : ''}</div></div>`;
    },
    input: el => { const w = prefs.wheel; w.nums = Math.max(2, Math.min(60, +el.value || 20)); savePrefs(); renderSetup(Wheel); },
    sum: () => { const w = prefs.wheel, n = Wheel.entries().length; return [`${arNum(n)} خيار في العجلة`, w.pairs ? 'مواجهات' : w.picks > 1 ? `${arNum(w.picks)} في كل لفّة` : '', w.remove ? 'اللي يطلع ينشال' : '']; },
    moreHint: 'الاختيارات · التشويق · المواجهات',
    more: () => { const w = prefs.wheel, t = Wheel; return uSeg('🎯 كم اختيار في كل لفّة', 'picks', w, [[1, 'واحد'], [2, 'اثنين'], [3, 'ثلاثة']])
      + `<div class="mods">${uTog(t, 'remove', '🧺', 'اللي يطلع ينشال', 'ما يتكرر لين يطلع الكل')}${uTog(t, 'suspense', '🥁', 'لفّة التشويق', 'أطول وأبطأ في آخرها، وطبول قبل النتيجة')}${uTog(t, 'pairs', '🆚', 'قرعة مواجهات', 'كل لفّة تطلّع اثنين ضد بعض')}${uGlobal(false)}</div>`; },
    adminHint: 'قائمة الأسماء',
    admin: () => { const L = prefs.wheel.text.split(/\r?\n/).map(s => s.trim()).filter(Boolean); return `<div class="us-line" style="justify-content:space-between"><span class="hint">${L.length ? `${arNum(Math.min(60, L.length))} اسم محفوظ` : 'ما فيه أسماء محفوظة'} · حتى ٦٠ اسم</span><button class="btn ghost" data-act="w-edit">✏️ تعديل الأسماء</button></div>`; },
  },
  entries() {
    const w = prefs.wheel;
    if (w.src === 'teams') return teams().map(t => t.e + ' ' + t.n);
    if (w.src === 'nums') return Array.from({ length: Math.max(2, Math.min(60, w.nums)) }, (_, i) => arNum(i + 1));
    if (w.src === 'tools') { w.src = 'teams'; return teams().map(t => t.e + ' ' + t.n); }
    return w.text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, 60);
  },
  enter() { renderSetup(this); },
  leave() { cancelAnimationFrame(this.raf); this.spinning = false; this.sid = (this.sid || 0) + 1; },
  busy() { return this.phase === 'play' && this.hist.length > 0; },
  begin() {
    const all = this.entries(); if (all.length < 2) { toast('أضف خيارين على الأقل'); return; }
    uPlay(); this.sid = (this.sid || 0) + 1; this.phase = 'play'; this.pool = all; this.res = null; this.hist = []; this.spinning = false; this.a = 0; this.render(); Snd.pop();
  },
  render() {
    stage().innerHTML = `<div class="wh-side">
      <div class="wheel-wrap" style="--ws:min(62vh,46vw)"><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><button class="wh-hub" data-act="w-spin" aria-label="لف العجلة">🎯</button></div>
      <div class="wh-res" id="w-res">${this.resHTML()}</div></div>`;
    this.draw();
  },
  per() { const w = prefs.wheel; return w.pairs ? 2 : Math.max(1, Math.min(3, w.picks)); },
  histHTML() {
    if (!this.hist.length) return ''; const w = prefs.wheel;
    const rows = this.hist.map((h, i) => `<li><b>${arNum(i + 1)}.</b> ${w.pairs ? (h[1] != null ? `${esc(h[0])} 🆚 ${esc(h[1])}` : `${esc(h[0])} · تأهل مباشر`) : h.map(esc).join('، ')}</li>`);
    return `<div class="wh-hist"><b>${w.pairs ? '🆚 المواجهات' : '📋 اللي طلعوا'}</b><ol>${rows.slice(-10).join('')}</ol></div>`;
  },
  resHTML() {
    const w = prefs.wheel, more = this.pool.length >= (w.pairs ? 1 : 2), refill = this.pool.length < this.entries().length ? '<button class="btn ghost" data-act="w-refill">↺ رجّع كل الخيارات</button>' : '';
    if (this.res == null) return `<div class="hint">${this.pool.length ? `${arNum(this.pool.length)} خيار في العجلة` : 'العجلة فاضية'}</div><button class="btn gold big" data-act="w-spin" ${more ? '' : 'disabled'}>🎡 لفّ العجلة<kbd>مسافة</kbd></button>${refill}${this.histHTML()}`;
    const r = this.res, duel = w.pairs && r.length === 2;
    return `<div class="kicker">${duel ? `المواجهة ${arNum(this.hist.length)}` : w.pairs ? 'بدون خصم' : 'وقعت القرعة على'}</div>
      <div class="who ${r.length > 1 ? 'sm' : ''}">${duel ? `${esc(r[0])}<span class="vs">🆚</span>${esc(r[1])}` : r.map(esc).join('<br>')}</div>${w.pairs && r.length === 1 ? '<div class="hint">تأهل مباشر</div>' : ''}
      ${more ? `<button class="btn big" data-act="w-again">🎡 ${w.pairs ? 'المواجهة التالية' : 'لفّة جديدة'}<kbd>مسافة</kbd></button>` : '<div class="hint">خلصت الخيارات 🎉</div>'}${refill}${this.histHTML()}`;
  },
  draw() {
    const cv = $('#wheel'); if (!cv) return; const x = cv.getContext('2d'), R = 450, n = this.pool.length;
    x.clearRect(0, 0, 900, 900);
    if (!n) { x.fillStyle = 'rgba(255,255,255,.08)'; x.beginPath(); x.arc(R, R, R, 0, Math.PI * 2); x.fill(); return; }
    const sw = Math.PI * 2 / n;
    for (let i = 0; i < n; i++) {
      const a0 = this.a + i * sw - Math.PI / 2;
      x.beginPath(); x.moveTo(R, R); x.arc(R, R, R - 4, a0, a0 + sw); x.closePath();
      const L = WHEEL_COLORS.length, ci = i === n - 1 && n > 1 && i % L === 0 ? 1 : i % L;   // آخر قطعة ما تاخذ نفس لون الأولى
      x.fillStyle = WHEEL_COLORS[ci]; x.fill();
      x.strokeStyle = 'rgba(10,29,21,.55)'; x.lineWidth = 4; x.stroke();
      x.save(); x.translate(R, R); x.rotate(a0 + sw / 2); x.textAlign = 'right'; x.textBaseline = 'middle'; x.direction = 'rtl';
      const fs = Math.max(20, Math.min(54, 900 / Math.max(n, 6) * 1.1)); x.font = `800 ${fs}px Tajawal, "Segoe UI", Tahoma, sans-serif`; x.fillStyle = '#10140f';
      let t = this.pool[i]; while (x.measureText(t).width > R * .68 && t.length > 2) t = t.slice(0, -2) + '…';
      x.fillText(t, R - 34, 0); x.restore();
    }
  },
  spinOnce(dur, sus) {   // لفّة وحدة، ترجع رقم الخيار اللي وقف عليه المؤشر
    return new Promise(done => {
      const id = this.sid, live = () => cur === Wheel && this.phase === 'play' && this.sid === id, n = this.pool.length, sw = Math.PI * 2 / n, pick = Math.random() * n | 0, TAU = Math.PI * 2;
      // نوقف بحيث يكون منتصف الخيار المختار تحت المؤشر (فوق)
      const base = -(pick * sw + sw / 2) + (Math.random() - .5) * sw * .7, turns = (sus ? 7 : 5) + Math.random() * 2 | 0;
      const from = this.a, target = from - (TAU * turns + ((from - base) % TAU + TAU) % TAU);
      const D = RM ? 300 : dur, t0 = performance.now(); let lastSeg = Math.floor(-from / sw);
      const ease = sus ? t => 1 - Math.pow(1 - t, 5) : t => 1 - Math.pow(1 - t, 4);
      const step = now => {
        if (!live()) return done(null);   // طلع المقدّم من العجلة أثناء اللف
        const t = Math.min(1, (now - t0) / D); this.a = from + (target - from) * ease(t); this.draw();
        const sg = Math.floor(-this.a / sw); if (sg !== lastSeg) { lastSeg = sg; Snd.tick(); }
        if (t < 1) { this.raf = requestAnimationFrame(step); return; }
        if (!sus || RM) return done(pick);
        const r = $('#w-res'); if (r) r.innerHTML = '<div class="who drum">🥁</div>';
        for (let i = 0; i < 9; i++) setTimeout(() => Snd.tick(), i * 85);
        setTimeout(() => done(live() ? pick : null), 950);
      };
      this.raf = requestAnimationFrame(step);
    });
  },
  async spin() {
    if (this.phase !== 'play' || this.spinning) return; const w = prefs.wheel, k = this.per();
    if (this.pool.length < 2 && !(w.pairs && this.pool.length === 1)) return;
    this.spinning = true; this.res = null; const got = []; Snd.whistle();
    while (got.length < k && this.pool.length) {
      let i = 0;
      if (this.pool.length > 1) {
        const r = $('#w-res'); if (r) r.innerHTML = `<div class="kicker">${got.length ? `الاختيار ${arNum(got.length + 1)} …` : '… تلفّ …'}</div>${got.length ? `<div class="who sm">${got.map(esc).join('<br>')}</div>` : ''}`;
        i = await this.spinOnce(got.length ? 2600 : w.suspense ? 8000 : 5200, w.suspense && !got.length);
        if (i == null) return;
      }
      got.push(this.pool.splice(i, 1)[0]); this.a = 0; this.draw();
      if (got.length < k && this.pool.length) { Snd.ding(); const id = this.sid; await sleep(RM ? 50 : 500); if (cur !== Wheel || this.phase !== 'play' || this.sid !== id) return; }
    }
    if (!w.remove) { this.pool = this.entries(); this.draw(); }
    this.spinning = false; this.res = got; this.hist.push(w.pairs ? [got[0], got[1] != null ? got[1] : null] : got);
    Snd.win(); FX.burst(110); const r = $('#w-res'); if (r) r.innerHTML = this.resHTML();
  },
  edit() {
    const d = dialog(`<h3>✍️ أسماء العجلة</h3><p class="hint" style="margin:0">كل اسم في سطر (حتى ٦٠).</p><textarea class="fld" id="w-text" placeholder="محمد&#10;عبدالله&#10;خالد">${esc(prefs.wheel.text)}</textarea>
      <div class="acts"><button class="btn gold" id="w-save">حفظ</button><button class="btn ghost" data-close>إلغاء</button></div>`);

  },
  act: { 'w-spin'() { Wheel.spin(); }, 'w-again'() { Wheel.spin(); }, 'w-edit'() { Wheel.edit(); }, 'w-refill'() { if (!Wheel.spinning) { Wheel.pool = Wheel.entries(); Wheel.res = null; Wheel.a = 0; Wheel.render(); Snd.pop(); } }, 'w-go'(el) { open(el.dataset.id); } },
  set() { if (this.phase === 'setup') renderSetup(this); },
  key(e) {
    const u = uKey(this, e); if (u !== 'go') return u ? undefined : false;
    if (e.code === 'Space' || e.code === 'Enter') this.spin(); else return false;
  },
};

/* ---------- بنك الأسئلة (لضربات الجزاء وصح أو خطأ) ---------- */
const QB = (BANK && BANK.q || []).map(r => ({ id: r[0], cat: BANK.cats[r[1]][0], catName: BANK.cats[r[1]][1], icon: BANK.cats[r[1]][2], lvl: r[2], type: r[3], q: r[4], a: r[5], w: r[6] || [] }));
const catOk = (q, cats) => cats === 'all' || (cats === 'deen' ? DEEN.includes(q.cat) : !DEEN.includes(q.cat));
const CATS_SEG = [['all', 'الكل'], ['deen', 'الدينية'], ['gen', 'العامة']];
const usedQ = new Set();   // ما يتكرر السؤال في نفس الجلسة
function drawFrom(list) { let pool = list.filter(q => !usedQ.has(q.id)); if (!pool.length) { list.forEach(q => usedQ.delete(q.id)); pool = list; } const q = rnd(pool); if (q) usedQ.add(q.id); return q; }

      if (ga + ra < gb) return 1; if (gb + rb < ga) return 0;
      if (!ra && !rb && ga !== gb) return ga > gb ? 0 : 1;

  answer(said) {

};

/* ---------- أكمل الآية ---------- */
const QS = QURAN ? QURAN.s : [];
const OFF = []; { let o = 0; QS.forEach((s, i) => { OFF[i] = o; o += s[1].length; }); }
const JUZ_OF = (() => {   // رقم الجزء لكل آية (بالترتيب العام)
  const out = []; if (!QURAN) return out; const starts = QURAN.j.map(([s, a]) => OFF[s - 1] + a - 1);
  let j = 0; for (let g = 0; g < 6236; g++) { while (j + 1 < starts.length && g >= starts[j + 1]) j++; out.push(j + 1); }
  return out;
})();
const MARK = /^[ؐ-ؚۖ-ۭ]+$/;   // علامات الوقف تلتصق بالكلمة اللي قبلها
const words = t => t.split(' ').reduce((a, w) => { if (MARK.test(w) && a.length) a[a.length - 1] += ' ' + w; else a.push(w); return a; }, []);

const AY_CARDS = [['hint', '💡', 'تلميح'], ['time', '⏱️', '+١٠ ثواني'], ['swap', '🔄', 'آية ثانية']];

const ayOK = (type, si, ai, n) => type === 'complete' ? n >= 4 : type === 'next' ? ai < QS[si][1].length - 1 && n >= 2 : n >= 3;

    modes: {

    adminHint: 'المصدر · لوحة النقاط',
    admin: () => `<div class="us-line" style="justify-content:space-between"><span class="hint">النص من مصحف المدينة برواية حفص (الرسم العثماني، مشروع تنزيل).</span>${uZeroNow()}</div>`,

  pool() {

    const p = prefs.ayat, pool = this.pool(); if (!pool.length) return toast('ما فيه آيات بهالاختيار');
    uPlay(); this.bag = shuffle(pool);
    this.G = { k: 0, total: Math.min(pool.length, this.S.sizeN(p.size)), cards: p.cards ? teams().map(() => new Set(AY_CARDS.map(c => c[0]))) : null, fin: null };
    this.phase = 'run'; Snd.whistle(); this.load();
  },
  pick(types) {   // آية من الكيس تناسب أحد الأنواع (ما تتكرر لين يخلص الكيس)
    for (let i = 0; i < this.bag.length; i++) { const it = this.bag.shift(); this.bag.push(it); const ok = types.filter(tp => ayOK(tp, it[0], it[1], it[2])); if (ok.length) return { si: it[0], ai: it[1], type: rnd(ok) }; }
    return null;
  },
  load() {
    if (this.T) this.T.stop(); const G = this.G, p = prefs.ayat, fin = G.fin;
    const team = fin ? fin.t[fin.k % 2] : G.k % prefs.teamCount, q = fin ? (this.pick(['next']) || this.pick(p.types)) : this.pick(p.types);
    this.Q = { ...q, team, mult: fin ? 2 : p.gold > 0 && chance(p.gold) ? 2 : 1, time: p.timer, hintN: 0, st: 'ask' };
    this.show();
  },
  textHTML() {
    const Q = this.Q, w = words(QS[Q.si][1][Q.ai]);
    if (Q.type !== 'complete') return `﴿ ${QS[Q.si][1][Q.ai]} ﴾`;
    return `﴿ ${w.slice(0, Math.min(w.length - 1, this.cut + Q.hintN)).join(' ')} <span class="gap">…</span> ﴾`;
  },
  hintHTML() {
    const Q = this.Q; if (!Q.hintN || this.revealed) return '';
    if (Q.type === 'next') return `<div class="qr hintq">💡 تبدأ بـ: ${words(QS[Q.si][1][Q.ai + 1]).slice(0, Q.hintN).join(' ')} …</div>`;
    if (Q.type === 'which') return `<div class="ref">💡 من الجزء ${arNum(JUZ_OF[OFF[Q.si] + Q.ai])}</div>`;
    return '';
  },
  show() {
    if (this.T) this.T.stop(); const Q = this.Q, p = prefs.ayat, s = QS[Q.si], G = this.G, w = words(s[1][Q.ai]);
    this.cut = Math.max(2, Math.min(w.length - 2, Math.round(w.length * .45))); this.revealed = false;
    const prompt = Q.type === 'complete' ? 'أكمل الآية' : Q.type === 'next' ? 'ما الآية التالية؟' : 'من أي سورة هذه الآية؟';
    const head = G.fin ? `🏆 جولة الحسم · ${arNum(G.fin.k + 1)} من ${arNum(AY_FIN)}` : `${arNum(G.k + 1)} من ${arNum(G.total)}`;
    const tag = Q.mult > 1 ? `<span class="tagx gold" style="margin-inline-start:.5rem">${G.fin ? 'النقاط ×٢' : '⭐ آية ذهبية ×٢'}</span>` : '';
    stage().innerHTML = `<div class="kicker">${prompt}${p.hint && Q.type !== 'which' ? ` · سورة ${esc(s[0])}` : ''} · ${head}</div>
      ${turnHTML(Q.team, tag)}
      ${Q.time ? `<div id="a-ring">${ringHTML(Q.time, Q.time, 'clamp(4.5rem,11vh,6rem)')}</div>` : ''}
      <div class="card"><div class="qr" id="a-text">${this.textHTML()}</div><div id="a-hint">${this.hintHTML()}</div><div id="a-ans"></div></div>
      <div class="row" id="a-ctl">${this.ctlHTML()}</div><div id="a-cards">${this.cardsHTML()}</div>`;
    if (Q.time) { this.T = makeTimer(Q.time, l => paintRing($('#a-ring .ring'), l, this.Q.time), () => { Snd.buzz(); }); this.T.start(); }
  },
  cardsHTML() { const Q = this.Q, G = this.G; return G.cards && !G.fin && Q.st === 'ask' && !this.revealed ? cardBar(this, Q.team, AY_CARDS.filter(c => c[0] !== 'time' || Q.time)) : ''; },
  ctlHTML() {
    const Q = this.Q, T = teams(), G = this.G;
    if (Q.st === 'ask') return `${this.revealed ? '' : '<button class="btn big" data-act="a-reveal">👁 الجواب<kbd>مسافة</kbd></button>'}<button class="btn good big" data-act="a-ok">✓ صح +${arNum(Q.mult)}<kbd>Enter</kbd></button><button class="btn bad big" data-act="a-no">✗ خطأ<kbd>⌫</kbd></button>${!G.cards && !G.fin && !this.revealed ? '<button class="btn ghost" data-act="a-skip">⟳ آية ثانية</button>' : ''}`;
    if (Q.st === 'steal') { const th = T[(Q.team + 1) % T.length]; return `<span class="turn" style="--tc:${th.c}">🏴‍☠️ فرصة السرقة: ${th.e} ${esc(th.n)}</span><button class="btn good big" data-act="a-ok">✓ سرقوها +${arNum(Q.mult)}<kbd>Enter</kbd></button><button class="btn bad big" data-act="a-no">✗ ما عرفوا<kbd>⌫</kbd></button>`; }
    const last = G.fin ? G.fin.k + 1 >= AY_FIN : G.k + 1 >= G.total;
    return `<button class="btn gold big" data-act="a-next">${!last ? 'التالي' : !G.fin && prefs.ayat.finale && prefs.teamCount >= 2 ? '🏆 إلى جولة الحسم' : '🏁 النتيجة النهائية'} ←<kbd>Enter</kbd></button>`;
  },
  paint() { const c = $('#a-ctl'); if (c) c.innerHTML = this.ctlHTML(); const k = $('#a-cards'); if (k) k.innerHTML = this.cardsHTML(); },
  reveal() {
    if (this.phase !== 'run' || this.revealed) return; this.revealed = true; if (this.T) this.T.stop(); Snd.ding();
    const Q = this.Q, s = QS[Q.si], ai = Q.ai, ref = `<div class="ref">سورة ${esc(s[0])} · الآية ${arNum(ai + 1)}</div>`;
    $('#a-hint').innerHTML = '';
    if (Q.type === 'complete') { const w = words(s[1][ai]), v = Math.min(w.length - 1, this.cut + Q.hintN); $('#a-text').innerHTML = `﴿ ${w.slice(0, v).join(' ')} <span class="rest">${w.slice(v).join(' ')}</span> ﴾`; $('#a-ans').innerHTML = ref; }
    else if (Q.type === 'next') $('#a-ans').innerHTML = `<div class="qr next">﴿ <span class="rest">${s[1][ai + 1]}</span> ﴾</div><div class="ref">سورة ${esc(s[0])} · الآية ${arNum(ai + 2)}</div>`;
    else $('#a-ans').innerHTML = `<div class="ans" style="font-size:clamp(1.6rem,5vh,2.8rem)">سورة ${esc(s[0])}</div><div class="ref" style="margin-top:.6rem">الآية ${arNum(ai + 1)} · الجزء ${arNum(JUZ_OF[OFF[Q.si] + ai])}</div>`;
    this.paint();
  },
  award(i, m) { addScore(i, m); Snd.good(); FX.burst(70); toast(`+${arNum(m)} لـ ${teams()[i].n}`); },
  judge(ok) {
    const Q = this.Q; if (this.phase !== 'run' || Q.st === 'done') return;
    if (Q.st === 'ask') {
      if (ok) { this.award(Q.team, Q.mult); Q.st = 'done'; }
      else if (prefs.ayat.steal && prefs.teamCount > 1 && !this.G.fin && !this.revealed) { Q.st = 'steal'; Snd.bad(); if (this.T) this.T.stop(); return this.paint(); }
      else { Q.st = 'done'; Snd.bad(); }
    } else { if (ok) this.award((Q.team + 1) % prefs.teamCount, Q.mult); else Snd.bad(); Q.st = 'done'; }
    if (this.revealed) this.paint(); else this.reveal();
  },
  next() {
    const G = this.G; if (this.Q.st !== 'done') return;
    if (G.fin) { G.fin.k++; return G.fin.k >= AY_FIN ? ceremony(this, 'جولة الحسم') : this.load(); }
    G.k++;
    if (G.k >= G.total) { if (prefs.ayat.finale && prefs.teamCount >= 2) { G.fin = { t: top2(), k: 0 }; toast('🏆 جولة الحسم!'); Snd.whistle(); return this.load(); } return ceremony(this); }
    this.load(); Snd.pop();
  },
  skip() { const Q = this.Q; if (this.phase !== 'run' || Q.st !== 'ask' || this.revealed || this.G.cards || this.G.fin) return; Object.assign(Q, this.pick(prefs.ayat.types), { hintN: 0 }); this.show(); Snd.pop(); },
  card(k, i) {
    const G = this.G, Q = this.Q; if (!G || !G.cards || G.fin || this.phase !== 'run' || Q.st !== 'ask' || this.revealed || i !== Q.team || !G.cards[i] || !G.cards[i].has(k)) return;
    if (k === 'time' && !this.T) return;
    if (k === 'hint' && Q.type === 'which' && Q.hintN) return;
    G.cards[i].delete(k); Snd.ding();
    if (k === 'swap') { Object.assign(Q, this.pick(prefs.ayat.types), { hintN: 0 }); return this.show(); }
    if (k === 'time') { Q.time += 10; this.T.add(10); toast('⏱️ +١٠ ثواني'); }
    else { Q.hintN += 2; $('#a-text').innerHTML = this.textHTML(); $('#a-hint').innerHTML = this.hintHTML(); }
    this.paint();
  },
  act: {
    'a-juz'(el) { const p = prefs.ayat, v = +el.dataset.v, i = p.juz.indexOf(v); if (i >= 0) p.juz.splice(i, 1); else p.juz.push(v); savePrefs(); renderSetup(Ayat); },
    'a-quick'(el) { prefs.ayat.juz = el.dataset.v === 'all' ? Array.from({ length: 30 }, (_, i) => i + 1) : el.dataset.v.split(',').map(Number); savePrefs(); renderSetup(Ayat); Snd.pop(); },
    'a-type'(el) { const p = prefs.ayat, v = el.dataset.v, on = p.types.includes(v); if (on && p.types.length === 1) return toast('اختر نوع واحد على الأقل'); p.types = AY_TYPES.map(x => x[0]).filter(k => k === v ? !on : p.types.includes(k)); p.mode = p.types[0]; savePrefs(); renderSetup(Ayat); Snd.pop(); },
    'a-start'() { Ayat.begin(); }, 'a-reveal'() { Ayat.reveal(); }, 'a-ok'() { Ayat.judge(true); }, 'a-no'() { Ayat.judge(false); },
    'a-next'() { Ayat.next(); }, 'a-skip'() { Ayat.skip(); }, 'a-setup'() { UACT['u-setup'](); },
  },
  set() { if (this.phase === 'setup') renderSetup(this); },
  key(e) {
    const u = uKey(this, e); if (u !== 'go') return u ? undefined : false;
    const Q = this.Q;
    if (e.code === 'Space') this.reveal();
    else if (e.code === 'Enter') { if (Q.st === 'done') this.next(); else this.judge(true); }
    else if (e.code === 'Backspace') this.judge(false);
    else return false;
  },
};

const TOOLS = [Counter, Buzz, Wheel, PK, TF, Ayat].filter(t => t.id === SOLO);
TOOLS.forEach(t => { if (!t.S) return; initMode(t); if (!t.dlgClosed) t.dlgClosed = function () { if (this.phase === 'setup') renderSetup(this); }; });
savePrefs();

/* ==========================================================================
   6) التنقّل والأوامر
   ========================================================================== */
function showHome() { if (cur) { cur.leave && cur.leave(); cur = null; } $('#tool').classList.remove('on'); $('#home').classList.add('on'); }
function open(id) {
  const t = TOOLS.find(x => x.id === id); if (!t) return;
  if (cur && cur.leave) cur.leave();
  cur = t; $('#home').classList.remove('on'); $('#tool').classList.add('on');
  $('#t-title').innerHTML = `<img class="t-mark" src="${SOLO_MARK}" alt="">${t.title}`; renderSB(); t.enter(); Snd.pop();
}
const applySound = () => $$('.snd-btn').forEach(b => { b.textContent = prefs.sound ? '🔊' : '🔇'; b.classList.toggle('off', !prefs.sound); });
const toggleFS = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }); };

function teamsDialog() {
  const paint = () => {
    const T = teams(), n = prefs.teamCount;
    d.innerHTML = `<h3>👥 الفرق ولوحة النقاط</h3>
      <div class="row" style="justify-content:flex-start"><span class="lbl">عدد الفرق</span><button class="ib" data-t="minus" ${n <= 2 ? 'disabled' : ''}>−</button><b style="font-size:1.4rem">${arNum(n)}</b><button class="ib" data-t="plus" ${n >= 6 ? 'disabled' : ''}>+</button></div>
      ${T.map((t, i) => `<div class="trow" style="--tc:${t.c}"><button class="ib" data-t="emoji" data-i="${i}" title="غيّر الشعار">${t.e}</button><input class="fld" data-name="${i}" maxlength="22" value="${esc(prefs.names[i] || TEAM_PRESETS[i].n)}"><b style="min-width:3ch;text-align:center;color:${t.c}">${scores[i]}</b></div>`).join('')}
      <div class="acts"><button class="btn gold" data-close>تمام</button><button class="btn ghost" data-t="zero">↺ تصفير النقاط</button></div>
      <p class="hint" style="margin:0">لوحة النقاط تحت كل فقرة، وتبقى محفوظة لين تصفّرها. اضغط 🏆 فوق عشان تخفيها أو تظهرها.</p>`;
  };
  const d = dialog(''); paint();
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return; const k = b.dataset.t;
    if (k === 'plus' || k === 'minus') prefs.teamCount = Math.max(2, Math.min(6, prefs.teamCount + (k === 'plus' ? 1 : -1)));
    else if (k === 'emoji') { const i = +b.dataset.i, used = teams().map(t => t.e); let j = EMOJIS.indexOf(teams()[i].e); do { j = (j + 1) % EMOJIS.length; } while (used.includes(EMOJIS[j])); prefs.emojis[i] = EMOJIS[j]; }
    else if (k === 'zero') { scores = [0, 0, 0, 0, 0, 0]; saveScores(); toast('تم تصفير النقاط'); }
    savePrefs(); paint(); renderSB(); Snd.pop();
  });
  d.addEventListener('input', e => { const i = e.target.dataset.name; if (i != null) { prefs.names[+i] = e.target.value; savePrefs(); renderSB(); } });
}
const HELP = `<h3>❓ طريقة الاستخدام</h3><div style="line-height:1.9;font-weight:600">
  <p style="margin:0">ست فقرات قصيرة تستخدمها بين جولات أي مسابقة. اللعبة تشتغل بدون إنترنت، وكل شي يتحفظ في المتصفح.</p>
  <ul style="margin:.4rem 0;padding-inline-start:1.2rem">
    <li><b>⏱️ العدّاد:</b> يطلع تصنيف (مثل «طيور»)، والفريق يعدّد قبل ما يخلص الوقت. كل إجابة صح اضغط <kbd>مسافة</kbd>. التصنيفات تتعدّل من زر ✏️.</li>
    <li><b>🔔 أسرع إصبع:</b> اقرأ السؤال، ثم <kbd>مسافة</kbd> تفتح الجرس، وكل فريق يضغط رقمه. اللي يضغط قبل فتح الجرس يطلع من السؤال.</li>
    <li><b>🎡 عجلة الاختيار:</b> قرعة على الفرق أو أرقام أو أسماء من عندك أو على البينيات نفسها.</li>
    <li><b>⚽ ضربات الجزاء:</b> فريقين، كل إجابة صح هدف والخطأ يصدّه الحارس. الأسئلة من الموسوعة أو المقدّم يسأل.</li>
    <li><b>⚡ صح أو خطأ:</b> فريق واحد كل مرة: سؤال ومعه جواب، والفريق يقول صح أو خطأ، والمقدّم يضغط اللي قاله الفريق.</li>
    <li><b>📖 أكمل الآية:</b> من الأجزاء أو السور اللي تختارها: أكمل الآية، أو الآية التالية، أو من أي سورة.</li>
  </ul>
  <p style="margin:0">لوحة النقاط 🏆 تحت كل فقرة مشتركة بين الفقرات. اختصارات عامة: <kbd>F</kbd> ملء الشاشة · <kbd>M</kbd> الصوت · <kbd>Esc</kbd> يقفل النافذة.</p></div>
  <div class="acts"><button class="btn gold" data-close>تمام</button></div>`;

const ACT = {
  open: el => open(el.dataset.id),
  home: () => {
    if (cur && cur.busy && cur.busy()) { const d = dialog(`<h3>ترجع للرئيسية؟</h3><p style="margin:0">اللعبة الحالية بتضيع.</p><div class="acts"><button class="btn bad" id="go-home">نعم، ارجع</button><button class="btn ghost" data-close>كمّل اللعبة</button></div>`); $('#go-home', d).onclick = () => { closeDialog(); showHome(); }; return; }
    showHome();
  },
  sound: () => { prefs.sound = !prefs.sound; savePrefs(); applySound(); Snd.pop(); },
  fs: toggleFS,
  sb: () => { prefs.showScore = !prefs.showScore; savePrefs(); renderSB(); },
  sc: el => { addScore(+el.dataset.i, +el.dataset.d); +el.dataset.d > 0 ? Snd.up() : Snd.down(); },
  teams: teamsDialog,
  help: () => dialog(soloHelp()),
};

document.addEventListener('click', e => {
  Snd.unlock();
  const s = e.target.closest('[data-set]');
  if (s && cur) {   // اختيارات الإعداد: data-set = المفتاح في إعدادات الفقرة
    const obj = prefs[cur.id], k = s.dataset.set, raw = s.dataset.v, old = obj[k];
    obj[k] = typeof old === 'number' ? +raw : typeof old === 'boolean' ? raw === 'true' : raw;
    savePrefs(); Snd.pop(); cur.set(); return;
  }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, f = ACT[a] || UACT[a] || (cur && cur.act && cur.act[a]);
  if (f) f(el, e);
});
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (dlgEl) { if (e.key === 'Escape') closeDialog(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'KeyF') return toggleFS();
  if (e.code === 'KeyM') return ACT.sound();
  if (!cur) { if (e.code === 'Enter') { e.preventDefault(); open(SOLO); } return; }
  Snd.unlock();
  if (cur.key(e) !== false) e.preventDefault();
});



renderHome();
</script>
</body>
